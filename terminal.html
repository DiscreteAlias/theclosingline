<script>
(function () {
  "use strict";

  const $ = (id) => document.getElementById(id);
  const STORAGE = "tcl.terminal.session";
  const FUNCTION_URL = SUPABASE_URL + "/functions/v1/" + FUNCTION_NAME;

  /* ---------- session: held in localStorage, refreshed before it expires ---------- */
  let session = null;
  let currentThread = null;
  let sending = false;
  let chartsRendered = 0;
  const rowCache = new Map();
  /* Row requests in flight, by snapshot id. The cache alone cannot dedupe two requests made
   * before either resolves — measured 2026-09-18: three charts naming the same five rows asked
   * for fifteen — so a request registers a promise per id and a second caller waits on it. */
  const inflight = new Map();

  function loadSession() {
    try {
      const raw = localStorage.getItem(STORAGE);
      session = raw ? JSON.parse(raw) : null;
    } catch (e) { session = null; }
  }
  function saveSession() {
    try {
      if (session) localStorage.setItem(STORAGE, JSON.stringify(session));
      else localStorage.removeItem(STORAGE);
    } catch (e) { /* private mode: the session lives for the page only */ }
  }
  function setSession(body) {
    session = {
      access_token: body.access_token,
      refresh_token: body.refresh_token,
      expires_at: Math.floor(Date.now() / 1000) + (body.expires_in || 3600),
      user: { id: body.user && body.user.id, email: body.user && body.user.email }
    };
    saveSession();
  }

  function authCall(path, body, token) {
    const headers = { "apikey": SUPABASE_KEY, "Content-Type": "application/json" };
    if (token) headers["Authorization"] = "Bearer " + token;
    return fetch(SUPABASE_URL + "/auth/v1/" + path, {
      method: "POST", headers: headers, body: JSON.stringify(body)
    }).then((r) => r.json().catch(() => ({})).then((j) => ({ status: r.status, body: j })));
  }

  async function signIn(email, password) {
    const r = await authCall("token?grant_type=password", { email: email, password: password });
    if (r.status !== 200 || !r.body.access_token) {
      throw new Error(r.body.error_description || r.body.msg || r.body.error || ("sign-in failed (HTTP " + r.status + ")"));
    }
    setSession(r.body);
  }

  async function signUp(email, password) {
    const r = await authCall("signup", { email: email, password: password });
    if (r.status !== 200) {
      throw new Error(r.body.error_description || r.body.msg || r.body.error || ("sign-up failed (HTTP " + r.status + ")"));
    }
    if (r.body.access_token) { setSession(r.body); return "signed in"; }
    return "account created: confirm the email we sent, then sign in";
  }

  async function refreshIfNeeded() {
    if (!session) return false;
    if (session.expires_at - Math.floor(Date.now() / 1000) > 60) return true;
    const r = await authCall("token?grant_type=refresh_token", { refresh_token: session.refresh_token });
    if (r.status !== 200 || !r.body.access_token) { signOut(); return false; }
    setSession(r.body);
    return true;
  }

  function signOut() {
    if (session) authCall("logout", {}, session.access_token).catch(() => {});
    session = null;
    saveSession();
    currentThread = null;
    resetPanel();
    show();
  }

  /* ---------- REST: threads and messages with the user's token; the board without it ---------- */
  function restHeaders(withUser) {
    const h = { "apikey": SUPABASE_KEY, "Accept": "application/json" };
    if (withUser && session) h["Authorization"] = "Bearer " + session.access_token;
    return h;
  }

  function rest(path, withUser) {
    return fetch(SUPABASE_URL + "/rest/v1/" + path, { headers: restHeaders(withUser) })
      .then((r) => {
        if (!r.ok) throw new Error("HTTP " + r.status + " on " + path.split("?")[0]);
        return r.json();
      });
  }

  function loadThreads() {
    return rest("threads?select=id,title,updated_at&order=updated_at.desc&limit=100", true)
      .then((rows) => {
        const ul = $("threads");
        ul.textContent = "";
        rows.forEach((t) => {
          const li = document.createElement("li");
          li.textContent = t.title || "(untitled)";
          li.setAttribute("data-thread", t.id);
          li.title = t.updated_at;
          if (currentThread === t.id) li.className = "current";
          li.addEventListener("click", () => openThread(t.id));
          ul.appendChild(li);
        });
      });
  }

  function openThread(id) {
    currentThread = id;
    $("messages").textContent = "";
    setStatus("");
    resetPanel();
    const epoch = panel.epoch;
    return rest("messages?select=id,role,content,charts,trace,created_at&thread_id=eq." + id + "&order=id.asc", true)
      .then((rows) => {
        /* The view this answer was fetched FOR may be gone: a second thread click lands here
         * too, and without this both threads' messages — and both threads' tabs — render. */
        if (epoch !== panel.epoch) return undefined;
        rows.forEach((m) => {
          const err = m.role === "assistant" && !m.content && m.trace && m.trace.error;
          const body = addMessage(m.role, err ? "no reply: " + (m.trace.error.message || m.trace.error.kind) : m.content, m.created_at);
          if (err) body.parentNode.className = "msg assistant failed";
          /* A card and a tab per stored chart, from the spec alone. NO ROW IS READ HERE: a tab
           * pays for its rows when it is first opened. */
          (m.charts || []).forEach((c) => registerChart(body.parentNode, c, m.id));
        });
        projectPanel();
        scrollDown();
        return loadThreads();
      });
  }

  function newThread() {
    currentThread = null;
    $("messages").textContent = "";
    setStatus("");
    resetPanel();
    return loadThreads();
  }

  /* ---------- board rows: fetched by id with the publishable key alone ---------- */
  function fetchRows(ids) {
    const need = ids.filter((id) => !rowCache.has(id) && !inflight.has(id));
    if (need.length) {
      const chunks = [];
      for (let i = 0; i < need.length; i += 30) chunks.push(need.slice(i, i + 30));
      const job = chunks.reduce((p, chunk) => p.then(() =>
        rest(SNAPSHOTS_TABLE + "?select=*&id=in.(" + chunk.join(",") + ")", false)
          .then((rows) => rows.forEach((r) => rowCache.set(r.id, r)))), Promise.resolve());
      /* ONE promise for the whole job, registered for every id BEFORE anything resolves, so a
       * caller arriving between two chunks waits too. Cleared either way: a failed request is
       * retried by the next open, not remembered. */
      const settled = job.then(() => { need.forEach((id) => inflight.delete(id)); },
                               (err) => { need.forEach((id) => inflight.delete(id)); throw err; });
      need.forEach((id) => inflight.set(id, settled));
    }
    const waits = [];
    ids.forEach((id) => { const p = inflight.get(id); if (p && waits.indexOf(p) === -1) waits.push(p); });
    return Promise.all(waits).then(() => ids.map((id) => rowCache.get(id)).filter(Boolean));
  }

  /* ---------- charts: spec + rows -> ChartSpec -> ChartForms ----------
   * Two steps, because they have different lifetimes. `computeChart` is the series: it depends
   * on the spec and the rows and on nothing about the page, so a tab keeps it. `ChartForms.render`
   * is that series AT A WIDTH, so it is redone when the panel's width changes and never refetches
   * or recomputes to do it. */
  function computeChart(spec, rows) {
    return ChartSpec.compute(spec, ChartSpec.polls(rows));
  }

  function renderChart(spec, rows, width) {
    return ChartForms.render(computeChart(spec, rows), { width: width || 720 });
  }

  /* ---------- the chart panel ----------
   * STATE, then ONE projector. Nothing here reads the DOM to find out what is showing.
   *
   * Per chart (a TAB): the stored record, a status, the computed series `c`, the drawn model `m`
   * with the width it was drawn at, and how many of the rows it names were still held. `c` and
   * `m` are what this page used to compute and discard; they are kept because everything a
   * chart will later answer to — a crosshair over `m.marks`, a selection by `data-book` — reads
   * them. Per thread: the tabs in message-then-emission order, which one is active, whether the
   * panel is open, and an EPOCH that every continuation appending into the view compares before
   * it writes. All of it is reset when the view changes and none of it is persisted:
   * `authenticated` holds SELECT and nothing else on threads and messages.
   *
   * IDENTITY. A stored chart's `id` is `"c" + n` with n restarting every turn, so every
   * message's first chart is `c1` — measured 2026-09-18: a two-message thread's three cards read
   * c1, c2, c1. A chart is identified by (message, chart). On the live path the message id does
   * not exist until `done`, so until then the message's ordinal in this view stands in for it
   * (`p3:c1`), and `done` replaces it (`41:c1`). */
  const FLOOR_W = 480;                       /* 21 books at a 14 px pitch + the forms' 174 px of padding */
  const WIDE_QUERY = "(min-width: 1112px)";  /* the CSS breakpoint's other statement */
  const RESIZE_MS = 150;
  const panel = { tabs: [], active: null, open: false, epoch: 0, messages: 0 };
  const refsByMessage = new Map();
  let readoutCells = null;
  let resizeTimer = null;

  function isWide() {
    return !window.matchMedia || window.matchMedia(WIDE_QUERY).matches;
  }

  function keyOf(tab) {
    return (tab.messageId === null ? "p" + tab.ordinal : String(tab.messageId)) + ":" + tab.chart.id;
  }

  function resetPanel() {
    panel.tabs = [];
    panel.active = null;
    panel.open = false;
    panel.messages = 0;
    panel.epoch += 1;
    refsByMessage.clear();
    $("tabs").textContent = "";
    projectPanel();
  }

  /* The card row of one assistant message, made on its first chart. */
  function refsOf(msgEl) {
    let refs = refsByMessage.get(msgEl);
    if (!refs) {
      panel.messages += 1;
      refs = { node: document.createElement("div"), ordinal: panel.messages };
      refs.node.className = "refs";
      msgEl.appendChild(refs.node);
      refsByMessage.set(msgEl, refs);
    }
    return refs;
  }

  function clock(iso) {
    return typeof iso === "string" && iso.length >= 19 ? iso.slice(0, 19).replace("T", " ") : "";
  }

  function registerChart(msgEl, chart, messageId) {
    const refs = refsOf(msgEl);
    const spec = chart.spec || {};
    const sd = typeof spec.series === "string" ? ChartSpec.seriesOf(spec.series) : null;
    const tab = {
      seq: panel.tabs.length, ordinal: refs.ordinal,
      messageId: messageId === undefined || messageId === null ? null : messageId,
      /* Only ids that ARE ids. The function stores `[null]` for a series that reads no row
       * (gamma). Unfiltered that is one request for `id=in.()` — 200 and empty, measured
       * 2026-09-18, so the chart drew — and, now that a tab counts the rows it was given against
       * the rows it names, a false "0 of 1 rows still held" about a chart that names none. */
      chart: { id: String(chart.id || ""), spec: spec, captured_at: chart.captured_at || null,
               ids: (Array.isArray(chart.ids) ? chart.ids : []).filter((id) => typeof id === "number" && isFinite(id)) },
      status: "idle", error: null, c: null, m: null, width: 0, held: null, loading: null,
      card: null, button: null
    };
    const when = clock(tab.chart.captured_at);

    /* The card: what the chart leaves in the thread. Always "go to", never a toggle — clicking
     * the card of the chart already showing closes nothing (live.html lost a pane to one gesture
     * meaning two things). Its listener is bound here, once, where the node is made. */
    const card = document.createElement("button");
    card.setAttribute("type", "button");
    card.className = "ref";
    const title = document.createElement("span");
    title.className = "ref-title";
    title.textContent = spec.title || (sd ? sd.label : String(spec.series || "chart"));
    card.appendChild(title);
    const chips = document.createElement("span");
    chips.className = "chips";
    [spec.series, spec.region, spec.market, when ? "poll " + when : null,
     tab.chart.ids.length > 1 ? tab.chart.ids.length + " polls" : null]
      .filter(Boolean).forEach((t) => {
        const chip = document.createElement("span");
        chip.className = "chip";
        chip.textContent = t;
        chips.appendChild(chip);
      });
    card.appendChild(chips);
    card.addEventListener("click", () => { openTab(tab); });
    refs.node.appendChild(card);
    tab.card = card;

    /* The tab: no listener of its own — the strip carries one, bound once, that outlives it. */
    const button = document.createElement("button");
    button.setAttribute("type", "button");
    button.setAttribute("role", "tab");
    button.setAttribute("data-tab", String(tab.seq));
    button.textContent = [spec.series, spec.region, spec.market, when ? when.slice(11) : null]
      .filter(Boolean).join(" · ");
    $("tabs").appendChild(button);
    tab.button = button;

    panel.tabs.push(tab);
    return tab;
  }

  /* A block child of the panel body, so its width is the body's content width whatever the
   * body's padding is — and 0 while the panel is not displayed, which is why a tab is drawn
   * only after the projector has shown the panel. */
  function chartWidth() {
    return Math.max(FLOOR_W, $("readout").clientWidth || 720);
  }

  function draw(tab) {
    if (tab.status === "ready") {
      const width = chartWidth();
      if (!tab.m || tab.width !== width) {
        tab.m = ChartForms.render(tab.c, { width: width });
        tab.width = width;
      }
      const svg = $("panel-svg");
      ChartForms.mount(tab.m, svg, document);
      svg.setAttribute("width", String(tab.m.width));
      svg.setAttribute("height", String(tab.m.height));
      chartsRendered += 1;
    }
    projectPanel();
  }

  function loadTab(tab) {
    const epoch = panel.epoch;
    tab.status = "loading";
    tab.error = null;
    tab.loading = fetchRows(tab.chart.ids).then((rows) => {
      tab.held = { named: tab.chart.ids.length, got: rows.length };
      let c;
      try { c = computeChart(tab.chart.spec, rows); } catch (err) { c = { ok: false, error: err.message }; }
      if (c.ok) { tab.c = c; tab.status = "ready"; }
      else { tab.status = "failed"; tab.error = "chart not drawn: " + c.error; }
    }, (err) => {
      tab.status = "failed";
      tab.error = "rows not loaded: " + err.message;
    }).then(() => {
      tab.loading = null;
      if (epoch === panel.epoch) { if (panel.active === tab) draw(tab); else projectPanel(); }
      return tab;
    });
    return tab.loading;
  }

  function openTab(tab) {
    panel.active = tab;
    panel.open = true;
    projectPanel();
    if (tab.status === "ready") { draw(tab); return Promise.resolve(tab); }
    if (tab.status === "loading") return tab.loading;
    const loading = loadTab(tab);
    projectPanel();
    return loading;
  }

  function closePanel() {
    panel.open = false;
    projectPanel();
  }

  /* live.html §9: cells are made ONCE and their text reassigned. What they show is the CHART —
   * the per-book quote waits for a selection, which this page does not have yet. */
  const READOUT = [
    ["series", (t) => { const sd = ChartSpec.seriesOf(t.chart.spec.series); return sd ? sd.label : String(t.chart.spec.series || "—"); }],
    ["event", (t) => { const ev = t.c && t.c.meta && t.c.meta.event; return Array.isArray(ev) ? ev[2] + " @ " + ev[1] : "—"; }],
    ["region", (t) => t.chart.spec.region || "—"],
    ["market", (t) => t.chart.spec.market || "—"],
    ["poll", (t) => clock(t.chart.captured_at) || "—"],
    ["reference", (t) => { const me = t.c && t.c.meta; return me && me.reference_book ? me.reference_book + (me.reference_line === null || me.reference_line === undefined ? "" : " " + me.reference_line) : "—"; }],
    ["books", (t) => { const me = t.c && t.c.meta; return me && typeof me.n_books === "number" ? me.n_books + " · " + me.n_matched + " on the line · " + me.n_off_line + " off" : "—"; }],
    ["polls", (t) => { const me = t.c && t.c.meta; return me && typeof me.n_frames === "number" ? me.n_frames + " of a " + me.window + "-poll window" : "—"; }],
    ["rows held", (t) => !t.held ? "—" : t.held.named ? t.held.got + " of " + t.held.named : "reads none"]
  ];

  function projectPanel() {
    const tab = panel.active;
    $("panel").hidden = !panel.open;
    $("app").className = panel.open ? "with-panel" : "";
    panel.tabs.forEach((t) => {
      const on = panel.open && t === tab;
      const bad = t.status === "failed" ? " failed" : "";
      t.button.className = "tab" + (on ? " is-active" : "") + bad;
      t.button.setAttribute("aria-selected", String(on));
      t.button.setAttribute("data-chart", keyOf(t));
      t.card.className = "ref" + (on ? " is-open" : "") + bad;
      t.card.setAttribute("data-chart", keyOf(t));
    });
    if (!readoutCells) {
      readoutCells = READOUT.map((spec) => {
        const cell = document.createElement("div");
        cell.className = "cell";
        const k = document.createElement("span");
        k.className = "label";
        k.textContent = spec[0];
        const v = document.createElement("b");
        cell.appendChild(k);
        cell.appendChild(v);
        $("readout").appendChild(cell);
        return v;
      });
    }
    READOUT.forEach((spec, i) => { readoutCells[i].textContent = tab ? spec[1](tab) : "—"; });
    $("chart-scroll").hidden = !(tab && tab.status === "ready");
    const why = $("panel-why");
    /* A chart redrawn from fewer rows than it names is a DIFFERENT chart from the one the
     * message was written beside, and `fetchRows` drops what does not resolve without a word. */
    const short = tab && tab.held && tab.held.got < tab.held.named;
    why.className = "why" + (tab && tab.status === "failed" ? "" : " note");
    why.textContent = !tab ? "" :
      tab.status === "loading" ? "loading rows" :
      tab.status === "failed" ? tab.error + (short ? " (" + tab.held.got + " of " + tab.held.named + " rows still held)" : "") :
      short ? "drawn from " + tab.held.got + " of the " + tab.held.named + " rows this chart names; the rest are no longer held" : "";
    if (panel.open && tab && tab.button.scrollIntoView) tab.button.scrollIntoView({ block: "nearest", inline: "nearest" });
  }

  function panelState() {
    return {
      open: panel.open, epoch: panel.epoch, active: panel.active ? keyOf(panel.active) : null,
      tabs: panel.tabs.map((t) => ({
        key: keyOf(t), seq: t.seq, messageId: t.messageId, series: t.chart.spec.series || null,
        ids: t.chart.ids.length, status: t.status, error: t.error, held: t.held,
        width: t.width, height: t.m ? t.m.height : 0, marks: t.m ? t.m.marks.length : 0,
        elements: t.m ? t.m.elements.length : 0, computed: !!t.c
      }))
    };
  }

  /* ---------- messages ---------- */
  function addMessage(role, text, at) {
    const el = document.createElement("div");
    el.className = "msg " + role;
    const meta = document.createElement("div");
    meta.className = "meta";
    meta.textContent = role + (at ? " · " + at.slice(0, 19).replace("T", " ") : "");
    el.appendChild(meta);
    const body = document.createElement("div");
    body.className = "body";
    body.textContent = text || "";
    el.appendChild(body);
    $("messages").appendChild(el);
    return body;
  }

  function scrollDown() {
    const box = $("messages");
    box.scrollTop = box.scrollHeight;
  }

  function setStatus(text, bad) {
    $("status").textContent = text;
    $("status").className = "status" + (bad ? " bad" : "");
  }

  /* ---------- SSE: parsed from the response body as it arrives ---------- */
  function makeSseParser() {
    let buffer = "";
    function parseBlock(block) {
      let event = "message";
      const data = [];
      block.split("\n").forEach((line) => {
        if (line.startsWith(":")) return;
        const at = line.indexOf(":");
        const field = at === -1 ? line : line.slice(0, at);
        let value = at === -1 ? "" : line.slice(at + 1);
        if (value.startsWith(" ")) value = value.slice(1);
        if (field === "event") event = value;
        else if (field === "data") data.push(value);
      });
      if (!data.length) return null;
      let parsed;
      try { parsed = JSON.parse(data.join("\n")); } catch (e) { parsed = { raw: data.join("\n") }; }
      return { event: event, data: parsed };
    }
    return {
      push: function (text) {
        buffer += text.replace(/\r\n/g, "\n");
        const out = [];
        let at;
        while ((at = buffer.indexOf("\n\n")) !== -1) {
          const block = buffer.slice(0, at);
          buffer = buffer.slice(at + 2);
          const ev = parseBlock(block);
          if (ev) out.push(ev);
        }
        return out;
      },
      end: function () {
        const rest = buffer;
        buffer = "";
        const ev = rest.trim() ? parseBlock(rest) : null;
        return ev ? [ev] : [];
      }
    };
  }

  async function send(text) {
    if (sending) return;
    if (!(await refreshIfNeeded())) { setStatus("signed out", true); return; }
    sending = true;
    $("send").disabled = true;
    addMessage("user", text, new Date().toISOString());
    const answerBody = addMessage("assistant", "", null);
    let looseBody = null;
    let answered = false;
    let failure = null;
    /* The view this turn started in. A thread click is not gated on `sending`, so the view can
     * change while the stream is still arriving; whatever would APPEND into the view checks that
     * it is still this one first. The answer's own nodes are detached by then and harmless. */
    const epoch = panel.epoch;
    const turnTabs = [];
    setStatus("sending");
    scrollDown();
    const handlers = {
      thread: (d) => { if (d.created || !currentThread) currentThread = d.id; },
      status: (d) => setStatus(d.tool ? "calling " + d.tool : (d.note || d.board || "")),
      tool_call: (d) => setStatus(d.name + (d.input && d.input.series ? " " + d.input.series : "")),
      tool_result: (d) => setStatus(d.name + (d.ok ? " ok" : " refused: " + (d.error || "")), !d.ok),
      chart: (d) => {
        if (epoch !== panel.epoch) return;
        /* ADD, never replace: a new tab, and the active one. Its message id arrives with `done`.
         * Opened at once only where the panel sits BESIDE the conversation — over it, the panel
         * would cover the answer while it streams, so the card waits to be tapped. */
        const tab = registerChart(answerBody.parentNode, d, null);
        turnTabs.push(tab);
        if (isWide()) openTab(tab); else projectPanel();
        scrollDown();
      },
      text_delta: (d) => {
        if (epoch !== panel.epoch) return;
        if (!looseBody) { looseBody = addMessage("assistant loose", "", null); }
        looseBody.textContent += d.text;
      },
      answer_delta: (d) => { answerBody.textContent += d.text; scrollDown(); },
      answer: (d) => { answerBody.textContent = d.text; answered = true; scrollDown(); },
      error: (d) => { failure = d.message || d.kind || "unknown error"; setStatus("error: " + failure, true); },
      done: (d) => {
        if (d.ok) setStatus("done · " + (d.ms ? Math.round(d.ms / 1000) + "s" : "") + (d.charts ? " · " + d.charts + " chart(s)" : ""));
        else { if (!failure) failure = d.reason || "no answer"; setStatus("no answer: " + failure, true); }
        /* The stored row's id, which is the other half of each of this turn's charts' identity.
         * A failed turn's `done` carries none, and its tabs keep their place in the view. */
        if (d.message_id !== undefined && d.message_id !== null && epoch === panel.epoch) {
          turnTabs.forEach((t) => { t.messageId = d.message_id; });
          projectPanel();
        }
      }
    };
    try {
      const resp = await fetch(FUNCTION_URL, {
        method: "POST",
        headers: { "apikey": SUPABASE_KEY, "Authorization": "Bearer " + session.access_token,
                   "Content-Type": "application/json", "Accept": "text/event-stream" },
        body: JSON.stringify({ thread_id: currentThread, message: text })
      });
      if (!resp.ok) {
        const j = await resp.json().catch(() => ({}));
        throw new Error(j.error || ("HTTP " + resp.status));
      }
      const reader = resp.body.getReader();
      const decoder = new TextDecoder();
      const parser = makeSseParser();
      const dispatch = (ev) => { const h = handlers[ev.event]; if (h) h(ev.data); };
      while (true) {
        const chunk = await reader.read();
        if (chunk.done) break;
        parser.push(decoder.decode(chunk.value, { stream: true })).forEach(dispatch);
      }
      parser.end().forEach(dispatch);
      if (!answered && !answerBody.textContent) {
        /* The function stores an assistant row carrying the error in its trace, so the thread
         * keeps the reason; the same text is shown here rather than a bare no-reply marker. */
        answerBody.textContent = failure ? "no reply: " + failure : "no reply";
        answerBody.parentNode.className = "msg assistant failed";
      }
      await loadThreads();
    } catch (err) {
      setStatus("error: " + err.message, true);
    } finally {
      sending = false;
      $("send").disabled = false;
    }
  }

  /* ---------- chrome ---------- */
  function show() {
    const signedIn = !!session;
    $("auth").hidden = signedIn;
    $("app").hidden = !signedIn;
    $("signout").hidden = !signedIn;
    $("who").textContent = signedIn ? (session.user.email || session.user.id) : "";
    if (signedIn) loadThreads().catch((err) => setStatus("threads: " + err.message, true));
  }

  function bind() {
    $("auth-form").addEventListener("submit", (e) => {
      e.preventDefault();
      const note = $("auth-note");
      note.className = "note";
      note.textContent = "signing in";
      signIn($("email").value.trim(), $("password").value)
        .then(() => { note.textContent = ""; show(); })
        .catch((err) => { note.className = "note bad"; note.textContent = err.message; });
    });
    $("signup").addEventListener("click", () => {
      const note = $("auth-note");
      /* The button is type="button", so the form's `required` and `minlength` never run for
       * it — only the submit button (sign in) triggers them — and an empty email reached
       * GoTrue, which reads a signup with no email as an anonymous sign-up and answers
       * "Anonymous sign-ins are disabled" (measured 2026-09-17). The check lives here, where
       * the values are read, and no call is made until both are present. */
      const email = $("email").value.trim();
      const password = $("password").value;
      if (!email || !password) {
        note.className = "note bad";
        note.textContent = "enter an email and a password to create an account";
        return;
      }
      if (password.length < 8) {
        note.className = "note bad";
        note.textContent = "the password must be at least 8 characters";
        return;
      }
      note.className = "note";
      note.textContent = "creating account";
      signUp(email, password)
        .then((msg) => { note.textContent = msg; show(); })
        .catch((err) => { note.className = "note bad"; note.textContent = err.message; });
    });
    $("signout").addEventListener("click", signOut);
    $("new-thread").addEventListener("click", newThread);
    $("composer").addEventListener("submit", (e) => {
      e.preventDefault();
      const text = $("input").value.trim();
      if (!text) return;
      $("input").value = "";
      send(text);
    });
    $("input").addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("composer").requestSubmit(); }
    });
    /* ONE listener for every tab there will ever be, on the strip — a container that outlives
     * each tab and each thread — rather than one per button made inside a loop. */
    $("tabs").addEventListener("click", (e) => {
      let el = e.target;
      while (el && el.getAttribute) {
        const seq = el.getAttribute("data-tab");
        if (seq !== null && seq !== undefined && seq !== "") {
          const tab = panel.tabs[Number(seq)];
          if (tab) openTab(tab);
          return;
        }
        el = el.parentNode;
      }
    });
    $("panel-close").addEventListener("click", closePanel);
    /* The panel's width is the chart's width, so when one changes the other is redone — from the
     * kept series: no request, no recompute. Without this the chart is a picture of the width
     * the panel had when the tab was opened. */
    window.addEventListener("resize", () => {
      if (resizeTimer !== null) clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        resizeTimer = null;
        if (panel.open && panel.active && panel.active.status === "ready") draw(panel.active);
      }, RESIZE_MS);
    });
  }

  /* Exposed so the page's OWN bytes can be driven in node: the SSE parser on a canned stream,
   * a chart from a spec and rows, the validator, and the state a test reads back.
   *
   * `panel` is the page's own panel, not a transcription of it: `add` is `registerChart` on a
   * fresh assistant message — the function `openThread` and the live `chart` handler call — and
   * `open` is `openTab`, the function a card and the strip call. A probe that rebuilt those
   * lines for itself stayed green on a path this page had stopped using. */
  window.__terminal = {
    parseSse: function (text) { const p = makeSseParser(); return p.push(text).concat(p.end()); },
    renderChart: function (spec, rows, width) { return renderChart(spec, rows, width); },
    validate: function (spec) { return ChartSpec.validate(spec); },
    functionUrl: function () { return FUNCTION_URL; },
    state: function () {
      return { signedIn: !!session, thread: currentThread, charts: chartsRendered, sending: sending };
    },
    panel: {
      add: function (chart, messageId) {
        const body = addMessage("assistant", "", null);
        const tab = registerChart(body.parentNode, chart, messageId);
        projectPanel();
        return keyOf(tab);
      },
      open: function (key) {
        const tab = panel.tabs.filter((t) => keyOf(t) === key)[0];
        return tab ? openTab(tab).then(panelState) : Promise.reject(new Error("no such chart: " + key));
      },
      close: function () { closePanel(); return panelState(); },
      state: panelState
    }
  };

  loadSession();
  bind();
  show();
})();
</script>
</body>
</html>
