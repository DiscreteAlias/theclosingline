    rows, declares: { interval: [{ low: "bin_lo", high: "bin_hi", meaning: "the two edges of one bin" }] } });
}

/* ---------- 1. distributions ---------- */

/* dist_summary: nearest-rank quantiles at the requested probabilities, a five-number summary, and
 * n, missing, mean, sd, min, max. params: { column, unit, probabilities: [...], label?, depends_on? } */
function distSummary(rows, p0) {
  return guard("dist_summary", () => {
    const p = params(p0);
    needRows(rows, 1, "A summary");
    const unit = needText(p.unit, "the column's unit");
    const col = numericColumn(rows, p.column);
    const probs = p.probabilities;
    if (!Array.isArray(probs) || probs.length < 1 || probs.length > LIMITS.PROBABILITIES_MAX || !probs.every(isNum)) refuse("bad_params", "probabilities must be 1 to " + LIMITS.PROBABILITIES_MAX + " numbers: the quantiles you want. There is no default set.");
    probs.forEach((x, i) => {
      if (!(x >= 0 && x <= 1)) refuse("out_of_range", "A quantile's probability must be between 0 and 1; " + x + " is not.");
      if (i > 0 && !(x > probs[i - 1])) refuse("bad_params", "probabilities must be strictly increasing, with no repeat.");
    });
    const n = col.values.length;
    if (n < 1) refuse("too_few", "No row holds a number in " + p.column + ", so there is nothing to summarise.");
    const label = p.label === undefined ? p.column : needText(p.label, "a non-empty label");
    const dep = dependsOn(p);
    const sorted = col.values.slice().sort((a, b) => a - b);
    const popRule = "rows holding a finite number in " + p.column;
    const pop = population(n, popRule);
    const rule = "nearest rank: the value at rank ceil(p x n) of the n values ascending, 1-indexed; never an interpolation";
    const five = [0, 0.25, 0.5, 0.75, 1].map((x) => nearestRank(sorted, x).value);
    const m = mean(col.values);
    const sd = n > 1 ? Math.sqrt(neumaierSum(col.values.map((v) => (v - m) * (v - m))) / (n - 1)) : null;
    const frames = [
      frame({ name: "quantiles", key: ["p"], order: { by: ["p"], direction: "ascending" }, depends_on: dep,
        fields: [field.id("p", "number", "quantitative", "fraction"), field.measure("value", "number", unit, POP), field.marker("rank", "integer")],
        markers: { population: pop, rule }, rows: probs.map((x) => { const r = nearestRank(sorted, x); return { p: x, value: r.value, rank: r.rank }; }),
        declares: { sequence: [{ by: "p" }] } }),
      frame({ name: "five_number", key: ["group"], depends_on: dep,
        fields: [field.id("group", "string", "nominal")].concat(["min", "q1", "median", "q3", "max"].map((k) => field.measure(k, "number", unit, POP))),
        markers: { population: pop, rule: rule + "; at p = 0, 0.25, 0.5, 0.75 and 1" },
        rows: [{ group: label, min: five[0], q1: five[1], median: five[2], q3: five[3], max: five[4] }],
        declares: { summary: [{ min: "min", q1: "q1", median: "median", q3: "q3", max: "max" }] } }),
      quantities("summary", dep, [
        { name: "n", value: n, unit: "rows", n, n_rule: popRule },
        { name: "missing", value: col.missing, unit: "rows", n: rows.length, n_rule: "rows read; missing counts those with no value in " + p.column },
        { name: "mean", value: m, unit, n, n_rule: popRule },
        sd === null ? { name: "sd", value: null, unit, n, n_rule: popRule, absent: "not_applicable", reason: "a standard deviation needs two values" }
          : { name: "sd", value: sd, unit, n, n_rule: popRule + "; divisor n - 1" },
        { name: "min", value: sorted[0], unit, n, n_rule: popRule },
        { name: "max", value: sorted[n - 1], unit, n, n_rule: popRule },
      ]),
    ];
    return produce("dist_summary", "tolerance", { column: p.column, unit, probabilities: probs.slice(), label }, frames,
      ["Whether the rows are a sample of anything: these are quantiles of the rows read, not estimates with an interval.",
        "Any value between two that occurred: a nearest-rank quantile is always a value in the data."], "Ask for fewer probabilities.");
  });
}

/* dist_histogram: counts in the caller's bins. params: { column, unit, bins: {edges} | {count, lo?, hi?} } */
function distHistogram(rows, p0) {
  return guard("dist_histogram", () => {
    const p = params(p0);
    needRows(rows, 1, "A histogram");
    const unit = needText(p.unit, "the column's unit");
    const col = numericColumn(rows, p.column);
    const n = col.values.length;
    if (n < 1) refuse("too_few", "No row holds a number in " + p.column + ", so there is nothing to bin.");
    const edges = binEdges(p.bins, col.values);
    const counts = new Array(edges.length - 1).fill(0);
    col.values.forEach((v) => {
      const b = binIndex(edges, v);
      if (b < 0) refuse("out_of_range", "The value " + v + " is outside the edges " + edges[0] + " to " + edges[edges.length - 1] + ". A histogram drops no row: widen the edges.");
      counts[b] += 1;
    });
    const frames = [histogramFrame("bins", edges, counts, n, unit, dependsOn(p), "rows holding a finite number in " + p.column, BIN_RULE)];
    return produce("dist_histogram", "exact", { column: p.column, unit, bins: has(p.bins, "edges") ? { edges } : Object.assign({ count: p.bins.count }, p.bins.lo === undefined ? {} : { lo: p.bins.lo }, p.bins.hi === undefined ? {} : { hi: p.bins.hi }) }, frames,
      ["The shape inside a bin: a count says how many values fell between two edges and nothing about where.",
        "A shape that does not depend on the edges: other edges give another picture of the same rows."], "Ask for fewer bins.");
  });
}

/* dist_ecdf: the share of values at or below each distinct value. params: { column, unit } */
function distEcdf(rows, p0) {
  return guard("dist_ecdf", () => {
    const p = params(p0);
    needRows(rows, 1, "An ECDF");
    const unit = needText(p.unit, "the column's unit");
    const col = numericColumn(rows, p.column);
    const n = col.values.length;
    if (n < 1) refuse("too_few", "No row holds a number in " + p.column + ", so there is no distribution to draw.");
    const sorted = col.values.slice().sort((a, b) => a - b);
    const steps = [];
    for (let i = 0; i < n; i += 1) {
      if (i + 1 < n && sorted[i + 1] === sorted[i]) continue;
      steps.push({ value: sorted[i], cum_count: i + 1, cum_share: (i + 1) / n });
    }
    if (steps.length > LIMITS.DISTINCT_MAX) refuse("over_cap", "The column holds " + steps.length + " distinct values; an exact ECDF draws at most " + LIMITS.DISTINCT_MAX + ". Ask dist_histogram for a binned shape, or dist_summary for quantiles.");
    const frames = [frame({ name: "steps", key: ["value"], order: { by: ["value"], direction: "ascending" }, depends_on: dependsOn(p),
      fields: [field.id("value", "number", "quantitative", unit), field.measure("cum_count", "integer", "count", POP), field.measure("cum_share", "number", "share of n", POP)],
      markers: { population: population(n, "rows holding a finite number in " + p.column), rule: "one row per distinct value: the count and the share of values at or below it; the function is flat between rows" },
      rows: steps, declares: { sequence: [{ by: "value" }] } })];
    return produce("dist_ecdf", "exact", { column: p.column, unit }, frames,
      ["The distribution the rows were drawn from: this is the share of the rows read, with no band around it."], "Ask dist_histogram for a binned shape.");
  });
}

/* ---------- 2. forecast evaluation: rows of { event, forecast, outcome } ---------- */

/* scores.py#calibration's index: min(floor(q K), K - 1), with edges i / K. */
const fixedIndex = (q, k) => Math.min(Math.floor(q * k), k - 1);
const FIXED_RULE = (k) => k + " equal bins on 0 to 1; a forecast q is in bin min(floor(q x " + k + "), " + (k - 1) + "), as the run score's calibration bins";
const binCount = (v, what) => needInt(v, 2, LIMITS.BINS_MAX, what);

/* fe_reliability: observed frequency against mean forecast, by bin, with a Wilson interval where a bin's
 * rows are independent. params: { binning: { kind: "fixed" | "quantile", count } } */
function feReliability(rows, p0) {
  return guard("fe_reliability", () => {
    const p = params(p0);
    const R = forecastRows(rows, 2, "A reliability curve");
    if (!isObj(p.binning) || !["fixed", "quantile"].includes(p.binning.kind)) refuse("bad_params", "Say how to bin the forecasts: binning: {kind: \"fixed\" | \"quantile\", count}. There is no default.");
    const k = binCount(p.binning.count, "binning.count");
    let edges, index, rule;
    if (p.binning.kind === "fixed") {
      edges = []; for (let i = 0; i <= k; i += 1) edges.push(i / k);
      index = (q) => fixedIndex(q, k);
      rule = FIXED_RULE(k);
    } else {
      const sorted = R.q.slice().sort((a, b) => a - b);
      edges = [0];
      for (let i = 1; i < k; i += 1) { const e = nearestRank(sorted, i / k).value; if (e > edges[edges.length - 1] && e < 1) edges.push(e); }
      edges.push(1);
      index = (q) => binIndex(edges, q);
      rule = "bins cut at the nearest-rank quantiles of the forecasts at i / " + k + ", equal cuts merged (" + (edges.length - 1) + " bins); " + BIN_RULE;
    }
    const B = edges.length - 1;
    const qs = Array.from({ length: B }, () => []), hits = new Array(B).fill(0), evs = Array.from({ length: B }, () => new Set());
    R.q.forEach((q, i) => { const b = index(q); qs[b].push(q); hits[b] += R.y[i]; evs[b].add(R.ev[i]); });
    const out = [];
    let clustered = 0;
    for (let b = 0; b < B; b += 1) {
      const n = qs[b].length, row = { bin_lo: edges[b], bin_hi: edges[b + 1], n, n_events: evs[b].size, mean_forecast: null, observed: null, lo: null, hi: null,
        absent: null, reason: null, interval_absent: null, interval_reason: null };
      if (n === 0) {
        row.absent = "no_data"; row.reason = "no forecast fell in this bin";
        row.interval_absent = "no_data"; row.interval_reason = "no forecast fell in this bin";
      } else {
        row.mean_forecast = mean(qs[b]); row.observed = hits[b] / n;
        if (evs[b].size === n) { const w = wilson(hits[b], n, Z95); row.lo = w.lo; row.hi = w.hi; }
        else { clustered += 1; row.interval_absent = "not_applicable"; row.interval_reason = "the bin's " + n + " rows come from " + evs[b].size + " events, so they are not independent and a Wilson interval would be too narrow"; }
      }
      out.push(row);
    }
    const binN = rowN("n", "rows whose forecast fell in the bin");
    const dep = dependsOn(p);
    const pop = population(R.n, "rows read, each one forecast with its outcome", eventUnits(R.events));
    const share = "share of n";
    const frames = [
      frame({ name: "bins", key: ["bin_lo"], order: { by: ["bin_lo"], direction: "ascending" }, depends_on: dep,
        fields: [field.id("bin_lo", "number", "quantitative", "fraction"), field.id("bin_hi", "number", "quantitative", "fraction"),
          field.marker("n", "integer"), field.marker("n_events", "integer"),
          field.measure("mean_forecast", "number", "fraction", binN, { nullable: true, absence: ABSENT_BY_ROW }),
          field.measure("observed", "number", share, binN, { nullable: true, absence: ABSENT_BY_ROW }),
          field.measure("lo", "number", share, binN, { nullable: true, absence: { kind_row: "interval_absent", reason_row: "interval_reason" } }),
          field.measure("hi", "number", share, binN, { nullable: true, absence: { kind_row: "interval_absent", reason_row: "interval_reason" } }),
          field.marker("absent", "string", true), field.marker("reason", "string", true), field.marker("interval_absent", "string", true), field.marker("interval_reason", "string", true)],
        markers: { population: pop, rule: rule + "; the interval is a Wilson score interval at z = " + Z95 + ", computed only where a bin's rows equal its events" },
        rows: out,
        declares: { sequence: [{ by: "mean_forecast" }], interval: [{ low: "lo", high: "hi", mid: "observed", meaning: "a Wilson score interval on the observed frequency, z = " + Z95 }, { low: "bin_lo", high: "bin_hi", meaning: "the two edges of one bin" }],
          same_scale: [["mean_forecast", "bin_lo"]] } }),
      frame({ name: "identity", key: ["forecast"], order: { by: ["forecast"], direction: "ascending" }, depends_on: dep,
        fields: [field.id("forecast", "number", "quantitative", "fraction"), field.id("observed", "number", "quantitative", share)],
        markers: { rule: "the line a perfectly calibrated forecaster lies on: observed frequency equal to the forecast" },
        rows: [{ forecast: 0, observed: 0 }, { forecast: 1, observed: 1 }],
        declares: { sequence: [{ by: "forecast" }], same_scale: [["forecast", "bins.mean_forecast"], ["observed", "bins.observed"]] } }),
      quantities("summary", dep, [
        { name: "calibration_in_the_large", value: mean(R.q) - neumaierSum(R.y) / R.n, unit: "fraction", n: R.n, n_rule: "rows read; mean forecast minus observed frequency" },
        { name: "observed_frequency", value: neumaierSum(R.y) / R.n, unit: share, n: R.n, n_rule: "rows read" },
        { name: "bins_without_interval", value: clustered, unit: "bins", n: B, n_rule: "bins; counts those whose rows share events" },
      ]),
    ];
    return produce("fe_reliability", "tolerance", { binning: { kind: p.binning.kind, count: k } }, frames,
      ["An interval for a bin whose rows share events: the cluster bootstrap that would give one is not built, so those bins have none.",
        "That the forecaster is calibrated at forecasts it never made: an empty bin is absent, not zero.",
        "A calibration that does not depend on the binning: other bins give another curve of the same rows.",
        "A recalibration slope and intercept: the fit is not built here."], "Ask for fewer bins.");
  });
}

/* fe_sharpness: the histogram of the forecasts themselves. params: { bins: K } */
function feSharpness(rows, p0) {
  return guard("fe_sharpness", () => {
    const p = params(p0);
    const R = forecastRows(rows, 2, "A sharpness histogram");
    const k = binCount(p.bins, "bins");
    const edges = []; for (let i = 0; i <= k; i += 1) edges.push(i / k);
    const counts = new Array(k).fill(0);
    R.q.forEach((q) => { counts[fixedIndex(q, k)] += 1; });
    const m = mean(R.q), base = neumaierSum(R.y) / R.n, dep = dependsOn(p), nRule = "rows read, each one forecast";
    const frames = [
      histogramFrame("bins", edges, counts, R.n, "fraction", dep, nRule, FIXED_RULE(k), eventUnits(R.events)),
      quantities("summary", dep, [
        { name: "mean_forecast", value: m, unit: "fraction", n: R.n, n_rule: nRule },
        { name: "sd_forecast", value: Math.sqrt(neumaierSum(R.q.map((q) => (q - m) * (q - m))) / (R.n - 1)), unit: "fraction", n: R.n, n_rule: nRule + "; divisor n - 1" },
        { name: "observed_frequency", value: base, unit: "share of n", n: R.n, n_rule: nRule },
        { name: "mean_distance_from_observed_frequency", value: mean(R.q.map((q) => Math.abs(q - base))), unit: "fraction", n: R.n, n_rule: nRule },
      ]),
    ];
    return produce("fe_sharpness", "tolerance", { bins: k }, frames,
      ["Whether the forecasts are right: sharpness is how far they move from the middle, not whether they should.",
        "Independence of the rows: several forecasts of one event are counted once each."], "Ask for fewer bins.");
  });
}

/* fe_brier_parts: Murphy's decomposition of the mean Brier score on K fixed bins, with the within-bin
 * term that makes it exact, and the two mean scores. params: { bins: K }
 *   brier = reliability - resolution + uncertainty + within_bin, asserted at IDENTITY_TOLERANCE. */
function feBrierParts(rows, p0) {
  return guard("fe_brier_parts", () => {
    const p = params(p0);
    const R = forecastRows(rows, 2, "A Brier decomposition");
    const k = binCount(p.bins, "bins");
    const n = R.n, base = neumaierSum(R.y) / n;
    const idx = R.q.map((q) => fixedIndex(q, k));
    const rel = [], res = [], wbv = [], wbc = [];
    for (let b = 0; b < k; b += 1) {
      const at = []; idx.forEach((v, i) => { if (v === b) at.push(i); });
      if (!at.length) continue;
      const fbar = mean(at.map((i) => R.q[i])), obar = neumaierSum(at.map((i) => R.y[i])) / at.length;
      rel.push(at.length * (fbar - obar) * (fbar - obar));
      res.push(at.length * (obar - base) * (obar - base));
      for (const i of at) { wbv.push((R.q[i] - fbar) * (R.q[i] - fbar)); wbc.push(2 * (R.y[i] - obar) * (R.q[i] - fbar)); }
    }
    const parts = { reliability: neumaierSum(rel) / n, resolution: neumaierSum(res) / n, uncertainty: base * (1 - base),
      within_bin: (neumaierSum(wbv) - neumaierSum(wbc)) / n };
    const brier = mean(R.q.map((q, i) => (q - R.y[i]) * (q - R.y[i])));
    const gap = Math.abs(brier - (parts.reliability - parts.resolution + parts.uncertainty + parts.within_bin));
    if (!(gap <= LIMITS.IDENTITY_TOLERANCE)) refuse("identity_failed", "The Brier decomposition did not add up (off by " + gap + "). This is a defect in the producer, not a finding about the forecasts.");
    const open = R.q.every((q) => q > 0 && q < 1);
    const dep = dependsOn(p), nRule = "rows read, each one forecast with its outcome";
    const order = ["reliability", "resolution", "uncertainty", "within_bin"];
    const frames = [
      frame({ name: "parts", key: ["part"], depends_on: dep,
        fields: [field.id("part", "string", "ordinal", null, { order: { values: order } }), field.measure("value", "number", "brier", POP)],
        markers: { population: population(n, nRule, eventUnits(R.events)),
          rule: "Murphy's decomposition on " + FIXED_RULE(k) + ": brier = reliability - resolution + uncertainty + within_bin, where within_bin is the within-bin variance of the forecasts less twice their within-bin covariance with the outcomes" },
        rows: order.map((part) => ({ part, value: parts[part] })) }),
      quantities("scores", dep, [
        { name: "mean_brier_score", value: brier, unit: "brier", n, n_rule: nRule },
        open ? { name: "mean_log_score", value: mean(R.q.map((q, i) => -(R.y[i] * Math.log(q) + (1 - R.y[i]) * Math.log1p(-q)))), unit: "nats", n, n_rule: nRule }
          : { name: "mean_log_score", value: null, unit: "nats", n, n_rule: nRule, absent: "not_applicable", reason: "a forecast of exactly 0 or 1 has no finite log score" },
        { name: "observed_frequency", value: base, unit: "share of n", n, n_rule: nRule },
      ]),
    ];
    return produce("fe_brier_parts", "tolerance", { bins: k }, frames,
      ["A decomposition that does not depend on the bins: reliability and resolution move with the binning, and within_bin is what the bins hide.",
        "Whether any part differs from another forecaster's by more than chance: no interval is computed on a part.",
        "Independence of the rows: several forecasts of one event are counted once each."], "Ask for fewer bins.");
  });
}

/* fe_pit: the non-randomized probability integral transform for a binary outcome (Czado, Gneiting and
 * Held 2009). An outcome of 0 under forecast q spreads its unit of mass evenly over [0, 1 - q]; an
 * outcome of 1 over [1 - q, 1]. No random draw. params: { bins: J } */
function fePit(rows, p0) {
  return guard("fe_pit", () => {
    const p = params(p0);
    const R = forecastRows(rows, 2, "A PIT histogram");
    const j = binCount(p.bins, "bins");
    const cdf = (u) => mean(R.q.map((q, i) => {
      const a = R.y[i] === 0 ? 0 : 1 - q, b = R.y[i] === 0 ? 1 - q : 1;
      return b > a ? Math.min(1, Math.max(0, (u - a) / (b - a))) : (u >= b ? 1 : 0);
    }));
    const edges = []; for (let i = 0; i <= j; i += 1) edges.push(i / j);
    const F = edges.map((u, i) => (i === 0 ? 0 : i === j ? 1 : cdf(u)));
    const dep = dependsOn(p), nRule = "rows read, each one forecast with its outcome; each row spreads one unit of mass";
    const pop = population(R.n, nRule, eventUnits(R.events));
    const frames = [
      frame({ name: "bins", key: ["bin_lo"], order: { by: ["bin_lo"], direction: "ascending" }, depends_on: dep,
        fields: [field.id("bin_lo", "number", "quantitative", "pit"), field.id("bin_hi", "number", "quantitative", "pit"), field.measure("mass", "number", "share of n", POP)],
        markers: { population: pop, rule: "non-randomized PIT for a binary outcome: an outcome of 0 under forecast q spreads evenly over 0 to 1 - q, an outcome of 1 over 1 - q to 1; a bin's mass is the mean share falling in it" },
        rows: edges.slice(0, j).map((e, i) => ({ bin_lo: e, bin_hi: edges[i + 1], mass: F[i + 1] - F[i] })),
        declares: { interval: [{ low: "bin_lo", high: "bin_hi", meaning: "the two edges of one bin" }] } }),
      frame({ name: "uniform", key: ["name"], depends_on: dep,
        fields: [field.id("name", "string", "nominal"), field.id("mass", "number", "quantitative", "share of n")],
        markers: { rule: "the mass every bin holds when the forecasts are calibrated: one over the number of bins" },
        rows: [{ name: "calibrated", mass: 1 / j }], declares: { same_scale: [["mass", "bins.mass"]] } }),
    ];
    return produce("fe_pit", "exact", { bins: j }, frames,
      ["Anything the reliability curve does not: for a binary outcome the PIT restates calibration. It earns its place when a forecast is a distribution, which no model here emits.",
        "Whether a bin's departure from the uniform line is more than chance: no band is computed.",
        "Independence of the rows: several forecasts of one event are counted once each."], "Ask for fewer bins.");
  });
}

/* ---------- 3. two forecasters on the same events: rows of { event, baseline, candidate, outcome } ---------- */

const SCORES = Object.freeze({ log: "nats", brier: "brier" });
/* scores.py#log_score and #brier_score; both negatively oriented (lower is better). */
const scoreOf = (name, q, y) => (name === "log" ? -(y * Math.log(q) + (1 - y) * Math.log1p(-q)) : (q - y) * (q - y));

/* fe_paired: d = S(candidate) - S(baseline) per row; its mean with the run score's event-clustered
 * interval (scores.py#paired_difference); the per-event sums; and their running sum in event order.
 * Events are taken in order of first appearance in the rows.
 * params: { score: "log" | "brier", detail: "summary" | "events" }. "summary" returns the `difference`
 * frame alone, at any size; "events" adds `per_event` and `path`, and refuses over the output caps. */
function fePaired(rows, p0) {
  return guard("fe_paired", () => {
    const p = params(p0);
    needRows(rows, 2, "A paired comparison");
    if (!has(SCORES, p.score)) refuse("bad_params", "Say which score to compare: score: \"log\" or \"brier\". There is no default.");
    if (!["summary", "events"].includes(p.detail)) refuse("bad_params", "Say how much to return: detail: \"summary\" (the mean difference and its interval) or \"events\" (also one row per event and the running sum).");
    const unit = SCORES[p.score], open = p.score === "log";
    const d = [], ev = [];
    rows.forEach((r, i) => {
      const e = eventKey(r.event, i), qb = probability(r.baseline, i, "baseline forecast", open), qc = probability(r.candidate, i, "candidate forecast", open), y = outcome(r.outcome, i);
      ev.push(e); d.push(scoreOf(p.score, qc, y) - scoreOf(p.score, qb, y));
    });
    const order = [], by = new Map();
    ev.forEach((e, i) => { if (!by.has(e)) { by.set(e, { id: rows[i].event, d: [] }); order.push(e); } by.get(e).d.push(d[i]); });
    if (order.length < 2) refuse("too_few", "The rows hold " + order.length + " event; an event-clustered interval needs at least two. One event gives a difference and no interval.");
    const c = clusteredMean(d, ev);
    const direction = c.hi < 0 ? "candidate_lower" : c.lo > 0 ? "baseline_lower" : "interval_spans_zero";
    const dep = dependsOn(p), n = rows.length;
    const pop = population(n, "rows read, each scored for both forecasters", eventUnits(order.length));
    const evN = rowN("rows", "rows of this event");
    const frames = [
      frame({ name: "difference", key: ["score"], depends_on: dep,
        fields: [field.id("score", "string", "nominal"), field.measure("mean", "number", unit, POP), field.measure("lo", "number", unit, POP), field.measure("hi", "number", unit, POP),
          field.measure("se", "number", unit, POP), field.attr("direction", "string", "nominal"), field.attr("level", "number", "quantitative"), field.attr("method", "string", "nominal")],
        markers: { population: pop, rule: "d = score(candidate) - score(baseline) per row, lower is better, so a negative mean favours the candidate; se = sqrt(G / (G - 1) x sum over events of the squared sum of centred d) / n; the interval is mean -/+ " + Z95 + " se" },
        rows: [{ score: p.score, mean: c.mean, lo: c.lo, hi: c.hi, se: c.se, direction, level: 0.95, method: "event-clustered normal interval, as the run score's" }],
        declares: { interval: [{ low: "lo", high: "hi", mid: "mean", meaning: "an event-clustered interval on the mean difference, mean -/+ " + Z95 + " se" }] } }),
    ];
    if (p.detail === "events") {
      const sums = order.map((e) => neumaierSum(by.get(e).d)), running = runningSums(sums);
      frames.push(frame({ name: "per_event", key: ["event_ordinal"], order: { by: ["event_ordinal"], direction: "ascending" }, depends_on: dep,
        fields: [field.id("event_ordinal", "integer", "quantitative"), field.attr("event", "string", "nominal"), field.marker("rows", "integer"),
          field.measure("d_sum", "number", unit, evN), field.measure("d_mean", "number", unit, evN)],
        markers: { population: pop, rule: "one row per event, in order of first appearance: the sum and the mean of d over the event's rows" },
        rows: order.map((e, i) => ({ event_ordinal: i + 1, event: String(by.get(e).id), rows: by.get(e).d.length, d_sum: sums[i], d_mean: sums[i] / by.get(e).d.length })) }));
      frames.push(frame({ name: "path", key: ["step"], order: { by: ["step"], direction: "ascending" }, depends_on: dep,
        fields: [field.id("step", "integer", "quantitative"), field.attr("event", "string", "nominal"), field.measure("cum_diff", "number", unit, POP)],
        markers: { population: pop, rule: "the running sum of the per-event sums of d, in event order; its last value over n is the mean difference" },
        rows: order.map((e, i) => ({ step: i + 1, event: String(by.get(e).id), cum_diff: running[i] })),
        declares: { sequence: [{ by: "step" }] } }));

    return produce("fe_paired", "tolerance", { score: p.score, detail: p.detail }, frames,
      ["A test: the interval is descriptive, with no p-value and no threshold. On fewer than 30 events it is stated with its event count and is not evidence of a difference.",
        "Anything valid at every look: the running sum is a description of where the difference was made. It has no band, and a band drawn on it would claim a guarantee it does not carry.",
        "That the difference holds on other events: both forecasters were scored on these rows only.",
        "How many comparisons were made before this one: nothing here adjusts for them."],
      "Ask for detail: \"summary\", which returns the mean difference and its interval at any size, or compare fewer events at a time.");
  });
}

/* ci_clustered: the mean of one column with the same event-clustered interval.
 * rows of { cluster, value }; params: { unit, statistic? } */
function ciClustered(rows, p0) {
  return guard("ci_clustered", () => {
    const p = params(p0);
    needRows(rows, 2, "A clustered interval");
    const unit = needText(p.unit, "the value's unit");
    const statistic = p.statistic === undefined ? "mean" : needText(p.statistic, "a non-empty name for the statistic");
    const d = [], cl = [];
    rows.forEach((r, i) => { if (!isNum(r.value)) refuse("not_finite", "Row " + i + " holds " + String(r.value) + " as its value, which is not a finite number."); d.push(r.value); cl.push(eventKey(r.cluster, i)); });
    const g = new Set(cl).size;
    if (g < 2) refuse("too_few", "The rows hold " + g + " cluster; a clustered interval needs at least two.");
    const c = clusteredMean(d, cl);
    const pop = population(d.length, "rows read", { n: g, rule: "distinct cluster ids among the rows" });
    const frames = [frame({ name: "interval", key: ["statistic"], depends_on: dependsOn(p),
      fields: [field.id("statistic", "string", "nominal"), field.measure("estimate", "number", unit, POP), field.measure("lo", "number", unit, POP), field.measure("hi", "number", unit, POP),
        field.measure("se", "number", unit, POP), field.attr("level", "number", "quantitative"), field.attr("method", "string", "nominal")],
      markers: { population: pop, rule: "se = sqrt(G / (G - 1) x sum over clusters of the squared sum of centred values) / n; the interval is mean -/+ " + Z95 + " se" },
      rows: [{ statistic, estimate: c.mean, lo: c.lo, hi: c.hi, se: c.se, level: 0.95, method: "cluster-robust normal interval, as the run score's" }],
      declares: { interval: [{ low: "lo", high: "hi", mid: "estimate", meaning: "a cluster-robust interval on the mean, mean -/+ " + Z95 + " se" }] } })];
    return produce("ci_clustered", "tolerance", { unit, statistic }, frames,
      ["A test: on fewer than 30 clusters the interval is stated with its cluster count and is not a test.",
        "How many intervals were computed in this conversation: nothing here adjusts for them."], "Nothing narrower exists: this is one row.");
  });
}

/* ---------- 4. relationships ---------- */

function midRanks(xs) {
  const order = xs.map((v, i) => i).sort((a, b) => xs[a] - xs[b] || a - b);
  const ranks = new Array(xs.length);
  for (let i = 0; i < order.length;) {
    let j = i;
    while (j + 1 < order.length && xs[order[j + 1]] === xs[order[i]]) j += 1;
    for (let k = i; k <= j; k += 1) ranks[order[k]] = (i + j) / 2 + 1;
    i = j + 1;
  }
  return ranks;
}
function pearson(xs, ys) {
  const mx = mean(xs), my = mean(ys);
  const sxx = neumaierSum(xs.map((x) => (x - mx) * (x - mx))), syy = neumaierSum(ys.map((y) => (y - my) * (y - my)));
  if (!(sxx > 0) || !(syy > 0)) return null;
  return Math.max(-1, Math.min(1, neumaierSum(xs.map((x, i) => (x - mx) * (ys[i] - my))) / Math.sqrt(sxx * syy)));
}

/* rel_corr: a correlation matrix in long form, each cell with its pairwise-complete n.
 * params: { columns: [...], method: "pearson" | "spearman" } */
function relCorr(rows, p0) {
  return guard("rel_corr", () => {
    const p = params(p0);
    needRows(rows, 3, "A correlation");
    const cols = p.columns;
    if (!Array.isArray(cols) || cols.length < 2 || cols.length > LIMITS.COLUMNS_MAX || !cols.every(isText) || new Set(cols).size !== cols.length) refuse("bad_params", "columns must be 2 to " + LIMITS.COLUMNS_MAX + " distinct column names.");
    if (!["pearson", "spearman"].includes(p.method)) refuse("bad_params", "Say which correlation: method: \"pearson\" or \"spearman\". There is no default.");
    const data = cols.map((c) => { numericColumn(rows, c); return rows.map((r) => (has(r, c) ? r[c] : null)); });
    const cells = [], done = new Map();   /* r is symmetric: each pair is computed once, in column order */
    cols.forEach((a, i) => cols.forEach((b, j) => {
      if (j < i) { cells.push(Object.assign({}, done.get(j + ":" + i), { var_a: a, var_b: b })); return; }
      const xs = [], ys = [];
      for (let k = 0; k < rows.length; k += 1) if (data[i][k] !== null && data[j][k] !== null) { xs.push(data[i][k]); ys.push(data[j][k]); }
      const cell = { var_a: a, var_b: b, r: null, n: xs.length, absent: null, reason: null };
      if (xs.length < 3) { cell.absent = "no_data"; cell.reason = "fewer than three rows hold both columns"; }
      else {
        cell.r = p.method === "pearson" ? pearson(xs, ys) : pearson(midRanks(xs), midRanks(ys));
        if (cell.r === null) { cell.absent = "not_applicable"; cell.reason = "a column is constant over the rows holding both, so no correlation is defined"; }
      }
      done.set(i + ":" + j, cell);
      cells.push(cell);
    }));
    const ord = { order: { values: cols.slice() } };
    const frames = [frame({ name: "cells", key: ["var_a", "var_b"], order: { by: ["var_a", "var_b"], direction: "ascending" }, depends_on: dependsOn(p),
      fields: [field.id("var_a", "string", "ordinal", null, ord), field.id("var_b", "string", "ordinal", null, ord),
        field.measure("r", "number", "correlation", rowN("n", "rows holding a number in both columns"), { nullable: true, absence: ABSENT_BY_ROW }),
        field.marker("n", "integer"), field.marker("absent", "string", true), field.marker("reason", "string", true)],
      markers: { population: population(rows.length, "rows read; each cell states its own pairwise-complete n"),
        rule: (p.method === "pearson" ? "Pearson's product-moment correlation" : "Spearman's rank correlation: Pearson's on mid-ranks, ties sharing the mean of their ranks") + ", over the rows holding both columns" },
      rows: cells })];
    return produce("rel_corr", "tolerance", { columns: cols.slice(), method: p.method }, frames,
      ["Which coefficients are more than chance: " + cols.length + " columns give " + (cols.length * (cols.length - 1) / 2) + " coefficients, none adjusted for the number examined, and none has an interval.",
        "Cause, or a relationship that is not a straight line (Pearson) or not monotone (Spearman).",
        "That two cells rest on the same rows: each cell uses the rows holding both of its columns."], "Ask for fewer columns.");
  });
}

function xyRows(rows, p, what) {
  needRows(rows, 3, what);
  needText(p.x, "which column is x"); needText(p.y, "which column is y");
  if (p.x === p.y) refuse("bad_params", "x and y must be two different columns.");
  numericColumn(rows, p.x); numericColumn(rows, p.y);
  const xs = [], ys = [], at = [];
  rows.forEach((r, i) => { const x = has(r, p.x) ? r[p.x] : null, y = has(r, p.y) ? r[p.y] : null; if (x !== null && y !== null) { xs.push(x); ys.push(y); at.push(i); } });
  if (xs.length < 3) refuse("too_few", what + " needs at least three rows holding both " + p.x + " and " + p.y + "; there are " + xs.length + ".");
  return { xs, ys, at, missing: rows.length - xs.length };
}
/* Ordinary least squares of y on x: +, -, *, / only. */
function ols(xs, ys) {
  const n = xs.length, mx = mean(xs), my = mean(ys);
  const sxx = neumaierSum(xs.map((x) => (x - mx) * (x - mx)));
  if (!(sxx > 0)) refuse("degenerate", "Every row has the same x, so no line is defined.");
  const slope = neumaierSum(xs.map((x, i) => (x - mx) * (ys[i] - my))) / sxx, intercept = my - slope * mx;
  const fitted = xs.map((x) => intercept + slope * x), resid = ys.map((y, i) => y - fitted[i]);
  const sse = neumaierSum(resid.map((e) => e * e)), syy = neumaierSum(ys.map((y) => (y - my) * (y - my)));
  return { n, mx, sxx, slope, intercept, fitted, resid, sse, syy };
}
const FIT_RULE = "ordinary least squares of y on x over the rows holding both";

/* rel_fit: the observations, the fitted line with its interval AS ITS OWN FRAME, and the coefficients.
 * params: { x, y, x_unit, y_unit } */
function relFit(rows, p0) {
  return guard("rel_fit", () => {
    const p = params(p0);
    const ux = needText(p.x_unit, "x's unit"), uy = needText(p.y_unit, "y's unit");
    const D = xyRows(rows, p, "A fitted line");
    if (D.xs.length > LIMITS.POINTS_MAX) refuse("over_cap", "The fit has " + D.xs.length + " observations; at most " + LIMITS.POINTS_MAX + " are returned as points. Narrow the rows.");
    const f = ols(D.xs, D.ys), n = f.n, dep = dependsOn(p);
    const s = Math.sqrt(f.sse / (n - 2));
    let lo = Infinity, hi = -Infinity;
    for (const x of D.xs) { if (x < lo) lo = x; if (x > hi) hi = x; }
    const grid = [];
    for (let i = 0; i < LIMITS.FIT_GRID; i += 1) {
      const x = i === LIMITS.FIT_GRID - 1 ? hi : lo + (hi - lo) * i / (LIMITS.FIT_GRID - 1);
      const yhat = f.intercept + f.slope * x, se = s * Math.sqrt(1 / n + (x - f.mx) * (x - f.mx) / f.sxx);
      grid.push({ x, y_hat: yhat, lo: yhat - Z95 * se, hi: yhat + Z95 * se });
    }
    const popRule = "rows holding a number in both " + p.x + " and " + p.y;
    const pop = population(n, popRule);
    const frames = [
      frame({ name: "points", key: ["row"], order: { by: ["row"], direction: "ascending" }, depends_on: dep,
        fields: [field.id("row", "integer", "nominal"), field.measure("x", "number", ux, { marker: "rows_marker" }), field.measure("y", "number", uy, { marker: "rows_marker" })],
        markers: { rows_marker: { n_per_row: "one row of the input", n_sort: "sample", n_rule: "each point is one row holding both columns; row is its position in the input" }, population: pop },
        rows: D.at.map((i, k) => ({ row: i, x: D.xs[k], y: D.ys[k] })) }),
      frame({ name: "fit", key: ["x"], order: { by: ["x"], direction: "ascending" }, depends_on: dep,
        fields: [field.id("x", "number", "quantitative", ux), field.measure("y_hat", "number", uy, POP), field.measure("lo", "number", uy, POP), field.measure("hi", "number", uy, POP)],
        markers: { population: pop, rule: FIT_RULE + ", evaluated at " + LIMITS.FIT_GRID + " equally spaced x from the smallest to the largest observed; the interval is for the MEAN of y at x, y_hat -/+ " + Z95 + " se with se = s sqrt(1/n + (x - mean x)^2 / Sxx) and s^2 = SSE / (n - 2): a normal multiplier, not Student's t" },
        rows: grid,
        declares: { sequence: [{ by: "x" }], interval: [{ low: "lo", high: "hi", mid: "y_hat", meaning: "an interval on the mean of y at x, y_hat -/+ " + Z95 + " se" }], same_scale: [["x", "points.x"], ["y_hat", "points.y"]] } }),
      quantities("coefficients", dep, [
        { name: "intercept", value: f.intercept, unit: uy, n, n_rule: popRule },
        { name: "slope", value: f.slope, unit: uy + " per " + ux, n, n_rule: popRule },
        { name: "residual_sd", value: s, unit: uy, n, n_rule: popRule + "; divisor n - 2" },
        f.syy > 0 ? { name: "r_squared", value: 1 - f.sse / f.syy, unit: "fraction", n, n_rule: popRule }
          : { name: "r_squared", value: null, unit: "fraction", n, n_rule: popRule, absent: "not_applicable", reason: "every row has the same y, so there is no variance to explain" },
      ]),
    ];
    return produce("rel_fit", "tolerance", { x: p.x, y: p.y, x_unit: ux, y_unit: uy }, frames,
      ["That the relationship is a line: the fit draws the best line whether or not a line fits. Look at rel_residuals.",
        "Cause, or what y would be at an x outside the observed range: the line is not drawn beyond it.",
        "An interval that is honest for few rows or for rows that share an event: it uses a normal multiplier and treats rows as independent. Student's t and the cluster-robust form are not built.",
        "Where a single new observation would fall: the interval is for the mean of y, which is narrower."], "Narrow the rows.");
  });
}

/* rel_residuals: residual against fitted, from the same fit. params: { x, y, y_unit } */
function relResiduals(rows, p0) {
  return guard("rel_residuals", () => {
    const p = params(p0);
    const uy = needText(p.y_unit, "y's unit");
    const D = xyRows(rows, p, "A residual plot");
    if (D.xs.length > LIMITS.POINTS_MAX) refuse("over_cap", "The fit has " + D.xs.length + " observations; at most " + LIMITS.POINTS_MAX + " residuals are returned. Narrow the rows.");
    const f = ols(D.xs, D.ys);
    const frames = [frame({ name: "residuals", key: ["row"], order: { by: ["row"], direction: "ascending" }, depends_on: dependsOn(p),
      fields: [field.id("row", "integer", "nominal"), field.measure("fitted", "number", uy, { marker: "rows_marker" }), field.measure("residual", "number", uy, { marker: "rows_marker" })],
      markers: { rows_marker: { n_per_row: "one row of the input", n_sort: "sample", n_rule: "each point is one row holding both columns; row is its position in the input" },
        population: population(f.n, "rows holding a number in both " + p.x + " and " + p.y), rule: FIT_RULE + "; residual = y - fitted" },
      rows: D.at.map((i, k) => ({ row: i, fitted: f.fitted[k], residual: f.resid[k] })) })];
    return produce("rel_residuals", "exact", { x: p.x, y: p.y, y_unit: uy }, frames,
      ["That the line fits: a pattern in the residuals is evidence against it, and no pattern is not proof for it.",
        "Independence of the rows: rows that share an event are drawn as separate points."], "Narrow the rows.");
  });
}

/* rel_qq: normal QQ points at min(n, QQ_POINTS_MAX) plotting positions, and the line through the
 * quartiles as its own frame. params: { column, unit } */
function relQq(rows, p0) {
  return guard("rel_qq", () => {
    const p = params(p0);
    needRows(rows, 3, "A QQ plot");
    const unit = needText(p.unit, "the column's unit");
    const col = numericColumn(rows, p.column);
    const n = col.values.length;
    if (n < 3) refuse("too_few", "A QQ plot needs at least three values; " + p.column + " holds " + n + ".");
    const sorted = col.values.slice().sort((a, b) => a - b);
    if (sorted[0] === sorted[n - 1]) refuse("degenerate", "Every value of " + p.column + " is the same, so there is no shape to compare with a normal.");
    const m = Math.min(n, LIMITS.QQ_POINTS_MAX), dep = dependsOn(p);
    const points = [];
    for (let i = 1; i <= m; i += 1) { const pr = (i - 0.5) / m; points.push({ rank: i, theoretical: inverseNormal(pr), sample: nearestRank(sorted, pr).value }); }
    const z25 = inverseNormal(0.25), z75 = inverseNormal(0.75), q25 = nearestRank(sorted, 0.25).value, q75 = nearestRank(sorted, 0.75).value;
    const slope = (q75 - q25) / (z75 - z25), at = (z) => q25 + slope * (z - z25);
    const popRule = "rows holding a finite number in " + p.column;
    const pop = population(n, popRule);
    const frames = [
      frame({ name: "points", key: ["rank"], order: { by: ["rank"], direction: "ascending" }, depends_on: dep,
        fields: [field.id("rank", "integer", "quantitative"), field.measure("theoretical", "number", "z", POP), field.measure("sample", "number", unit, POP)],
        markers: { population: pop, rule: "at " + m + " plotting positions (i - 0.5) / " + m + ": theoretical is the standard normal quantile (Acklam's rational approximation, relative error below 1.15e-9) and sample is the nearest-rank quantile of the values" },
        rows: points }),
      frame({ name: "line", key: ["theoretical"], order: { by: ["theoretical"], direction: "ascending" }, depends_on: dep,
        fields: [field.id("theoretical", "number", "quantitative", "z"), field.measure("sample", "number", unit, POP)],
        markers: { population: pop, rule: "the line through the first and third quartiles of both axes, drawn between the smallest and largest theoretical quantile" },
        rows: [{ theoretical: points[0].theoretical, sample: at(points[0].theoretical) }, { theoretical: points[m - 1].theoretical, sample: at(points[m - 1].theoretical) }],
        declares: { sequence: [{ by: "theoretical" }], same_scale: [["theoretical", "points.theoretical"], ["sample", "points.sample"]] } }),
    ];
    return produce("rel_qq", "tolerance", { column: p.column, unit }, frames,
      ["That the column is or is not normal: the plot shows where it departs from the line and tests nothing.",
        "The tails beyond the smallest and largest plotting position."], "Narrow the rows.");
  });
}

/* ---------- 5. sequential ---------- */

const NOT_PROSPECTIVE = Object.freeze({
  synthetic_backtest: "This is a synthetic backtest: every outcome was known when the forecasts were fitted, so a product of likelihood ratios over them is not an e-process and crossing a threshold would mean nothing. No wealth path is drawn. fe_paired shows the same differences as a running sum, with no threshold.",
  historical_backtest: "This is a historical backtest: every outcome was known when the forecasts were fitted, so a product of likelihood ratios over them is not an e-process and crossing a threshold would mean nothing. No wealth path is drawn. fe_paired shows the same differences as a running sum, with no threshold.",
});
const DEFAULT_ALPHAS = Object.freeze([0.1, 0.05, 0.01]);

/* seq_wealth: the log of a test martingale's wealth after each step, with the thresholds ln(1 / alpha).
 * params: { evidence_class, input: "likelihood_ratio" | "forecasts", alphas? }
 *   likelihood_ratio rows: { lr }                          one factor per step, a number above 0
 *   forecasts rows:        { baseline, candidate, outcome } the factor is candidate's likelihood of the
 *                                                           outcome over baseline's
 * The evidence class is the caller's statement and nothing here can check it. For the two backtest
 * classes the producer refuses: that is the rule, and it is not a parameter. */
function seqWealth(rows, p0) {
  return guard("seq_wealth", () => {
    const p = params(p0);
    if (!EVIDENCE_CLASSES.includes(p.evidence_class)) refuse("bad_params", "Say what the evidence is: evidence_class is one of " + EVIDENCE_CLASSES.join(", ") + ". There is no default.");
    if (has(NOT_PROSPECTIVE, p.evidence_class)) refuse("not_prospective", NOT_PROSPECTIVE[p.evidence_class]);
    if (!["likelihood_ratio", "forecasts"].includes(p.input)) refuse("bad_params", "Say what the rows are: input: \"likelihood_ratio\" (rows of {lr}) or \"forecasts\" (rows of {baseline, candidate, outcome}).");
    needRows(rows, 1, "A wealth path");
    const alphas = p.alphas === undefined ? DEFAULT_ALPHAS.slice() : p.alphas;
    if (!Array.isArray(alphas) || alphas.length < 1 || alphas.length > LIMITS.ALPHAS_MAX || !alphas.every((a) => isNum(a) && a > 0 && a < 1) || alphas.some((a, i) => i > 0 && !(a < alphas[i - 1]))) {
      refuse("bad_params", "alphas must be 1 to " + LIMITS.ALPHAS_MAX + " numbers strictly between 0 and 1, strictly decreasing.");
    }
    const logs = rows.map((r, i) => {
      if (p.input === "likelihood_ratio") {
        if (!isNum(r.lr)) refuse("not_finite", "Row " + i + " holds " + String(r.lr) + " as its likelihood ratio, which is not a finite number.");
        if (!(r.lr > 0)) refuse("out_of_range", "Row " + i + " holds a likelihood ratio of " + r.lr + ". A factor of zero or less ends the path: log wealth is not finite there.");
        return Math.log(r.lr);
      }
      const qb = probability(r.baseline, i, "baseline forecast", true), qc = probability(r.candidate, i, "candidate forecast", true), y = outcome(r.outcome, i);
      return y === 1 ? Math.log(qc) - Math.log(qb) : Math.log1p(-qc) - Math.log1p(-qb);
    });
    const dep = dependsOn(p), n = logs.length;
    const pop = population(n, "steps read, in the order given");
    const path = runningSums(logs).map((w, i) => ({ step: i + 1, log_wealth: w }));
    const frames = [
      frame({ name: "wealth", key: ["step"], order: { by: ["step"], direction: "ascending" }, depends_on: dep,
        fields: [field.id("step", "integer", "quantitative"), field.measure("log_wealth", "number", "nats", POP)],
        markers: { population: pop, rule: "log wealth after each step: the running sum of the log of each step's factor, starting from wealth one" + (p.input === "forecasts" ? "; a step's factor is the candidate's likelihood of the outcome over the baseline's" : "") },

        for (const k of BOX) if (B[k]) { const v = read(row, B[k]); if (v !== null) it[k] = v; }
        const gk = dKey(groupOf(row));
        const gap = it[pos] === null ? pos : ["q1", "median", "q3"].find((k) => !has(it, k)) || visualGap(row);
        if (gap) { const at = {}; at[pos] = it[pos]; miss(row, gap, at, dodge ? gk : undefined); return; }
        const order = BOX.filter((k) => has(it, k)).map((k) => it[k]);
        if (order.some((v, j) => j > 0 && v < order[j - 1])) fail("bad_frames", path, "A summary row of " + frame.name + " is out of order (min ≤ q1 ≤ median ≤ q3 ≤ max does not hold).");
        const k = String(it[pos]) + (dodge ? "\u0000" + gk : "");
        if (seen.has(k)) fail("duplicate_position", path, "Two summary rows land on the same box (" + pos + " = " + String(it[pos]) + "). " + (dodge ? "The grouping does not separate them." : "Set arrange.dodge with a grouping on color or detail, or facet by the field that tells them apart."));
        seen.add(k);
        if (dodge) dodgeGroup.set(it, gk);
        layer.items.push(visuals(row, it));
      });
    } else {  // point, text, tick, rule, segment, rect, errorbar
      const chans = ["x", "y", "x2", "y2"].filter((c) => B[c]);
      const one = (row, i) => {
        const it = { key: row ? rowKey(row) : "spec|" + id + "|" + i };
        const gk = row && dodge ? dKey(groupOf(row)) : undefined;
        let gap = null;
        for (const c of chans) { const v = val(c, row); if (v === null) { gap = gap || c; continue; } it[c] = v; }
        if (mark === "text") { const t = B.text.kind === "value" ? B.text.value : read(row, B.text); if (t === null) gap = gap || "text"; else it.text = String(t); }
        if (row && !gap) gap = visualGap(row);
        if (gap) { miss(row, gap, { x: has(it, "x") && !has(it, "x2") ? it.x : null, y: has(it, "y") && !has(it, "y2") ? it.y : null }, gk); return; }
        if (gk !== undefined) dodgeGroup.set(it, gk);
        layer.items.push(row ? visuals(row, it) : it);
      };
      if (frame) rows.forEach(one); else one(null, 0);
      if (mark === "point" || mark === "tick") {
        const seen = new Set();
        for (const it of layer.items) {
          const k = chans.map((c) => String(it[c])).join("\u0000") + (dodge ? "\u0000" + dodgeGroup.get(it) : "");
          if (seen.has(k)) {
            fail("rows_indistinguishable", path, "Two rows of " + frame.name + " sit at exactly the same position, so one " + mark + " would hide the other. The view never jitters or merges. " +
              "Ask for a histogram or count frame of these values and draw that.");
          }
          seen.add(k);
        }
      }
      if (mark === "errorbar") {
        const at = orient === "vertical" ? "x" : "y";
        const seen = new Set();
        for (const it of layer.items) {
          const k = String(it[at]) + (dodge ? "\u0000" + dodgeGroup.get(it) : "");
          if (seen.has(k)) fail("duplicate_position", path, "Two rows put an errorbar at the same " + at + " (" + String(it[at]) + "). " + (dodge ? "The grouping does not separate them." : "Set arrange.dodge with the same grouping as the bars it sits on, or facet by the field that tells them apart."));
          seen.add(k);
        }
      }
      if (mark === "rect") {
        const seen = new Set();
        for (const it of layer.items) { const k = chans.map((c) => String(it[c])).join("\u0000"); if (seen.has(k)) fail("duplicate_position", path, "Two rows land on the same cell. The view never adds rows up; facet by the field that tells them apart."); seen.add(k); }
      }
    }

    function pathItem(pts, g, gk, pos) {
      const orderB = B.order && B.order.kind === "field" ? B.order : B[pos];
      const seqField = orderB.kind === "field" ? orderB.name : null;
      const seq = (Array.isArray(frame.declares.sequence) ? frame.declares.sequence : []).find((s) => s.by === seqField);
      if (!seq) {
        fail("relationship_not_declared", B.order ? epath("order") : epath(pos), "A " + mark + " joins rows in order of " + seqField + ", and frame " + frame.name +
          " does not declare " + seqField + " a connectable sequence (declares.sequence). Draw points instead, or use a frame whose producer declares the sequence.");
      }
      for (const w of Array.isArray(seq.within) ? seq.within : []) {
        if (typeof w !== "string" || !frame.fields.has(w)) continue;
        const held = new Set(pts.map(([row]) => row[w]));
        if (held.size > 1) {
          fail("relationship_not_declared", B.order ? epath("order") : epath(pos), "Frame " + frame.name + " declares " + seqField + " a sequence within " + w + ", and this " + mark + " would join rows of " + held.size +
            " different " + w + " values into one path. Bind " + w + " to color or detail, or facet by it.");
        }
      }
      const dOrder = orderB.vk === "d" ? usages.get(scaleKey(scaleChOf(B.order ? "order" : pos))) : null;
      const ord = (row) => { const v = read(row, orderB); return orderB.vk === "d" && dOrder ? dOrder.members.indexOf(v) : v; };
      const withOrd = pts.map(([row, it]) => [ord(row), it]);
      if (withOrd.some((p) => p[0] === null)) fail("bad_frames", path, "A row of " + frame.name + " has no " + seqField + ", so it has no place on the path.");
      withOrd.sort((a, b) => cmp(a[0], b[0]));
      for (let i = 1; i < withOrd.length; i++) {
        if (withOrd[i][0] === withOrd[i - 1][0]) {
          fail("duplicate_position", path, "Two rows of " + frame.name + " share one " + seqField + " on the same path, so the path would double back. " +
            (groupBindings.length ? "The grouping does not separate them." : "Bind the field that separates the series to color or detail, or facet by it."));
        }
      }
      let points = withOrd.map((p) => p[1]);
      if (Array.isArray(seq.members) && orderB.vk !== "d" && !B.order) {
        const at = new Map(points.map((p) => [p[pos], p]));
        const members = seq.members.map((m) => (orderB.vk === "t" ? Date.parse(m) : m));
        if (points.every((p) => members.includes(p[pos]))) {
          const lenCh = pos === "x" ? "y" : "x";
          points = members.map((m) => { if (at.has(m)) return at.get(m); const hole = { key: frame.name + "~missing~" + String(m) }; hole[pos] = m; hole[lenCh] = null; if (mark !== "line") hole[lenCh + "2"] = null; return hole; });
        }
      }
      if (points.length > VIEW.PATH_POINTS_MAX) fail("cardinality_exceeded", path, "A path has " + points.length + " points; the limit is " + VIEW.PATH_POINTS_MAX + " (PATH_POINTS_MAX).");
      const item = { key: frame.name + "~" + (gk || "all"), group: {} };
      for (const [ch] of groupBindings) item.group[ch] = g[ch];
      for (const ch of ["color", "shape", "size", "opacity"]) if (B[ch] && B[ch].kind === "field" && B[ch].vk === "d") item[ch] = g[ch];
      item.points = points;
      return item;
    }

    // limits, key uniqueness, values onto scales
    const limit = mark === "text" ? VIEW.TEXT_ITEMS_MAX : isPath ? VIEW.SERIES_MAX : VIEW.LAYER_ITEMS_MAX;
    if (layer.items.length > limit) {
      fail("cardinality_exceeded", path, "This " + mark + " layer would draw " + layer.items.length + " items; the limit is " + limit + " (" + (mark === "text" ? "TEXT_ITEMS_MAX" : "LAYER_ITEMS_MAX") +
        "). Ask a producer for a summary frame (a histogram, quantiles, a binned table) and draw that.");
    }
    const ks = new Set();
    for (const it of layer.items) { if (ks.has(it.key)) fail("bad_frames", path, "Frame " + (frame ? frame.name : "") + " does not give its rows unique keys (" + it.key + ")."); ks.add(it.key); }
    const coord = (o) => {
      for (const c of Object.keys(o)) {
        if (c === "key" || c === "group" || c === "points" || c === "slot" || c === "value" || c === "text") continue;
        const sc = scaleChOf(c);
        if (o[c] === null || !layer.scales[sc]) continue;
        addValue(usages.get(layer.scales[sc]), o[c]);
      }
    };
    const inOrder = (o) => {
      for (const [lo, hi] of ordered) {
        if (typeof o[lo] === "number" && typeof o[hi] === "number" && o[lo] > o[hi]) {
          fail("bad_frames", path, "A row of " + frame.name + " has its declared interval reversed (" + B[lo].name + " = " + o[lo] + " above " + B[hi].name + " = " + o[hi] + "). This is a producer defect.");
        }
      }
    };
    for (const it of layer.items) { inOrder(it); if (it.points) it.points.forEach(inOrder); }
    for (const it of layer.items) { coord(it); if (it.points) { it.points.forEach(coord); counts.path_points += it.points.length; } else counts.items++; }
    if (absences.length > VIEW.LAYER_ITEMS_MAX) fail("cardinality_exceeded", path, "This layer has " + absences.length + " rows with no value; the limit is " + VIEW.LAYER_ITEMS_MAX + " (LAYER_ITEMS_MAX). Ask for a narrower frame.");
    for (const a of absences) for (const c of POSITIONAL) if (has(a, c) && layer.scales[c]) addValue(usages.get(layer.scales[c]), a[c]);
    if (absences.length > 0) { layer.absent = absences.length; layer.absences = absences; counts.absent += absences.length; }
    const drawsValue = isPath ? layer.items.some((it) => it.points.some((q) => Object.keys(q).every((k) => q[k] !== null))) : layer.items.length > 0;
    const lenCh = orient === "horizontal" ? "x" : "y";
    built.push({ layer, pid, path, mark, orient, dodge, dodgeCh, dodgeGroup, groupFields: groupBindings.map(([, b]) => b.name).join("\u0001"), grouped: groupBindings.length > 0,
      colorKey: B.color && B.color.kind === "field" && B.color.vk === "d" ? scaleKey("color") : null,
      groupColor: (() => { const m = new Map(); if (frame && dodge) for (const row of rows) { const g = groupOf(row); m.set(dKey(g), g.color); } return m; })(),
      drawsValue, absentKinds: Array.from(new Set(absences.map((a) => a.kind))),
      gapFields: absences.length ? Array.from(new Set(absences.map((a) => (layer.fields[a.channel] ? layer.fields[a.channel].field : a.channel)))) : (layer.fields[lenCh] ? [layer.fields[lenCh].field] : []) });
    if (counts.items + counts.path_points > VIEW.MARKS_MAX) fail("cardinality_exceeded", path, "The chart would draw more than " + VIEW.MARKS_MAX + " marks (MARKS_MAX). Ask a producer for a summary frame.");
    counts.layers++;
    return layer;
  }

  /* ---- composition ---- */
  function buildPanel(node, ctx, path, title) {
    if (panelSeq >= VIEW.PANELS_MAX) fail("cardinality_exceeded", path, "The chart would have more than " + VIEW.PANELS_MAX + " panels (PANELS_MAX).");
    const pid = "p" + panelSeq++;
    const panel = { id: pid, title: title ? { text: title, origin: "spec" } : null, note: null, axes: [], layers: [] };
    panels[pid] = panel;
    counts.panels++;
    node.layer.forEach((L, i) => {
      const scope = {};
      for (const sc of SCALE_CHANNELS) scope[sc] = node.resolve.scale[sc] === "independent" ? ctx.scope[sc] + "/l" + i : ctx.scope[sc];
      panel.layers.push(buildLayer(L, i, pid, scope, ctx.facet, ctx.repeat, (path ? path + "." : "") + "layer[" + i + "]"));
    });
    if (!panel.layers.some((l) => l.origin === "frame")) {
      fail("missing_channel", path, "This " + (path ? "panel" : "view") + " draws only constants you wrote and no frame data. A reference mark accompanies data; bind a frame field in at least one layer.");
    }
    const mine = built.filter((b) => b.pid === pid);
    // Dodge slots, once per panel and position scale, so a mark over a dodged bar carries that bar's slot.
    const sets = new Map();
    for (const b of mine) if (b.dodge) { const k = b.layer.scales[b.dodgeCh]; if (!sets.has(k)) sets.set(k, []); sets.get(k).push(b); }
    for (const list of sets.values()) {
      const grouped = list.filter((b) => b.grouped);
      if (grouped.length === 0) { list.forEach((b, k) => { for (const o of b.dodgeGroup.keys()) o.slot = { index: k, count: list.length }; }); continue; }
      const odd = list.find((b) => !b.grouped) || grouped.find((b) => b.groupFields !== grouped[0].groupFields);
      if (odd) {
        fail("scale_conflict", odd.path + ".arrange.dodge", "The dodged layers of this panel must agree on what a slot is: " + (odd.grouped ? "they group by different fields" : "one groups by a field and one does not") +
          ". Give every dodged layer the same grouping field (on color or detail), or none.");
      }
      const order = [];
      for (const b of list) for (const gk of b.dodgeGroup.values()) if (!order.includes(gk)) order.push(gk);
      const coloured = list.find((b) => b.colorKey);
      if (coloured) {   // the legend's order: the given domain, else the colour scale's members
        const u = usages.get(coloured.colorKey);
        const given = u.specs.find((sp) => sp.def.domain);
        const dom = given ? given.def.domain : u.members;
        const colorOf = new Map();
        for (const b of list) for (const [gk, c] of b.groupColor) if (c !== undefined) colorOf.set(gk, c);
        const first = new Map(order.map((gk, i) => [gk, i]));
        const rank = (gk) => { const i = dom.indexOf(colorOf.get(gk)); return i < 0 ? dom.length : i; };
        order.sort((a, c) => rank(a) - rank(c) || first.get(a) - first.get(c));
      }
      if (order.length > VIEW.SERIES_MAX) fail("cardinality_exceeded", list[0].path, "These layers dodge " + order.length + " groups; the limit is " + VIEW.SERIES_MAX + " (SERIES_MAX). Facet, or ask for fewer groups.");
      for (const b of list) for (const [o, gk] of b.dodgeGroup) o.slot = { index: order.indexOf(gk), count: order.length };
    }
    // Two bar layers must not cover one another: the lower one's lengths would be hidden, not added.
    const bars = mine.filter((b) => b.mark === "bar");
    for (let i = 0; i < bars.length; i++) {
      for (let j = i + 1; j < bars.length; j++) {
        const a = bars[i], c = bars[j];
        const pa = a.orient === "vertical" ? "x" : "y", pc = c.orient === "vertical" ? "x" : "y";
        if (a.dodge && c.dodge && a.layer.scales[a.dodgeCh] === c.layer.scales[c.dodgeCh]) continue;
        let meet;
        if (pa !== pc || a.layer.scales[pa] !== c.layer.scales[pc]) meet = a.layer.items.length > 0 && c.layer.items.length > 0;
        else if (usages.get(a.layer.scales[pa]).kinds.has("d")) { const held = new Set(a.layer.items.map((it) => it[pa])); meet = c.layer.items.some((it) => held.has(it[pa])); }
        else {
          const iv = (it) => (has(it, pa + "2") ? [Math.min(it[pa], it[pa + "2"]), Math.max(it[pa], it[pa + "2"])] : [it[pa], it[pa]]);
          const A = a.layer.items.map(iv);
          meet = c.layer.items.map(iv).some(([lo, hi]) => A.some(([l2, h2]) => (lo < hi && l2 < h2 ? lo < h2 && l2 < hi : lo <= h2 && l2 <= hi)));
        }
        if (meet) {
          fail("layer_overlap", c.path, "Layers " + a.layer.id + " and " + c.layer.id + " are both bars in one panel and would cover one another, hiding lengths instead of showing them. " +
            "Set arrange.dodge on both to put them side by side, stack or dodge one long-form frame by a grouping, or draw them in separate panels (a concat or a facet).");
        }
      }
    }
    // A panel with rows and no value says so; it is not an empty frame.
    const data = mine.filter((b) => b.layer.origin === "frame");
    if (data.length > 0 && data.every((b) => !b.drawsValue)) {
      const names = Array.from(new Set(data.flatMap((b) => b.gapFields)));
      const kinds = Array.from(new Set(data.flatMap((b) => b.absentKinds)));
      panel.note = { kind: "all_absent", text: "No value to draw: every row of " + (names.join(", ") || "this panel") + " is absent" +
        (kinds.length === 1 && kinds[0] !== "unstated" ? " (" + kinds[0].replace("_", " ") + ")" : "") + "." };
    }
    return pid;
  }
  const child = (scope, node, tag, j) => { const o = {}; for (const sc of SCALE_CHANNELS) o[sc] = scope[sc] + "/" + tag + (!node || node.resolve.scale[sc] === "independent" ? j : ""); return o; };
  const ttl = (t) => (t ? { text: t, origin: "spec" } : null);

  function walk(node, ctx, path, isRoot) {
    const p = (k) => (path ? path + "." + k : k);
    if (node.layer) return { kind: "panel", id: buildPanel(node, ctx, path, isRoot ? null : node.title) };
    if (node.hconcat || node.vconcat) {
      const k = node.hconcat ? "hconcat" : "vconcat";
      return { kind: "concat", direction: node.hconcat ? "horizontal" : "vertical", title: isRoot ? null : ttl(node.title),
        children: node[k].map((c, i) => walk(c, Object.assign({}, ctx, { scope: child(ctx.scope, node, "c", i) }), p(k + "[" + i + "]"), false)), shared: { x: false, y: false } };
    }
    const grid = { kind: "grid", origin: node.facet ? "facet" : "repeat", title: isRoot ? null : ttl(node.title), rows: 1, columns: 1, row_header: null, column_header: null, cells: [], shared: { x: false, y: false } };
    const inner = node.spec;
    let combos;   // [{row, column, label, facet, repeat}]
    if (node.facet) {
      const bound = inner.layer.filter((L) => Object.keys(L.encoding).some((ch) => ch === "detail" || has(L.encoding[ch], "field")));
      if (bound.length === 0) fail("missing_channel", p("spec"), "A facet needs at least one layer that binds a frame field.");
      const valuesOf = (fd, fpath) => {
        const out = [];
        for (const L of bound) {
          const fr = frameOf(L.frame, p("spec"));
          if (!fr.fields.has(fd.field)) fail("unknown_field", fpath + ".field", "Frame " + fr.name + " has no field \"" + fd.field + "\" to facet by. Its fields: " + Array.from(fr.fields.keys()).join(", ") + ".");
          const b = bindField(fr, fd.field, "facet", fpath);
          if (b.vk !== "d") fail("channel_level_mismatch", fpath + ".field", "A facet splits by a categorical field; " + fd.field + " is " + b.decl.level + ". The view does not bin it.");
          for (const v of discreteOrder(fr.rows, b, fd.sort, fpath)) if (!out.includes(v)) out.push(v);
        }
        if (out.length > VIEW.FACET_VALUES_MAX) fail("cardinality_exceeded", fpath, "Faceting by " + fd.field + " gives " + out.length + " panels; the limit is " + VIEW.FACET_VALUES_MAX + " (FACET_VALUES_MAX). Ask for fewer groups, or colour by it instead.");
        return out;
      };
      const anyRows = (filters) => bound.some((L) => F.byName.get(L.frame).rows.some((r) => filters.every((f) => r[f.field] === f.value)));
      if (node.facet.wrap) {
        const vals = valuesOf(node.facet.wrap, p("facet.wrap"));
        grid.columns = Math.min(vals.length, node.facet.columns || 3);
        grid.rows = Math.ceil(vals.length / grid.columns);
        combos = vals.map((v, i) => ({ row: Math.floor(i / grid.columns), column: i % grid.columns, label: String(v), facet: [{ field: node.facet.wrap.field, value: v }] }));
      } else {
        const rv = node.facet.row ? valuesOf(node.facet.row, p("facet.row")) : [null];
        const cv = node.facet.column ? valuesOf(node.facet.column, p("facet.column")) : [null];
        grid.rows = rv.length; grid.columns = cv.length;
        if (node.facet.row) grid.row_header = { title: node.facet.row.field, labels: rv.map(String) };
        if (node.facet.column) grid.column_header = { title: node.facet.column.field, labels: cv.map(String) };
        combos = [];
        rv.forEach((r, ri) => cv.forEach((c, ci) => {
          const facet = [];
          if (node.facet.row) facet.push({ field: node.facet.row.field, value: r });
          if (node.facet.column) facet.push({ field: node.facet.column.field, value: c });
          if (anyRows(facet)) combos.push({ row: ri, column: ci, label: [c, r].filter((v) => v !== null).map(String).join(" · "), facet });
        }));
      }
    } else {
      const R = node.repeat;
      if (R.wrap) {
        grid.columns = Math.min(R.wrap.length, R.columns || 3);
        grid.rows = Math.ceil(R.wrap.length / grid.columns);
        combos = R.wrap.map((f, i) => ({ row: Math.floor(i / grid.columns), column: i % grid.columns, label: f, repeat: { wrap: f } }));
      } else {
        const rv = R.row || [null], cv = R.column || [null];
        grid.rows = rv.length; grid.columns = cv.length;
        if (R.row) grid.row_header = { title: null, labels: rv.slice() };
        if (R.column) grid.column_header = { title: null, labels: cv.slice() };
        combos = [];
        rv.forEach((r, ri) => cv.forEach((c, ci) => combos.push({ row: ri, column: ci, label: [c, r].filter((v) => v !== null).join(" · "), repeat: { row: r, column: c } })));
      }
    }
    combos.forEach((c, j) => {
      const cctx = { scope: child(ctx.scope, node, node.facet ? "f" : "r", j), facet: ctx.facet.concat(c.facet || []), repeat: c.repeat || ctx.repeat };
      grid.cells.push({ row: c.row, column: c.column, label: c.label, panel: buildPanel(inner, cctx, p("spec"), null) });
    });
    return grid;
  }

  const root = walk(view, { scope: ALL("r"), facet: [], repeat: null }, "", true);

  /* ---- scales ---- */
  const scales = {};
  const idOf = new Map();
  const seq = { x: 0, y: 0, color: 0, size: 0, shape: 0, opacity: 0 };
  const prefix = { x: "x", y: "y", color: "c", size: "s", shape: "h", opacity: "o" };
  for (const key of usageOrder) {
    const u = usages.get(key);
    const ch = u.channel;
    const at = u.specs.length ? u.specs[0].path : (u.fields.size ? Array.from(u.fields.values())[0].path : "");
    if (u.kinds.size > 1) {
      fail("scale_type_mismatch", at, "One " + ch + " scale is shared by fields of different levels (" + Array.from(u.fields.values()).map((b) => b.name + ": " + b.decl.level).join(", ") +
        "). Give the layers independent scales (resolve.scale." + ch + ": \"independent\") or draw them in separate views.");
    }
    const vk = Array.from(u.kinds)[0];
    const S = {};
    for (const s of u.specs) for (const k of Object.keys(s.def)) {
      if (has(S, k) && JSON.stringify(S[k]) !== JSON.stringify(s.def[k])) fail("scale_conflict", s.path + "." + k, "Two channels on one " + ch + " scale ask for different " + k + ". State it once, or make the scales independent.");
      S[k] = s.def[k];
    }
    // units and relationships
    const fq = Array.from(u.fields.keys());
    for (let i = 1; i < fq.length; i++) {
      const a = fq[0], b = fq[i];
      if (u.units.get(a) !== u.units.get(b)) {
        fail("unit_mismatch", u.fields.get(b).path, "Fields " + a + " (" + (u.units.get(a) || "no unit") + ") and " + b + " (" + (u.units.get(b) || "no unit") + ") would share one " + ch +
          " scale, and their units differ. Nothing converts units. Give them independent scales (resolve.scale." + ch + ": \"independent\"), or separate views.");

  e.needs = { dimension: dimension, plot_px: Math.ceil(needPx), have_px: Math.round(havePx) };
  throw e;
}

/* THE one number formatter for anything written to the SVG. */
function num(v) {
  if (typeof v !== "number" || !isFinite(v)) fail("non_finite", "a non-finite number reached the output (" + String(v) + ")");
  const r = Math.round(v * 100) / 100;
  return r === 0 ? "0" : String(r);
}

function esc(s) {
  return String(s)
    .replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f￾￿]/g, "�")
    .replace(/[\ud800-\udbff](?![\udc00-\udfff])|(^|[^\ud800-\udbff])[\udc00-\udfff]/g,
             (m, p) => (p || "") + "�")
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function el(name, attrs, inner) {
  let s = "<" + name;
  for (const k in attrs) {
    const v = attrs[k];
    if (v === null || v === undefined || v === "") continue;
    s += " " + k + "=\"" + esc(typeof v === "number" ? num(v) : v) + "\"";
  }
  return inner === undefined ? s + "/>" : s + ">" + inner + "</" + name + ">";
}

function textWidth(s, size, tracked) {
  return String(s).length * size * (CHAR_EM + (tracked ? 0.08 : 0));
}

function truncate(s, maxPx, size) {
  s = String(s);
  if (textWidth(s, size) <= maxPx) return { text: s, cut: false };
  const keep = Math.max(1, Math.floor(maxPx / (size * CHAR_EM)) - 1);
  return { text: s.slice(0, keep) + "…", cut: true };
}

/* A text element; `full` (when the drawn text was cut) becomes a <title> tooltip child. */
function text(cls, x, y, str, extra, full) {
  const attrs = Object.assign({ class: cls, x: x, y: y }, extra || {});
  return el("text", attrs, (full !== undefined && full !== null ? el("title", {}, esc(full)) : "") + esc(str));
}

function isObj(v) { return v !== null && typeof v === "object" && !Array.isArray(v); }
function has(o, k) { return isObj(o) && Object.prototype.hasOwnProperty.call(o, k) && o[k] !== undefined && o[k] !== null; }
function memberKey(v) { return typeof v + ":" + String(v); }

/* ---------- colour ---------- */
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function rgbHex(c) {
  return "#" + c.map((v) => {
    const n = Math.max(0, Math.min(255, Math.round(v)));
    return (n < 16 ? "0" : "") + n.toString(16);
  }).join("");
}
/* Piecewise between stops, in sRGB, as chart_forms.js `rampColour` does. */
function rampColour(stops, t) {
  const u = t < 0 ? 0 : (t > 1 ? 1 : t);
  const n = stops.length - 1;
  const seg = Math.min(n - 1, Math.floor(u * n));
  const f = u * n - seg;
  const a = hexRgb(stops[seg]), b = hexRgb(stops[seg + 1]);
  return rgbHex([0, 1, 2].map((i) => a[i] + (b[i] - a[i]) * f));
}

/* ---------- scales ---------- */
function niceStepFor(span, maxIntervals) {
  if (!(span > 0)) return 1;
  const raw = span / Math.max(1, maxIntervals);
  const mag = Math.pow(10, Math.floor(Math.log(raw) / Math.LN10));
  for (let i = 0; i < NICE_STEPS.length; i += 1) {
    if (NICE_STEPS[i] * mag >= raw * (1 - 1e-9)) return NICE_STEPS[i] * mag;
  }
  return 10 * mag;
}

function clean(v) { return v === 0 ? 0 : parseFloat(v.toPrecision(12)); }

/* The page's outward snap (chart_forms.js `niceDomain`): among ladder steps that keep the interval
 * count inside [GRID_MIN, maxIntervals], the one adding least headroom. */
function niceDomain(lo, hi, maxIntervals) {
  const span = hi - lo;
  const mag0 = Math.pow(10, Math.floor(Math.log(span) / Math.LN10));
  let best = null;
  for (let m = mag0 / 100; m <= mag0 * 10; m *= 10) {
    for (let i = 0; i < NICE_STEPS.length - 1; i += 1) {
      const step = NICE_STEPS[i] * m;
      if (!(step > 0) || !isFinite(step)) continue;
      const dlo = Math.floor(lo / step + 1e-9) * step, dhi = Math.ceil(hi / step - 1e-9) * step;
      const n = Math.round((dhi - dlo) / step);
      if (n < GRID_MIN || n > maxIntervals) continue;
      const slack = ((dhi - hi) + (lo - dlo)) / span;
      if (!best || slack <= best.slack + 1e-12) best = { lo: clean(dlo), hi: clean(dhi), slack: slack };
    }
  }
  return best ? [best.lo, best.hi] : [lo, hi];
}

function transformOf(def) {
  const type = def.type;
  if (type === "linear" || type === "time" || type === "sequential" || type === "diverging") return (v) => v;
  if (type === "log") {
    const base = has(def, "base") ? def.base : 10;
    return (v) => Math.log(v) / Math.log(base);
  }
  if (type === "symlog") {
    const c = has(def, "constant") ? def.constant : 1;
    return (v) => (v < 0 ? -1 : 1) * Math.log1p(Math.abs(v) / c);
  }
  if (type === "sqrt") return (v) => (v < 0 ? -1 : 1) * Math.sqrt(Math.abs(v));
  return null;
}

/* A scale as a map to t in [0, 1] (t = 0 is `domain[0]`'s end of the range, before `reverse`). */
function buildScale(def, id, niceCount) {
  if (!isObj(def)) fail("bad_plan", "scale \"" + id + "\" is not in plan.scales");
  if (SCALE_TYPES.indexOf(def.type) < 0) fail("unknown_scale", "unknown scale type \"" + def.type + "\" on scale \"" + id + "\"");
  const s = { id: id, def: def, type: def.type, reverse: def.reverse === true, bw: 0 };
  const flip = (t) => (s.reverse ? 1 - t : t);
  const bad = (v) => fail("bad_value", "value " + JSON.stringify(v) + " is not on scale \"" + id + "\" (" + def.type + ")");
  if (!Array.isArray(def.domain) || def.domain.length < 1) fail("bad_plan", "scale \"" + id + "\" has no domain");
  if (def.type === "band" || def.type === "point" || def.type === "ordinal") {
    s.discrete = true;
    s.members = def.domain.slice();
    const index = {};
    s.members.forEach((m, i) => { index[memberKey(m)] = i; });
    s.indexOf = (v) => {
      const i = index[memberKey(v)];
      if (i === undefined) bad(v);
      return i;
    };
    const n = s.members.length;
    if (def.type === "band") {
      const pin = has(def, "padding_inner") ? def.padding_inner : 0.2;
      const pout = has(def, "padding_outer") ? def.padding_outer : 0.1;
      const step = 1 / Math.max(1e-9, n - pin + 2 * pout);
      s.step = step;
      s.bw = step * (1 - pin);
      s.span = (v) => {
        const a = pout * step + s.indexOf(v) * step;
        return s.reverse ? [1 - a - s.bw, 1 - a] : [a, a + s.bw];
      };
      s.t = (v) => { const sp = s.span(v); return (sp[0] + sp[1]) / 2; };
    } else {
      const pout = has(def, "padding_outer") ? def.padding_outer : 0.5;
      const step = 1 / Math.max(1, n - 1 + 2 * pout);
      s.step = step;
      s.t = (v) => flip(n === 1 ? 0.5 : pout * step + s.indexOf(v) * step);
      s.span = (v) => { const t = s.t(v); return [t, t]; };
    }
    return s;
  }
  s.discrete = false;
  const f = transformOf(def);
  let dom = def.domain.slice();
  dom.forEach((v) => { if (typeof v !== "number" || !isFinite(v)) fail("bad_plan", "scale \"" + id + "\" has a non-numeric domain"); });
  if (def.type === "diverging") {
    if (dom.length !== 3) fail("bad_plan", "diverging scale \"" + id + "\" needs [min, mid, max]");
    const a = dom[0], m = dom[1], b = dom[2];
    s.domain = dom;
    s.t = (v) => {
      if (typeof v !== "number" || !isFinite(v)) bad(v);
      const t = v <= m ? (m > a ? 0.5 * (v - a) / (m - a) : 0.5) : (b > m ? 0.5 + 0.5 * (v - m) / (b - m) : 0.5);
      if (t < -1e-9 || t > 1 + 1e-9) bad(v);
      return flip(t < 0 ? 0 : (t > 1 ? 1 : t));
    };
    s.span = (v) => { const t = s.t(v); return [t, t]; };
    return s;
  }
  if (dom.length !== 2 || !(dom[1] > dom[0])) fail("bad_plan", "scale \"" + id + "\" needs a domain [min, max] with min < max");
  if (def.type === "log" && !(dom[0] > 0)) fail("bad_plan", "log scale \"" + id + "\" needs a positive domain");
  if (def.nice === true) {
    if (def.type === "linear" || def.type === "sqrt") {
      dom = niceDomain(dom[0], dom[1], niceCount);
      if (def.type === "sqrt" && def.domain[0] >= 0 && dom[0] < 0) dom[0] = 0;
    } else if (def.type === "log") {
      const base = has(def, "base") ? def.base : 10;
      dom = [Math.pow(base, Math.floor(f(dom[0]) + 1e-9)), Math.pow(base, Math.ceil(f(dom[1]) - 1e-9))];
    }
  }
  s.domain = dom;
  const f0 = f(dom[0]), f1 = f(dom[1]);
  s.t = (v) => {
    if (typeof v !== "number" || !isFinite(v)) bad(v);
    if (def.type === "log" && !(v > 0)) bad(v);
    const t = (f(v) - f0) / (f1 - f0);
    if (t < -1e-9 || t > 1 + 1e-9) bad(v);      /* contract P7.3; nothing is clipped, so nothing may fall outside */
    return flip(t < 0 ? 0 : (t > 1 ? 1 : t));
  };
  s.span = (v) => { const t = s.t(v); return [t, t]; };
  return s;
}

/* ---------- ticks and tick labels ---------- */
function digitsNeeded(x) {
  for (let d = 0; d <= 8; d += 1) {
    const y = Math.abs(x) * Math.pow(10, d);
    if (Math.abs(y - Math.round(y)) <= 1e-7 * Math.max(1, y)) return d;
  }
  return 8;
}

function trim(x) {
  const d = Math.min(2, digitsNeeded(Math.round(x * 100) / 100));
  return x.toFixed(d);
}

function compact(v) {
  const a = Math.abs(v);
  if (a >= 1e9) return trim(v / 1e9) + "B";
  if (a >= 1e6) return trim(v / 1e6) + "M";
  if (a >= 1e3) return trim(v / 1e3) + "k";
  return trim(v);
}

function fixed(v, d) {
  const s = v.toFixed(d);
  return parseFloat(s) === 0 ? (0).toFixed(d) : s;
}

function numberLabels(values, uniform, scaleBy) {
  const vs = values.map((v) => clean(v * scaleBy));
  let maxAbs = 0;
  vs.forEach((v) => { if (Math.abs(v) > maxAbs) maxAbs = Math.abs(v); });
  if (maxAbs >= 10000) return vs.map(compact);
  if (uniform) {
    let d = 0;
    vs.forEach((v) => { d = Math.max(d, digitsNeeded(v)); });
    d = Math.min(d, 6);
    return vs.map((v) => fixed(v, d));
  }
  return vs.map((v) => fixed(v, Math.min(6, digitsNeeded(v))));
}

function linearTicks(lo, hi, maxIntervals) {
  const step = niceStepFor(hi - lo, maxIntervals);
  const out = [];
  const k0 = Math.ceil(lo / step - 1e-9), k1 = Math.floor(hi / step + 1e-9);
  for (let k = k0; k <= k1 && out.length < 64; k += 1) out.push(clean(k * step));
  return out;
}
