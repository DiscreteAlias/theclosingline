/* Ticks that land on both ends of a snapped domain: the finest ladder step that divides it into at
 * most `maxIntervals`. Null when no ladder step does. */
function alignedTicks(lo, hi, maxIntervals) {
  const span = hi - lo;
  const mag0 = Math.pow(10, Math.floor(Math.log(span) / Math.LN10));
  let best = null;
  for (let m = mag0 / 100; m <= mag0 * 10; m *= 10) {
    for (let i = 0; i < NICE_STEPS.length - 1; i += 1) {
      const step = NICE_STEPS[i] * m, n = span / step, k = lo / step;
      if (Math.abs(n - Math.round(n)) > 1e-6 || Math.abs(k - Math.round(k)) > 1e-6) continue;
      if (Math.round(n) < 1 || Math.round(n) > maxIntervals) continue;
      if (best === null || step < best) best = step;
    }
  }
  if (best === null) return null;
  const out = [], k0 = Math.round(lo / best), n = Math.round(span / best);
  for (let k = 0; k <= n; k += 1) out.push(clean((k0 + k) * best));
  return out;
}

function logTicks(lo, hi, base, maxIntervals) {
  const out = [];
  const e0 = Math.ceil(Math.log(lo) / Math.log(base) - 1e-9);
  const e1 = Math.floor(Math.log(hi) / Math.log(base) + 1e-9);
  for (let e = e0; e <= e1 && out.length < 64; e += 1) out.push(clean(Math.pow(base, e)));
  if (out.length >= 3) return out;
  if (base === 10) {
    /* Under two powers in view: the 1-2-5 members of each decade, then a linear ladder. */
    const all = [];
    for (let e = e0 - 1; e <= e1 + 1; e += 1) {
      [1, 2, 5].forEach((m) => {
        const v = clean(m * Math.pow(10, e));
        if (v >= lo * (1 - 1e-9) && v <= hi * (1 + 1e-9)) all.push(v);
      });
    }
    if (all.length >= 2) return all;
  }
  if (out.length >= 2) return out;
  return linearTicks(lo, hi, maxIntervals);
}

/* Zero, and the same magnitudes on both sides of it: constant x 10^k, the largest first, as many as
 * the axis has room for. */
function symlogTicks(lo, hi, c, maxIntervals) {
  const out = [];
  const push = (v) => { if (v >= lo - 1e-12 && v <= hi + 1e-12) out.push(clean(v)); };
  const top = Math.max(Math.abs(lo), Math.abs(hi));
  const all = [];
  for (let m = c; m <= top * (1 + 1e-9) && all.length < 24; m *= 10) all.push(m);
  const sides = (lo < 0 ? 1 : 0) + (hi > 0 ? 1 : 0);
  const room = Math.max(1, Math.floor(maxIntervals / Math.max(1, sides)));
  const stride = Math.max(1, Math.ceil(all.length / room));
  const mags = [];
  for (let i = all.length - 1; i >= 0; i -= stride) mags.unshift(all[i]);
  mags.slice().reverse().forEach((m) => push(-m));
  push(0);
  mags.forEach((m) => push(m));
  return out;
}

const SEC = 1000, MIN = 60 * SEC, HOUR = 60 * MIN, DAY = 24 * HOUR;
const TIME_FIXED = [SEC, 5 * SEC, 15 * SEC, 30 * SEC, MIN, 5 * MIN, 15 * MIN, 30 * MIN, HOUR, 3 * HOUR,
                    6 * HOUR, 12 * HOUR, DAY, 2 * DAY, 7 * DAY];
const TIME_MONTHS = [1, 3, 6];
const TIME_YEARS = [1, 2, 5, 10, 20, 50, 100, 200, 500, 1000];
const MONTH_NAMES = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
function two(n) { return (n < 10 ? "0" : "") + n; }

/* Calendar boundaries in UTC. Returns { values, unit } where unit names the interval class. */
function timeTicks(lo, hi, maxIntervals) {
  const span = hi - lo;
  for (let i = 0; i < TIME_FIXED.length; i += 1) {
    const iv = TIME_FIXED[i];
    if (span / iv > maxIntervals + 1) continue;
    const off = iv === 7 * DAY ? 4 * DAY : 0;      /* weeks start on a Monday: 1970-01-05 */
    const out = [];
    for (let v = Math.ceil((lo - off) / iv) * iv + off; v <= hi && out.length < 64; v += iv) out.push(v);
    return { values: out, unit: iv < MIN ? "second" : (iv < DAY ? "minute" : "day") };
  }
  const d0 = new Date(lo), y0 = d0.getUTCFullYear();
  for (let i = 0; i < TIME_MONTHS.length; i += 1) {
    const mv = TIME_MONTHS[i];
    if (span / (mv * 30.44 * DAY) > maxIntervals) continue;
    const out = [];
    for (let m = 0; out.length < 64; m += mv) {
      const v = Date.UTC(y0, m, 1);
      if (v > hi) break;
      if (v >= lo) out.push(v);
    }
    return { values: out, unit: "month" };
  }
  for (let i = 0; i < TIME_YEARS.length; i += 1) {
    const yv = TIME_YEARS[i];
    if (span / (yv * 365.25 * DAY) > maxIntervals && i < TIME_YEARS.length - 1) continue;
    const out = [];
    for (let y = Math.ceil(y0 / yv) * yv; out.length < 64; y += yv) {
      const v = Date.UTC(y, 0, 1);
      if (v > hi) break;
      if (v >= lo) out.push(v);
    }
    return { values: out, unit: "year" };
  }
  return { values: [], unit: "year" };
}

function timeLabel(v, unit) {
  const d = new Date(v);
  const date = MONTH_NAMES[d.getUTCMonth()] + " " + two(d.getUTCDate());
  if (unit === "year") return String(d.getUTCFullYear());
  if (unit === "month") return d.getUTCMonth() === 0 ? String(d.getUTCFullYear()) : MONTH_NAMES[d.getUTCMonth()];
  if (unit === "day") return date;
  const midnight = d.getUTCHours() === 0 && d.getUTCMinutes() === 0 && d.getUTCSeconds() === 0;
  if (midnight) return date;
  const hm = two(d.getUTCHours()) + ":" + two(d.getUTCMinutes());
  return unit === "second" ? hm + ":" + two(d.getUTCSeconds()) : hm;
}

function isoDate(v) {
  const d = new Date(v);
  return d.getUTCFullYear() + "-" + two(d.getUTCMonth() + 1) + "-" + two(d.getUTCDate());
}

/* What the tick labels leave out, stated once in the axis title. */
function timeContext(lo, hi, unit) {
  if (unit === "second" || unit === "minute") return isoDate(lo) === isoDate(hi) ? isoDate(lo) + " UTC" : "UTC";
  if (unit === "day" || unit === "month") {
    const y0 = new Date(lo).getUTCFullYear(), y1 = new Date(hi).getUTCFullYear();
    return y0 === y1 ? y0 + " UTC" : "UTC";
  }
  return "UTC";
}

/* The ticks of one axis at one pixel length: [{ v, t, label, full }] plus the axis title text. */
function axisTicks(ax, scale, lenPx, horizontal) {
  const tk = isObj(ax.ticks) ? ax.ticks : {};
  const policy = has(tk, "policy") ? tk.policy : "auto";
  if (["auto", "values", "categories", "log", "time"].indexOf(policy) < 0) fail("unknown_policy", "unknown tick policy \"" + policy + "\" on scale \"" + scale.id + "\"");
  const kind = isObj(ax.format) && has(ax.format, "kind") ? ax.format.kind : (scale.discrete ? "category" : (scale.type === "time" ? "time" : "number"));
  const byPx = horizontal ? Math.max(GRID_MIN, Math.min(XTICK_MAX, Math.floor(lenPx / XTICK_PX)))
                          : Math.max(GRID_MIN, Math.min(GRID_MAX, Math.round(lenPx / GRID_PX)));
  const want = has(tk, "count") ? Math.max(GRID_MIN, Math.min(byPx, tk.count)) : byPx;
  const hasTitle = isObj(ax.title) && has(ax.title, "text");
  let values, labels, context = null, uniform = true;
  if (scale.discrete) {
    values = policy === "values" && Array.isArray(tk.values) ? tk.values.slice() : scale.members.slice();
    labels = values.map((v) => String(v));
  } else {
    const lo = scale.domain[0], hi = scale.domain[scale.domain.length - 1];
    let unit = null;
    if (policy === "values" && Array.isArray(tk.values)) { values = tk.values.slice(); uniform = false; }
    else if (scale.type === "time" || policy === "time") { const tt = timeTicks(lo, hi, want); values = tt.values; unit = tt.unit; }
    else if (scale.type === "log") { values = logTicks(lo, hi, has(scale.def, "base") ? scale.def.base : 10, want); uniform = false; }
    else if (scale.type === "symlog") { values = symlogTicks(lo, hi, has(scale.def, "constant") ? scale.def.constant : 1, want); uniform = false; }
    else {
      values = alignedTicks(lo, hi, want) || linearTicks(lo, hi, want);
      /* An axis with one tick has no scale: ask for a finer step, and failing that mark the two ends. */
      for (let k = want + 1; values.length < 2 && k <= want + 3; k += 1) values = linearTicks(lo, hi, k);
      if (values.length < 2) { values = [lo, hi]; uniform = false; }
    }
    if (kind === "time" || unit !== null) {
      if (unit === null) unit = timeTicks(lo, hi, want).unit;
      labels = values.map((v) => timeLabel(v, unit));
      context = timeContext(lo, hi, unit);
    } else if (kind === "percent") {
      labels = numberLabels(values, uniform, 100).map((s) => (hasTitle ? s : s + "%"));
    } else {
      labels = numberLabels(values, uniform, 1);
    }
  }
  const ticks = values.map((v, i) => ({ v: v, t: scale.t(v), label: labels[i], full: null }));
  let title = null;
  if (hasTitle) {
    const unit = kind === "percent" ? "%" : (kind === "time" ? context : (has(ax.title, "unit") ? ax.title.unit : null));
    title = { text: String(ax.title.text), unit: unit, spec: ax.title.origin === "spec" };
  } else if (context !== null) {
    title = { text: "", unit: context, spec: false };
  }
  return { ticks: ticks, title: title, kind: kind };
}

/* THE label rule (specs/chart-marks.md §"The label rule"). Mutates `info.ticks` to the labels drawn
 * and returns the thickness the labels need across the axis. */
function fitLabels(info, scale, lenPx, horizontal, capPx) {
  const ticks = info.ticks;
  info.rotate = false;
  if (!ticks.length) return 0;
  const along = (tk) => tk.t * lenPx;
  if (scale.discrete) {
    const stepPx = Math.abs(scale.step * lenPx);
    let widest = 0;
    ticks.forEach((tk) => { widest = Math.max(widest, textWidth(tk.label, FS)); });
    if (horizontal && widest * LABEL_SLACK + MIN_GAP_X <= stepPx) return FS;
    let keepEvery = 1;
    if (stepPx < MIN_STEP_PX) keepEvery = Math.ceil(MIN_STEP_PX / Math.max(stepPx, 1e-6));
    if (horizontal) info.rotate = true;
    const cap = Math.max(LABEL_MIN_PX, capPx);
    info.ticks = ticks.filter((tk, i) => i % keepEvery === 0);
    let used = 0;
    info.ticks.forEach((tk) => {
      const c = truncate(tk.label, cap, FS);
      if (c.cut) { tk.full = tk.label; tk.label = c.text; }
      used = Math.max(used, textWidth(tk.label, FS));
    });
    return used;
  }
  const order = ticks.slice().sort((a, b) => along(a) - along(b));
  const fits = (k) => {
    let last = null;
    for (let i = 0; i < order.length; i += k) {
      const tk = order[i];
      const half = horizontal ? textWidth(tk.label, FS) * LABEL_SLACK / 2 : FS / 2;
      const a = along(tk) - half, b = along(tk) + half;
      if (last !== null && a - last < (horizontal ? MIN_GAP_X : MIN_GAP_Y)) return false;
      last = b;
    }
    return true;
  };
  let k = 1;
  while (k < order.length && !fits(k)) k += 1;
  info.ticks = order.filter((tk, i) => i % k === 0);
  if (horizontal) return FS;
  let widest = 0;
  info.ticks.forEach((tk) => { widest = Math.max(widest, textWidth(tk.label, FS)); });
  return widest;
}

function fitTitle(str, maxPx, spec) {
  return truncate(str, spec ? maxPx : maxPx / (1 + 0.08 / CHAR_EM), FS);
}

function titleString(title) {
  if (!title) return "";
  const t = title.spec ? title.text : title.text.toUpperCase();
  return title.unit ? (t ? t + " (" + title.unit + ")" : title.unit) : t;
}

/* ---------- the panel: margins, axes, layers ---------- */
function isHorizontalSide(orient) { return orient === "bottom" || orient === "top"; }

function axisSide(ax) {
  if (has(ax, "orient")) {
    if (["bottom", "top", "left", "right"].indexOf(ax.orient) < 0) fail("bad_plan", "unknown axis orient \"" + ax.orient + "\"");
    return ax.orient;
  }
  return ax.channel === "x" ? "bottom" : "left";
}

/* Everything about a panel's axes at a plot size: tick sets, label thickness, margins.
 * flags: { labels: {bottom,top,left,right}, titles: {...}, head: [lines] } */
function measurePanel(ctx, panel, plotW, plotH, flags) {
  const m = { L: 6, R: 6, T: 6, B: 6 };
  const axes = [];
  let yTitleLines = 0;
  (panel.axes || []).forEach((ax) => {
    const side = axisSide(ax);
    const horizontal = isHorizontalSide(side);
    const scale = ctx.scale(ax.scale);
    const len = horizontal ? plotW : plotH;
    const info = axisTicks(ax, scale, len, horizontal);
    info.ax = ax; info.side = side; info.horizontal = horizontal; info.scale = scale;
    info.showLabels = !flags.labels || flags.labels[side] !== false;
    info.showTitle = !!info.title && (!flags.titles || flags.titles[side] !== false);
    const thick = fitLabels(info, scale, len, horizontal, (horizontal ? plotH : plotW) * STRIP_SHARE);
    info.thick = thick;
    if (info.showLabels) {
      const need = TICK + LABEL_GAP + thick + 2;
      if (side === "bottom") m.B = Math.max(m.B, need + (info.showTitle ? LINE : 0));
      if (side === "top") m.T = Math.max(m.T, need + (info.showTitle ? LINE : 0));
      if (side === "left") m.L = Math.max(m.L, need);
      if (side === "right") m.R = Math.max(m.R, need);
      if (horizontal && !info.rotate) {
        info.ticks.forEach((tk) => {
          const half = textWidth(tk.label, FS) / 2 + 1, px = tk.t * plotW;
          m.L = Math.max(m.L, half - px);
          m.R = Math.max(m.R, half - (plotW - px));
        });
      }
      if (!horizontal) { m.T = Math.max(m.T, FS / 2 + 2); m.B = Math.max(m.B, FS / 2 + 2); }
    }
    if (!horizontal && info.showTitle) yTitleLines = 1;
    axes.push(info);
  });
  let reach = 0;
  (panel.layers || []).forEach((layer) => {
    if (!isObj(layer) || layer.mark !== "point") return;
    const sid = isObj(layer.scales) ? layer.scales.size : null;
    const def = sid === null || sid === undefined ? null : ctx.plan.scales[sid];
    let r = DOT_R;
    if (isObj(def) && isObj(def.range) && typeof def.range.max === "number") r = def.range.max;
    else if (has(layer.constants, "size")) r = layer.constants.size;
    reach = Math.max(reach, r * 1.25 + 1);
  });
  ["L", "R", "T", "B"].forEach((k) => { m[k] = Math.max(m[k], reach); });
  const head = (flags.head || []).length;
  m.T = Math.max(m.T, 6 + LINE * (head + Math.max(yTitleLines, flags.headOffset || 0)));
  return { m: m, axes: axes, yTitle: yTitleLines };
}

function panelHead(panel, extra) {
  const lines = (extra || []).slice();
  if (isObj(panel.title) && has(panel.title, "text")) lines.push({ text: String(panel.title.text), spec: panel.title.origin === "spec" });
  return lines;
}

function drawAxes(meas, box, flags) {
  let grid = "", lines = "", labels = "";
  const w = box.x1 - box.x0, h = box.y1 - box.y0;
  meas.axes.forEach((info) => {
    const side = info.side;
    const px = (t) => (info.horizontal ? box.x0 + t * w : box.y1 - t * h);
    if (info.ax.grid === true) {
      info.ticks.forEach((tk) => {
        const p = px(tk.t);
        grid += info.horizontal ? el("line", { class: "gr", x1: p, x2: p, y1: box.y0, y2: box.y1 })
                                : el("line", { class: "gr", x1: box.x0, x2: box.x1, y1: p, y2: p });
      });
    }
    const edge = side === "bottom" ? box.y1 : (side === "top" ? box.y0 : (side === "left" ? box.x0 : box.x1));
    lines += info.horizontal ? el("line", { class: "ax", x1: box.x0, x2: box.x1, y1: edge, y2: edge })
                             : el("line", { class: "ax", x1: edge, x2: edge, y1: box.y0, y2: box.y1 });
    if (!info.scale.discrete && info.scale.domain[0] < 0 && info.scale.domain[info.scale.domain.length - 1] > 0 &&
        (info.scale.type === "linear" || info.scale.type === "symlog" || info.scale.type === "sqrt")) {
      const z = px(info.scale.t(0));
      lines += info.horizontal ? el("line", { class: "zero", x1: z, x2: z, y1: box.y0, y2: box.y1 })
                               : el("line", { class: "zero", x1: box.x0, x2: box.x1, y1: z, y2: z });
    }
    const out = side === "bottom" || side === "right" ? 1 : -1;
    if (info.showLabels) {
      let g = "";
      info.ticks.forEach((tk) => {
        const p = px(tk.t);
        if (info.horizontal) {
          g += el("line", { class: "ax", x1: p, x2: p, y1: edge, y2: edge + out * TICK });
          if (info.rotate) {
            const ty = edge + out * (TICK + LABEL_GAP);
            g += text("tk", p + 3.5, ty, tk.label,
                      { "text-anchor": out > 0 ? "end" : "start", transform: "rotate(-90 " + num(p + 3.5) + " " + num(ty) + ")" }, tk.full);
          } else {
            g += text("tk", p, out > 0 ? edge + TICK + LABEL_GAP + FS - 2 : edge - TICK - LABEL_GAP, tk.label, { "text-anchor": "middle" }, tk.full);
          }
        } else {
          g += el("line", { class: "ax", x1: edge, x2: edge + out * TICK, y1: p, y2: p });
          g += text("tk", edge + out * (TICK + LABEL_GAP), p + 3.5, tk.label, { "text-anchor": out > 0 ? "start" : "end" }, tk.full);
        }
      });
      labels += el("g", { class: "axis", "data-axis": info.ax.channel, "data-scale": info.scale.id, "data-orient": side }, g);
    }
    if (info.showTitle) {
      const str = titleString(info.title);
      const cls = info.title.spec ? "t-cap" : "t-key";
      if (info.horizontal) {
        const ty = side === "bottom" ? box.y1 + TICK + LABEL_GAP + info.thick + 2 + FS : box.y0 - TICK - LABEL_GAP - info.thick - 6;
        const c = fitTitle(str, w, info.title.spec);
        labels += text(cls, box.x0, ty, c.text, {}, c.cut ? str : null);
      } else {
        const c = fitTitle(str, Math.max(60, w - 4), info.title.spec);
        labels += text(cls, side === "left" ? box.x0 : box.x1, box.y0 - 7, c.text,
                       { "text-anchor": side === "left" ? "start" : "end" }, c.cut ? str : null);
      }
    }
  });
  (flags.head || []).forEach((ln, i) => {
    const y = box.y0 - 7 - LINE * ((flags.headOffset === undefined ? meas.yTitle : flags.headOffset) + (flags.head.length - 1 - i));
    const c = truncate(ln.text, w, FS);
    labels += text(ln.spec ? "t-cap" : "t-val", box.x0, y, c.text, {}, c.cut ? ln.text : null);
  });
  return { grid: grid, lines: lines, labels: labels };
}

/* ---------- item style ---------- */
function roleColour(ctx, role) {
  const c = ctx.theme.roles[role];
  if (!c) fail("unknown_role", "unknown colour role \"" + role + "\"");
  return c;
}

function nonPositional(ctx, layer, channel) {
  const id = isObj(layer.scales) ? layer.scales[channel] : null;
  return id === null || id === undefined ? null : ctx.scale(id);
}

function colourOn(ctx, scale, v) {
  const r = isObj(scale.def.range) ? scale.def.range : {};
  if (r.kind === "palette") {
    const i = scale.discrete ? scale.indexOf(v) : 0;
    return ctx.theme.categorical[i % paletteSlots(ctx, scale)];
  }
  if (r.kind === "ramp") {
    if (r.scheme !== "sequential" && r.scheme !== "diverging") fail("unknown_range", "unknown ramp scheme \"" + r.scheme + "\" on scale \"" + scale.id + "\"");
    const stops = r.scheme === "diverging" ? ctx.theme.diverging : ctx.theme.sequential;
    const t = scale.discrete ? (scale.members.length > 1 ? scale.indexOf(v) / (scale.members.length - 1) : 0.5) : scale.t(v);
    return rampColour(stops, scale.discrete && scale.reverse ? 1 - t : t);
  }
  return fail("unknown_range", "colour scale \"" + scale.id + "\" has no usable range (" + JSON.stringify(r.kind) + ")");
}

/* The hues a palette scale uses (contract P9.7): `range.slots`, never more than the theme holds. */
function paletteSlots(ctx, scale) {
  const r = isObj(scale.def.range) ? scale.def.range : {};
  const n = ctx.theme.categorical.length;
  if (r.slots === undefined || r.slots === null) return n;
  if (typeof r.slots !== "number" || !(r.slots >= 1) || r.slots > n) fail("unknown_range", "palette scale \"" + scale.id + "\" asks for " + String(r.slots) + " hues and the theme has " + n);
  return r.slots;
}
/* Member i is hue (i mod slots) in cycle floor(i / slots); cycle 0 is the bare hue. */
function paletteCycle(ctx, scale, v) {
  if (!scale.discrete || !isObj(scale.def.range) || scale.def.range.kind !== "palette") return 0;
  return Math.floor(scale.indexOf(v) / paletteSlots(ctx, scale));
}

function magnitudeOn(scale, v, kind) {
  const r = isObj(scale.def.range) ? scale.def.range : {};
  if (r.kind !== kind || typeof r.min !== "number" || typeof r.max !== "number") fail("unknown_range", "scale \"" + scale.id + "\" has no " + kind + " range");
  const t = scale.discrete ? (scale.members.length > 1 ? scale.indexOf(v) / (scale.members.length - 1) : 0.5) : scale.t(v);
  return r.min + Math.max(0, Math.min(1, t)) * (r.max - r.min);
}

function shapeOn(scale, v) {
  const r = isObj(scale.def.range) ? scale.def.range : {};
  if (r.kind !== "shapes" || !Array.isArray(r.values) || !r.values.length) fail("unknown_range", "scale \"" + scale.id + "\" has no shapes range");
  return r.values[(scale.discrete ? scale.indexOf(v) : 0) % r.values.length];
}

/* The resolved look of one item (or one path): colour, opacity, size, shape, dash. */
function styleOf(ctx, L, item) {
  const k = L.layer.constants || {};
  const st = { color: null, opacity: 1, size: null, shape: "circle", dash: "", cycle: 0 };
  if (L.reference) {
    st.color = ctx.theme.roles.reference;
    st.dash = DASH_REF;
  } else if (L.color && has(item, "color")) {
    st.color = colourOn(ctx, L.color, item.color);
    st.cycle = paletteCycle(ctx, L.color, item.color);
    st.dash = PALETTE_DASH[st.cycle % PALETTE_DASH.length];
  } else {
    st.color = roleColour(ctx, has(k, "color") ? k.color : "mark");
  }
  if (L.opacity && has(item, "opacity")) st.opacity = magnitudeOn(L.opacity, item.opacity, "opacity");
  else if (has(k, "opacity")) st.opacity = k.opacity;
  if (L.size && has(item, "size")) st.size = magnitudeOn(L.size, item.size, "size");
  else if (has(k, "size")) st.size = k.size;
  if (L.shape && has(item, "shape")) st.shape = shapeOn(L.shape, item.shape);
  else if (has(k, "shape")) st.shape = k.shape;
  else if (st.cycle > 0) st.shape = PALETTE_SHAPE[st.cycle % PALETTE_SHAPE.length];   /* past the palette, a point is told apart by shape */
  if (SHAPES.indexOf(st.shape) < 0) fail("unknown_shape", "unknown shape \"" + st.shape + "\" in layer \"" + L.layer.id + "\"");
  return st;
}

function fillStyle(st, alpha) {
  const a = st.opacity * (alpha === undefined ? 1 : alpha);
  return "fill:" + st.color + (a < 1 ? ";fill-opacity:" + num(a) : "");
}
function strokeStyle(st, width) {
  return "fill:none;stroke:" + st.color + ";stroke-width:" + num(width) +
         (st.opacity < 1 ? ";stroke-opacity:" + num(st.opacity) : "") +
         (st.dash ? ";stroke-dasharray:" + st.dash : "");
}

function glyph(shape, cx, cy, r, attrs) {
  if (shape === "circle") return el("circle", Object.assign({ cx: cx, cy: cy, r: r }, attrs));
  if (shape === "square") {
    const s = r * 0.89;
    return el("rect", Object.assign({ x: cx - s, y: cy - s, width: 2 * s, height: 2 * s }, attrs));
  }
  let pts;
  if (shape === "triangle") {
    const a = r * 1.2;
    pts = [[cx, cy - a], [cx + a * 0.95, cy + a * 0.72], [cx - a * 0.95, cy + a * 0.72]];
  } else if (shape === "diamond") {
    const a = r * 1.25;
    pts = [[cx, cy - a], [cx + a, cy], [cx, cy + a], [cx - a, cy]];
  } else {
    const a = r * 1.15, b = r * 0.4;
    pts = [[cx - b, cy - a], [cx + b, cy - a], [cx + b, cy - b], [cx + a, cy - b], [cx + a, cy + b], [cx + b, cy + b],
           [cx + b, cy + a], [cx - b, cy + a], [cx - b, cy + b], [cx - a, cy + b], [cx - a, cy - b], [cx - b, cy - b]];
  }
  return el("polygon", Object.assign({ points: pts.map((p) => num(p[0]) + "," + num(p[1])).join(" ") }, attrs));
}

/* ---------- marks ---------- */
function extentOn(pos, item, a, b, fallback) {
  if (has(item, b)) {
    const p = pos.at(item[a]), q = pos.at(item[b]);
    return [Math.min(p, q), Math.max(p, q)];
  }
  const sp = pos.span(item[a]);
  if (sp[0] !== sp[1]) return [Math.min(sp[0], sp[1]), Math.max(sp[0], sp[1])];
  return [sp[0] - fallback / 2, sp[0] + fallback / 2];
}

function slotOf(ext, item) {
  if (!isObj(item.slot) || !(item.slot.count > 0)) return ext;
  const w = (ext[1] - ext[0]) / item.slot.count;
  return [ext[0] + w * item.slot.index, ext[0] + w * (item.slot.index + 1)];
}

function capThickness(ext, cap) {
  if (ext[1] - ext[0] <= cap) return ext;
  const mid = (ext[0] + ext[1]) / 2;
  return [mid - cap / 2, mid + cap / 2];
}

/* The centre of an item on a positional scale; on a band, the centre of its dodge slot if it has one. */
function centre(pos, item, field) {
  const sp = pos.span(item[field]);
  if (sp[0] === sp[1] || !isObj(item.slot)) return (sp[0] + sp[1]) / 2;
  const e = slotOf([Math.min(sp[0], sp[1]), Math.max(sp[0], sp[1])], item);
  return (e[0] + e[1]) / 2;
}

function need(L, what) {
  if (!L[what]) fail("bad_plan", "layer \"" + L.layer.id + "\" (" + L.layer.mark + ") names no " + what + " scale");
  return L[what];
}

const DRAW = {
  point: (ctx, L, it, st) => {
    const r = st.size === null ? DOT_R : st.size;
    return glyph(st.shape, centre(need(L, "x"), it, "x"), centre(need(L, "y"), it, "y"), r,
                 { "data-key": it.key, style: fillStyle(st) + ";stroke:" + ctx.theme.page + ";stroke-width:1" });
  },
  text: (ctx, L, it, st) => {
    const x = centre(need(L, "x"), it, "x"), y = centre(need(L, "y"), it, "y");
    const str = has(it, "text") ? String(it.text) : (has(L.layer.constants, "text") ? String(L.layer.constants.text) : "");
    const fs = st.size === null ? FS : st.size;
    const w = textWidth(str, fs);
    /* Contract P9.2: `align` and `baseline` name the side of the label's own box that sits on the
     * position. Without them (a plan written before P9) a label on two bands is centred in its cell
     * and any other sits above its point. The only move the renderer makes is a flip that keeps the
     * label inside the plot. */
    const sty = isObj(L.layer.style) ? L.layer.style : {};
    const inCell = L.x.bw > 0 && L.y.bw > 0;
    const align0 = has(sty, "align") ? sty.align : "center", base0 = has(sty, "baseline") ? sty.baseline : (inCell ? "middle" : "bottom");
    if (["left", "center", "right"].indexOf(align0) < 0) fail("bad_plan", "unknown text align \"" + align0 + "\" in layer \"" + L.layer.id + "\"");
    if (["top", "middle", "bottom"].indexOf(base0) < 0) fail("bad_plan", "unknown text baseline \"" + base0 + "\" in layer \"" + L.layer.id + "\"");
    const GAP = 6;
    const leftOf = (a) => (a === "left" ? x + GAP : (a === "right" ? x - GAP - w : x - w / 2));
    const topOf = (b) => (b === "bottom" ? y - GAP - fs : (b === "top" ? y + GAP : y - fs / 2));
    const pick = (first, all, lo, hi, startOf, size) => {
      const order = [first].concat(all.filter((o) => o !== first));
      for (let i = 0; i < order.length; i += 1) { if (startOf(order[i]) >= lo - 0.5 && startOf(order[i]) + size <= hi + 0.5) return order[i]; }
      return first;
    };
    const align = pick(align0, align0 === "left" ? ["right", "center"] : ["left", "right", "center"], L.box.x0, L.box.x1, leftOf, w);
    const base = pick(base0, base0 === "middle" ? ["bottom", "top"] : ["bottom", "top", "middle"], L.box.y0, L.box.y1, topOf, fs);
    const tx = align === "left" ? x + GAP : (align === "right" ? x - GAP : x);
    const ty = topOf(base) + fs * 0.82;
    /* On a label the role `mark` is the label ink (the theme's primary text): the grammar writes it on
     * every layer that names no colour, and a label in the data hue cannot be read on a data fill. */
    const explicit = !L.reference && (has(it, "color") || (has(L.layer.constants, "color") && L.layer.constants.color !== "mark"));
    return text(L.reference ? "t-ref" : "t-lab", tx, ty, str,
                { "text-anchor": align === "left" ? "start" : (align === "right" ? "end" : "middle"), "data-key": it.key,
                  style: (explicit ? "fill:" + st.color + ";" : "") + (st.size === null ? "" : "font-size:" + num(fs) + "px;") +
                         "paint-order:stroke;stroke:" + ctx.theme.page + ";stroke-width:3;stroke-linejoin:round" });
  },
  tick: (ctx, L, it, st) => {
    const w = st.size === null ? 1.2 : st.size;
    const vertical = L.orient === "vertical";
    let x1, x2, y1, y2;
    if (has(it, "x") && has(it, "y")) {
      const x = centre(need(L, "x"), it, "x"), y = centre(need(L, "y"), it, "y");
      const along = vertical ? L.y : L.x;
      const len = along.bw > 0 ? along.bw * 0.7 : TICK_LEN;
      if (vertical) { x1 = x2 = x; y1 = y - len / 2; y2 = y + len / 2; }
      else { y1 = y2 = y; x1 = x - len / 2; x2 = x + len / 2; }
    } else if (has(it, "x")) {
      x1 = x2 = need(L, "x").at(it.x); y1 = L.box.y1; y2 = L.box.y1 - RUG_LEN;
    } else {
      y1 = y2 = need(L, "y").at(it.y); x1 = L.box.x0; x2 = L.box.x0 + RUG_LEN;
    }
    return el("line", { "data-key": it.key, x1: x1, y1: y1, x2: x2, y2: y2, style: strokeStyle(st, w) });
  },
  rule: (ctx, L, it, st) => {
    const w = st.size === null ? 1 : st.size;
    let x1, x2, y1, y2;
    const hx = has(it, "x"), hy = has(it, "y");
    if (hx && hy && has(it, "x2") && has(it, "y2")) {
      x1 = L.x.at(it.x); x2 = L.x.at(it.x2); y1 = L.y.at(it.y); y2 = L.y.at(it.y2);
    } else if (hx && hy && has(it, "y2")) {
      x1 = x2 = need(L, "x").at(it.x); y1 = need(L, "y").at(it.y); y2 = L.y.at(it.y2);
    } else if (hx && hy && has(it, "x2")) {
      y1 = y2 = need(L, "y").at(it.y); x1 = need(L, "x").at(it.x); x2 = L.x.at(it.x2);
    } else if (hy) {
      y1 = y2 = need(L, "y").at(it.y); x1 = L.box.x0; x2 = L.box.x1;
    } else {
      x1 = x2 = need(L, "x").at(it.x); y1 = L.box.y0; y2 = L.box.y1;
    }
    return el("line", { "data-key": it.key, x1: x1, y1: y1, x2: x2, y2: y2, style: strokeStyle(st, w) });
  },
  segment: (ctx, L, it, st) => el("line", {
    "data-key": it.key, x1: need(L, "x").at(it.x), y1: need(L, "y").at(it.y), x2: L.x.at(it.x2), y2: L.y.at(it.y2),
    style: strokeStyle(st, st.size === null ? LINE_W : st.size) }),
  bar: (ctx, L, it, st) => {
    let xe, ye;
    const across = (P, f, len) => {
      let e = extentOn(P, it, f, f + "2", L.stick);
      const raw = e[1] - e[0];
      if (!has(it, f + "2")) {
        e = slotOf(e, it);
        /* A bar thinner than MIN_BAR_PX cannot be told from its neighbour: refuse, never draw it. */
        if (P.scale.discrete && e[1] - e[0] < MIN_BAR_PX) tooSmall("Layer \"" + L.layer.id + "\" would draw bars " + num(e[1] - e[0]) + "px thick.", f === "x" ? "width" : "height", len, len * MIN_BAR_PX / Math.max(e[1] - e[0], 1e-6));
        /* ... and a band with padding must leave a visible gap between one category's bars and the next's. */
        const gapPx = P.step - P.bw;
        if (P.scale.discrete && P.bw > 0 && gapPx > 1e-9 && gapPx < MIN_BAR_GAP_PX) tooSmall("Layer \"" + L.layer.id + "\" would leave " + num(gapPx) + "px between neighbouring categories.", f === "x" ? "width" : "height", len, len * MIN_BAR_GAP_PX / gapPx);
        e = capThickness(e, st.size === null ? BAR_MAX : st.size);
      } else {
        if (raw < 1) tooSmall("Layer \"" + L.layer.id + "\" would draw bins " + num(raw) + "px wide.", f === "x" ? "width" : "height", len, len / Math.max(raw, 1e-6));
        if (raw >= 4) e = [e[0] + 0.5, e[1] - 0.5];
      }
      return e;
    };
    if (L.orient === "vertical") {
      xe = across(need(L, "x"), "x", L.box.x1 - L.box.x0);
      ye = extentOn(need(L, "y"), it, "y", "y2", 0);
    } else {
      ye = across(need(L, "y"), "y", L.box.y1 - L.box.y0);
      xe = extentOn(need(L, "x"), it, "x", "x2", 0);
    }
    return el("rect", { "data-key": it.key, x: xe[0], y: ye[0], width: xe[1] - xe[0], height: ye[1] - ye[0],
                        style: fillStyle(st, L.reference ? REF_ALPHA : 1) });
  },
  rect: (ctx, L, it, st) => {
    /* Contract P9.6 and P9.12: a cell is drawn edge to edge, so cells on padding-free bands touch; a
     * rect with one positional pair spans the plot along the other. */
    const side = (P, f, lo, hi, dim) => {
      if (!has(it, f)) return [lo, hi];
      const e = extentOn(need(L, f), it, f, f + "2", P.step > 0 ? P.step : 6);
      if (P.scale.discrete && !has(it, f + "2") && e[1] - e[0] < MIN_CELL_PX) {
        tooSmall("Layer \"" + L.layer.id + "\" would draw cells " + num(e[1] - e[0]) + "px across.", dim, hi - lo, (hi - lo) * MIN_CELL_PX / Math.max(e[1] - e[0], 1e-6));
      }
      return e;
    };
    const xe = side(L.x, "x", L.box.x0, L.box.x1, "width"), ye = side(L.y, "y", L.box.y0, L.box.y1, "height");
    return el("rect", { "data-key": it.key, x: xe[0], y: ye[0], width: xe[1] - xe[0], height: ye[1] - ye[0],
                        "shape-rendering": "crispEdges", style: fillStyle(st, L.reference ? REF_ALPHA : 1) });
  },
  errorbar: (ctx, L, it, st) => {
    const w = st.size === null ? 1.2 : st.size;
    let d;
    if (L.orient === "vertical") {
      const x = centre(need(L, "x"), it, "x"), a = need(L, "y").at(it.y), b = L.y.at(it.y2), c = CAP_W / 2;
      d = "M" + num(x) + " " + num(a) + "V" + num(b) + "M" + num(x - c) + " " + num(a) + "H" + num(x + c) +
          "M" + num(x - c) + " " + num(b) + "H" + num(x + c);
    } else {
      const y = centre(need(L, "y"), it, "y"), a = need(L, "x").at(it.x), b = L.x.at(it.x2), c = CAP_W / 2;
      d = "M" + num(a) + " " + num(y) + "H" + num(b) + "M" + num(a) + " " + num(y - c) + "V" + num(y + c) +
          "M" + num(b) + " " + num(y - c) + "V" + num(y + c);
    }
    return el("path", { "data-key": it.key, d: d, style: strokeStyle(st, w) });
  },
  boxplot: (ctx, L, it, st) => {
    const vertical = L.orient === "vertical";
    const cat = vertical ? need(L, "x") : need(L, "y");
    const val = vertical ? need(L, "y") : need(L, "x");
    const slot = slotOf(extentOn(cat, it, vertical ? "x" : "y", "__none", 18), it);
    const span = vertical ? L.box.x1 - L.box.x0 : L.box.y1 - L.box.y0;
    if (slot[1] - slot[0] < MIN_BOX_PX) tooSmall("Layer \"" + L.layer.id + "\" would draw boxes " + num(slot[1] - slot[0]) + "px thick.", vertical ? "width" : "height", span, span * MIN_BOX_PX / Math.max(slot[1] - slot[0], 1e-6));
    const ce = capThickness(slot, st.size === null ? BOX_MAX : st.size);
    const mid = (ce[0] + ce[1]) / 2, cap = (ce[1] - ce[0]) * 0.25;
    const q1 = val.at(it.q1), q3 = val.at(it.q3), med = val.at(it.median);
    const line = (a, b, c, e) => (vertical ? "M" + num(a) + " " + num(b) + "L" + num(c) + " " + num(e)
                                           : "M" + num(b) + " " + num(a) + "L" + num(e) + " " + num(c));
    let wh = "";
    if (has(it, "min")) { const p = val.at(it.min); wh += line(mid, q1, mid, p) + line(mid - cap, p, mid + cap, p); }
    if (has(it, "max")) { const p = val.at(it.max); wh += line(mid, q3, mid, p) + line(mid - cap, p, mid + cap, p); }
    const lo = Math.min(q1, q3), sz = Math.abs(q3 - q1);
    const box = vertical ? { x: ce[0], y: lo, width: ce[1] - ce[0], height: sz } : { x: lo, y: ce[0], width: sz, height: ce[1] - ce[0] };
    return el("g", { "data-key": it.key },
      (wh ? el("path", { d: wh, style: strokeStyle(st, 1.2) }) : "") +
      el("rect", Object.assign(box, { style: fillStyle(st, BOX_ALPHA) + ";stroke:" + st.color + ";stroke-width:1.2" })) +
      el("path", { d: line(ce[0], med, ce[1], med), style: "fill:none;stroke:" + ctx.theme.primary + ";stroke-width:2" }));
  },
};

/* Runs of valued points; a null coordinate is a break and is never bridged (contract P5). */
function runsOf(points, fields) {
  const runs = [];
  let cur = [];
  (points || []).forEach((p) => {
    const valued = isObj(p) && fields.every((f) => p[f] !== null && p[f] !== undefined);
    if (valued) cur.push(p);
    else if (cur.length) { runs.push(cur); cur = []; }
  });
  if (cur.length) runs.push(cur);
  return runs;
}

/* A polyline through pixel points under an interpolation; `vertical` = the path runs along x. */
function trace(pts, interp, vertical, first) {
  let d = "";
  pts.forEach((p, i) => {
    if (i === 0) { d += (first ? "M" : "L") + num(p[0]) + " " + num(p[1]); return; }
    const q = pts[i - 1];
    if (interp === "linear") { d += "L" + num(p[0]) + " " + num(p[1]); return; }
    const a = vertical ? 0 : 1, b = vertical ? 1 : 0;
    const corner = (u, v) => { const c = [0, 0]; c[a] = u; c[b] = v; return "L" + num(c[0]) + " " + num(c[1]); };
    if (interp === "step-after") d += corner(p[a], q[b]);
    else if (interp === "step-before") d += corner(q[a], p[b]);
    else { const mid = (q[a] + p[a]) / 2; d += corner(mid, q[b]) + corner(mid, p[b]); }
    d += "L" + num(p[0]) + " " + num(p[1]);
  });
  return d;
}

function drawPath(ctx, L, it, st) {
  const mark = L.layer.mark;
  const interp = isObj(L.layer.style) && has(L.layer.style, "interpolate") ? L.layer.style.interpolate : "linear";
  if (["linear", "step-after", "step-before", "step"].indexOf(interp) < 0) fail("unknown_interpolate", "unknown interpolate \"" + interp + "\" in layer \"" + L.layer.id + "\"");
  const X = need(L, "x"), Y = need(L, "y");
  const pts0 = Array.isArray(it.points) ? it.points : [];
  const horizontal = mark !== "line" && pts0.some((p) => isObj(p) && Object.prototype.hasOwnProperty.call(p, "x2"));
  const fields = mark === "line" ? ["x", "y"] : (horizontal ? ["y", "x", "x2"] : ["x", "y", "y2"]);
  const runs = runsOf(pts0, fields);
  const w = st.size === null ? LINE_W : st.size;
  let body = "", vx = "";
  runs.forEach((run) => {
    const top = run.map((p) => [X.at(p.x), Y.at(p.y)]);
    if (mark === "line") {
      if (top.length === 1) body += el("circle", { cx: top[0][0], cy: top[0][1], r: Math.max(1.5, w), style: fillStyle(st) });
      else body += el("path", { d: trace(top, interp, true, true), style: strokeStyle(st, w) });
    } else {
      const base = run.map((p) => (horizontal ? [X.at(p.x2), Y.at(p.y)] : [X.at(p.x), Y.at(p.y2)])).reverse();
      const d = trace(top, interp, !horizontal, true) + trace(base, interpBack(interp), !horizontal, false) + "Z";
      /* A constant opacity from the plan IS the fill's opacity; the defaults apply only without one. */
      const own = has(L.layer.constants, "opacity") || (L.opacity && has(it, "opacity"));
      body += el("path", { d: d, style: fillStyle(st, L.reference ? REF_ALPHA : (own ? 1 : (mark === "band" ? BAND_ALPHA : AREA_ALPHA))) });
      if (mark === "area" && !L.reference && top.length > 1) body += el("path", { d: trace(top, interp, !horizontal, true), style: strokeStyle(st, 1.2) });
    }
    if (ctx.vertices) run.forEach((p, i) => { vx += el("circle", { class: "vx", "data-key": p.key, cx: top[i][0], cy: top[i][1], r: 4 }); });
  });
  return el("g", { "data-key": it.key }, body + vx);
}
/* Walking a stepped edge backwards swaps which neighbour holds the level. */
function interpBack(interp) {
  return interp === "step-after" ? "step-before" : (interp === "step-before" ? "step-after" : interp);
}

function positional(scale, a, b) {
  return {
    scale: scale,
    at: (v) => a + scale.t(v) * (b - a),
    span: (v) => { const s = scale.span(v); return [a + s[0] * (b - a), a + s[1] * (b - a)]; },
    bw: Math.abs(scale.bw * (b - a)),
    step: scale.discrete ? Math.abs(scale.step * (b - a)) : 0,
  };
}

function drawLayer(ctx, layer, box) {
  if (!isObj(layer)) fail("bad_plan", "a layer is not an object");
  if (MARKS.indexOf(layer.mark) < 0) fail("unknown_mark", "unknown mark \"" + layer.mark + "\" in layer \"" + layer.id + "\"");
  const sc = isObj(layer.scales) ? layer.scales : {};
  const style = isObj(layer.style) ? layer.style : {};
  const L = {
    layer: layer, box: box,
    reference: layer.origin === "spec" || style.reference === true,
    orient: has(style, "orient") ? style.orient : "vertical",
    x: has(sc, "x") ? positional(ctx.scale(sc.x), box.x0, box.x1) : null,
    y: has(sc, "y") ? positional(ctx.scale(sc.y), box.y1, box.y0) : null,
    color: nonPositional(ctx, layer, "color"), size: nonPositional(ctx, layer, "size"),
    shape: nonPositional(ctx, layer, "shape"), opacity: nonPositional(ctx, layer, "opacity"),
  };
  const isPath = layer.mark === "line" || layer.mark === "area" || layer.mark === "band";
  L.stick = STICK_MAX;
  if (layer.mark === "bar") {
    const f = L.orient === "vertical" ? "x" : "y", pos = L[f];
    if (pos && !pos.scale.discrete) {
      const at = [];
      (layer.items || []).forEach((it) => {
        if (isObj(it) && !has(it, f + "2") && typeof it[f] === "number" && isFinite(it[f])) at.push(it[f]);
      });
      at.sort((a, b) => a - b);
      let gap = Infinity;
      for (let i = 1; i < at.length; i += 1) {
        if (at[i] === at[i - 1]) continue;
        /* A value off its scale is refused below, with its item's key; here it is only skipped. */
        let d;
        try { d = Math.abs(pos.at(at[i]) - pos.at(at[i - 1])); } catch (e) { continue; }
        if (d < gap) gap = d;
      }
      if (gap < MIN_STICK_GAP_PX) {
        const len = f === "x" ? box.x1 - box.x0 : box.y1 - box.y0;
        tooSmall("Layer \"" + layer.id + "\" has sticks " + num(gap) + "px apart, so two values would share a pixel column.", f === "x" ? "width" : "height", len, len * MIN_STICK_GAP_PX / Math.max(gap, 1e-6));
      }
      L.stick = Math.max(1, Math.min(STICK_MAX, gap - 1));
    }
  }
  /* A dodged mark's sub-band must be wide enough to tell slots apart. */
  if (layer.mark !== "bar" && layer.mark !== "boxplot") {
    ["x", "y"].forEach((f) => {
      const P = L[f];
      if (!P || !(P.bw > 0)) return;
      const first = (layer.items || []).find((it) => isObj(it) && isObj(it.slot) && it.slot.count > 0);
      if (first && P.bw / first.slot.count < MIN_SLOT_PX) {
        const len = f === "x" ? box.x1 - box.x0 : box.y1 - box.y0;
        tooSmall("Layer \"" + layer.id + "\" would set " + first.slot.count + " marks side by side in " + num(P.bw) + "px.", f === "x" ? "width" : "height", len, len * MIN_SLOT_PX * first.slot.count / P.bw);
      }
    });
  }
  let out = "";
  (layer.items || []).forEach((it) => {
    if (!isObj(it) || typeof it.key !== "string") fail("bad_plan", "an item of layer \"" + layer.id + "\" has no key");
    try {
      const st = styleOf(ctx, L, it);
      out += isPath ? drawPath(ctx, L, it, st) : DRAW[layer.mark](ctx, L, it, st);
    } catch (e) {
      if (e && e.code && !e.located) {
        e.message += " [layer \"" + layer.id + "\", item \"" + it.key + "\"]";
        e.located = true;
      }
      throw e;
    }
  });
  return el("g", { class: "layer" + (L.reference ? " ref" : ""), "data-layer": layer.id, "data-mark": layer.mark,
                   "data-absent": has(layer, "absent") ? String(layer.absent) : null }, out + drawAbsences(ctx, L));
}

/* Typed absence (contract P9.10; chartspec-v2 §8.5). A row with no value keeps its place and is
 * marked there, never as a data mark and never with `data-key`: a dash for `not_applicable`, a ring
 * for `no_data`, a hollow square where the producer stated no kind. Along the channel that has no
 * value the mark sits on the scale's zero when the scale has one, else on the plot's near edge. The
 * `<title>` names the kind and the reason. */
function drawAbsences(ctx, L) {
  const list = Array.isArray(L.layer.absences) ? L.layer.absences : [];
  let out = "";
  const rest = (P, edge, away) => {
    if (P && !P.scale.discrete && P.scale.def.domain_origin !== "none" && P.scale.type !== "log" &&
        P.scale.domain[0] <= 0 && P.scale.domain[P.scale.domain.length - 1] >= 0) return P.at(0) + away;
    return edge + away;
  };
  list.forEach((a) => {
    if (!isObj(a) || typeof a.key !== "string") fail("bad_plan", "an absence of layer \"" + L.layer.id + "\" has no key");
    const hx = has(a, "x") && L.x, hy = has(a, "y") && L.y;
    if (!hx && !hy) return;
    if (!Object.prototype.hasOwnProperty.call(ABSENCE_WORDS, a.kind)) fail("bad_plan", "unknown absence kind \"" + String(a.kind) + "\" in layer \"" + L.layer.id + "\"");
    const x = hx ? centre(L.x, a, "x") : rest(L.x, L.box.x0, 8);
    const y = hy ? centre(L.y, a, "y") : rest(L.y, L.box.y1, -8);
    const stroke = "fill:none;stroke:" + ctx.theme.muted + ";stroke-width:1.5";
    const g = a.kind === "not_applicable" ? el("line", { x1: x - 5, x2: x + 5, y1: y, y2: y, style: stroke })
      : (a.kind === "no_data" ? el("circle", { cx: x, cy: y, r: 4, style: stroke })
                              : el("rect", { x: x - 3.5, y: y - 3.5, width: 7, height: 7, style: stroke }));
    out += el("g", { class: "absence", "data-absent-key": a.key, "data-kind": a.kind },
              el("title", {}, esc(ABSENCE_WORDS[a.kind] + (has(a, "reason") ? ": " + String(a.reason) : ""))) + g);
  });
  return out;
}

/* The sketch treatment (specs/chartspec-v2.md §8.2): plot-level, inside the plot rectangle and behind
 * every mark, so it survives a crop that removes the header. A hatch of flat lines, the word tiled,
 * and a double rule. No data mark changes with it. */
function drawSketch(box) {
  const w = box.x1 - box.x0, h = box.y1 - box.y0;
  let out = "";
  for (let c = -h + SKETCH_HATCH; c < w; c += SKETCH_HATCH) {
    const t0 = Math.max(0, -c), t1 = Math.min(h, w - c);
    if (t1 - t0 > 1) out += el("line", { class: "sk-h", x1: box.x0 + c + t0, y1: box.y1 - t0, x2: box.x0 + c + t1, y2: box.y1 - t1 });
  }
  const word = "SKETCH", ww = textWidth(word, FS, true) + 4 * FS * 0.3;
  const cols = Math.max(1, Math.floor(w / SKETCH_TILE_W)), rows = Math.max(1, Math.floor(h / SKETCH_TILE_H));
  for (let r = 0; r < rows; r += 1) {
    for (let c = 0; c < cols; c += 1) {
      const cx = box.x0 + (c + 0.5 + (r % 2 ? 0.25 : -0.25) * (cols > 1 ? 1 : 0)) * (w / cols);
      const cy = box.y0 + (r + 0.5) * (h / rows);
      if (cx - ww / 2 < box.x0 + 6 || cx + ww / 2 > box.x1 - 6) continue;
      out += text("sk-w", cx, cy + 4, word, { "text-anchor": "middle" });
    }
  }
  out += el("rect", { class: "sk-f", x: box.x0, y: box.y0, width: w, height: h });
  if (w > 12 && h > 12) out += el("rect", { class: "sk-f", x: box.x0 + 3, y: box.y0 + 3, width: w - 6, height: h - 6 });
  return el("g", { class: "sketch" }, out);
}

function drawPanelAt(ctx, panel, box, meas, flags) {
  const w = box.x1 - box.x0, h = box.y1 - box.y0;
  if (w < MIN_PLOT_W) tooSmall("Panel \"" + panel.id + "\" would have a plot " + num(w) + "px wide after its axis labels.", "width", w, MIN_PLOT_W);
  if (h < MIN_PLOT_H) tooSmall("Panel \"" + panel.id + "\" would have a plot " + num(h) + "px tall after its axis labels.", "height", h, MIN_PLOT_H);
  const ax = drawAxes(meas, box, flags);
  let layers = "";
  (panel.layers || []).forEach((layer) => { layers += drawLayer(ctx, layer, box); });
  /* Contract P9.11: a panel with rows and no value says so, in the platform's voice. */
  let note = "";
  if (isObj(panel.note) && has(panel.note, "text")) {
    const c = truncate(String(panel.note.text), w - 12, FS);
    note = text("t-note", (box.x0 + box.x1) / 2, (box.y0 + box.y1) / 2 + 4, c.text, { "text-anchor": "middle", "data-note": has(panel.note, "kind") ? String(panel.note.kind) : null }, c.cut ? String(panel.note.text) : null);
  }
  return el("g", { class: "panel", "data-panel": panel.id }, (ctx.sketch ? drawSketch(box) : "") + ax.grid + ax.lines + layers + ax.labels + note);
}

/* ---------- layout ---------- */
function panelOf(ctx, id) {
  const p = ctx.plan.panels[id];
  if (!isObj(p)) fail("bad_plan", "panel \"" + id + "\" is not in plan.panels");
  return p;
}

/* Two passes: margins at a provisional plot size, then at the size those margins leave. */
function fitPanel(ctx, panel, rect, flags, minM) {
  let m = { L: 46, R: 12, T: 16, B: 30 }, meas = null;
  for (let pass = 0; pass < 3; pass += 1) {
    const pw = Math.max(20, rect.w - m.L - m.R), ph = Math.max(20, rect.h - m.T - m.B);
    meas = measurePanel(ctx, panel, pw, ph, flags);
    m = { L: Math.max(meas.m.L, minM.L || 0), R: Math.max(meas.m.R, minM.R || 0),
          T: Math.max(meas.m.T, minM.T || 0), B: Math.max(meas.m.B, minM.B || 0) };
  }
  const box = { x0: rect.x + m.L, x1: Math.max(rect.x + m.L + 20, rect.x + rect.w - m.R),
                y0: rect.y + m.T, y1: Math.max(rect.y + m.T + 20, rect.y + rect.h - m.B) };
  meas = measurePanel(ctx, panel, box.x1 - box.x0, box.y1 - box.y0, flags);
  return { box: box, meas: meas, m: m };
}

/* A concat or grid node's own title (contract P8): one line above its children. */
function nodeTitle(node, rect) {
  if (!isObj(node.title) || !has(node.title, "text")) return { svg: "", rect: rect };
  const full = String(node.title.text), c = truncate(full, rect.w, FS);
  return { svg: text(node.title.origin === "spec" ? "t-cap" : "t-val", rect.x, rect.y + FS, c.text, {}, c.cut ? full : null),
           rect: { x: rect.x, y: rect.y + LINE + 2, w: rect.w, h: rect.h - LINE - 2 } };
}

function drawNode(ctx, node, rect, minM, extra) {
  if (!isObj(node)) fail("bad_plan", "a layout node is not an object");
  if (node.kind === "panel") {
    const panel = panelOf(ctx, node.id);
    const flags = Object.assign({ head: panelHead(panel, []) }, extra || {});
    const fit = fitPanel(ctx, panel, rect, flags, minM || {});
    const room = { w: rect.w - fit.m.L - fit.m.R, h: rect.h - fit.m.T - fit.m.B };
    if (room.w < MIN_PLOT_W) tooSmall("Panel \"" + panel.id + "\" has " + num(Math.max(0, room.w)) + "px left for its plot after its axis labels.", "width", Math.max(0, room.w), MIN_PLOT_W);
    if (room.h < MIN_PLOT_H) tooSmall("Panel \"" + panel.id + "\" has " + num(Math.max(0, room.h)) + "px left for its plot after its axis labels.", "height", Math.max(0, room.h), MIN_PLOT_H);
    return drawPanelAt(ctx, panel, fit.box, fit.meas, flags);
  }
  if (node.kind === "concat") {
    if (node.direction !== "horizontal" && node.direction !== "vertical") fail("unknown_layout", "unknown concat direction \"" + node.direction + "\"");
    const kids = Array.isArray(node.children) ? node.children : [];
    const nt = nodeTitle(node, rect);
    rect = nt.rect;
    const n = Math.max(1, kids.length), horiz = node.direction === "horizontal";
    const each = ((horiz ? rect.w : rect.h) - GUTTER * (n - 1)) / n;
    const rects = kids.map((k, i) => (horiz ? { x: rect.x + i * (each + GUTTER), y: rect.y, w: each, h: rect.h }
                                            : { x: rect.x, y: rect.y + i * (each + GUTTER), w: rect.w, h: each }));
    /* Contract P9.13: children on one shared scale show that axis once, on the outer child of its
     * side: under the last of a stack sharing x, beside the first of a row sharing y. */
    const sh = isObj(node.shared) ? node.shared : {};
    const extraOf = (i) => {
      const off = {};
      if (!horiz && sh.x === true) { if (i < kids.length - 1) off.bottom = false; if (i > 0) off.top = false; }
      if (horiz && sh.y === true) { if (i > 0) off.left = false; if (i < kids.length - 1) off.right = false; }
      return Object.keys(off).length ? { labels: off, titles: off } : {};
    };
    /* Panels that sit side by side share top and bottom margins; stacked panels share left and right. */
    const shared = {};
    kids.forEach((k, i) => {
      if (!isObj(k) || k.kind !== "panel") return;
      const panel = panelOf(ctx, k.id);
      const fit = fitPanel(ctx, panel, rects[i], Object.assign({ head: panelHead(panel, []) }, extraOf(i)), {});
      (horiz ? ["T", "B"] : ["L", "R"]).forEach((side) => { shared[side] = Math.max(shared[side] || 0, fit.m[side]); });
    });
    return nt.svg + kids.map((k, i) => drawNode(ctx, k, rects[i], shared, extraOf(i))).join("");
  }
  if (node.kind === "grid") return drawGrid(ctx, node, rect);
  return fail("unknown_layout", "unknown layout kind \"" + (node.kind === undefined ? "undefined" : node.kind) + "\"");
}

function drawGrid(ctx, node, rect0) {
  const nt = nodeTitle(node, rect0), rect = nt.rect;
  const R = Math.max(1, node.rows | 0), C = Math.max(1, node.columns | 0);
  const cells = (Array.isArray(node.cells) ? node.cells : []).slice().sort((a, b) => a.row - b.row || a.column - b.column);
  const sharedX = isObj(node.shared) && node.shared.x === true, sharedY = isObj(node.shared) && node.shared.y === true;
  const colH = isObj(node.column_header) ? node.column_header : null, rowH = isObj(node.row_header) ? node.row_header : null;
  const headers = !!(colH || rowH);
  const at = {};
  cells.forEach((c) => { at[c.row + ":" + c.column] = c; });
  const flagsOf = (c) => {
    const below = !!at[(c.row + 1) + ":" + c.column], right = !!at[c.row + ":" + (c.column + 1)];
    const labels = { bottom: !sharedX || !below, top: !sharedX || c.row === 0, left: !sharedY || c.column === 0, right: !sharedY || !right };
    const firstInRow = c.column === 0 || !at[c.row + ":" + (c.column - 1)];
    const titles = { bottom: labels.bottom && (!sharedX || firstInRow), top: labels.top && (!sharedX || c.column === 0),
                     left: labels.left && (!sharedY || c.row === 0), right: labels.right && (!sharedY || c.row === 0) };
    const panel = panelOf(ctx, c.panel);
    const own = !headers && typeof c.label === "string" && c.label !== "" ? [{ text: c.label, spec: false }] : [];
    return { labels: labels, titles: titles, head: panelHead(panel, own), headOffset: rowTitle[c.row] ? 1 : 0 };
  };
  /* One row, one height for the cell labels: a row where any cell carries an axis title above its
   * plot lifts every cell's label by that line. */
  const rowTitle = {};
  cells.forEach((c) => {
    (panelOf(ctx, c.panel).axes || []).forEach((a) => {
      const side = axisSide(a);
      if ((side === "left" || side === "right") && isObj(a.title) && has(a.title, "text") && (!sharedY || c.row === 0)) rowTitle[c.row] = true;
    });
  });
  let top = rect.y, right = rect.x + rect.w, out = nt.svg;
  const headLine = [colH && has(colH, "title") ? "columns: " + colH.title : null, rowH && has(rowH, "title") ? "rows: " + rowH.title : null]
    .filter((s) => s !== null).join(" · ");
  if (headLine) { out += text("t-sub", rect.x, top + FS, headLine); top += LINE; }
  if (colH) top += LINE;
  if (rowH) right -= LINE;
  /* Per-column and per-row margins, from every cell at a provisional plot size, twice. */
  let pw = Math.max(20, (right - rect.x) / C - 50), ph = Math.max(20, (rect.y + rect.h - top) / R - 40);
  let Lc, Rc, Tr, Br;
  for (let pass = 0; pass < 3; pass += 1) {
    Lc = new Array(C).fill(6); Rc = new Array(C).fill(6); Tr = new Array(R).fill(6); Br = new Array(R).fill(6);
    cells.forEach((c) => {
      const meas = measurePanel(ctx, panelOf(ctx, c.panel), pw, ph, flagsOf(c));
      const below = !!at[(c.row + 1) + ":" + c.column], rightCell = !!at[c.row + ":" + (c.column + 1)];
      Lc[c.column] = Math.max(Lc[c.column], meas.m.L); Tr[c.row] = Math.max(Tr[c.row], meas.m.T);
      /* A cell with nothing below (or to its right) may spend the empty cell's room on its labels. */
      if (below || c.row === R - 1 || !sharedX) Br[c.row] = Math.max(Br[c.row], meas.m.B);
      if (rightCell || c.column === C - 1 || !sharedY) Rc[c.column] = Math.max(Rc[c.column], meas.m.R);
    });
    const sum = (a) => a.reduce((s, v) => s + v, 0);
    pw = Math.max(20, (right - rect.x - sum(Lc) - sum(Rc) - 8 * (C - 1)) / C);
    ph = Math.max(20, (rect.y + rect.h - top - sum(Tr) - sum(Br) - 8 * (R - 1)) / R);
  }
  const x0 = [], y0 = [];
  let cx = rect.x;
  for (let c = 0; c < C; c += 1) { x0.push(cx + Lc[c]); cx += Lc[c] + pw + Rc[c] + 8; }
  let cy = top;
  for (let r = 0; r < R; r += 1) { y0.push(cy + Tr[r]); cy += Tr[r] + ph + Br[r] + 8; }
  cells.forEach((c) => {
    if (!(c.row >= 0 && c.row < R && c.column >= 0 && c.column < C)) fail("bad_plan", "grid cell (" + c.row + ", " + c.column + ") is outside the grid");
    const flags = flagsOf(c);
    const box = { x0: x0[c.column], x1: x0[c.column] + pw, y0: y0[c.row], y1: y0[c.row] + ph };
    const panel = panelOf(ctx, c.panel);
    out += drawPanelAt(ctx, panel, box, measurePanel(ctx, panel, pw, ph, flags), flags);
  });
  if (colH && Array.isArray(colH.labels)) {
    colH.labels.forEach((lb, c) => {
      if (c >= C) return;
      const cut = truncate(String(lb), pw, FS);
      out += text("t-val", x0[c] + pw / 2, top - 4, cut.text, { "text-anchor": "middle" }, cut.cut ? String(lb) : null);
    });
  }
  if (rowH && Array.isArray(rowH.labels)) {
    rowH.labels.forEach((lb, r) => {
      if (r >= R) return;
      const cut = truncate(String(lb), ph, FS);
      const tx = right + LINE - 4, ty = y0[r] + ph / 2;
      out += text("t-val", tx, ty, cut.text, { "text-anchor": "middle", transform: "rotate(90 " + num(tx) + " " + num(ty) + ")" }, cut.cut ? String(lb) : null);
    });
  }
  return el("g", { class: "grid-layout", "data-origin": has(node, "origin") ? String(node.origin) : null }, out);
}

/* ---------- legends ---------- */
function legendMark(ctx, legend) {
  let found = null;
  ctx.panelOrder.forEach((pid) => {
    (ctx.plan.panels[pid].layers || []).forEach((layer) => {
      if (found === null && isObj(layer.scales) && layer.scales[legend.channel] === legend.scale) found = layer.mark;
    });
  });
  if (found === "line" || found === "rule" || found === "segment" || found === "errorbar" || found === "tick") return "line";
  return found === "point" || found === "text" ? "point" : "square";
}

function drawLegends(ctx, x0, y0, width) {
  const legends = Array.isArray(ctx.plan.legends) ? ctx.plan.legends : [];
  if (!legends.length) return { svg: "", height: 0 };
  const th = ctx.theme;
  let x = x0, y = y0, out = "", rowH = LINE;
  legends.forEach((lg) => {
    const def = isObj(lg) ? ctx.plan.scales[lg.scale] : null;
    if (isObj(lg) && lg.kind === "size" && isObj(def) && isObj(def.range) && typeof def.range.max === "number") rowH = Math.max(rowH, 2 * Math.min(LEGEND_R, def.range.max) + 4);
  });
  const mid = () => y + rowH / 2;
  const place = (w) => {
    if (x > x0 && x + w > x0 + width) { x = x0; y += rowH + 2; }
    const at = x;
    x += w;
    return at;
  };
  /* A colour legend and a shape legend with the same title and the same entries describe one field:
   * they are drawn once, each swatch in its colour and its shape. */
  const sameEntries = (a, b) => Array.isArray(a.entries) && Array.isArray(b.entries) && JSON.stringify(a.entries.map((e) => e.value)) === JSON.stringify(b.entries.map((e) => e.value)) &&
    isObj(a.title) && isObj(b.title) && a.title.text === b.title.text;
  const merged = {}, shapeFor = {};
  legends.forEach((a, i) => {
    if (!isObj(a) || a.kind !== "discrete") return;
    legends.forEach((b, j) => { if (isObj(b) && b.kind === "shape" && merged[j] === undefined && shapeFor[i] === undefined && sameEntries(a, b)) { merged[j] = i; shapeFor[i] = b.scale; } });
  });
  legends.forEach((lg, li) => {
    if (!isObj(lg)) fail("bad_plan", "a legend is not an object");
    if (merged[li] !== undefined) { out += el("g", { class: "legend", "data-legend": has(lg, "id") ? String(lg.id) : null, "data-scale": String(lg.scale), "data-channel": String(lg.channel), "data-merged": String(legends[merged[li]].id) }, ""); return; }
    if (["discrete", "gradient", "size", "shape", "opacity"].indexOf(lg.kind) < 0) fail("unknown_legend", "unknown legend kind \"" + lg.kind + "\"");
    const scale = ctx.scale(lg.scale);
    const swatch = legendMark(ctx, lg);
    let g = "";
    if (li > 0 && x > x0) x += 14;
    const tt = isObj(lg.title) && has(lg.title, "text") ? { text: String(lg.title.text), unit: has(lg.title, "unit") ? lg.title.unit : null, spec: lg.title.origin === "spec" } : null;
    if (tt) {
      const str = titleString(tt);
      const w = textWidth(str, FS, !tt.spec) + 10;
      const at = place(w);
      g += text(tt.spec ? "t-cap" : "t-key", at, mid() + 4, str);
    }
    const base = { color: th.secondary, opacity: 1, size: null, shape: "circle", dash: "" };
    const entries = Array.isArray(lg.entries) ? lg.entries
      : (scale.discrete ? scale.members.map((m) => ({ value: m, label: String(m) })) : null);
    if (lg.kind === "gradient" || entries === null) {
      if (scale.discrete) fail("unknown_legend", "legend \"" + String(lg.id) + "\" is a ramp over a discrete scale and lists no entries");
      const lo = scale.domain[0], hi = scale.domain[scale.domain.length - 1];
      const labs = numberLabels(scale.domain, false, 1);
      const steps = 24;
      const lw = textWidth(labs[0], FS) + 6, rw = textWidth(labs[labs.length - 1], FS) + 6;
      if (lg.kind === "size") {
        /* The smallest, the middle and the largest radius of the range, at their true size. */
        const rs = [0, 0.5, 1].map((u) => Math.min(LEGEND_R, magnitudeOn(scale, lo + (hi - lo) * u, "size")));
        const cell = 2 * Math.max(rs[0], rs[2]) + 6;
        const at = place(lw + 3 * cell + rw);
        g += text("tk", at, mid() + 4, labs[0]);
        rs.forEach((r, i) => { g += glyph("circle", at + lw + cell * (i + 0.5), mid(), r, { style: fillStyle(base) }); });
        g += text("tk", at + lw + 3 * cell + 6, mid() + 4, labs[labs.length - 1]);
      } else {
        const bw = 96;
        const at = place(lw + bw + rw);
        g += text("tk", at, mid() + 4, labs[0]);
        for (let i = 0; i < steps; i += 1) {
          const u = (i + 0.5) / steps;
          /* Equal steps along the ramp: a diverging scale's two arms each take half the bar. */
          const v = scale.type === "diverging" ? (u < 0.5 ? scale.domain[0] + (scale.domain[1] - scale.domain[0]) * u * 2 : scale.domain[1] + (scale.domain[2] - scale.domain[1]) * (u - 0.5) * 2)
                                               : lo + (hi - lo) * u;
          const st = Object.assign({}, base);
          if (lg.kind === "gradient") st.color = colourOn(ctx, scale, v); else st.opacity = magnitudeOn(scale, v, "opacity");
          g += el("rect", { x: at + lw + i * (bw / steps), y: mid() - 5, width: bw / steps + 0.3, height: 9, style: fillStyle(st) });
        }
        g += text("tk", at + lw + bw + 6, mid() + 4, labs[labs.length - 1]);
      }
    } else {
      entries.forEach((en) => {
        const label = truncate(has(en, "label") ? String(en.label) : String(en.value), 160, FS);
        const pad = lg.kind === "size" ? rowH - 2 : 12;
        const w = pad + 4 + textWidth(label.text, FS) + 10;
        const at = place(w);
        const st = Object.assign({}, base);
        let sw;
        if (lg.kind === "discrete") {
          st.color = colourOn(ctx, scale, en.value);
          const cyc = paletteCycle(ctx, scale, en.value);
          st.dash = PALETTE_DASH[cyc % PALETTE_DASH.length];
          sw = swatch === "line" ? el("line", { x1: at, x2: at + 12, y1: mid(), y2: mid(), style: strokeStyle(st, 2) })
            : (swatch === "point" ? glyph(shapeFor[li] !== undefined ? shapeOn(ctx.scale(shapeFor[li]), en.value) : PALETTE_SHAPE[cyc % PALETTE_SHAPE.length], at + 6, mid(), 4, { style: fillStyle(st) })
                                  : el("rect", { x: at + 1, y: mid() - 5, width: 10, height: 10, style: fillStyle(st) }));
        } else if (lg.kind === "shape") {
          const shp = shapeOn(scale, en.value);
          if (SHAPES.indexOf(shp) < 0) fail("unknown_shape", "unknown shape \"" + shp + "\" on scale \"" + scale.id + "\"");
          sw = glyph(shp, at + 6, mid(), 4, { style: fillStyle(st) });
        } else if (lg.kind === "size") {
          sw = glyph("circle", at + pad / 2, mid(), Math.min(LEGEND_R, magnitudeOn(scale, en.value, "size")), { style: fillStyle(st) });
        } else {
          st.opacity = magnitudeOn(scale, en.value, "opacity");
          sw = el("rect", { x: at + 1, y: mid() - 5, width: 10, height: 10, style: fillStyle(st) });
        }
        g += sw + text("t-val", at + pad + 4, mid() + 4, label.text, {}, label.cut ? (has(en, "label") ? String(en.label) : String(en.value)) : null);
      });
    }
    out += el("g", { class: "legend", "data-legend": has(lg, "id") ? String(lg.id) : null, "data-scale": String(lg.scale), "data-channel": String(lg.channel) }, g);
  });
  return { svg: out, height: y - y0 + rowH + 4 };
}

/* ---------- the plot ---------- */
function panelOrder(node, out) {
  if (!isObj(node)) return out;
  if (node.kind === "panel") out.push(node.id);
  else if (node.kind === "concat") (node.children || []).forEach((k) => panelOrder(k, out));
  else if (node.kind === "grid") (node.cells || []).forEach((c) => out.push(c.panel));
  return out;
}

function styleSheet(th) {
  const r = ".tcl-marks";
  return r + "{font-family:" + th.font + ";font-size:" + FS + "px}" +
    r + " text{fill:" + th.muted + "}" +
    r + " .t-title{fill:" + th.primary + ";font-size:" + FS_TITLE + "px}" +
    r + " .t-cap{fill:" + th.secondary + ";font-style:italic}" +
    r + " .t-title.t-cap{fill:" + th.secondary + "}" +
    r + " .t-sub,.tcl-marks .tk,.tcl-marks .t-ref{fill:" + th.muted + "}" +
    r + " .t-key{fill:" + th.muted + ";letter-spacing:.08em}" +
    r + " .t-val{fill:" + th.secondary + "}" +
    r + " .t-lab{fill:" + th.primary + "}" +
    r + " .t-note{fill:" + th.secondary + ";paint-order:stroke;stroke:" + th.page + ";stroke-width:3;stroke-linejoin:round}" +
    r + " .bg{fill:" + th.page + "}" +
    r + " .ax{stroke:" + th.rule + ";stroke-width:1;fill:none}" +
    r + " .gr{stroke:" + th.hairline + ";stroke-width:1}" +
    r + " .zero{stroke:" + th.muted + ";stroke-width:1;stroke-dasharray:" + DASH_REF + "}" +
    r + " .vx{fill:none;stroke:none;pointer-events:all}" +
    r + " .sk-h{stroke:" + th.hairline + ";stroke-width:1}" +
    r + " .sk-f{fill:none;stroke:" + th.faint + ";stroke-width:1}" +
    r + " .sk-w{fill:" + th.rule + ";letter-spacing:.3em}" +
    r + " .t-sk{fill:" + th.muted + ";letter-spacing:.3em}";
}

function themeOf(t) {
  if (t === undefined || t === null) return THEMES.dark;
  if (typeof t === "string") {
    if (!THEMES[t]) fail("bad_plan", "unknown theme \"" + t + "\"");
    return THEMES[t];
  }
  if (!isObj(t) || !isObj(t.roles) || !Array.isArray(t.categorical)) fail("bad_plan", "the theme is not a theme object");
  return t;
}

function k2w(kind) { return kind === "unstated" ? "with no value" : ABSENCE_WORDS[kind]; }

/* The platform's own line under the title: what was read, and what was not drawn. */
function platformLine(plan, order) {
  const parts = [];
  (Array.isArray(plan.frames) ? plan.frames : []).forEach((f) => {
    if (isObj(f) && has(f, "name")) parts.push(String(f.name) + " · " + (typeof f.rows === "number" ? f.rows + (f.rows === 1 ? " row" : " rows") : "rows not stated"));
  });
  /* What is not drawn is said, by kind, with the mark that stands for it (contract P9.10). A row is
   * counted once, however many layers bind it. */
  let absent = 0;
  const kinds = { no_data: {}, not_applicable: {}, unstated: {} };
  const marks = { no_data: "ring", not_applicable: "dash", unstated: "square" };
  order.forEach((pid) => {
    (plan.panels[pid].layers || []).forEach((l) => {
      if (Array.isArray(l.absences)) l.absences.forEach((a) => { if (isObj(a) && kinds[a.kind]) kinds[a.kind][String(a.key)] = true; });
      else if (typeof l.absent === "number") absent += l.absent;
    });
  });
  let s = parts.join("; ");
  const said = Object.keys(kinds).map((k) => [k, Object.keys(kinds[k]).length]).filter((p) => p[1] > 0)
    .map((p) => p[1] + " " + (k2w(p[0])) + " (" + marks[p[0]] + ")");
  if (said.length) s += (s ? "; " : "") + "not drawn: " + said.join(", ");
  if (absent > 0) s += (s ? "; " : "") + absent + (absent === 1 ? " row" : " rows") + " not drawn: no value";
  return s;
}

/* The marker strip (specs/chartspec-v2.md §8.1): beside the plot, never inside a mark. One entry per
 * distinct binding; several bindings are each labelled with the fields they cover. The binding shapes
 * read here are the ones the grammar's examples carry; any other shape refuses. */
function markerStrip(plan, panels) {
  if (!Array.isArray(plan.markers) || !plan.markers.length) return null;
  const groups = [];
  plan.markers.forEach((m) => {
    if (!isObj(m)) fail("bad_plan", "a marker is not an object");
    const who = String(m.frame) + "." + String(m.field);
    let str = null, rule = null;
    /* Contract P9.1: `n` is the field's binding and names the marker that describes it. The marker
     * read is the one named, never whichever happens to be present. */
    const b = isObj(m.n) ? m.n : {};
    if (b.marker === "rows_marker" && isObj(m.rows_marker) && has(m.rows_marker, "n_per_row") && has(m.rows_marker, "n_sort")) {
      str = "n per row: " + String(m.rows_marker.n_per_row) + " \u00b7 " + String(m.rows_marker.n_sort);
      rule = has(m.rows_marker, "n_rule") ? String(m.rows_marker.n_rule) : null;
    } else if (b.marker === "population" && isObj(m.population) && typeof m.population.n === "number" && has(m.population, "n_sort")) {
      /* One population over several panels covers them together; it is never one panel's n (v2 §8.1). */
      str = "n " + String(m.population.n) + " \u00b7 " + String(m.population.n_sort) + (panels > 1 ? ", all panels together" : "");
      rule = has(m.population, "n_rule") ? String(m.population.n_rule) : null;
    } else if (typeof b.row === "string" && b.row !== "") {
      str = has(b, "n_sort") ? "n per row from " + b.row + " \u00b7 " + String(b.n_sort) : "n and its sort per row";
      rule = has(b, "n_rule") ? String(b.n_rule) : null;
    } else {
      fail("unknown_marker", "the marker on \"" + who + "\" has a binding this renderer cannot read");
    }
    let g = null;
    groups.forEach((x) => { if (x.str === str && x.rule === rule) g = x; });
    if (g === null) { g = { str: str, rule: rule, fields: [] }; groups.push(g); }
    if (g.fields.indexOf(String(m.field)) < 0) g.fields.push(String(m.field));
  });
  const one = groups.length === 1;
  return { text: groups.map((g) => (one ? "" : g.fields.join(", ") + ": ") + g.str).join("; "),
           rule: groups.map((g) => g.rule).filter((r) => r !== null).join("; ") };
}

function render(plan, opts) {
  opts = opts || {};
  if (!isObj(plan)) fail("bad_plan", "the plan is not an object");
  if (plan.schema !== SCHEMA) fail("unknown_schema", "unknown plan schema \"" + plan.schema + "\" (this renderer reads " + SCHEMA + ")");
  if (!isObj(plan.panels) || !isObj(plan.scales) || !isObj(plan.root)) fail("bad_plan", "the plan needs root, panels and scales");
  const W = opts.width === undefined ? DEFAULT_W : opts.width, H = opts.height === undefined ? DEFAULT_H : opts.height;
  if (typeof W !== "number" || typeof H !== "number" || !(W >= 120) || !(H >= 90) || !isFinite(W) || !isFinite(H)) fail("bad_size", "width and height must be numbers of at least 120 and 90 (got " + String(W) + " x " + String(H) + ")");
  const theme = themeOf(opts.theme);
  const order = panelOrder(plan.root, []);
  order.forEach((pid) => { if (!isObj(plan.panels[pid])) fail("bad_plan", "panel \"" + pid + "\" is not in plan.panels"); });
  /* A scale is snapped once, from the first axis that names it, so every panel sharing it agrees. */
  const niceCount = {};
  order.forEach((pid) => {
    (plan.panels[pid].axes || []).forEach((ax) => {
      if (niceCount[ax.scale] === undefined) {
        const c = isObj(ax.ticks) && typeof ax.ticks.count === "number" ? ax.ticks.count : 5;
        niceCount[ax.scale] = Math.max(GRID_MIN, Math.min(XTICK_MAX, c));
      }
    });
  });
  const cache = {};
  const ctx = {
    plan: plan, theme: theme, panelOrder: order, vertices: opts.vertices !== false, sketch: plan.sketch !== false,
    scale: (id) => {
      if (!Object.prototype.hasOwnProperty.call(cache, id)) cache[id] = buildScale(plan.scales[id], id, niceCount[id] === undefined ? 5 : niceCount[id]);
      return cache[id];
    },
  };
  let head = "", y = PAD;

  const $ = (id) => document.getElementById(id);
  const FUNCTION_URL = SUPABASE_URL + "/functions/v1/" + FUNCTION_NAME;
  const AGENT_SESSION_URL = SUPABASE_URL + "/functions/v1/agent-session";
  const TERMINAL_AUTH_MODE = "agent-session";
  /* specs/keep-as-investigation.md. Off until a release turns it on: the control's third line is true
   * only where the terminal function runs with TERMINAL_CONTEXT=investigation. */
  const KEEP_ON = "on" === "on";
  const WORKSPACE_URL = "/";
  const LOGOUT_WAIT_MS = 2000;

  /* ---------- session: the one the sign-in page stored, through session.js ---------- */
  let session = TclSession.load();
  let currentThread = null;
  let sending = false;
  let chartsRendered = 0;
  const rowCache = new Map();
  /* Row requests in flight, by snapshot id. The cache alone cannot dedupe two requests made
   * before either resolves — measured 2026-09-18: three charts naming the same five rows asked
   * for fifteen — so a request registers a promise per id and a second caller waits on it. */
  const inflight = new Map();

  /* True when the session may be used now. A token with a minute or more left is used as it is;
   * otherwise it is refreshed first — at boot too, before any read: the page used to read threads
   * with whatever token was stored, an expired one included (F128), and only a send refreshed.
   * GoTrue REFUSING the refresh token ends the session. GoTrue not answering does not: nothing is
   * known about the session then, the reader is told, and it is kept for the next try. */
  async function refreshIfNeeded() {
    if (!session) return false;
    if (TclSession.remaining(session) > 60) return true;
    /* Another page on this origin may already have refreshed this session — the Investigation page
     * frames this one, and both hold it. GoTrue rotates refresh tokens: spending the one this page
     * still holds after the other page spent it is a reuse, refused, and the refusal signs out BOTH.
     * So a fresher stored session for the same reader is adopted, and nothing is spent. */
    const stored = TclSession.load();
    if (stored && stored.access_token !== session.access_token && stored.user && session.user &&
        stored.user.id === session.user.id && TclSession.remaining(stored) > 60) {
      session = stored;
      return true;
    }
    let next;
    try {
      next = await TclSession.refresh(session);
    } catch (err) {
      setStatus("could not refresh the session: " + err.message, true);
      return false;
    }
    if (!next) { signOut(); return false; }
    session = next;
    TclSession.save(session);
    return true;
  }

  /* Cleared HERE first, so that a reload cannot bring the session back whatever the network does;
   * then the logout is waited for, bounded, and only then does the page go. A logout sent as the
   * page leaves is the browser's to cancel, which is why session.js sends it with `keepalive` and
   * why this waits for it as well. */
  function signOut() {
    const was = session;
    session = null;
    TclSession.clear();
    if (KEEP_ON) TclKeep.clearAll(keepStore());
    TclPropose.clearAll(keepStore());
    const out = was ? TclSession.logout(was).catch(() => {}) : Promise.resolve();
    return Promise.race([out, new Promise((r) => setTimeout(r, LOGOUT_WAIT_MS))])
      .then(() => { location.replace(SIGNIN_URL); });
  }

  /* ---------- REST: threads and messages with the user's token; the board without it ---------- */
  function restHeaders(withUser) {
    const h = { "apikey": SUPABASE_KEY, "Accept": "application/json" };
    if (withUser && session) h["Authorization"] = "Bearer " + session.access_token;
    return h;
  }

  function rest(path, withUser) {
    return fetch(SUPABASE_URL + "/rest/v1/" + path, { headers: restHeaders(withUser) })
      .then((r) => {
        if (!r.ok) throw new Error("HTTP " + r.status + " on " + path.split("?")[0]);
        return r.json();
      });
  }

  /* The JWT stays on the model-free exchange path. The model-running terminal sees only
   * the signed, terminal-audience capability. Legacy mode preserves the old page render
   * until the gateway, verifier, and page can be released together. */
  async function terminalAuthorization() {
    if (TERMINAL_AUTH_MODE === "jwt") return session.access_token;
    if (TERMINAL_AUTH_MODE !== "agent-session") throw new Error("unknown terminal auth mode");
    const response = await fetch(AGENT_SESSION_URL, {
      method: "POST",
      headers: { "apikey": SUPABASE_KEY, "Authorization": "Bearer " + session.access_token,
                 "Accept": "application/json" }
    });
    if (!response.ok) throw new Error("terminal authorization failed (HTTP " + response.status + ")");
    const capability = await response.json();
    /* Shape only. Expiry is the terminal's to judge on the server clock: a check against this
     * browser's clock would refuse every turn on a machine running five minutes fast. */
    if (!capability || typeof capability.token !== "string" ||
        !/^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$/.test(capability.token) ||
        !Number.isSafeInteger(capability.expires_at)) {
      throw new Error("invalid terminal capability");
    }
    return capability.token;
  }

  /* The list as it has always been, or, given contexts, the same conversations under the Investigation each
   * works in (specs/conversation-readers.md §3). A conversation's row is the same row either way. */
  function paintThreads(rows, contexts) {
    const ul = $("threads");
    ul.textContent = "";
    const row = (t, nested) => {
      const li = document.createElement("li");
      li.textContent = t.title || "(untitled)";
      li.setAttribute("data-thread", t.id);
      li.title = t.updated_at;
      if (currentThread === t.id) li.className = "current";
      if (nested) li.classList.add("nested");
      li.addEventListener("click", () => openThread(t.id));
      ul.appendChild(li);
    };
    const grouped = contexts ? TclRun.group(rows, contexts) : { groups: [], rest: rows };
    if (!grouped.groups.length) { rows.forEach((t) => row(t, false)); return; }
    const label = (text) => {
      const li = document.createElement("li");
      li.className = "label";
      li.textContent = text;
      ul.appendChild(li);
    };
    label("Investigations");
    grouped.groups.forEach((g) => {
      const li = document.createElement("li");
      li.className = "inv";
      const a = document.createElement("a");
      a.href = WORKSPACE_URL + "?id=" + encodeURIComponent(g.investigation_id);
      a.target = "_top";
      a.textContent = g.title;
      li.appendChild(a);
      ul.appendChild(li);
      g.threads.forEach((t) => row(t, true));
    });
    if (grouped.rest.length) {
      label("Other conversations");
      grouped.rest.forEach((t) => row(t, false));
    }
  }

  let threadsSeq = 0;
  /* The contexts as last read, so that a later load of the list paints it grouped at once instead of flat
   * and then grouped. And whether this database has the reader at all: asked once, not at every load. */
  let knownContexts = null;
  let contextsMissing = false;
  function loadThreads() {
    threadsSeq += 1;
    const seq = threadsSeq;
    return rest("threads?select=id,title,updated_at&order=updated_at.desc&limit=100", true)
      .then((rows) => {
        /* A newer load has started: its paint is the one that stands, and this one would undo it. */
        if (seq !== threadsSeq) return;
        paintThreads(rows, knownContexts);
        if (contextsMissing) return;
        /* Then, where this database has the reader (023), the Investigations as they are now. The list is
         * already painted: a failed read leaves it as it is, and an unchanged answer repaints nothing. */
        api("thread_contexts", {})
          .then((contexts) => {
            if (seq !== threadsSeq || !Array.isArray(contexts)) return;
            const changed = JSON.stringify(contexts) !== JSON.stringify(knownContexts || []);
            knownContexts = contexts;
            if (changed) paintThreads(rows, contexts);
          })
          .catch((err) => { if (err && (err.status === 404 || err.code === "PGRST202")) contextsMissing = true; });
      });
  }

  function openThread(id) {
    currentThread = id;
    $("messages").textContent = "";
    setStatus("");
    resetPanel();
    clearContext();
    refreshContext(id);
    const epoch = panel.epoch;
    const answers = new Map();
    return rest("messages?select=*&thread_id=eq." + id + "&order=id.asc", true)
      .then((rows) => {
        /* The view this answer was fetched FOR may be gone: a second thread click lands here
         * too, and without this both threads' messages — and both threads' tabs — render. */
        if (epoch !== panel.epoch) return undefined;
        rows.forEach((m) => {
          /* A run command row (kind "command") is a run line, not a question or an answer: no chart, no
