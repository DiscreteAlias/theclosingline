<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>the closing line · terminal (beta)</title>
<!--
  The beta terminal (R-CL15, R-CL16). Rendered by realdata/closingline/terminal.py, which
  inlines the six modules verbatim and substitutes only scalars (live.py's F19 guard).

  WHAT THIS PAGE DOES, and with which credential:
    signs a user in with Supabase Auth (email + password) and holds the access token;
    reads that user's threads and messages with the PUBLISHABLE key plus the token, so
      PostgREST runs as `authenticated` under the RLS policies 005_terminal.sql proposes;
    reads board rows with the publishable key ALONE (anon), the credential the live page reads
      with — `authenticated` holds no grant on public.snapshots and needs none;
    sends each message to the Edge Function with the token, and reads the reply as
      Server-Sent Events over the response body (not Realtime);
    draws a chart from its stored spec and the rows the spec names, through the same six
      modules the function computed it with — in a PANEL beside the conversation, not in the
      thread. The thread carries one reference card per chart; the panel holds every chart of
      the open thread as a tab strip, and reads a chart's rows when its tab is first opened.
  No package, no CDN, no HTML strings: every node is built with createElement/textContent.
-->
<style>
  :root {
    --page: #0a0a0c; --panel: #121216; --panel2: #17171c; --rule: #2a2a32;
    --ink: #e6e6ea; --muted: #8a8a93; --accent: #22d3ee; --margin: #f59e0b; --bad: #f87171;
    --ramp-lo: #4a6a78; --ramp-mid: #ba8757; --ramp-hi: #f59e0b;
    --mono: ui-monospace, Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  /* F42, recurring here. `[hidden]` is a USER-AGENT rule, the lowest weight in the cascade, and
     `main { display: grid }` and `section { display: flex }` below are author rules that beat it.
     Measured 2026-09-18: signed out, #app carried `hidden = true` and computed `display: grid`,
     868 px of shell under the sign-in box. live.html has carried this rule since F42. */
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--page); color: var(--ink); font-family: var(--sans);
         font-size: 14px; line-height: 1.45; }
  header { display: flex; align-items: center; gap: 14px; padding: 10px 16px;
           border-bottom: 1px solid var(--rule); }
  .wordmark { font-family: var(--mono); letter-spacing: .14em; text-transform: uppercase;
              font-size: 12px; color: var(--ink); }
  .beta { font-family: var(--mono); font-size: 11px; letter-spacing: .13em; text-transform: uppercase;
          color: var(--margin); border: 1px solid var(--margin); padding: 1px 6px; border-radius: 3px; }
  .spacer { flex: 1; }
  #who { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  button { font: inherit; color: var(--ink); background: var(--panel2); border: 1px solid var(--rule);
           border-radius: 4px; padding: 6px 10px; cursor: pointer; }
  button:hover { border-color: var(--muted); }
  button.primary { border-color: var(--accent); color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  input, textarea { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--rule);
                    border-radius: 4px; padding: 8px 10px; width: 100%; }
  input:focus, textarea:focus { outline: none; border-color: var(--accent); }
  .auth { max-width: 380px; margin: 60px auto; padding: 24px; background: var(--panel);
          border: 1px solid var(--rule); border-radius: 6px; }
  .auth h1 { font-size: 14px; margin: 0 0 14px; font-family: var(--mono); letter-spacing: .13em;
             text-transform: uppercase; color: var(--muted); }
  .auth label { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 4px; }
  .auth .row { display: flex; gap: 8px; margin-top: 14px; }
  .note { font-size: 12px; color: var(--muted); margin-top: 10px; min-height: 1.4em; }
  .note.bad { color: var(--bad); }
  /* The ROW is pinned to the viewport. An implicit auto row grows with its content — measured
     2026-09-18 with 80 messages: the DOCUMENT scrolled (4721 px in a 913 px viewport), #messages
     never did (clientHeight = scrollHeight, so scrollDown() was a no-op) and the composer sat 3.8
     viewports down. A panel beside that conversation would have scrolled away with it. One
     declaration, on the row, for every child of `main`: `min-height: 0` on the sections does
     the same and was measured redundant beside it, so it is not here. */
  main { display: grid; grid-template-columns: 240px 1fr; grid-template-rows: minmax(0, 1fr);
         height: calc(100% - 45px); position: relative; }
  /* Three columns while the panel is open. Their minima — 240 + 360 + 512 — are the breakpoint
     below, where there is no longer room for a panel BESIDE the conversation. 512, not the
     chart's 480 floor: the panel's border and its body's padding sit outside the chart, and a
     panel at its minimum must still hold a chart at its floor without scrolling. */
  main.with-panel { grid-template-columns: 240px minmax(360px, 1fr) minmax(512px, 1.4fr); }
  aside { border-right: 1px solid var(--rule); padding: 12px; overflow: auto; }
  aside button { width: 100%; margin-bottom: 10px; }
  #threads { list-style: none; margin: 0; padding: 0; }
  #threads li { padding: 8px 8px; border-radius: 4px; cursor: pointer; font-size: 13px;
                color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #threads li:hover { background: var(--panel); }
  #threads li.current { background: var(--panel2); color: var(--ink); }
  section { display: flex; flex-direction: column; min-width: 0; }
  #messages { flex: 1; overflow: auto; padding: 16px 20px; }
  .msg { max-width: 820px; margin: 0 0 14px; padding: 10px 14px; border-radius: 6px; white-space: pre-wrap;
         overflow-wrap: anywhere; }
  .msg.user { background: var(--panel2); border: 1px solid var(--rule); }
  .msg.assistant { background: var(--panel); border: 1px solid var(--rule); }
  .msg.loose { color: var(--muted); font-style: italic; }
  .msg.failed { border-color: var(--bad); color: var(--muted); }
  .meta { font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase;
          color: var(--muted); margin: 0 0 6px; }
  /* ---- the reference card: what a chart leaves in the thread. One per chart, inside the
     assistant's message, built from the stored spec alone — no row is read to draw it. ---- */
  .refs { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; white-space: normal; }
  .ref { display: inline-flex; flex-direction: column; align-items: flex-start; gap: 5px;
         max-width: 100%; text-align: left; padding: 8px 10px; }
  .ref:hover, .ref.is-open { border-color: var(--accent); }
  .ref.failed { border-color: var(--bad); }
  .ref-title { font-size: 13px; overflow-wrap: anywhere; }
  .ref .chips { display: flex; flex-wrap: wrap; gap: 4px 0; }
  /* ---- the chart panel: BESIDE the conversation while there is room, OVER it when there is
     not. A <section>, so it is already a flex column with min-width 0. ---- */
  .panel { border-left: 1px solid var(--rule); background: var(--panel); }
  .panel-head { display: flex; align-items: stretch; border-bottom: 1px solid var(--rule); }
  .tabs { flex: 1; min-width: 0; display: flex; overflow-x: auto; scrollbar-width: thin; }
  .tab { flex: none; border: 0; border-right: 1px solid var(--rule); border-bottom: 2px solid transparent;
         border-radius: 0; background: transparent; color: var(--muted); padding: 9px 12px;
         font-family: var(--mono); font-size: 11px; letter-spacing: .04em; white-space: nowrap; }
  .tab:hover { color: var(--ink); }
  .tab.is-active { color: var(--ink); background: var(--panel2); border-bottom-color: var(--accent); }
  .tab.failed { color: var(--bad); }
  /* Outside the strip's scroll area, so it stays reachable however many tabs there are. */
  #panel-close { flex: none; border: 0; border-left: 1px solid var(--rule); border-radius: 0;
                 background: transparent; color: var(--muted); font-family: var(--mono); font-size: 11px;
                 letter-spacing: .08em; text-transform: uppercase; }
  .panel-body { flex: 1; min-height: 0; overflow-y: auto; padding: 12px 14px 16px; }
  .readout { display: flex; flex-wrap: wrap; gap: 4px 18px; margin: 0 0 12px;
             font-family: var(--mono); font-size: 11px; }
  .readout .cell { display: flex; gap: 6px; align-items: baseline; }
  .readout .label { color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
  .readout b { font-weight: 600; }
  /* The <svg> carries its width and height as ATTRIBUTES and no CSS width, so one user unit is
     one CSS pixel at every panel width; narrower than the chart's floor, this wrapper scrolls. */
  .chart-scroll { overflow-x: auto; }
  .chart-scroll svg { display: block; }
  .why { color: var(--bad); font-size: 12px; margin: 10px 0 0; min-height: 1.4em; }
  .why.note { color: var(--muted); }
  .status { font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase;
            color: var(--muted); padding: 4px 20px; min-height: 22px; border-top: 1px solid var(--rule); }
  .status.bad { color: var(--bad); }
  #composer { display: flex; gap: 10px; padding: 12px 20px 16px; border-top: 1px solid var(--rule); }
  #composer textarea { resize: none; height: 64px; }
  #composer button { align-self: flex-end; height: 40px; }
  .chip { display: inline-block; font-family: var(--mono); font-size: 11px; color: var(--muted);
          border: 1px solid var(--rule); border-radius: 3px; padding: 0 6px; margin-right: 6px; }
  /* The attribution nflverse's CC BY 4.0 asks for, on the page that shows the data. Scheme-less on
     purpose: this page carries no absolute URL to any host but its Supabase project
     (test_live_output_safety.py), so the references are text, not links. */
  .attribution { font-size: 11px; color: var(--muted); padding: 4px 20px 8px; margin: 0;
                 border-top: 1px solid var(--rule); }
  /* Below 1112 px the panel covers the conversation instead of narrowing it, so the conversation
     underneath does not reflow and keeps its scroll position. It is positioned against `main`,
     not against the viewport with the header's height written in: the header measured 40.9 px,
     not the 45 `main`'s own height assumes, and a panel pinned at 45 left 4 px of conversation
     showing above it. The script's WIDE_QUERY is the other statement of this breakpoint. */
  @media (max-width: 1111px) {
    main.with-panel { grid-template-columns: 240px 1fr; }
    .panel { position: absolute; top: 0; right: 0; bottom: 0; left: 0; z-index: 20; border-left: 0; }
  }
  @media (max-width: 720px) { main, main.with-panel { grid-template-columns: 1fr; } aside { display: none; } }
</style>
</head>
<body>
<header>
  <span class="wordmark">the closing line</span>
  <span class="beta">terminal · beta</span>
  <span class="spacer"></span>
  <span id="who"></span>
  <button id="signout" hidden>sign out</button>
</header>

<div id="auth" class="auth">
  <h1>Sign in</h1>
  <form id="auth-form">
    <label for="email">email</label>
    <input id="email" type="email" autocomplete="username" required>
    <label for="password">password</label>
    <input id="password" type="password" autocomplete="current-password" minlength="8" required>
    <div class="row">
      <button type="submit" class="primary" id="signin">sign in</button>
      <button type="button" id="signup">create account</button>
    </div>
  </form>
  <p id="auth-note" class="note"></p>
</div>

<main id="app" hidden>
  <aside>
    <button id="new-thread">new thread</button>
    <ul id="threads"></ul>
  </aside>
  <section>
    <div id="messages"></div>
    <div id="status" class="status"></div>
    <form id="composer">
      <textarea id="input" placeholder="Ask about the board. Shift+Enter for a new line." required></textarea>
      <button type="submit" class="primary" id="send">send</button>
    </form>
    <p class="attribution">NFL statistics: nflverse-data (github.com/nflverse/nflverse-data), CC BY 4.0 (creativecommons.org/licenses/by/4.0); restructured into tables; not endorsed by nflverse.</p>
  </section>
  <!-- The chart panel. The <svg> is MARKUP, not a node a script creates: every tab is mounted into
       this one root, so "one persistent root" is a property of the page rather than a discipline
       of its script — and the root is the container that outlives every redraw, which is where a
       delegated listener will go when the charts become interactive. -->
  <section id="panel" class="panel" aria-label="charts" hidden>
    <div class="panel-head">
      <div id="tabs" class="tabs" role="tablist" aria-label="charts in this thread"></div>
      <button type="button" id="panel-close" aria-label="close the chart panel">close</button>
    </div>
    <div id="panel-body" class="panel-body" role="tabpanel">
      <div id="readout" class="readout"></div>
      <div id="chart-scroll" class="chart-scroll" hidden><svg id="panel-svg" role="img"></svg></div>
      <p id="panel-why" class="why"></p>
    </div>
  </section>
</main>

<script>
/* slice/layer4/devig.js, inlined verbatim. Proven bit-identical to devig.py by
 * tests/test_devig_parity.py, which evaluates the file's own bytes. */
/* Devigging methods for two-sided markets — the browser-side port of devig.py.
 *
 * A LITERAL transcription of `slice/layer4/devig.py`, agreeing with it bit-for-bit.
 * Both languages use IEEE 754 binary64, and +, - and / are correctly rounded in both,
 * so bit-equality follows from the standard — PROVIDED the operation order is preserved.
 * It is not an approximation to be reordered for elegance:
 *
 *     additive returns `p_a - overround / 2.0`, NOT the algebraically equal
 *     `(p_a - p_b + 1) / 2`. Those two forms differ by one unit in the last place
 *     on 772 of 2304 sampled price pairs.
 *
 * Proven against `slice/layer4/parity/devig_parity.json` by
 * `tests/test_devig_parity.py`, which evaluates THIS FILE'S BYTES — the same bytes
 * that get inlined into the page. A bare script, no import/export, no dependency,
 * no build step.
 *
 * NAMING COLLISION, because these two live one call apart in a browser:
 *   `overround` HERE (and in devig.py)   = book sum MINUS ONE.
 *   `overround` in board.py / board_quote.js = the book sum ITSELF.
 * See board_quote.js.
 *
 * Errors: see DevigError. Messages devig.py authors are reproduced byte for byte.
 * Messages CPython authors are a DECLARED equivalence, tabulated in the fixture.
 */

var Devig = (function () {
  "use strict";

  /* Carries the Python exception type name, so a declared equivalence is checkable
   * rather than merely asserted in prose. `pyType` is one of ValueError, TypeError,
   * ZeroDivisionError, NotImplementedError. */
  class DevigError extends Error {
    constructor(pyType, message) {
      super(message);
      this.name = "DevigError";
      this.pyType = pyType;
    }
  }

  /* Python's repr(float), byte for byte.
   *
   * Needed because devig.py interpolates the offending values into its own error
   * messages, and JS disagrees with Python on all of: integral values ("2" vs "2.0"),
   * infinity ("Infinity" vs "inf"), NaN ("NaN" vs "nan"), negative zero ("0" vs
   * "-0.0"), and the thresholds at which each switches to exponent notation.
   *
   * Python uses exponent form iff decpt <= -4 or decpt > 16, with a signed exponent
   * of at least two digits; JS switches at 1e-7 and 1e21 and never pads the exponent.
   * Verified over 14040 values, including both threshold boundaries and subnormals. */
  function pyRepr(x) {
    if (Number.isNaN(x)) return "nan";
    if (x === Infinity) return "inf";
    if (x === -Infinity) return "-inf";
    const neg = x < 0 || Object.is(x, -0);
    const a = Math.abs(x);
    if (a === 0) return neg ? "-0.0" : "0.0";
    const m = a.toExponential().match(/^(\d)(?:\.(\d+))?e([+-]\d+)$/);
    const digits = m[1] + (m[2] || "");
    const decpt = parseInt(m[3], 10) + 1;
    let out;
    if (decpt <= -4 || decpt > 16) {
      const e = decpt - 1;
      const frac = digits.slice(1);
      const es = (e < 0 ? "-" : "+") + String(Math.abs(e)).padStart(2, "0");
      out = digits[0] + (frac ? "." + frac : "") + "e" + es;
    } else if (decpt <= 0) {
      out = "0." + "0".repeat(-decpt) + digits;
    } else if (decpt >= digits.length) {
      out = digits + "0".repeat(decpt - digits.length) + ".0";
    } else {
      out = digits.slice(0, decpt) + "." + digits.slice(decpt);
    }
    return (neg ? "-" : "") + out;
  }

  /* Mirrors devig.py's `_validate_two_sided`, INCLUDING the order in which the
   * failures occur. Python unpacks before it compares, so an arity failure precedes
   * the range guard and a non-numeric element fails at the comparison, not the
   * unpack. Trigger order is part of what the fixture asserts. */
  function validateTwoSided(oddsTwoSided) {
    if (!Array.isArray(oddsTwoSided)) {
      // Python: `o_a, o_b = 2.0` -> TypeError, cannot unpack non-iterable float object
      throw new DevigError(
        "TypeError",
        "cannot unpack non-array odds_two_sided"
      );
    }
    if (oddsTwoSided.length !== 2) {
      // Python: ValueError from unpacking, "not enough"/"too many values to unpack"
      throw new DevigError(
        "ValueError",
        "odds_two_sided must hold exactly 2 values; got " + oddsTwoSided.length
      );
    }
    for (const o of oddsTwoSided) {
      if (typeof o !== "number") {
        // Python: TypeError, '<=' not supported between instances of 'str' and 'float'
        throw new DevigError(
          "TypeError",
          "'<=' not supported between decimal odds of type " +
            typeof o +
            " and float"
        );
      }
    }
    const o_a = oddsTwoSided[0];
    const o_b = oddsTwoSided[1];
    // NaN fails both comparisons, so it passes this guard exactly as Python's does.
    if (o_a <= 1.0 || o_b <= 1.0) {
      throw new DevigError(
        "ValueError",
        "both decimal odds must be > 1.0; got (" +
          pyRepr(o_a) +
          ", " +
          pyRepr(o_b) +
          ")"
      );
    }
  }

  /* Standard proportional devigging. devig.py:23-36. */
  function multiplicative(oddsTwoSided) {
    validateTwoSided(oddsTwoSided);
    const o_a = oddsTwoSided[0];
    const o_b = oddsTwoSided[1];
    const p_a = 1.0 / o_a;
    const p_b = 1.0 / o_b;
    const s = p_a + p_b;
    /* EXPLICIT, not inherited. Both odds infinite underflows the sum to zero, where
     * Python raises and JS would return NaN. NaN is the worst available way to
     * disagree: it propagates into a chart instead of surfacing. */
    if (s === 0) {
      throw new DevigError("ZeroDivisionError", "float division by zero");
    }
    return [p_a / s, p_b / s];
  }

  /* Additive devigging — subtract half the overround from each side. devig.py:39-56.
   * `overround` here is the book sum MINUS ONE, per the header note. */
  function additive(oddsTwoSided) {
    validateTwoSided(oddsTwoSided);
    const o_a = oddsTwoSided[0];
    const o_b = oddsTwoSided[1];
    const p_a = 1.0 / o_a;
    const p_b = 1.0 / o_b;
    const overround = p_a + p_b - 1.0;
    return [p_a - overround / 2.0, p_b - overround / 2.0];
  }

  /* Shin (1992). DEFERRED — devig.py:59-66 raises before touching its argument, so
   * this raises on invalid input and on wrong arity too. Message is devig.py's own,
   * reproduced byte for byte.
   *
   * At n = 2 the Shin and additive maps are the same map, exactly, at every price and
   * every hold — so deferring this costs nothing on two-way markets. */
  function shin(oddsTwoSided) {
    throw new DevigError(
      "NotImplementedError",
      "Shin devigging deferred per slice non-goals"
    );
  }

  /* Power devigging. DEFERRED — devig.py:69-76. The `power` argument is accepted and
   * never read, matching the Python. */
  function power(oddsTwoSided, powerExponent) {
    throw new DevigError(
      "NotImplementedError",
      "Power devigging deferred per slice non-goals"
    );
  }

  /* Mid-price implied probability for an exchange's two-sided market. devig.py:79-91.
   * `ask` is never checked against 1.0 on its own; NaN in either argument returns NaN
   * without raising, because every comparison against NaN is false. */
  function spreadToImpliedProb(bid, ask) {
    if (typeof bid !== "number" || typeof ask !== "number") {
      throw new DevigError(
        "TypeError",
        "'<=' not supported between bid/ask of non-float type and float"
      );
    }
    if (bid <= 1.0) {
      throw new DevigError("ValueError", "bid must be > 1.0; got " + pyRepr(bid));
    }
    if (bid > ask) {
      throw new DevigError(
        "ValueError",
        "bid must be <= ask; got bid=" + pyRepr(bid) + ", ask=" + pyRepr(ask)
      );
    }
    return (1.0 / bid + 1.0 / ask) / 2.0;
  }

  return {
    DevigError: DevigError,
    pyRepr: pyRepr,
    multiplicative: multiplicative,
    additive: additive,
    shin: shin,
    power: power,
    spreadToImpliedProb: spreadToImpliedProb,
  };
})();

</script>
<script>
/* realdata/closingline/board_quote.js, inlined verbatim, AFTER devig.js because it reads the
 * free global `Devig`. Proven by test_board_quote_parity.py. */
/* One book's two-sided quote, devigged — the browser-side port of board.py's `_devig`.
 *
 * A LITERAL transcription of `realdata/closingline/board.py:224-256`, agreeing with it
 * bit-for-bit. Depends on `Devig` from `slice/layer4/devig.js`, which must be evaluated
 * first. Direction is realdata -> slice, which is the permitted one.
 *
 * Proven against `realdata/closingline/parity/board_quote_parity.json` by
 * `tests/realdata/closingline/test_board_quote_parity.py`, which evaluates THIS FILE'S
 * BYTES. A bare script, no import/export, no dependency, no build step.
 *
 * NAMING COLLISION — the reason this note appears in both files:
 *   `overround` HERE (and in board.py) = the book sum ITSELF, p_a + p_b.
 *   `overround` in devig.js / devig.py = the book sum MINUS ONE.
 * Carrying this file's vocabulary into the devig math would be wrong in a way that
 * still produces plausible numbers.
 *
 * WHAT THIS FILE DELIBERATELY DOES NOT PORT: `_market_board`. Outcome alignment,
 * bucketing, and the B1-B6 constraints stay server-side, which is what poller.py
 * already does at encode time. Moving them into the browser is precisely what
 * realdata/closingline/__init__.py warns against.
 */

var BoardQuote = (function () {
  "use strict";

  /* board.py:224-242. Returns null where the Python returns None.
   *
   * NOTE the asymmetry with devig.js: on the SAME predicate — either price at or
   * below 1.0 — this returns null and `Devig.multiplicative` throws. Two responses to
   * one condition, one frame apart. The board answers with None so the quote is
   * dropped from the board rather than failing the render. */
  function quote(prices) {
    if (!Array.isArray(prices) || prices.length !== 2) {
      return null;
    }
    if (prices[0] <= 1.0 || prices[1] <= 1.0) {
      return null;
    }
    const implied = [1.0 / prices[0], 1.0 / prices[1]];
    // The book sum. Named `overround` to match board.py's field, not devig.py's local.
    const overround = implied[0] + implied[1];
    /* Unreachable for valid input, since both implied values are strictly positive.
     * Present because board.py has it, and because NaN passes it there too:
     * `NaN <= 0.0` is false in both languages. */
    if (overround <= 0.0) {
      return null;
    }
    const fair = Devig.multiplicative(prices);
    return {

 * the set, which is a payload change and therefore a schema bump, a new image and a restart.

 * cannot drift apart silently — which is the only thing that makes the duplication safe.

        line: row[5],
        asof: payload.last_updates[row[6]],

        overround: quote === null ? null : quote.overround,

/* First-order devig bias coefficients — the browser-side port of Proposition 2.

 * are themselves transcribed from `docs/15_LAYER_5_FOUNDATIONS_CLV_FAIR_BET.md:182` and
 * published as Proposition 2 of Stavsky, É. (2026), "Closing-Line Value as a Fair Bet, and
 * the Devig Bias That Governs It".

 * Each function returns the PER-STEP BIAS β = v · γ(p) at the focal outcome, not γ itself.
 * The Python's own docstrings are explicit about that and the naming here follows it rather
 * than improving on it, because a reader moving between the two files should not have to
 * hold two conventions.
 *
 * NO PYTHON IMPORT, IN EITHER DIRECTION. `realdata/` may not import `verification/`
 * (`tests/test_realdata_import_direction.py`, docs/31 §8), so this file transcribes and the
 * TEST — which lives in `tests/` and may import anything — is what pins the transcription to
 * the source. That is the same shape as `devig.js`: the artifact is standalone, the proof
 * crosses the boundary.
 *
 * EXACTNESS, AND THE ONE EXCEPTION. Three of the four are +, -, * and / on binary64, which
 * IEEE 754 requires to be correctly rounded, so they agree with the Python bit for bit and
 * the test asserts exactly that. `power` calls `log`, which IEEE 754 does NOT require to be
 * correctly rounded — the standard recommends it and does not mandate it — so no bit claim is
 * available for it across two runtimes. The test states a tolerance for that one case, in
 * ulps, as a decision with its measured basis. See `test_live_gamma_parity.py`.
 *
 * A bare script, no import/export, no dependency, no build step.
 */

  "use strict";

  /* Matched method-truth: multiplicative devig on multiplicative truth. γ ≡ 0.
   * `docs/15:182` — the hold cancels, so the bias is zero at ALL orders in v, not merely at
   * first order. `gamma_analytical_wsb.py:31-41` returns zeros_like(v). */

    return 0.0 * v;

   * `gamma_analytical_wsb.py:43-53`: `v * (p_focal - 0.5)`. */
  function additive(p, v) {
    return v * (p - 0.5);
  }

  /* Shin three-way on multiplicative truth, n = 3: β = v · (n·p − 1) / (2(n − 1)).
   * `gamma_analytical_wsb.py:55-69`: `v * (3.0 * p_focal - 1.0) / 4.0`.
   *
   * Kept at n = 3 rather than generalised. The Python is n = 3 and the operation order is
   * what the bit-equality claim rests on; a general form would be a different expression
   * that happens to agree at n = 3, which is not the same thing. */

   * entropy of the true distribution. `gamma_analytical_wsb.py:71-87`.

   * still preserved exactly, because that is what keeps the divergence to the transcendental
   * rather than adding rounding of our own. */

      note: "matched: zero at all orders" },
    { key: "additive", label: "additive", fn: additive,
      note: "zero crossing at p = 1/n" },
    { key: "shin3", label: "Shin (n=3)", fn: shinThreeWay,
      note: "zero crossing at p = 1/n" },
    { key: "power", label: "power", fn: power,
      note: "entropy-weighted" }

  return {
    multiplicative: multiplicative,
    additive: additive,
    shinThreeWay: shinThreeWay,
    power: power,
    METHODS: METHODS
  };
})();

  function bookPoints(board, valueOf, opts) {
    var out = [];
    everyQuote(board).forEach(function (q) {
      if (q.fair === null) return;
      var v = valueOf(q);
      out.push({
        book: q.book, y: v.y, y2: (v.y2 === undefined ? null : v.y2),
        withheld: v.withheld === true, isRef: !!board.reference && q.book === board.reference.book,
        isExchange: q.isExchange, hold: q.hold, fair: q.fair[0]
      });
    });
    return { unit: opts.unit, zero: opts.zero === true, fmt: opts.fmt, points: out };
  }

  function lineSeries(frames, valueOf, opts) {
    var byBookMap = {};
    frames.forEach(function (fr, i) {
      everyQuote(fr.board).forEach(function (q) {
        if (q.fair === null) return;
        var v = valueOf(q, fr, i);
        if (v === null || v === undefined || !isFinite(v)) return;
        (byBookMap[q.book] = byBookMap[q.book] || []).push({ i: i, y: v });
      });
    });
    var lines = [];
    for (var book in byBookMap) {
      if (byBookMap[book].length >= 2) lines.push({ book: book, points: byBookMap[book] });
    }
    return { unit: opts.unit, zero: opts.zero === true, fmt: opts.fmt, lines: lines,
             points: lines.reduce(function (a, ln) { return a.concat(ln.points); }, []) };
  }

  function aggregateSeries(frames, reduce, opts) {
    var pts = [];
    frames.forEach(function (fr, i) {
      var v = reduce(fr.board);
      if (v !== null && isFinite(v)) pts.push({ i: i, y: v });
    });
    return { unit: opts.unit, zero: opts.zero === true, fmt: opts.fmt,
             lines: pts.length >= 2 ? [{ book: opts.label, points: pts }] : [],
             points: pts };
  }

  var SERIES = [
    /* ---- BOOK: one mark per book, on the rank axis ---- */
    { key: "hold_strip", label: "hold by book", family: FAM.BOOK, form: "dot",
      quantity: "hold", unit: "%", axis: "book rank", fmt: "pct", needs: "quotes",
      note: "wide range makes a strip clearer than bars",
      compute: function (b) {
        return bookPoints(b, function (q) { return { y: q.hold }; }, { unit: "%", fmt: "pct" });
      } },
    { key: "fair_pi", label: "fair π", family: FAM.BOOK, form: "dot",
      quantity: "probability", unit: "%", axis: "book rank", fmt: "pct", needs: "quotes",
      note: "the devigged probability each book implies for side A",
      compute: function (b) {
        return bookPoints(b, function (q) { return { y: q.fair[0] }; }, { unit: "%", fmt: "pct" });
      } },
    { key: "delta_ref", label: "Δ vs reference", family: FAM.BOOK, form: "bar",
      quantity: "deviation", unit: "pp", axis: "book rank", fmt: "signed2", needs: "reference",
      note: "withheld where a comparison would cross a line (B6) or a lay price (B4)",
      compute: function (b) {
        return bookPoints(b, function (q) {
          var ok = comparable(b, q.book);
          return { y: ok ? q.delta_pp : 0, withheld: !ok };
        }, { unit: "pp", zero: true, fmt: "signed2" });
      } },
    { key: "overround", label: "overround", family: FAM.BOOK, form: "bar",
      quantity: "overround", unit: "×", axis: "book rank", fmt: "pctRaw", needs: "quotes",
      note: "the vig made physical rather than stated",
      compute: function (b) {
        return bookPoints(b, function (q) { return { y: q.overround - 1.0 }; },
                          { unit: "×", zero: true, fmt: "pctRaw" });
      } },
    { key: "dumbbell", label: "offered vs fair", family: FAM.BOOK, form: "dumbbell",
      quantity: "probability", unit: "%", axis: "book rank", fmt: "pct", needs: "quotes",
      note: "offered implied against devigged fair, per book",
      compute: function (b) {
        return bookPoints(b, function (q) { return { y: q.fair[0], y2: q.implied[0] }; },
                          { unit: "%", fmt: "pct" });
      } },
    { key: "beta", label: "β = v·γ per book", family: FAM.BOOK, form: "bar",
      quantity: "first-order bias", unit: "pp", axis: "book rank", fmt: "signed2", needs: "quotes",
      note: "Proposition 2, evaluated at each book's own hold and fair probability",
      compute: function (b) {
        return bookPoints(b, function (q) {
          return { y: Gamma.additive(q.fair[0], q.hold) * 100.0 };
        }, { unit: "pp", zero: true, fmt: "signed2" });
      } },

    /* ---- STANDALONE ---- */
    { key: "slope", label: "implied → fair", family: FAM.SOLO, form: "slope",
      quantity: "probability", unit: "pp", axis: "two-axis slope", fmt: "pct", needs: "reference",
      note: "the devig transform, working",
      compute: function (b) {
        var pick = function (q) {
          return { book: q.book, implied: q.implied[0], fair: q.fair[0], hold: q.hold,
                   line: q.line, isRef: !!b.reference && q.book === b.reference.book };
        };
        var lines = [];
        b.off_line.forEach(function (q) {
          var v = q.line === null ? "—" : String(q.line);
          if (lines.indexOf(v) === -1) lines.push(v);
        });
        return { unit: "%", fmt: "pct",
                 top: chartable(b).map(pick), bottom: b.off_line.map(pick),
                 offLines: lines, exchanges: b.exchanges.length,
                 referenceBook: b.referenceBook, referenceLine: b.referenceLine,
                 matched: b.matched.length };
      } },
    { key: "hold_dev", label: "hold vs deviation", family: FAM.SOLO, form: "scatter",
      quantity: "hold", unit: "%", axis: "hold", fmt: "signed2", needs: "reference",
      note: "asks whether margin predicts bias; the shape of the cloud is the content",
      compute: function (b) {
        return { unit: "pp", fmt: "signed2", zero: true,
                 points: chartable(b).map(function (q) {
                   return { book: q.book, hold: q.hold, delta_pp: q.delta_pp,
                            isRef: !!b.reference && q.book === b.reference.book };
                 }) };
      } },
    { key: "gamma", label: "γ(p) family", family: FAM.SOLO, form: "curves",
      quantity: "first-order bias", unit: "pp", axis: "probability", fmt: "num2", needs: "none",
      note: "Proposition 2; one curve per devig method, zero crossing at p = 1/n",
      compute: function () {
        var ps = [];
        for (var i = 1; i < 200; i += 1) ps.push(i / 200);
        return { unit: "β", fmt: "num2", v: GAMMA_V, ps: ps,
                 curves: Gamma.METHODS.map(function (m) {
                   return { key: m.key, label: m.label, note: m.note,
                            ys: ps.map(function (pp) { return m.fn(pp, GAMMA_V); }) };
                 }) };
      } },

    /* ---- TIME: one line per book, or one aggregate, across the polls held ---- */
    { key: "dispersion_t", label: "dispersion width", family: FAM.TIME, form: "line",
      quantity: "spread", unit: "pp", axis: "time", fmt: "signed2", needs: "quotes",
      note: "aggregates across books, so it moves when individuals do not",
      compute: function (frames) {
        return aggregateSeries(frames, function (b) {
          var qs = chartable(b);
          if (qs.length < 2) return null;
          var lo = Infinity, hi = -Infinity;
          qs.forEach(function (q) {
            if (q.fair[0] < lo) lo = q.fair[0];
            if (q.fair[0] > hi) hi = q.fair[0];
          });
          return (hi - lo) * 100.0;
        }, { unit: "pp", label: "dispersion", fmt: "signed2" });
      } },
    { key: "hold_t", label: "hold per book", family: FAM.TIME, form: "line",
      quantity: "hold", unit: "%", axis: "time", fmt: "pct", needs: "quotes",
      note: "the reference should sit flat and low; the contrast is the point",
      compute: function (frames) {
        return lineSeries(frames, function (q) { return q.hold; }, { unit: "%", fmt: "pct" });
      } },
    { key: "price_t", label: "price path per book", family: FAM.TIME, form: "line",
      quantity: "price", unit: "dec", axis: "time", fmt: "num3", needs: "quotes",
      note: "side A's offered decimal price, per book",
      compute: function (frames) {
        return lineSeries(frames, function (q) { return q.prices[0]; },
                          { unit: "dec", fmt: "num3" });
      } },
    { key: "dv", label: "Δv per interval", family: FAM.TIME, form: "line",
      quantity: "hold change", unit: "pp", axis: "time", fmt: "signed2", needs: "quotes",
      note: "the per-interval change in each book's hold",
      compute: function (frames) {
        var prev = {}, byBookMap = {};
        frames.forEach(function (fr, i) {
          everyQuote(fr.board).forEach(function (q) {
            if (q.fair === null) return;
            if (prev[q.book] !== undefined) {
              (byBookMap[q.book] = byBookMap[q.book] || []).push(
                { i: i, y: (q.hold - prev[q.book]) * 100.0 });
            }
            prev[q.book] = q.hold;
          });
        });
        var lines = [];
        for (var book in byBookMap) {
          if (byBookMap[book].length >= 2) lines.push({ book: book, points: byBookMap[book] });
        }
        return { unit: "pp", zero: true, fmt: "signed2", lines: lines,
                 points: lines.reduce(function (a, ln) { return a.concat(ln.points); }, []) };
      } },
    { key: "freshness", label: "freshness", family: FAM.TIME, form: "cells",
      quantity: "staleness", unit: "s", axis: "time", fmt: "secs", needs: "quotes",
      note: "books × time by last_update recency; busy even when prices are static",
      compute: function (frames) {
        var books = [], cells = [], worst = 1;
        frames.forEach(function (fr, i) {
          everyQuote(fr.board).forEach(function (q) {
            if (q.fair === null || !q.asof) return;
            if (books.indexOf(q.book) === -1) books.push(q.book);
            var age = (Date.parse(fr.at) - Date.parse(q.asof)) / 1000.0;
            if (!isFinite(age) || age < 0) return;
            if (age > worst) worst = age;
            cells.push({ book: q.book, i: i, age: age });
          });
        });
        books.sort();
        cells.forEach(function (c) { c.v = Math.min(c.age / worst, 1) * 0.85 + 0.05; });
        return { unit: "s", books: books, cells: cells, fmt: "secs", worst: worst,
                 points: cells.map(function (c) { return { i: c.i, y: c.age }; }) };
      } }
  ];

  function seriesOf(key) {
    for (var i = 0; i < SERIES.length; i += 1) if (SERIES[i].key === key) return SERIES[i];
    return null;
  }

  function seriesList() {
    return SERIES.map(function (sd) {
      return { key: sd.key, label: sd.label, family: sd.family, form: sd.form,
               quantity: sd.quantity, unit: sd.unit, axis: sd.axis, needs: sd.needs,
               note: sd.note };
    });
  }

  /* ---------- validation: fail closed ---------- */
  function isInt(v) { return typeof v === "number" && isFinite(v) && Math.floor(v) === v; }

  function validate(raw) {
    var errors = [];
    if (!raw || typeof raw !== "object" || Array.isArray(raw)) {
      return { ok: false, errors: ["spec must be an object"], spec: null };
    }
    Object.keys(raw).forEach(function (k) {
      if (SPEC_KEYS.indexOf(k) === -1) errors.push("unknown key: " + k);
    });
    var sd = typeof raw.series === "string" ? seriesOf(raw.series) : null;
    if (!sd) errors.push("unknown series: " + String(raw.series));
    var spec = { series: raw.series };
    if (sd && sd.needs !== "none") {
      if (REGIONS.indexOf(raw.region) === -1) errors.push("region must be one of " + REGIONS.join(", "));
      if (typeof raw.event !== "string" || !raw.event.length) errors.push("event must be an event id string");
      if (MARKETS.indexOf(raw.market) === -1) errors.push("market must be one of " + MARKETS.join(", "));
      spec.region = raw.region; spec.event = raw.event; spec.market = raw.market;
    } else if (sd) {
      ["region", "event", "market"].forEach(function (k) {
        if (raw[k] !== undefined) errors.push(sd.key + " takes no " + k);
      });
    }
    if (sd && sd.family === FAM.TIME) {
      if (raw.window === undefined) spec.window = WINDOW.dflt;
      else if (!isInt(raw.window) || raw.window < WINDOW.min || raw.window > WINDOW.max) {
        errors.push("window must be an integer in " + WINDOW.min + ".." + WINDOW.max);
      } else spec.window = raw.window;
    } else if (raw.window !== undefined) errors.push("window applies to time series only");
    if (sd && sd.family === FAM.BOOK) {
      if (raw.sort === undefined) spec.sort = "hold";
      else if (SORTS.indexOf(raw.sort) === -1) errors.push("sort must be one of " + SORTS.join(", "));
      else spec.sort = raw.sort;
    } else if (raw.sort !== undefined) errors.push("sort applies to book series only");
    if (raw.title !== undefined) {
      if (typeof raw.title !== "string" || raw.title.length > TITLE_MAX) {
        errors.push("title must be a string of at most " + TITLE_MAX + " characters");
      } else spec.title = raw.title;
    }
    return { ok: errors.length === 0, errors: errors, spec: errors.length === 0 ? spec : null };
  }

  /* ---------- compute ---------- */
  function meta(row, board, spec, group) {
    return {
      region: spec.region, event: board.event, market: spec.market,
      captured_at: group.captured_at, snapshot_id: row.id,
      region_seq: (typeof row.region_seq === "number") ? row.region_seq : null,
      schema: row.payload.schema, gate: gateOf(row),
      reference_book: board.referenceBook, reference_line: board.referenceLine,
      referenceless: board.referenceless === true,
      roles: board.roles, n_books: everyQuote(board).length,
      n_matched: board.matched.length, n_off_line: board.off_line.length,
      n_exchanges: board.exchanges.length, n_dropped: board.dropped.length,
      poll: group.poll
    };
  }

  function timeFrames(spec, pollList) {
    var frames = [];
    for (var i = 0; i < pollList.length && frames.length < spec.window; i += 1) {
      var row = pollList[i].rows[spec.region];
      if (!row || !usable(row).ok) continue;
      var b = panel(row, spec.event, spec.market);
      if (!b) continue;
      frames.push({ at: pollList[i].captured_at, id: row.id, board: b, group: pollList[i] });
    }
    frames.reverse();
    return frames;
  }

  function compute(raw, pollList) {
    var v = validate(raw);
    if (!v.ok) return { ok: false, error: v.errors.join("; ") };
    var spec = v.spec, sd = seriesOf(spec.series);
    var body;
    if (sd.needs === "none") {
      body = sd.compute();
      body.ok = true; body.spec = spec; body.key = sd.key; body.label = sd.label;
      body.family = sd.family; body.form = sd.form;
      body.meta = { series: sd.key };
      return body;
    }
    if (!pollList || !pollList.length) return { ok: false, error: "no polls held" };
    if (sd.family === FAM.TIME) {
      var frames = timeFrames(spec, pollList);
      if (frames.length < 2) {
        return { ok: false, error: "fewer than 2 usable frames for region " + spec.region +
                 ", event " + spec.event + ", " + spec.market + " in the last " + spec.window +
                 " polls (" + frames.length + " found)" };
      }
      body = sd.compute(frames);
      body.ok = true; body.spec = spec; body.key = sd.key; body.label = sd.label;
      body.family = sd.family; body.form = sd.form;
      body.frames = frames.map(function (fr) { return { at: fr.at, id: fr.id }; });
      var last = frames[frames.length - 1];
      body.meta = meta(last.group.rows[spec.region], last.board, spec, last.group);
      body.meta.n_frames = frames.length;
      body.meta.window = spec.window;
      body.meta.first_at = frames[0].at;
      body.referenceBook = last.board.referenceBook;
      return body;
    }
    var g = pollList[0];
    var row = g.rows[spec.region];
    if (!row) {
      return { ok: false, error: "region " + spec.region + " is absent from the newest poll (" +
               g.captured_at + "; regions present: " + regionsOf(g).join(", ") + ")" + pollNote(g) };
    }
    var u = usable(row);
    if (!u.ok) {
      return { ok: false, error: "region " + spec.region + "'s newest row is " + u.reason +
               " and is excluded from the board (R-CL11)" + pollNote(g) };
    }
    var board = panel(row, spec.event, spec.market);
    if (!board) return { ok: false, error: noPanelReason(row, spec) };
    if (sd.needs === "reference" && !board.reference) {
      return { ok: false, error: sd.key + " needs a reference book and region " + spec.region +
               " carries none (reference_book is null; R-CL3)" };
    }
    body = sd.compute(board, spec);
    body.ok = true; body.spec = spec; body.key = sd.key; body.label = sd.label;
    body.family = sd.family; body.form = sd.form;
    body.referenceBook = board.referenceBook;
    body.meta = meta(row, board, spec, g);
    return body;
  }

  /* ---------- a compact summary of a computed series, for the model ---------- */
  function summary(c) {
    if (!c || !c.ok) return { ok: false, error: c ? c.error : "no series" };
    var s = { ok: true, series: c.key, family: c.family, form: c.form, unit: c.unit, meta: c.meta };
    if (c.family === FAM.BOOK) {
      var pts = c.points.slice().sort(function (a, b) { return a.y - b.y; });
      s.n = pts.length;
      s.withheld = pts.filter(function (p) { return p.withheld; }).length;
      s.values = c.points.map(function (p) {
        var v = { book: p.book, y: r4(p.y) };
        if (p.y2 !== null) v.y2 = r4(p.y2);
        if (p.withheld) v.withheld = true;
        if (p.isRef) v.reference = true;
        if (p.isExchange) v.exchange = true;
        return v;
      });
      var shown = pts.filter(function (p) { return !p.withheld; });
      if (shown.length) {
        s.min = { book: shown[0].book, y: r4(shown[0].y) };
        s.max = { book: shown[shown.length - 1].book, y: r4(shown[shown.length - 1].y) };
      }
      var ref = c.points.filter(function (p) { return p.isRef; })[0];
      if (ref) s.reference = { book: ref.book, y: r4(ref.y) };
    } else if (c.family === FAM.TIME) {
      s.n_frames = c.frames.length;
      s.first_at = c.frames[0].at; s.last_at = c.frames[c.frames.length - 1].at;
      if (c.lines) {
        s.lines = c.lines.map(function (ln) {
          var ys = ln.points.map(function (p) { return p.y; });
          var sum = 0; ys.forEach(function (y) { sum += y; });
          return { book: ln.book, n: ys.length, first: r4(ys[0]), last: r4(ys[ys.length - 1]),
                   mean: r4(sum / ys.length), min: r4(Math.min.apply(null, ys)),
                   max: r4(Math.max.apply(null, ys)) };
        });
      }
      if (c.cells) { s.n_books = c.books.length; s.worst_age_s = r4(c.worst); }
    } else if (c.key === "slope") {
      s.top = c.top.map(function (q) {
        return { book: q.book, implied: r4(q.implied), fair: r4(q.fair), hold: r4(q.hold),
                 reference: q.isRef };
      });
      s.bottom = c.bottom.map(function (q) {
        return { book: q.book, line: q.line, implied: r4(q.implied), fair: r4(q.fair), hold: r4(q.hold) };
      });
      s.exchanges_excluded = c.exchanges;
    } else if (c.key === "hold_dev") {
      s.points = c.points.map(function (p) {
        return { book: p.book, hold: r4(p.hold), delta_pp: r4(p.delta_pp), reference: p.isRef };
      });
    } else if (c.key === "gamma") {
      s.v = c.v;
      s.at = [0.1, 0.25, 0.5, 0.75, 0.9].map(function (p) {
        var idx = Math.round(p * 200) - 1;
        var row = { p: p };
        c.curves.forEach(function (cv) { row[cv.key] = r4(cv.ys[idx]); });
        return row;
      });
    }
    return s;
  }

  /* ---------- describe: the board as the `read_board` tool returns it ---------- */
  function marketSummary(board) {
    var ch = chartable(board);
    var holds = ch.map(function (q) { return q.hold; });
    var fairs = ch.map(function (q) { return q.fair[0]; });
    var offLines = [];
    board.off_line.forEach(function (q) {
      var v = q.line === null ? null : q.line;
      if (offLines.indexOf(v) === -1) offLines.push(v);
    });
    var out = {
      reference: board.reference ? {
        book: board.reference.book, prices: board.reference.prices,
        fair_a: r4(board.reference.fair[0]), hold: r4(board.reference.hold),
        line: board.referenceLine
      } : null,
      line: board.referenceLine,
      roles: board.roles,
      n_matched: board.matched.length, n_off_line: board.off_line.length,
      n_exchanges: board.exchanges.length, n_dropped: board.dropped.length,
      off_lines: offLines
    };
    if (ch.length) {
      out.hold_min = r4(Math.min.apply(null, holds));
      out.hold_max = r4(Math.max.apply(null, holds));
      out.fair_a_min = r4(Math.min.apply(null, fairs));
      out.fair_a_max = r4(Math.max.apply(null, fairs));
      out.dispersion_pp = r4((out.fair_a_max - out.fair_a_min) * 100.0);
    }
    return out;
  }

  function quoteDetail(board) {
    return function (q) {
      return { book: q.book, bucket: bucketOf(board, q.book), line: q.line, prices: q.prices,
               implied_a: q.implied === null ? null : r4(q.implied[0]),
               fair_a: q.fair === null ? null : r4(q.fair[0]),
               hold: r4(q.hold), delta_pp: r4(q.delta_pp), asof: q.asof };
    };
  }

  function describe(pollList, opts) {
    opts = opts || {};
    if (!pollList || !pollList.length) return { ok: false, error: "no polls held" };
    var g = pollList[0];
    var out = { ok: true, captured_at: g.captured_at, poll: g.poll, regions: {}, absent: [],
                cross: {}, polls_held: pollList.length };
    var presence = {};
    REGIONS.forEach(function (region) {
      if (opts.region && opts.region !== "all" && opts.region !== region) return;
      var row = g.rows[region];
      if (!row) { out.absent.push(region); return; }
      var u = usable(row), p = row.payload;
      var R = {
        snapshot_id: row.id,
        region_seq: (typeof row.region_seq === "number") ? row.region_seq : null,
        schema: p.schema, gate: gateOf(row), usable: u.ok, excluded_reason: u.reason,
        reference_book: (p.reference_book === undefined) ? null : p.reference_book,
        n_events: p.events.length, n_books: p.books.length,
        books: p.books.slice(), markets: p.markets.slice(), events: []
      };
      p.events.forEach(function (ev) {
        (presence[ev[0]] = presence[ev[0]] || []).push(region);
        if (opts.event && opts.event !== ev[0]) return;
        var E = { id: ev[0], home: ev[1], away: ev[2], commence: ev[3], markets: {} };
        p.markets.forEach(function (mk) {
          var board = panel(row, ev[0], mk);
          if (!board) { E.markets[mk] = null; return; }
          var M = marketSummary(board);
          if (opts.detail === "books") M.books = everyQuote(board).map(quoteDetail(board));
          E.markets[mk] = M;
        });
        R.events.push(E);
      });
      out.regions[region] = R;
    });
    for (var id in presence) if (presence[id].length > 1) out.cross[id] = presence[id];

      mk(m, "line", { class: "axis", x1: f.x0, y1: band.top - 10, x2: f.x0, y2: band.bot + 10 });
      mk(m, "line", { class: "axis", x1: f.x1, y1: band.top - 10, x2: f.x1, y2: band.bot + 10 });
      var c1 = f.x0 + (f.x1 - f.x0) * 0.42, c2 = f.x0 + (f.x1 - f.x0) * 0.58;
      quotes.forEach(function (q) {
        var y0 = y(y.clamp(q.implied)), y1 = y(y.clamp(q.fair));
        var cutL = y.clamp(q.implied) !== q.implied;
        var cutR = y.clamp(q.fair) !== q.fair;
        var d = "M " + f.x0 + " " + y0 + " C " + c1 + " " + y0 + ", " + c2 + " " + y1 +
                ", " + f.x1 + " " + y1;
        var t = rampPosition(q.hold, holdLo, holdHi);
        mk(m, "path", { class: "mark" + (q.isRef ? " is-ref" : "") + (off ? " is-off" : ""),
                        d: d, "data-book": q.book, "data-ramp": q.isRef ? "" : t.toFixed(6),
                        style: "stroke:" + (q.isRef ? ACCENT : rampColour(t)) });
        if (cutL || cutR) {
          var px = cutL ? f.x0 : f.x1, py = cutL ? y0 : y1;
          var raw = cutL ? q.implied : q.fair;
          var up = raw > y.clamp(raw);
          var d0 = up ? 3 : -3;
          mk(m, "path", { class: "brk", "data-book": q.book,
                          d: "M " + (px - 7) + " " + (py + d0) + " L " + (px - 2) + " " + (py - d0) +
                             " L " + (px + 2) + " " + (py + d0) + " L " + (px + 7) + " " + (py - d0),
                          style: "stroke:" + MARGIN + ";stroke-width:1.6" });
          mk(m, "text", { class: "clip-val", "text-anchor": "start", x: px + 10,
                          y: py + (up ? -6 : 14), "data-book": q.book }, fmt(raw));
        }
        m.marks.push({ book: q.book, band: off ? "off_line" : "comparable", implied: q.implied,
                       fair: q.fair, y0: y0, y1: y1, clipped: cutL || cutR, isRef: q.isRef });
      });
      drawYScale(m, tickValues(y.dom), y, fmt, f.x0, f.x1, W - SCALE_X);
      return y;
    };
    var yA = place(top, b1, false);
    var yB = two ? place(bottom, b2, true) : null;
    mk(m, "text", { class: "band-label", x: 4, y: b1.top - 18 }, "Comparable");
    mk(m, "text", { class: "band-sub", x: 4, y: b1.top - 3 },
       c.referenceLine === null
         ? (c.matched ? c.referenceBook + " + " + c.matched + " books"
                      : c.referenceBook + " alone; no other book quotes this market")
         : (c.matched ? c.referenceBook + " + " + c.matched + " on " + c.referenceLine
                      : c.referenceBook + " alone, no book on " + c.referenceLine));
    if (two) {
      mk(m, "text", { class: "band-label", x: 4, y: b2.top - 18 }, "Off the line");
      mk(m, "text", { class: "band-warn", x: 4, y: b2.top - 3 },
         bottom.length + " book" + (bottom.length === 1 ? "" : "s") + " on " +
         c.offLines.join(", ") + ", a different bet, never compared (B6)");
    }
    mk(m, "text", { class: "ax-label", "text-anchor": "middle", x: f.x0, y: H - 26 }, "implied");
    mk(m, "text", { class: "ax-label", "text-anchor": "middle", x: f.x1, y: H - 26 }, "fair");
    mk(m, "text", { class: "excl-note", x: 4, y: H - 8 },
       c.exchanges
         ? c.exchanges + " exchange quote" + (c.exchanges === 1 ? "" : "s") +
           " excluded from both bands: a lay price is not a back price (B4)"
         : "no exchange quotes on this market");
    m.frame = f;
    m.scale = { comparable: yA ? { lo: yA.dom.lo, hi: yA.dom.hi, capHi: yA.capHi, capLo: yA.capLo,
                                   nOver: yA.nOver } : null,
                off_line: yB ? { lo: yB.dom.lo, hi: yB.dom.hi, capHi: yB.capHi, capLo: yB.capLo,
                                 nOver: yB.nOver } : null };
    return m;
  }

  function renderScatter(c, opts) {
    var W = opts.width || DEFAULT_W, H = opts.height || SOLO_H;
    var m = newModel(W, H, "scatter");
    var f = frameOf(W, H);
    var qs = c.points;
    var x = linear(qs.map(function (q) { return q.hold; }), f.x0, f.x1);
    var y = bookScale(qs.map(function (q) { return q.delta_pp; }), f.y1, f.y0, { zero: true });
    mk(m, "line", { class: "axis", x1: f.x0, y1: f.y1, x2: f.x1, y2: f.y1 });
    mk(m, "line", { class: "zero", x1: f.x0, y1: y(0), x2: f.x1, y2: y(0) });
    qs.forEach(function (q) {
      var cy = y(y.clamp(q.delta_pp));
      mk(m, "circle", { class: "dot mark-dot", cx: x(q.hold), cy: cy, r: 4, "data-book": q.book,
                        style: "fill:" + (q.isRef ? ACCENT : rampColour(rampPosition(q.hold, x.lo, x.hi))) });
      m.marks.push({ book: q.book, hold: q.hold, delta_pp: q.delta_pp, cx: x(q.hold), cy: cy,
                     clipped: y.clamp(q.delta_pp) !== q.delta_pp, isRef: q.isRef });
    });
    mk(m, "text", { class: "legend-k", x: 4, y: f.y0 + 12 }, "Hold vs deviation");
    mk(m, "text", { class: "legend-v", x: 4, y: f.y0 + 28 }, qs.length + " comparable books");
    mk(m, "text", { class: "ax-label", x: f.x0, y: H - 20 }, "hold %");
    drawYScale(m, tickValues(y.dom), y, FMT.signed2, f.x0, f.x1, W - SCALE_X);
    m.frame = f;
    m.scale = { lo: y.dom.lo, hi: y.dom.hi, capHi: y.capHi, capLo: y.capLo, nOver: y.nOver,
                xlo: x.lo, xhi: x.hi };
    return m;
  }

  function renderCurves(c, opts) {
    var W = opts.width || DEFAULT_W, H = opts.height || SOLO_H;
    var m = newModel(W, H, "curves");
    var f = frameOf(W, H);
    var ps = c.ps;
    var all = [];
    c.curves.forEach(function (cv) { cv.ys.forEach(function (v) { all.push(v); }); });
    var x = linear(ps, f.x0, f.x1);
    var ydom = niceDomain(Math.min.apply(null, all), Math.max.apply(null, all),
                          wantTicks(f.y1 - f.y0));
    var y = linearExact(ydom.lo, ydom.hi, f.y1, f.y0);
    mk(m, "line", { class: "zero", x1: f.x0, y1: y(0), x2: f.x1, y2: y(0) });
    mk(m, "line", { class: "axis", x1: f.x0, y1: f.y0 - 8, x2: f.x0, y2: f.y1 + 8 });
    c.curves.forEach(function (cv, i) {
      var d = "";
      ps.forEach(function (pp, j) { d += (j ? " L " : "M ") + x(pp) + " " + y(cv.ys[j]); });
      var hue = FAM_HUES[i % FAM_HUES.length];
      mk(m, "path", { class: "analytic-line", d: d, "data-method": cv.key, style: "stroke:" + hue });
      var ly = f.y0 + 8 + i * 16;
      mk(m, "line", { class: "analytic-line", x1: f.x0 + 8, y1: ly, x2: f.x0 + 26, y2: ly,
                      "data-swatch": cv.key, style: "stroke:" + hue });
      mk(m, "text", { class: "legend-k", x: f.x0 + 32, y: ly + 3.5 }, cv.label);
      mk(m, "text", { class: "note", x: f.x0 + 190, y: ly + 3.5 }, cv.note);
      m.marks.push({ method: cv.key, n: cv.ys.length, min: Math.min.apply(null, cv.ys),
                     max: Math.max.apply(null, cv.ys) });
    });
    [0.5, 1 / 3].forEach(function (g) {
      mk(m, "line", { class: "zero", x1: x(g), y1: f.y0 - 4, x2: x(g), y2: f.y1 + 4 });
      mk(m, "text", { class: "tick", "text-anchor": "middle", x: x(g), y: f.y1 + 18 },
         "p = " + (g === 0.5 ? "1/2" : "1/3"));
    });
    drawYScale(m, tickValues(ydom), y, FMT.num2, f.x0, f.x1, W - SCALE_X);
    mk(m, "text", { class: "ax-label", x: f.x0, y: H - 20 }, "probability");
    mk(m, "text", { class: "ax-label", "text-anchor": "end", x: f.x1, y: f.y0 - 8 },
       "BETA AT V = " + c.v);
    m.frame = f;
    m.scale = { lo: ydom.lo, hi: ydom.hi, step: ydom.step };
    return m;
  }

  /* ---------- dispatch ---------- */
  function render(c, opts) {
    opts = opts || {};
    if (!c || !c.ok) return { ok: false, error: c ? c.error : "no series" };
    var m;
    if (c.family === ChartSpec.FAM.BOOK) m = renderBook(c, opts);
    else if (c.form === "line") m = renderLine(c, opts);
    else if (c.form === "cells") m = renderCells(c, opts);
    else if (c.form === "slope") m = renderSlope(c, opts);
    else if (c.form === "scatter") m = renderScatter(c, opts);
    else if (c.form === "curves") m = renderCurves(c, opts);
    else throw new Error("unknown form: " + c.form);
    m.ok = true;
    m.series = c.key;
    m.form = c.form;
    m.title = (c.spec && c.spec.title) || c.label;
    m.meta = c.meta;
    return m;
  }

  /* ---------- serialisation ---------- */
  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  /* The class EVERY rule below is scoped to, and therefore the class BOTH serialisers must
   * put on the root. `toSvg` set it from the start; `mount` did not, so on the page the whole
   * stylesheet matched nothing: `.axis`, `.grid` and `.zero` resolved to `stroke: none`, every
   * text to `fill: rgb(0,0,0)` on a #121216 panel, and `.mark`/`.analytic-line` lost
   * `fill: none`, which filled each line path black. Measured in headless Chromium against the
   * bytes served from www.theclosingline.io; specs/nfl-capture-parameterization.md §F82. */
  var ROOT_CLASS = "tcl-chart";

  var STYLE =
    ".tcl-chart{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px}" +
    ".tcl-chart .axis{stroke:#2a2a32;stroke-width:1}" +
    ".tcl-chart .grid{stroke:#2a2a32;stroke-dasharray:2 4}" +
    ".tcl-chart .zero{stroke:#8a8a93;stroke-width:1}" +
    ".tcl-chart .tick,.tcl-chart .ax-label,.tcl-chart .legend-v,.tcl-chart .cap-note," +
    ".tcl-chart .note,.tcl-chart .band-sub,.tcl-chart .excl-note{fill:#8a8a93}" +
    ".tcl-chart .legend-k,.tcl-chart .band-label{fill:#e6e6ea;letter-spacing:.08em;" +
    "text-transform:uppercase}" +
    ".tcl-chart .ax-book{fill:#8a8a93;font-size:10px}" +
    ".tcl-chart .ax-book.is-ref{fill:#22d3ee}" +
    ".tcl-chart .clip-val{fill:#e6e6ea;font-size:10px}" +
    ".tcl-chart .band-warn{fill:#f59e0b}" +
    ".tcl-chart .link{stroke-width:2}" +
    ".tcl-chart .mark{fill:none;stroke-width:1.6}" +
    ".tcl-chart .analytic-line{fill:none;stroke-width:1.6}" +
    ".tcl-chart .brk{fill:none}" +
    ".tcl-chart .cell{stroke:none}";

  function toSvg(m) {
    if (!m || !m.ok) return "";
    var out = "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 " + m.width + " " +
              m.height + "\" width=\"100%\" class=\"" + ROOT_CLASS + "\" role=\"img\" data-series=\"" +
              esc(m.series) + "\"><title>" + esc(m.title) + "</title><style>" + STYLE + "</style>";
    m.elements.forEach(function (e) {
      out += "<" + e.tag;
      Object.keys(e.attrs).forEach(function (k) {
        out += " " + k + "=\"" + esc(e.attrs[k]) + "\"";
      });
      out += e.text === undefined ? "/>" : ">" + esc(e.text) + "</" + e.tag + ">";
    });
    return out + "</svg>";
  }

  /* DOM-bound by nature, and the one function here that is: the page hands in its document. */
  function mount(m, svg, doc) {
    var NS = "http://www.w3.org/2000/svg";
    while (svg.firstChild) svg.removeChild(svg.firstChild);
    svg.setAttribute("viewBox", "0 0 " + m.width + " " + m.height);
    svg.setAttribute("class", ROOT_CLASS);
    svg.setAttribute("data-series", m.series);
    var st = doc.createElementNS(NS, "style");
    st.textContent = STYLE;
    svg.appendChild(st);
    var t = doc.createElementNS(NS, "title");
    t.textContent = m.title;
    svg.appendChild(t);
    m.elements.forEach(function (e) {
      var el = doc.createElementNS(NS, e.tag);
      Object.keys(e.attrs).forEach(function (k) { el.setAttribute(k, e.attrs[k]); });
      if (e.text !== undefined) el.textContent = e.text;
      svg.appendChild(el);
    });
    return svg;
  }

  return {
    render: render,
    toSvg: toSvg,
    mount: mount,
    /* The scale rules, exposed so a test can derive expectations independently of a draw. */
    niceDomain: niceDomain,
    tickValues: tickValues,
    wantTicks: wantTicks,
    tailBound: tailBound,
    quantile: quantile,
    rampPosition: rampPosition,
    rampColour: rampColour,
    linear: linear,
    linearExact: linearExact,
    bookScale: bookScale,
    PAD_L: PAD_L,
    PAD_R: PAD_R,
    AXIS_MIN: AXIS_MIN,
    AXIS_MAX: AXIS_MAX,
    DEFAULT_W: DEFAULT_W
  };
})();

<script>
  const SUPABASE_URL     = "https://eddbffgqmqwebpcsaewj.supabase.co";
  const SUPABASE_KEY     = "sb_publishable_8Rp9NOSJPyKToxHQqFm4dQ_AlRRN81g";
