  }

  function everyQuote(board) {
    if (!board) return [];
    var head = board.reference ? [board.reference] : [];
    return head.concat(board.matched, board.off_line, board.exchanges, board.dropped);
  }
  function chartable(board) {
    if (!board) return [];
    return (board.reference ? [board.reference] : []).concat(board.matched);
  }
  function bucketOf(board, book) {
    if (!board) return null;
    if (board.reference && board.reference.book === book) return "reference";
    var named = ["matched", "off_line", "exchanges", "dropped"];
    for (var n = 0; n < named.length; n += 1) {
      var g = board[named[n]];
      for (var i = 0; i < g.length; i += 1) if (g[i].book === book) return named[n];
    }
    return null;
  }
  function comparable(board, book) {
    var k = bucketOf(board, book);
    return k === "reference" || k === "matched";
  }
  function quoteFor(board, book) {
    var all = everyQuote(board);
    for (var i = 0; i < all.length; i += 1) if (all[i].book === book) return all[i];
    return null;
  }

  /* ---------- polls: rows -> one group per bulk insert, newest first ---------- */
  function polls(rows) {
    var groups = {}, order = [];
    var sorted = (rows || []).filter(function (r) {
      return r && typeof r.captured_at === "string" && typeof r.region === "string";
    }).slice().sort(function (a, b) { return (a.id || 0) - (b.id || 0); });
    sorted.forEach(function (r) {
      var g = groups[r.captured_at];
      if (!g) {
        g = groups[r.captured_at] = {
          captured_at: r.captured_at, t: Date.parse(r.captured_at),
          rows: {}, ids: [], duplicates: [], poll: null
        };
        order.push(g);
      }
      if (g.rows[r.region]) { g.duplicates.push(r.region); return; }
      g.rows[r.region] = r;
      g.ids.push(r.id);
      if (g.poll === null && r.payload && r.payload.poll) g.poll = r.payload.poll;
    });
    order.sort(function (a, b) { return b.t - a.t; });
    return order;
  }

  function regionsOf(group) {
    return REGIONS.filter(function (r) { return !!group.rows[r]; });
  }

  /* ---------- the gate a row carries (R-CL11, R-CL13) ---------- */
  function gateOf(row) {
    var p = row && row.payload;
    if (!p || p.gate === undefined) return null;
    return p.gate;
  }

  /* Whether a row may be read as part of the board. `eu` rows are Pinnacle-gated by
   * construction (schema 1–2 had no `gate` field; schema 3 writes "pinnacle"). A `us` row is
   * usable only under the eu_events gate; one stored ungated (R-CL11) is excluded and the
   * exclusion is returned so it can be said. `us_ex` is exempt from the gate (R-CL3). */
  function usable(row) {
    if (!row || !row.payload) return { ok: false, reason: "no payload" };
    if (row.region === "eu") return { ok: true, reason: null };
    if (row.region === "us") {
      return row.payload.gate === GATE_EU_EVENTS
        ? { ok: true, reason: null }
        : { ok: false, reason: "stored_ungated" };
    }
    if (row.region === "us_ex") return { ok: true, reason: null };
    return { ok: false, reason: "unknown region " + row.region };
  }

  function pollNote(group) {
    return group.poll ? "; poll record " + JSON.stringify(group.poll) : "";
  }

  /* ---------- the registry ---------- */
  function bookPoints(board, valueOf, opts) {
    var out = [];
    everyQuote(board).forEach(function (q) {
      if (q.fair === null) return;
      var v = valueOf(q);
      out.push({
        book: q.book, y: v.y, y2: (v.y2 === undefined ? null : v.y2),
        withheld: v.withheld === true, isRef: !!board.reference && q.book === board.reference.book,
        isExchange: q.isExchange, hold: q.hold, fair: q.fair[0]
      });
    });
    return { unit: opts.unit, zero: opts.zero === true, fmt: opts.fmt, points: out };
  }

  function lineSeries(frames, valueOf, opts) {
    var byBookMap = {};
    frames.forEach(function (fr, i) {
      everyQuote(fr.board).forEach(function (q) {
        if (q.fair === null) return;
        var v = valueOf(q, fr, i);
        if (v === null || v === undefined || !isFinite(v)) return;
        (byBookMap[q.book] = byBookMap[q.book] || []).push({ i: i, y: v });
      });
    });
    var lines = [];
    for (var book in byBookMap) {
      if (byBookMap[book].length >= 2) lines.push({ book: book, points: byBookMap[book] });
    }
    return { unit: opts.unit, zero: opts.zero === true, fmt: opts.fmt, lines: lines,
             points: lines.reduce(function (a, ln) { return a.concat(ln.points); }, []) };
  }

  function aggregateSeries(frames, reduce, opts) {
    var pts = [];
    frames.forEach(function (fr, i) {
      var v = reduce(fr.board);
      if (v !== null && isFinite(v)) pts.push({ i: i, y: v });
    });
    return { unit: opts.unit, zero: opts.zero === true, fmt: opts.fmt,
             lines: pts.length >= 2 ? [{ book: opts.label, points: pts }] : [],
             points: pts };
  }

  var SERIES = [
    /* ---- BOOK: one mark per book, on the rank axis ---- */
    { key: "hold_strip", label: "hold by book", family: FAM.BOOK, form: "dot",
      quantity: "hold", unit: "%", axis: "book rank", fmt: "pct", needs: "quotes",
      note: "wide range makes a strip clearer than bars",
      compute: function (b) {
        return bookPoints(b, function (q) { return { y: q.hold }; }, { unit: "%", fmt: "pct" });
      } },
    { key: "fair_pi", label: "fair π", family: FAM.BOOK, form: "dot",
      quantity: "probability", unit: "%", axis: "book rank", fmt: "pct", needs: "quotes",
      note: "the devigged probability each book implies for side A",
      compute: function (b) {
        return bookPoints(b, function (q) { return { y: q.fair[0] }; }, { unit: "%", fmt: "pct" });
      } },
    { key: "delta_ref", label: "Δ vs reference", family: FAM.BOOK, form: "bar",
      quantity: "deviation", unit: "pp", axis: "book rank", fmt: "signed2", needs: "reference",
      note: "withheld where a comparison would cross a line (B6) or a lay price (B4)",
      compute: function (b) {
        return bookPoints(b, function (q) {
          var ok = comparable(b, q.book);
          return { y: ok ? q.delta_pp : 0, withheld: !ok };
        }, { unit: "pp", zero: true, fmt: "signed2" });
      } },
    { key: "overround", label: "overround", family: FAM.BOOK, form: "bar",
      quantity: "overround", unit: "×", axis: "book rank", fmt: "pctRaw", needs: "quotes",
      note: "the vig made physical rather than stated",
      compute: function (b) {
        return bookPoints(b, function (q) { return { y: q.overround - 1.0 }; },
                          { unit: "×", zero: true, fmt: "pctRaw" });
      } },
    { key: "dumbbell", label: "offered vs fair", family: FAM.BOOK, form: "dumbbell",
      quantity: "probability", unit: "%", axis: "book rank", fmt: "pct", needs: "quotes",
      note: "offered implied against devigged fair, per book",
      compute: function (b) {
        return bookPoints(b, function (q) { return { y: q.fair[0], y2: q.implied[0] }; },
                          { unit: "%", fmt: "pct" });
      } },
    { key: "beta", label: "β = v·γ per book", family: FAM.BOOK, form: "bar",
      quantity: "first-order bias", unit: "pp", axis: "book rank", fmt: "signed2", needs: "quotes",
      note: "Proposition 2, evaluated at each book's own hold and fair probability",
      compute: function (b) {
        return bookPoints(b, function (q) {
          return { y: Gamma.additive(q.fair[0], q.hold) * 100.0 };
        }, { unit: "pp", zero: true, fmt: "signed2" });
      } },

    /* ---- STANDALONE ---- */
    { key: "slope", label: "implied → fair", family: FAM.SOLO, form: "slope",
      quantity: "probability", unit: "pp", axis: "two-axis slope", fmt: "pct", needs: "reference",
      note: "the devig transform, working",
      compute: function (b) {
        var pick = function (q) {
          return { book: q.book, implied: q.implied[0], fair: q.fair[0], hold: q.hold,
                   line: q.line, isRef: !!b.reference && q.book === b.reference.book };
        };
        var lines = [];
        b.off_line.forEach(function (q) {
          var v = q.line === null ? "—" : String(q.line);
          if (lines.indexOf(v) === -1) lines.push(v);
        });
        return { unit: "%", fmt: "pct",
                 top: chartable(b).map(pick), bottom: b.off_line.map(pick),
                 offLines: lines, exchanges: b.exchanges.length,
                 referenceBook: b.referenceBook, referenceLine: b.referenceLine,
                 matched: b.matched.length };
      } },
    { key: "hold_dev", label: "hold vs deviation", family: FAM.SOLO, form: "scatter",
      quantity: "hold", unit: "%", axis: "hold", fmt: "signed2", needs: "reference",
      note: "asks whether margin predicts bias; the shape of the cloud is the content",
      compute: function (b) {
        return { unit: "pp", fmt: "signed2", zero: true,
                 points: chartable(b).map(function (q) {
                   return { book: q.book, hold: q.hold, delta_pp: q.delta_pp,
                            isRef: !!b.reference && q.book === b.reference.book };
                 }) };
      } },
    { key: "gamma", label: "γ(p) family", family: FAM.SOLO, form: "curves",
      quantity: "first-order bias", unit: "pp", axis: "probability", fmt: "num2", needs: "none",
      note: "Proposition 2; one curve per devig method, zero crossing at p = 1/n",
      compute: function () {
        var ps = [];
        for (var i = 1; i < 200; i += 1) ps.push(i / 200);
        return { unit: "β", fmt: "num2", v: GAMMA_V, ps: ps,
                 curves: Gamma.METHODS.map(function (m) {
                   return { key: m.key, label: m.label, note: m.note,
                            ys: ps.map(function (pp) { return m.fn(pp, GAMMA_V); }) };
                 }) };
      } },

    /* ---- TIME: one line per book, or one aggregate, across the polls held ---- */
    { key: "dispersion_t", label: "dispersion width", family: FAM.TIME, form: "line",
      quantity: "spread", unit: "pp", axis: "time", fmt: "signed2", needs: "quotes",
      note: "aggregates across books, so it moves when individuals do not",
      compute: function (frames) {
        return aggregateSeries(frames, function (b) {
          var qs = chartable(b);
          if (qs.length < 2) return null;
          var lo = Infinity, hi = -Infinity;
          qs.forEach(function (q) {
            if (q.fair[0] < lo) lo = q.fair[0];
            if (q.fair[0] > hi) hi = q.fair[0];
          });
          return (hi - lo) * 100.0;
        }, { unit: "pp", label: "dispersion", fmt: "signed2" });
      } },
    { key: "hold_t", label: "hold per book", family: FAM.TIME, form: "line",
      quantity: "hold", unit: "%", axis: "time", fmt: "pct", needs: "quotes",
      note: "the reference should sit flat and low; the contrast is the point",
      compute: function (frames) {
        return lineSeries(frames, function (q) { return q.hold; }, { unit: "%", fmt: "pct" });
      } },
    { key: "price_t", label: "price path per book", family: FAM.TIME, form: "line",
      quantity: "price", unit: "dec", axis: "time", fmt: "num3", needs: "quotes",
      note: "side A's offered decimal price, per book",
      compute: function (frames) {
        return lineSeries(frames, function (q) { return q.prices[0]; },
                          { unit: "dec", fmt: "num3" });
      } },
    { key: "dv", label: "Δv per interval", family: FAM.TIME, form: "line",
      quantity: "hold change", unit: "pp", axis: "time", fmt: "signed2", needs: "quotes",
      note: "the per-interval change in each book's hold",
      compute: function (frames) {
        var prev = {}, byBookMap = {};
        frames.forEach(function (fr, i) {
          everyQuote(fr.board).forEach(function (q) {
            if (q.fair === null) return;
            if (prev[q.book] !== undefined) {
              (byBookMap[q.book] = byBookMap[q.book] || []).push(
                { i: i, y: (q.hold - prev[q.book]) * 100.0 });
            }
            prev[q.book] = q.hold;
          });
        });
        var lines = [];
        for (var book in byBookMap) {
          if (byBookMap[book].length >= 2) lines.push({ book: book, points: byBookMap[book] });
        }
        return { unit: "pp", zero: true, fmt: "signed2", lines: lines,
                 points: lines.reduce(function (a, ln) { return a.concat(ln.points); }, []) };
      } },
    { key: "freshness", label: "freshness", family: FAM.TIME, form: "cells",
      quantity: "staleness", unit: "s", axis: "time", fmt: "secs", needs: "quotes",
      note: "books × time by last_update recency; busy even when prices are static",
      compute: function (frames) {
        var books = [], cells = [], worst = 1;
        frames.forEach(function (fr, i) {
          everyQuote(fr.board).forEach(function (q) {
            if (q.fair === null || !q.asof) return;
            if (books.indexOf(q.book) === -1) books.push(q.book);
            var age = (Date.parse(fr.at) - Date.parse(q.asof)) / 1000.0;
            if (!isFinite(age) || age < 0) return;
            if (age > worst) worst = age;
            cells.push({ book: q.book, i: i, age: age });
          });
        });
        books.sort();
        cells.forEach(function (c) { c.v = Math.min(c.age / worst, 1) * 0.85 + 0.05; });
        return { unit: "s", books: books, cells: cells, fmt: "secs", worst: worst,
                 points: cells.map(function (c) { return { i: c.i, y: c.age }; }) };
      } }
  ];

  function seriesOf(key) {
    for (var i = 0; i < SERIES.length; i += 1) if (SERIES[i].key === key) return SERIES[i];
    return null;
  }

  function seriesList() {
    return SERIES.map(function (sd) {
      return { key: sd.key, label: sd.label, family: sd.family, form: sd.form,
               quantity: sd.quantity, unit: sd.unit, axis: sd.axis, needs: sd.needs,
               note: sd.note };
    });
  }

  /* ---------- validation: fail closed ---------- */
  function isInt(v) { return typeof v === "number" && isFinite(v) && Math.floor(v) === v; }

  function validate(raw) {
    var errors = [];
    if (!raw || typeof raw !== "object" || Array.isArray(raw)) {
      return { ok: false, errors: ["spec must be an object"], spec: null };
    }
    Object.keys(raw).forEach(function (k) {
      if (SPEC_KEYS.indexOf(k) === -1) errors.push("unknown key: " + k);
    });
    var sd = typeof raw.series === "string" ? seriesOf(raw.series) : null;
    if (!sd) errors.push("unknown series: " + String(raw.series));
    var spec = { series: raw.series };
    if (sd && sd.needs !== "none") {
      if (REGIONS.indexOf(raw.region) === -1) errors.push("region must be one of " + REGIONS.join(", "));
      if (typeof raw.event !== "string" || !raw.event.length) errors.push("event must be an event id string");
      if (MARKETS.indexOf(raw.market) === -1) errors.push("market must be one of " + MARKETS.join(", "));
      spec.region = raw.region; spec.event = raw.event; spec.market = raw.market;
    } else if (sd) {
      ["region", "event", "market"].forEach(function (k) {
        if (raw[k] !== undefined) errors.push(sd.key + " takes no " + k);
      });
    }
    if (sd && sd.family === FAM.TIME) {
      if (raw.window === undefined) spec.window = WINDOW.dflt;
      else if (!isInt(raw.window) || raw.window < WINDOW.min || raw.window > WINDOW.max) {
        errors.push("window must be an integer in " + WINDOW.min + ".." + WINDOW.max);
      } else spec.window = raw.window;
    } else if (raw.window !== undefined) errors.push("window applies to time series only");
    if (sd && sd.family === FAM.BOOK) {
      if (raw.sort === undefined) spec.sort = "hold";
      else if (SORTS.indexOf(raw.sort) === -1) errors.push("sort must be one of " + SORTS.join(", "));
      else spec.sort = raw.sort;
    } else if (raw.sort !== undefined) errors.push("sort applies to book series only");
    if (raw.title !== undefined) {
      if (typeof raw.title !== "string" || raw.title.length > TITLE_MAX) {
        errors.push("title must be a string of at most " + TITLE_MAX + " characters");
      } else spec.title = raw.title;
    }
    return { ok: errors.length === 0, errors: errors, spec: errors.length === 0 ? spec : null };
  }

  /* ---------- compute ---------- */
  function meta(row, board, spec, group) {
    return {
      region: spec.region, event: board.event, market: spec.market,
      captured_at: group.captured_at, snapshot_id: row.id,
      region_seq: (typeof row.region_seq === "number") ? row.region_seq : null,
      schema: row.payload.schema, gate: gateOf(row),
      reference_book: board.referenceBook, reference_line: board.referenceLine,
      referenceless: board.referenceless === true,
      roles: board.roles, n_books: everyQuote(board).length,
      n_matched: board.matched.length, n_off_line: board.off_line.length,
      n_exchanges: board.exchanges.length, n_dropped: board.dropped.length,
      poll: group.poll
    };
  }

  function timeFrames(spec, pollList) {
    var frames = [];
    for (var i = 0; i < pollList.length && frames.length < spec.window; i += 1) {
      var row = pollList[i].rows[spec.region];
      if (!row || !usable(row).ok) continue;
      var b = panel(row, spec.event, spec.market);
      if (!b) continue;
      frames.push({ at: pollList[i].captured_at, id: row.id, board: b, group: pollList[i] });
    }
    frames.reverse();
    return frames;
  }

  /* A time series with NOTHING TO DRAW is refused, with the reason (F99). Two usable frames say the
   * panel existed twice; they do not say the series has a point. `dispersion_t` on `us_ex` is the case
   * that was measured: all five venues are exchanges, an exchange price is never compared (B4), so no
   * frame has two comparable books, and the series came back ok:true with 10 frames and no points —
   * a success whose summary was `lines: []`. Returns the reason, or null when something is drawn. */
  function nothingDrawn(sd, spec, frames, body) {
    var drawn = body.cells ? body.cells.length : body.lines.length;
    if (drawn) return null;
    var where = "region " + spec.region + ", event " + spec.event + ", " + spec.market + ", " +
      frames.length + " frames";
    if (sd.key === "dispersion_t") {
      var withTwo = 0, exchangesOnly = 0;
      frames.forEach(function (fr) {
        var n = chartable(fr.board).length;
        if (n >= 2) withTwo += 1;
        if (n === 0 && fr.board.exchanges.length) exchangesOnly += 1;
      });
      if (exchangesOnly === frames.length) {
        return "dispersion_t has nothing to compare (" + where + "): every quote is an exchange's, and " +
          "an exchange price is never compared with a book's (B4), so no frame has two comparable " +
          "books. read_board reports this panel as it is: n_matched 0";
      }
      return "dispersion_t needs two comparable books (the reference and the books on its line; " +
        "off-line books and exchanges are not compared, B6 and B4) in at least 2 frames, and " +
        withTwo + " had them (" + where + ")";
    }
    return sd.key + " has nothing to draw (" + where + "): no book has a usable quote in two frames";
  }

  function compute(raw, pollList) {
    var v = validate(raw);
    if (!v.ok) return { ok: false, error: v.errors.join("; ") };
    var spec = v.spec, sd = seriesOf(spec.series);
    var body;
    if (sd.needs === "none") {
      body = sd.compute();
      body.ok = true; body.spec = spec; body.key = sd.key; body.label = sd.label;
      body.family = sd.family; body.form = sd.form;
      body.meta = { series: sd.key };
      return body;
    }
    if (!pollList || !pollList.length) return { ok: false, error: "no polls held" };
    if (sd.family === FAM.TIME) {
      var frames = timeFrames(spec, pollList);
      if (frames.length < 2) {
        return { ok: false, error: "fewer than 2 usable frames for region " + spec.region +
                 ", event " + spec.event + ", " + spec.market + " in the last " + spec.window +
                 " polls (" + frames.length + " found)" };
      }
      body = sd.compute(frames);
      var nothing = nothingDrawn(sd, spec, frames, body);
      if (nothing) return { ok: false, error: nothing };
      body.ok = true; body.spec = spec; body.key = sd.key; body.label = sd.label;
      body.family = sd.family; body.form = sd.form;
      body.frames = frames.map(function (fr) { return { at: fr.at, id: fr.id }; });
      var last = frames[frames.length - 1];
      body.meta = meta(last.group.rows[spec.region], last.board, spec, last.group);
      body.meta.n_frames = frames.length;
      body.meta.window = spec.window;
      body.meta.first_at = frames[0].at;
      body.referenceBook = last.board.referenceBook;
      return body;
    }
    var g = pollList[0];
    var row = g.rows[spec.region];
    if (!row) {
      return { ok: false, error: "region " + spec.region + " is absent from the newest poll (" +
               g.captured_at + "; regions present: " + regionsOf(g).join(", ") + ")" + pollNote(g) };
    }
    var u = usable(row);
    if (!u.ok) {
      return { ok: false, error: "region " + spec.region + "'s newest row is " + u.reason +
               " and is excluded from the board (R-CL11)" + pollNote(g) };
    }
    var board = panel(row, spec.event, spec.market);
    if (!board) return { ok: false, error: noPanelReason(row, spec) };
    if (sd.needs === "reference" && !board.reference) {
      return { ok: false, error: sd.key + " needs a reference book and region " + spec.region +
               " carries none (reference_book is null; R-CL3)" };
    }
    body = sd.compute(board, spec);
    body.ok = true; body.spec = spec; body.key = sd.key; body.label = sd.label;
    body.family = sd.family; body.form = sd.form;
    body.referenceBook = board.referenceBook;
    body.meta = meta(row, board, spec, g);
    return body;
  }

  /* ---------- a compact summary of a computed series, for the model ---------- */
  function summary(c) {
    if (!c || !c.ok) return { ok: false, error: c ? c.error : "no series" };
    var s = { ok: true, series: c.key, family: c.family, form: c.form, unit: c.unit, meta: c.meta };
    if (c.family === FAM.BOOK) {
      var pts = c.points.slice().sort(function (a, b) { return a.y - b.y; });
      s.n = pts.length;
      s.withheld = pts.filter(function (p) { return p.withheld; }).length;
      s.values = c.points.map(function (p) {
        var v = { book: p.book, y: r4(p.y) };
        if (p.y2 !== null) v.y2 = r4(p.y2);
        if (p.withheld) v.withheld = true;
        if (p.isRef) v.reference = true;
        if (p.isExchange) v.exchange = true;
        return v;
      });
      var shown = pts.filter(function (p) { return !p.withheld; });
      if (shown.length) {
        s.min = { book: shown[0].book, y: r4(shown[0].y) };
        s.max = { book: shown[shown.length - 1].book, y: r4(shown[shown.length - 1].y) };
      }
      var ref = c.points.filter(function (p) { return p.isRef; })[0];
      if (ref) s.reference = { book: ref.book, y: r4(ref.y) };
    } else if (c.family === FAM.TIME) {
      s.n_frames = c.frames.length;
      s.first_at = c.frames[0].at; s.last_at = c.frames[c.frames.length - 1].at;
      if (c.lines) {
        s.lines = c.lines.map(function (ln) {
          var ys = ln.points.map(function (p) { return p.y; });
          var sum = 0; ys.forEach(function (y) { sum += y; });
          return { book: ln.book, n: ys.length, first: r4(ys[0]), last: r4(ys[ys.length - 1]),

    var f = { top: 4, bot: H - AXIS_MIN - 6 };
    var bandTop = f.top + 22, bandBot = f.bot - 10;
    var ys = c.points.map(function (p) { return p.y; });
    var domain = ys.slice();
    if (c.zero) domain.push(0);
    if (!domain.length) domain = [0];
    var dom = niceDomain(Math.min.apply(null, domain), Math.max.apply(null, domain),
                         wantTicks(bandBot - bandTop));
    var y = linearExact(dom.lo, dom.hi, bandBot, bandTop);
    var fmt = fmtOf(c.fmt);
    timeAxis(m, c, W, f);
    if (c.zero) mk(m, "line", { class: "zero", x1: PAD_L, x2: W - PAD_R, y1: y(0), y2: y(0) });
    mk(m, "text", { class: "legend-k", x: 4, y: f.top + 12 }, c.label);
    mk(m, "text", { class: "legend-v", x: 4, y: f.top + 28 },
       n + " polls" + (c.referenceBook ? " · ref " + c.referenceBook : ""));
    drawYScale(m, tickValues(dom), y, fmt, PAD_L, W - PAD_R, W - SCALE_X);
    var means = [], lo = Infinity, hi = -Infinity;
    c.lines.forEach(function (ln) {
      var sum = 0;
      ln.points.forEach(function (pt) { sum += pt.y; });
      var mean = sum / ln.points.length;
      means.push(mean);
      if (mean < lo) lo = mean;
      if (mean > hi) hi = mean;
    });
    c.lines.forEach(function (ln, k) {
      var d = "";
      ln.points.forEach(function (pt, i) {
        d += (i ? " L " : "M ") + xOfIndex(pt.i, n, W) + " " + y(pt.y);
      });
      var isRef = !!c.referenceBook && ln.book === c.referenceBook;
      var t = rampPosition(means[k], lo, hi);
      mk(m, "path", { class: "mark line", d: d, "data-book": ln.book,
                      "data-ramp": isRef ? "" : t.toFixed(6),
                      style: "stroke:" + (isRef ? ACCENT : rampColour(t)) });
      m.marks.push({ book: ln.book, n: ln.points.length, mean: means[k],
                     first: ln.points[0].y, last: ln.points[ln.points.length - 1].y,
                     isRef: isRef, ramp: isRef ? null : t });
    });
    if (!c.lines.length) {
      mk(m, "text", { class: "note", x: PAD_L, y: (bandTop + bandBot) / 2 },
         "no book has two points in this window");
    }
    m.frame = f;
    m.scale = { lo: dom.lo, hi: dom.hi, step: dom.step, ticks: tickValues(dom), zero: !!c.zero,
                bandTop: bandTop, bandBot: bandBot };
    return m;
  }

  function renderCells(c, opts) {
    var W = opts.width || DEFAULT_W;
    var books = c.books;
    var rowH = 14;
    var H = opts.height || (books.length * rowH + 20 + AXIS_MIN + 12);
    var m = newModel(W, H, "cells");
    var n = c.frames.length;
    var f = { top: 4, bot: H - AXIS_MIN - 6 };
    var cw = (W - PAD_L - PAD_R) / Math.max(n, 1);
    timeAxis(m, c, W, f);
    mk(m, "text", { class: "legend-k", x: 4, y: f.top + 12 }, c.label);
    books.forEach(function (b, r) {
      mk(m, "text", { class: "ax-book", "text-anchor": "end", x: PAD_L - 6,
                      y: f.top + 16 + r * rowH + rowH * 0.75, "data-book": b }, b);
    });
    c.cells.forEach(function (cell) {
      mk(m, "rect", { class: "cell", x: xOfIndex(cell.i, n, W) - cw / 2,
                      y: f.top + 16 + books.indexOf(cell.book) * rowH, width: cw + 0.5,
                      height: rowH + 0.5, "data-book": cell.book,
                      style: "fill:" + MARGIN + ";fill-opacity:" + cell.v.toFixed(4) });
      m.marks.push({ book: cell.book, i: cell.i, age: cell.age, v: cell.v });
    });
    m.frame = f; m.rows = books.slice();
    return m;
  }

  /* ---------- standalone panels ---------- */
  function frameOf(W, H) {
    return { x0: PAD_L, x1: W - PAD_R, y0: 34, y1: H - AXIS_MIN - 22 };
  }

  function renderSlope(c, opts) {
    var W = opts.width || DEFAULT_W, H = opts.height || SOLO_H;
    var m = newModel(W, H, "slope");
    var f = frameOf(W, H);
    var top = c.top, bottom = c.bottom;
    var two = bottom.length > 0;
    var bandH = two ? (f.y1 - f.y0 - 54) / 2 : (f.y1 - f.y0);
    var b1 = { top: f.y0, bot: f.y0 + bandH };
    var b2 = { top: f.y0 + bandH + 54, bot: f.y1 };
    var holdLo = Infinity, holdHi = -Infinity;
    top.concat(bottom).forEach(function (q) {
      if (q.hold < holdLo) holdLo = q.hold;
      if (q.hold > holdHi) holdHi = q.hold;
    });
    var fmt = FMT.pct;
    var place = function (quotes, band, off) {
      if (!quotes.length) return null;
      var vals = [];
      quotes.forEach(function (q) { vals.push(q.implied, q.fair); });
      var y = bookScale(vals, band.bot, band.top);
      mk(m, "line", { class: "axis", x1: f.x0, y1: band.top - 10, x2: f.x0, y2: band.bot + 10 });
      mk(m, "line", { class: "axis", x1: f.x1, y1: band.top - 10, x2: f.x1, y2: band.bot + 10 });
      var c1 = f.x0 + (f.x1 - f.x0) * 0.42, c2 = f.x0 + (f.x1 - f.x0) * 0.58;
      quotes.forEach(function (q) {
        var y0 = y(y.clamp(q.implied)), y1 = y(y.clamp(q.fair));
        var cutL = y.clamp(q.implied) !== q.implied;
        var cutR = y.clamp(q.fair) !== q.fair;
        var d = "M " + f.x0 + " " + y0 + " C " + c1 + " " + y0 + ", " + c2 + " " + y1 +
                ", " + f.x1 + " " + y1;
        var t = rampPosition(q.hold, holdLo, holdHi);
        mk(m, "path", { class: "mark" + (q.isRef ? " is-ref" : "") + (off ? " is-off" : ""),
                        d: d, "data-book": q.book, "data-ramp": q.isRef ? "" : t.toFixed(6),
                        style: "stroke:" + (q.isRef ? ACCENT : rampColour(t)) });
        if (cutL || cutR) {
          var px = cutL ? f.x0 : f.x1, py = cutL ? y0 : y1;
          var raw = cutL ? q.implied : q.fair;
          var up = raw > y.clamp(raw);
          var d0 = up ? 3 : -3;
          mk(m, "path", { class: "brk", "data-book": q.book,
                          d: "M " + (px - 7) + " " + (py + d0) + " L " + (px - 2) + " " + (py - d0) +
                             " L " + (px + 2) + " " + (py + d0) + " L " + (px + 7) + " " + (py - d0),
                          style: "stroke:" + MARGIN + ";stroke-width:1.6" });
          mk(m, "text", { class: "clip-val", "text-anchor": "start", x: px + 10,
                          y: py + (up ? -6 : 14), "data-book": q.book }, fmt(raw));
        }
        m.marks.push({ book: q.book, band: off ? "off_line" : "comparable", implied: q.implied,
                       fair: q.fair, y0: y0, y1: y1, clipped: cutL || cutR, isRef: q.isRef });
      });
      drawYScale(m, tickValues(y.dom), y, fmt, f.x0, f.x1, W - SCALE_X);
      return y;
    };
    var yA = place(top, b1, false);
    var yB = two ? place(bottom, b2, true) : null;
    mk(m, "text", { class: "band-label", x: 4, y: b1.top - 18 }, "Comparable");
    mk(m, "text", { class: "band-sub", x: 4, y: b1.top - 3 },
       c.referenceLine === null
         ? (c.matched ? c.referenceBook + " + " + c.matched + " books"
                      : c.referenceBook + " alone; no other book quotes this market")
         : (c.matched ? c.referenceBook + " + " + c.matched + " on " + c.referenceLine
                      : c.referenceBook + " alone, no book on " + c.referenceLine));
    if (two) {
      mk(m, "text", { class: "band-label", x: 4, y: b2.top - 18 }, "Off the line");
      mk(m, "text", { class: "band-warn", x: 4, y: b2.top - 3 },
         bottom.length + " book" + (bottom.length === 1 ? "" : "s") + " on " +
         c.offLines.join(", ") + ", a different bet, never compared (B6)");
    }
    mk(m, "text", { class: "ax-label", "text-anchor": "middle", x: f.x0, y: H - 26 }, "implied");
    mk(m, "text", { class: "ax-label", "text-anchor": "middle", x: f.x1, y: H - 26 }, "fair");
    mk(m, "text", { class: "excl-note", x: 4, y: H - 8 },
       c.exchanges
         ? c.exchanges + " exchange quote" + (c.exchanges === 1 ? "" : "s") +
           " excluded from both bands: a lay price is not a back price (B4)"
         : "no exchange quotes on this market");
    m.frame = f;
    m.scale = { comparable: yA ? { lo: yA.dom.lo, hi: yA.dom.hi, capHi: yA.capHi, capLo: yA.capLo,
                                   nOver: yA.nOver } : null,
                off_line: yB ? { lo: yB.dom.lo, hi: yB.dom.hi, capHi: yB.capHi, capLo: yB.capLo,
                                 nOver: yB.nOver } : null };
    return m;
  }

  function renderScatter(c, opts) {
    var W = opts.width || DEFAULT_W, H = opts.height || SOLO_H;
    var m = newModel(W, H, "scatter");
    var f = frameOf(W, H);
    var qs = c.points;
    var x = linear(qs.map(function (q) { return q.hold; }), f.x0, f.x1);
    var y = bookScale(qs.map(function (q) { return q.delta_pp; }), f.y1, f.y0, { zero: true });
    mk(m, "line", { class: "axis", x1: f.x0, y1: f.y1, x2: f.x1, y2: f.y1 });
    mk(m, "line", { class: "zero", x1: f.x0, y1: y(0), x2: f.x1, y2: y(0) });
    qs.forEach(function (q) {
      var cy = y(y.clamp(q.delta_pp));
      mk(m, "circle", { class: "dot mark-dot", cx: x(q.hold), cy: cy, r: 4, "data-book": q.book,
                        style: "fill:" + (q.isRef ? ACCENT : rampColour(rampPosition(q.hold, x.lo, x.hi))) });
      m.marks.push({ book: q.book, hold: q.hold, delta_pp: q.delta_pp, cx: x(q.hold), cy: cy,
                     clipped: y.clamp(q.delta_pp) !== q.delta_pp, isRef: q.isRef });
    });
    mk(m, "text", { class: "legend-k", x: 4, y: f.y0 + 12 }, "Hold vs deviation");
    mk(m, "text", { class: "legend-v", x: 4, y: f.y0 + 28 }, qs.length + " comparable books");
    mk(m, "text", { class: "ax-label", x: f.x0, y: H - 20 }, "hold %");
    drawYScale(m, tickValues(y.dom), y, FMT.signed2, f.x0, f.x1, W - SCALE_X);
    m.frame = f;
    m.scale = { lo: y.dom.lo, hi: y.dom.hi, capHi: y.capHi, capLo: y.capLo, nOver: y.nOver,
                xlo: x.lo, xhi: x.hi };
    return m;
  }

  function renderCurves(c, opts) {
    var W = opts.width || DEFAULT_W, H = opts.height || SOLO_H;
    var m = newModel(W, H, "curves");
    var f = frameOf(W, H);
    var ps = c.ps;
    var all = [];
    c.curves.forEach(function (cv) { cv.ys.forEach(function (v) { all.push(v); }); });
    var x = linear(ps, f.x0, f.x1);
    var ydom = niceDomain(Math.min.apply(null, all), Math.max.apply(null, all),
                          wantTicks(f.y1 - f.y0));
    var y = linearExact(ydom.lo, ydom.hi, f.y1, f.y0);
    mk(m, "line", { class: "zero", x1: f.x0, y1: y(0), x2: f.x1, y2: y(0) });
    mk(m, "line", { class: "axis", x1: f.x0, y1: f.y0 - 8, x2: f.x0, y2: f.y1 + 8 });
    c.curves.forEach(function (cv, i) {
      var d = "";
      ps.forEach(function (pp, j) { d += (j ? " L " : "M ") + x(pp) + " " + y(cv.ys[j]); });
      var hue = FAM_HUES[i % FAM_HUES.length];
      mk(m, "path", { class: "analytic-line", d: d, "data-method": cv.key, style: "stroke:" + hue });
      var ly = f.y0 + 8 + i * 16;
      mk(m, "line", { class: "analytic-line", x1: f.x0 + 8, y1: ly, x2: f.x0 + 26, y2: ly,
                      "data-swatch": cv.key, style: "stroke:" + hue });
      mk(m, "text", { class: "legend-k", x: f.x0 + 32, y: ly + 3.5 }, cv.label);
      mk(m, "text", { class: "note", x: f.x0 + 190, y: ly + 3.5 }, cv.note);
      m.marks.push({ method: cv.key, n: cv.ys.length, min: Math.min.apply(null, cv.ys),
                     max: Math.max.apply(null, cv.ys) });
    });
    [0.5, 1 / 3].forEach(function (g) {
      mk(m, "line", { class: "zero", x1: x(g), y1: f.y0 - 4, x2: x(g), y2: f.y1 + 4 });
      mk(m, "text", { class: "tick", "text-anchor": "middle", x: x(g), y: f.y1 + 18 },
         "p = " + (g === 0.5 ? "1/2" : "1/3"));
    });
    drawYScale(m, tickValues(ydom), y, FMT.num2, f.x0, f.x1, W - SCALE_X);
    mk(m, "text", { class: "ax-label", x: f.x0, y: H - 20 }, "probability");
    mk(m, "text", { class: "ax-label", "text-anchor": "end", x: f.x1, y: f.y0 - 8 },
       "BETA AT V = " + c.v);
    m.frame = f;
    m.scale = { lo: ydom.lo, hi: ydom.hi, step: ydom.step };
    return m;
  }

  /* ---------- dispatch ---------- */
  function render(c, opts) {
    opts = opts || {};
    if (!c || !c.ok) return { ok: false, error: c ? c.error : "no series" };
    var m;
    if (c.family === ChartSpec.FAM.BOOK) m = renderBook(c, opts);
    else if (c.form === "line") m = renderLine(c, opts);
    else if (c.form === "cells") m = renderCells(c, opts);
    else if (c.form === "slope") m = renderSlope(c, opts);
    else if (c.form === "scatter") m = renderScatter(c, opts);
    else if (c.form === "curves") m = renderCurves(c, opts);
    else throw new Error("unknown form: " + c.form);
    m.ok = true;
    m.series = c.key;
    m.form = c.form;
    m.title = (c.spec && c.spec.title) || c.label;
    m.meta = c.meta;
    return m;
  }

  /* ---------- serialisation ---------- */
  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  /* The class EVERY rule below is scoped to, and therefore the class BOTH serialisers must
   * put on the root. `toSvg` set it from the start; `mount` did not, so on the page the whole
   * stylesheet matched nothing: `.axis`, `.grid` and `.zero` resolved to `stroke: none`, every
   * text to `fill: rgb(0,0,0)` on a #121216 panel, and `.mark`/`.analytic-line` lost
   * `fill: none`, which filled each line path black. Measured in headless Chromium against the
   * bytes served from www.theclosingline.io; specs/nfl-capture-parameterization.md §F82. */
  var ROOT_CLASS = "tcl-chart";

  var STYLE =
    ".tcl-chart{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px}" +
    ".tcl-chart .axis{stroke:#2a2a32;stroke-width:1}" +
    ".tcl-chart .grid{stroke:#2a2a32;stroke-dasharray:2 4}" +
    ".tcl-chart .zero{stroke:#8a8a93;stroke-width:1}" +
    ".tcl-chart .tick,.tcl-chart .ax-label,.tcl-chart .legend-v,.tcl-chart .cap-note," +
    ".tcl-chart .note,.tcl-chart .band-sub,.tcl-chart .excl-note{fill:#8a8a93}" +
    ".tcl-chart .legend-k,.tcl-chart .band-label{fill:#e6e6ea;letter-spacing:.08em;" +
    "text-transform:uppercase}" +
    ".tcl-chart .ax-book{fill:#8a8a93;font-size:10px}" +
    ".tcl-chart .ax-book.is-ref{fill:#22d3ee}" +
    ".tcl-chart .clip-val{fill:#e6e6ea;font-size:10px}" +
    ".tcl-chart .band-warn{fill:#f59e0b}" +
    ".tcl-chart .link{stroke-width:2}" +
    ".tcl-chart .mark{fill:none;stroke-width:1.6}" +
    ".tcl-chart .analytic-line{fill:none;stroke-width:1.6}" +
    ".tcl-chart .brk{fill:none}" +
    ".tcl-chart .cell{stroke:none}";

  function toSvg(m) {
    if (!m || !m.ok) return "";
    var out = "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 " + m.width + " " +
              m.height + "\" width=\"100%\" class=\"" + ROOT_CLASS + "\" role=\"img\" data-series=\"" +
              esc(m.series) + "\"><title>" + esc(m.title) + "</title><style>" + STYLE + "</style>";
    m.elements.forEach(function (e) {
      out += "<" + e.tag;
      Object.keys(e.attrs).forEach(function (k) {
        out += " " + k + "=\"" + esc(e.attrs[k]) + "\"";
      });
      out += e.text === undefined ? "/>" : ">" + esc(e.text) + "</" + e.tag + ">";
    });
    return out + "</svg>";
  }

  /* DOM-bound by nature, and the one function here that is: the page hands in its document. */
  function mount(m, svg, doc) {
    var NS = "http://www.w3.org/2000/svg";
    while (svg.firstChild) svg.removeChild(svg.firstChild);
    svg.setAttribute("viewBox", "0 0 " + m.width + " " + m.height);
    svg.setAttribute("class", ROOT_CLASS);
    svg.setAttribute("data-series", m.series);
    var st = doc.createElementNS(NS, "style");
    st.textContent = STYLE;
    svg.appendChild(st);
    var t = doc.createElementNS(NS, "title");
    t.textContent = m.title;
    svg.appendChild(t);
    m.elements.forEach(function (e) {
      var el = doc.createElementNS(NS, e.tag);
      Object.keys(e.attrs).forEach(function (k) { el.setAttribute(k, e.attrs[k]); });
      if (e.text !== undefined) el.textContent = e.text;
      svg.appendChild(el);
    });
    return svg;
  }

  return {
    render: render,
    toSvg: toSvg,
    mount: mount,
    /* The scale rules, exposed so a test can derive expectations independently of a draw. */
    niceDomain: niceDomain,
    tickValues: tickValues,
    wantTicks: wantTicks,
    tailBound: tailBound,
    quantile: quantile,
    rampPosition: rampPosition,
    rampColour: rampColour,
    linear: linear,
    linearExact: linearExact,
    bookScale: bookScale,
    PAD_L: PAD_L,
    PAD_R: PAD_R,
    AXIS_MIN: AXIS_MIN,
    AXIS_MAX: AXIS_MAX,
    DEFAULT_W: DEFAULT_W
  };
})();

</script>
<script>
/* realdata/closingline/run_card.js, inlined verbatim: what a run's record says, and the left column's
 * grouping, with no DOM in them. Proven by tests/realdata/closingline/run_card.test.mjs, which evaluates
 * the file's own bytes and holds its words to the workspace page's. */
/* The Closing Line — what a run's record says, with no DOM in it.
 *
 * specs/conversation-readers.md §3. The terminal draws a run's result where the run happened, from the
 * owner's own read of api.thread_runs (023), whose `record` is api.run_record's answer (018, 021). This
 * file turns one record into the words and the geometry of its card. It reads nothing and draws nothing:
 * tests/realdata/closingline/run_card.test.mjs evaluates these bytes with no browser.
 *
 * THE WORDS ARE THE WORKSPACE PAGE'S. STATUS_TEXT, SCORE_CLASSES, SCORE_NAMES and SCORE_DIRECTIONS are
 * the constants of templates/investigations.html, and the test compares the two files, so the same run
 * cannot read differently on the two pages.
 *
 * NEVER A FIGURE WITHOUT ITS CLASS AND DISCLOSURE (specs/run-score.md §6): `describe` returns a score
 * only when the whole score is readable, and then the class, the disclosure and the figures come out
 * together. An unreadable score gives no figure at all.
 */
var TclRun = (function () {
  "use strict";

  var UUID = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
  var STATUSES = ["pending", "completed", "refused", "not_evaluated", "lost"];
  var STATUS_TEXT = {
    pending: ["Pending", "The run has started. Its result is not recorded yet; this page checks again."],
    completed: ["Completed", "The evaluation finished and its outcome is recorded. A provisional run supports no decision."],
    refused: ["Refused", "The evaluation was refused, so nothing was compared. The reason is not shown here."],
    not_evaluated: ["Not evaluated", "The run stopped before a comparison was completed, so nothing was compared."],
    lost: ["Lost", "No outcome was recorded before the run's deadline, so nothing was compared."]
  };
  var SCORE_KEYS = ["baseline_mean", "candidate_mean", "difference_hi", "difference_lo", "difference_mean", "direction",
    "disclosure", "evidence_class", "n_events", "n_rows", "name"];
  var SCORE_CLASSES = { synthetic_backtest: "Synthetic backtest", historical_backtest: "Historical backtest" };
  var SCORE_NAMES = {
    log: "Mean log score on the final test rows. Lower is better.",
    brier: "Mean Brier score on the final test rows. Lower is better."
  };
  var SCORE_DIRECTIONS = {
    candidate_lower: "Your model scored lower (better) and the interval excludes zero.",
    baseline_lower: "The baseline scored lower (better) and the interval excludes zero.",
    interval_spans_zero: "The interval includes zero, so these rows do not separate them."
  };
  var UNREADABLE = "Completed. The score could not be read, so none is shown.";
  /* The two figures' names, and the sentences around the difference and the counts: the workspace page's own
   * words (its renderScore), which the test reads out of that page. */
  var LABELS = { candidate: "Your model", baseline: "Market-only baseline" };
  var DIFFERENCE = ["Difference (yours minus baseline): ", ", interval ", " to ", " (mean plus or minus 1.96 standard errors, clustered by event)"];
  var COUNTS = ["Computed on ", " rows from ", " events."];
  /* A pending run this page has stopped reading. The workspace has no such sentence: it never stops. */
  var PENDING_GAVE_UP = "The run has started. Its result is not recorded yet. Reopen this conversation to check again.";
  /* Why nothing was compared, for a run whose record carries a stored reason (api.run_record's `reason_code`,
   * migration 024; specs/run-results.md section 4). A CLOSED table, status then code. A code that is not here,
   * a record with no reason_code (a database before 024) and every other status say nothing, and the card keeps
   * the sentence it has today. No sentence holds a figure. */
  var REASON_TEXT = {
    refused: {
      unknown_feature: "The evaluation was refused: the model names a feature this evaluation's data does not have. Nothing was compared.",
      feature_available_after_reference: "The evaluation was refused: the model uses a feature whose value was only available after the moment it predicts. Nothing was compared.",

 * They do not settle DS-F34's failure taxonomy. `unclassified` is the explicit escape valve for a refusal
 * nobody typed — an honest absence of a class, never an inferred one. An OPERATIONAL failure is the
 * platform failing to run the tool (R-PV5: a timeout or execution error is operational); it is never a
 * refusal class, and nothing converts one into the other. Neither is ever read from an error's text. */
const OUTCOME = Symbol.for("tcl.turn-record.outcome");
const RESOLUTIONS = Symbol.for("tcl.turn-record.resolutions");
const QUANTITY = Symbol.for("tcl.turn-record.quantity");
const QUANTITY_TAG = "stat_prims.quantity/1";

const REFUSAL_CLASSES = Object.freeze(["invalid_input", "not_loaded", "no_match", "ambiguous", "insufficient_data",
                                              "rule", "integrity", "unsupported", "unclassified"]);
const OPERATIONAL_CODES = Object.freeze(["store_error", "count_unreadable", "reader_not_configured", "transport_timeout",
                                                "transport_error", "malformed_response", "response_too_large", "contract_violation",
                                                "database_timeout", "database_error", "exception"]);
const RESOLUTION_OUTCOMES = Object.freeze(["resolved", "no_match", "ambiguous", "refused_form"]);
const ENTITY_KINDS = Object.freeze(["team", "player", "game"]);
const RESOLUTION_CANDIDATES_MAX = 10;
const CODE_RE = /^[a-z][a-z0-9_]{1,63}$/;
const PG_CODE_RE = /^(?:[0-9A-Z]{5}|PGRST[0-9]{3})$/;

/* A JSON value in the strict sense a record can hold: null, a string, a boolean, a finite number, or a
 * plain array or object of them. No symbol, accessor, cycle or class instance. */
function isJsonValue(v, depth) {
  const d = depth || 0;
  if (d > 16) return false;
  if (v === null || typeof v === "string" || typeof v === "boolean") return true;
  if (typeof v === "number") return isFinite(v);
  if (typeof v !== "object") return false;
  const proto = Object.getPrototypeOf(v);
  if (Array.isArray(v)) return proto === Array.prototype && v.every((x) => isJsonValue(x, d + 1));
  if (proto !== Object.prototype || Object.getOwnPropertySymbols(v).length) return false;
  return Object.keys(v).every((k) => {
    const p = Object.getOwnPropertyDescriptor(v, k);
    return Object.prototype.hasOwnProperty.call(p, "value") && isJsonValue(p.value, d + 1);
  });
}
const jsonCopy = (v) => JSON.parse(JSON.stringify(v));

/* The typed fourth argument of refuse(): { refusal_class, code }. */
function refusedOutcome(typed) {
  const t = typed || {};
  if (REFUSAL_CLASSES.indexOf(t.refusal_class) === -1) {
    throw new ShapeError("a typed refusal's class must be one of " + REFUSAL_CLASSES.join(", ") + ", got " + String(t.refusal_class));
  }
  if (typeof t.code !== "string" || !CODE_RE.test(t.code)) throw new ShapeError("a typed refusal's code must match " + String(CODE_RE) + ", got " + String(t.code));
  return Object.freeze({ outcome: "refused", refusal_class: t.refusal_class, code: t.code });
}

/* A failure's HTTP status as a typed field, or null when it carries none a record can hold. */
function httpStatusOf(v) { return Number.isInteger(v) && v >= 100 && v <= 599 ? v : null; }
/* A failure's PostgreSQL SQLSTATE or PostgREST code as a typed field, or null. */
function pgCodeOf(v) { return typeof v === "string" && PG_CODE_RE.test(v) ? v : null; }

function operationalOutcome(op) {
  const o = op || {};
  if (OPERATIONAL_CODES.indexOf(o.code) === -1) throw new ShapeError("an operational code must be one of " + OPERATIONAL_CODES.join(", ") + ", got " + String(o.code));
  const status = o.http_status === undefined ? null : o.http_status;
  if (status !== null && !(Number.isInteger(status) && status >= 100 && status <= 599)) throw new ShapeError("http_status must be an HTTP status or null, got " + String(status));
  const pg = o.pg_code === undefined ? null : o.pg_code;
  if (pg !== null && !(typeof pg === "string" && PG_CODE_RE.test(pg))) throw new ShapeError("pg_code must be a PostgreSQL or PostgREST code or null, got " + String(pg));
  return Object.freeze({ outcome: "operational_failure", code: o.code, http_status: status, pg_code: pg });
}

/* ---------- markers ---------- */

/* One value with its n. `value` is a finite number, or null WITH the reason it is absent (§2.5: absence
 * has two values; a zero denominator is not_applicable, never 0). Extra fields ride along untouched. */
function quantity(q) {
  const o = q || {};
  if (!isText(o.name)) throw new ShapeError("a quantity needs a name");
  if (!isText(o.unit)) throw new ShapeError(o.name + ": a quantity needs a unit");
  if (!isCount(o.n)) throw new ShapeError(o.name + ": n must be a non-negative integer, got " + String(o.n));
  if (N_SORTS.indexOf(o.n_sort) === -1) throw new ShapeError(o.name + ": n_sort must be one of " + N_SORTS.join(", "));
  if (!isText(o.n_rule)) throw new ShapeError(o.name + ": a quantity says which rule produced its n");
  const out = Object.assign({}, o);
  if (o.value === null || o.value === undefined) {
    if (ABSENCES.indexOf(o.absent) === -1) throw new ShapeError(o.name + ": a null value says which absence it is: " + ABSENCES.join(" or "));
    if (!isText(o.reason)) throw new ShapeError(o.name + ": an absent value gives its reason");
    out.value = null;
  } else {
    if (typeof o.value !== "number" || !isFinite(o.value)) throw new ShapeError(o.name + ": value must be a finite number or null");
    if (o.absent !== undefined) throw new ShapeError(o.name + ": a present value is not absent");
    out.value = r4(o.value);
  }
  /* The tag says platform code built this quantity. It is a symbol, so the visible shape is unchanged; a
   * figure in prose, or a copy made through JSON, carries none. */
  out[QUANTITY] = QUANTITY_TAG;
  return out;
}

/* The marker a TABLE of per-row values carries once, instead of on every row: what one row's n is. */
function table(rows, marker) {
  const m = marker || {};
  if (!Array.isArray(rows)) throw new ShapeError("a table needs rows");
  if (!isText(m.n_per_row)) throw new ShapeError("a table says what one row's n is");
  if (N_SORTS.indexOf(m.n_sort) === -1) throw new ShapeError("a table's n_sort must be one of " + N_SORTS.join(", "));
  if (!isText(m.n_rule)) throw new ShapeError("a table says which rule produced its rows' n");
  return { rows, rows_marker: { n_per_row: m.n_per_row, n_sort: m.n_sort, n_rule: m.n_rule } };
}

/* A tool's success. `spec` is the validated input a page would recompute from; `read` is what was read;
 * `cannot_establish` is never empty — a tool is defined by its refusals as much as its computation. */
function result(tool, body) {
  const b = body || {};
  if (!isText(tool)) throw new ShapeError("a result names its tool");
  if (!b.spec || typeof b.spec !== "object") throw new ShapeError(tool + ": a result carries the spec it was computed from");
  if (!b.read || typeof b.read !== "object" || !Object.keys(b.read).length) throw new ShapeError(tool + ": a result says what was read");
  if (!Array.isArray(b.cannot_establish) || !b.cannot_establish.length || !b.cannot_establish.every(isText)) {
    throw new ShapeError(tool + ": a result says what it cannot establish");
  }
  const hasQuantities = Array.isArray(b.quantities) && b.quantities.length > 0;
  const hasRows = Array.isArray(b.rows);
  if (!hasQuantities && !hasRows) throw new ShapeError(tool + ": a result carries quantities or a table");
  if (hasQuantities) b.quantities.forEach((q) => { if (!q || N_SORTS.indexOf(q.n_sort) === -1) throw new ShapeError(tool + ": every quantity is built by quantity()"); });
  if (hasRows && !b.rows_marker) throw new ShapeError(tool + ": a table is built by table()");
  if (!b.series || typeof b.series !== "object" || !isText(b.series.family)) throw new ShapeError(tool + ": a result carries a series body a chart could take");
  return Object.assign({ ok: true, tool }, b);
}

/* A tool's refusal: the reason the model repeats. Extra fields (coverage, candidates) ride along.
 *
 * `typed` is { refusal_class, code }, set by the SITE that refuses, from what that site knows — never
 * from the words of `error`. Absent, the refusal is recorded `unclassified`. Passed, it must be valid:
 * an explicit `undefined` from a table that lacks a key throws rather than reading as unclassified.
 * The bytes returned are the bytes the three-argument form returned. */
function refuse(tool, error, extra, typed) {
  if (!isText(tool) || !isText(error)) throw new ShapeError("a refusal names its tool and gives its reason");
  const outcome = arguments.length < 4 ? Object.freeze({ outcome: "refused", refusal_class: "unclassified", code: null }) : refusedOutcome(typed);
  const out = Object.assign({ ok: false, tool, error }, extra || {});
  out[OUTCOME] = outcome;
  return out;
}

/* The platform failed to run the tool: a store error, an unreadable count, a transport failure, a reader
 * that is not configured. Same bytes as a refusal — the model is told the same way it always was — and a
 * different outcome, which no reader may turn into a finding about the world.
 * `op` is { code, http_status?, pg_code? }, each from a TYPED field of the failure. */
function operational(tool, error, extra, op) {
  if (!isText(tool) || !isText(error)) throw new ShapeError("an operational failure names its tool and gives its reason");
  const outcome = operationalOutcome(op);
  const out = Object.assign({ ok: false, tool, error }, extra || {});
  out[OUTCOME] = outcome;
  return out;
}

/* A wrapper that states an inner refusal in its own words ("side a: ...") KEEPS the inner's outcome and
 * resolutions: the class is the inner site's, not re-derived here. Same bytes as refuse(tool, error, extra). */
function restate(inner, tool, error, extra) {
  const o = inner && inner[OUTCOME];
  if (!o) throw new ShapeError("restate: the inner result carries no outcome marker");
  let out;
  if (o.outcome === "operational_failure") out = operational(tool, error, extra, o);
  else if (o.outcome === "refused" && o.code === null) out = refuse(tool, error, extra);
  else if (o.outcome === "refused") out = refuse(tool, error, extra, o);
  else throw new ShapeError("restate: the inner result is not a refusal or an operational failure");
  return withResolutions(out, inner[RESOLUTIONS] || []);
}

/* The typed outcome ALONE, set on an object a site already builds — for the refusal shapes that predate
 * refuse() and carry no `tool` key (terminal_core's read_board, emit_chart, read_nfl and answer, W0 PR-C).
 * refuse() would add `tool` and change the bytes; these add nothing visible: the target's own keys, and so
 * JSON.stringify of it, are what they were. Same validation as refuse()'s and operational()'s typed argument. */
function markRefused(target, typed) {
  if (!target || typeof target !== "object") throw new ShapeError("markRefused: the target is a result object");
  target[OUTCOME] = refusedOutcome(typed);
  return target;
}
function markOperational(target, op) {
  if (!target || typeof target !== "object") throw new ShapeError("markOperational: the target is a result object");
  target[OUTCOME] = operationalOutcome(op);
  return target;
}
/* A tool that tried to return a figure without its markers (a ShapeError caught at the tool boundary): neither
 * a refusal the tool chose nor the platform failing to run it — a defect, typed as one (§5). */
const SHAPE_ERROR_OUTCOME = Object.freeze({ outcome: "shape_error" });
function markShapeError(target) {
  if (!target || typeof target !== "object") throw new ShapeError("markShapeError: the target is a result object");
  target[OUTCOME] = SHAPE_ERROR_OUTCOME;
  return target;
}

/* ---------- entity resolutions (specs/turn-record.md §5.2; architecture §7) ---------- */
/* What one lookup bound a piece of text to: an invocation-output fact, not a research identity. `grain`
 * names the entity-by-time index the id denotes (DATA_AND_SPINE §2.4): a gsis id is a "player", a
 * crosswalk code a "team", a game_id a "game". The instant is the capture's to stamp, not this module's.
 * Only an object this function returned is accepted by withResolutions. */
const RESOLUTION_OBJECTS = new WeakSet();

function resolution(r) {
  const o = r || {};
  if (!isText(o.resolver) || !isText(o.resolver_version)) throw new ShapeError("a resolution names its resolver and the resolver's version");
  if (o.input === undefined || !isJsonValue(o.input)) throw new ShapeError(o.resolver + ": a resolution's input is a JSON value");
  if (RESOLUTION_OUTCOMES.indexOf(o.outcome) === -1) throw new ShapeError(o.resolver + ": a resolution's outcome is one of " + RESOLUTION_OUTCOMES.join(", "));
  const kind = o.entity_kind === undefined ? null : o.entity_kind;
  if (kind !== null && ENTITY_KINDS.indexOf(kind) === -1) throw new ShapeError(o.resolver + ": entity_kind is one of " + ENTITY_KINDS.join(", ") + " or null");
  const id = o.entity_id === undefined ? null : o.entity_id;
  if (id !== null && !isText(id)) throw new ShapeError(o.resolver + ": entity_id is text or null");
  const grain = o.grain === undefined ? null : o.grain;
  if (grain !== null && !isText(grain)) throw new ShapeError(o.resolver + ": grain is text or null");
  const cands = o.candidates === undefined ? null : o.candidates;
  if (cands !== null && !(Array.isArray(cands) && cands.length <= RESOLUTION_CANDIDATES_MAX && isJsonValue(cands))) {
    throw new ShapeError(o.resolver + ": candidates are a JSON array of at most " + RESOLUTION_CANDIDATES_MAX);
  }
  const count = o.candidate_count === undefined ? null : o.candidate_count;
  if (count !== null && !isCount(count)) throw new ShapeError(o.resolver + ": candidate_count is a non-negative integer or null");
  const floor = o.candidate_count_is_floor === undefined ? null : o.candidate_count_is_floor;
  if (floor !== null && typeof floor !== "boolean") throw new ShapeError(o.resolver + ": candidate_count_is_floor is a boolean or null");
  const why = o.failure_reason === undefined ? null : o.failure_reason;
  if (why !== null && !isText(why)) throw new ShapeError(o.resolver + ": failure_reason is text or null");
  if (o.outcome === "resolved" && (kind === null || id === null)) throw new ShapeError(o.resolver + ": a resolved entity has a kind and an id");
  if (o.outcome !== "resolved" && id !== null) throw new ShapeError(o.resolver + ": only a resolved entity has an id");
  if (o.outcome === "ambiguous" && !(cands !== null && cands.length >= 1 && count !== null && count >= 2)) {
    throw new ShapeError(o.resolver + ": an ambiguous resolution lists its candidates and counts at least two");
  }
  const out = Object.freeze({
    resolver: o.resolver, resolver_version: o.resolver_version, input: Object.freeze(jsonCopy(o.input)), outcome: o.outcome,
    entity_kind: kind, entity_id: id, grain, candidates: cands === null ? null : Object.freeze(jsonCopy(cands)),
    candidate_count: count, candidate_count_is_floor: floor, failure_reason: why,
  });
  RESOLUTION_OBJECTS.add(out);
  return out;
}

/* Attach resolutions to a result or refusal: the same object back, its list extended. Each call sets a
 * NEW frozen array, so an object that copied the marker earlier never sees a later append. */
function withResolutions(target, list) {
  if (!target || typeof target !== "object") throw new ShapeError("withResolutions: the target is a result object");
  if (!Array.isArray(list)) throw new ShapeError("withResolutions: resolutions come as a list");
  list.forEach((r) => { if (!RESOLUTION_OBJECTS.has(r)) throw new ShapeError("withResolutions: only an object built by resolution() is accepted"); });
  if (!list.length) return target;
  target[RESOLUTIONS] = Object.freeze((target[RESOLUTIONS] || []).concat(list));
  return target;
}

/* ---------- primitives: the operators-to-be, each with its n rule ---------- */

/* Σ of one additive column. `games` is the rows that carry a number for it; `rows` is every row. */
function sumAdditive(rows, column) {
  let total = 0, games = 0;
  (rows || []).forEach((r) => { if (typeof r[column] === "number" && isFinite(r[column])) { total += r[column]; games += 1; } });
  return { column, total, games, rows: (rows || []).length };
}

/* §3.3 reduce_pair: Σ numerator / Σ denominator, n = Σ denominators. A zero denominator is
 * not_applicable: nothing was attempted, so there is no rate — which is not a rate of zero. */
function ratio(name, unit, num, den) {
  const n_rule = "reduce_pair: the sum of the denominator (" + den.column + ")";
  if (!(den.total > 0)) {
    return quantity({ name, unit, value: null, absent: "not_applicable", n: 0, n_sort: "sample", n_rule,
                      reason: den.column + " is 0 over " + den.rows + " game(s): there is no rate, which is not a rate of 0",
                      numerator: { column: num.column, total: num.total }, denominator: { column: den.column, total: den.total } });
  }
  return quantity({ name, unit, value: num.total / den.total, n: den.total, n_sort: "sample", n_rule,
                    numerator: { column: num.column, total: num.total }, denominator: { column: den.column, total: den.total } });
}

/* A per-game average: Σ / games, n = games. No game is no_data, not zero. */
function perGame(name, unit, sum) {
  const n_rule = "reduce_count: games with a value";
  if (!(sum.games > 0)) {
    return quantity({ name, unit, value: null, absent: "no_data", n: 0, n_sort: "sample", n_rule,
                      reason: "no game carries " + sum.column, total: sum.total });
  }
  return quantity({ name, unit, value: sum.total / sum.games, n: sum.games, n_sort: "sample", n_rule, total: sum.total });
}

/* W, L and T from per-game points. `games` is [{ points_for, points_against }]. */
function tally(games) {
  const out = { w: 0, l: 0, t: 0, games: 0, points_for: 0, points_against: 0 };
  (games || []).forEach((g) => {
    out.games += 1; out.points_for += g.points_for; out.points_against += g.points_against;
    if (g.points_for > g.points_against) out.w += 1; else if (g.points_for < g.points_against) out.l += 1; else out.t += 1;
  });
  return out;
}

/* §5.3: a − b. n is the min over SAMPLE-sorted inputs only. Two observations make an observation-sorted
 * difference whose n is the count of distinct observations (2). Mixed sorts take the sample side's n.
 * An absent side makes the difference absent, and it says which side and why (§7.3: absence propagates). */
function difference(name, unit, a, b) {
  const samples = [a, b].filter((q) => q.n_sort === "sample");
  const n_sort = samples.length ? "sample" : "observation";
  const n_rule = samples.length ? "min over the sample-sorted inputs" : "reduce_observation: the count of distinct observations";
  if (a.value === null || b.value === null) {
    const side = a.value === null ? "a" : "b", q = a.value === null ? a : b;
    return quantity({ name, unit, value: null, absent: q.absent, n: 0, n_sort, n_rule,
                      reason: "side " + side + " has no value: " + q.reason, a: a.value, b: b.value });
  }
  const n = samples.length ? Math.min.apply(null, samples.map((q) => q.n)) : 2;
  return quantity({ name, unit, value: a.value - b.value, n, n_sort, n_rule, a: a.value, b: b.value, n_a: a.n, n_b: b.n });
}

/* Competition ranking, highest first: equal values share a rank and the next rank skips (1, 2, 2, 4).
 * `items` is [{ key, value }]; values are compared as given, so callers rank the rounded value they
 * show. Order within a tie is by key, so the output is deterministic. */
function rankDescending(items) {
  const sorted = (items || []).slice().sort((x, y) => (y.value - x.value) || (x.key < y.key ? -1 : (x.key > y.key ? 1 : 0)));
  let rank = 0;
  return sorted.map((it, i) => {
    if (i === 0 || it.value !== sorted[i - 1].value) rank = i + 1;
    return Object.assign({}, it, { rank, tied: false });
  }).map((it, _i, all) => Object.assign(it, { tied: all.filter((o) => o.rank === it.rank).length > 1 }));
}

/* ---------- the shape of a field of quotes (specs/terminal-field-shape.md) ---------- */
/* STATED CONVENTIONS, not measurements: one point is an outlier when it holds at least half the
 * range and there are at least four points to be wide against. Named in the result so a reader can
 * disagree with the line drawn. */
const FIELD_OUTLIER_SHARE = 0.5;
const FIELD_OUTLIER_MIN = 4;

/* Where a value sits in its own field, and what the field looks like around it. `points` is
 * [{key, value}] over the COMPARABLE quotes only — the caller applies B4 and B6 first, because an
 * exchange's price and a price on another line are not in the same field.
 *
 * The ORIGIN is the reference's own value when `referenceKey` names a point, and 0 when it is null:
 * a field of deltas is already measured from a reference that is not itself in the set. That is the
 * only difference between the two callers.
 *
 * SHAPE BEATS SPREAD, and the two cases are not exclusive: a field can be one outlier AND one-sided
 * underneath it. So `shape` names the outlier — the thing that most changes how a range reads — and
 * `sidedness` describes what is left when the outlier is set aside, saying which point that was.
 * n is a count of quotes: `symmetric` means points on both sides, never a distribution. */
function fieldShape(points, referenceKey) {
  const ps = (points || []).filter((p) => p && typeof p.value === "number" && isFinite(p.value));
  const n = ps.length;
  const named = referenceKey !== undefined && referenceKey !== null;
  const ref = named ? ps.find((p) => p.key === referenceKey) || null : null;
  /* A caller names a reference only when it is IN the field. Naming one that is not would silently
   * count every point against 0, which is a fair probability of nothing: a defect, so it throws. */
  if (named && ref === null) throw new ShapeError("fieldShape: reference " + String(referenceKey) + " is not one of the " + n + " points");
  const origin = ref ? ref.value : 0;
  const rankOf = (key) => {
    const hit = rankDescending(ps).find((p) => p.key === key);
    return hit ? { rank: hit.rank, tied: hit.tied } : null;
  };
  const spread = (list) => (list.length < 2 ? null : Math.max.apply(null, list.map((p) => p.value)) - Math.min.apply(null, list.map((p) => p.value)));
  const range = spread(ps);
  let leaveOneOut = null, leftOut = null, share = null;
  if (n >= 3 && range !== null) {
    ps.forEach((p) => {
      const without = spread(ps.filter((o) => o !== p));
      if (leaveOneOut === null || without < leaveOneOut) { leaveOneOut = without; leftOut = p.key; }
    });
    share = range > 0 ? (range - leaveOneOut) / range : 0;
  }
  const outlier = leftOut !== null && share !== null && share >= FIELD_OUTLIER_SHARE && n >= FIELD_OUTLIER_MIN ? leftOut : null;
  /* TWO DIFFERENT QUESTIONS, and the build found them by answering both with one subset. The COUNTS
   * are over the whole field — how many books sit each side — so below + above + level is every point
   * but the reference itself; a count that quietly dropped the outlier would not sum to n and a
   * reader would ask where the missing book went. SIDEDNESS is the shape once the outlier is set
   * aside: with it in, a one-sided field holding one distant point on the other side reads
   * `both_sides`, which is the backwards reading this exists to stop. Points exactly at the origin
   * are level — neither below nor above. */
  const others = ps.filter((p) => ref === null || p.key !== referenceKey);
  const below = others.filter((p) => p.value < origin).length;
  const above = others.filter((p) => p.value > origin).length;
  const level = others.length - below - above;
  const judged = others.filter((p) => p.key !== outlier);
  const jBelow = judged.filter((p) => p.value < origin).length;
  const jAbove = judged.filter((p) => p.value > origin).length;
  const sidedness = jBelow > 0 && jAbove === 0 ? "all_below" : (jAbove > 0 && jBelow === 0 ? "all_above" : "both_sides");
  /* `too_few` below FIELD_OUTLIER_MIN, not below 3: with three points one of them can hold nearly the
   * whole range and no rule can tell that from a wide field, so the one word would read `symmetric`
   * over a field that is anything but — the backwards reading this exists to stop. `range`, `share`
   * and `sidedness` are still reported there; only the claim about the shape is withheld. */
  const shape = n < FIELD_OUTLIER_MIN ? "too_few" : (outlier !== null ? "one_outlier" : (sidedness === "both_sides" ? "symmetric" : "one_sided"));
  return {
    n, origin: r4(origin),
    reference_key: ref ? referenceKey : null,
    reference_rank: ref ? rankOf(referenceKey) : null,
    below, above, level,
    range: r4(range), range_leave_one_out: r4(leaveOneOut), left_out: leftOut, share: r4(share),
    outlier, sidedness, sidedness_excludes: outlier, shape,
  };
}

/* §3.3 reduce_observation with a max: the entries ordered best first by `valueOf`, ties by key. n is the
 * count of distinct observations ranked — a count of quotes, never a sample size. */
function maxObservation(entries, valueOf, keyOf) {
