           * Record, and it stays out of `answers`. A row with no kind (a database before 016) is conversation. */
          if (m.kind === "command") {
            const line = document.createElement("div");
            line.className = "run-line";
            line.setAttribute("data-message", String(m.id));
            const tag = document.createElement("span");
            tag.className = "meta";
            tag.textContent = "Run";
            const text = document.createElement("span");
            text.textContent = m.content || "";
            line.append(tag, " ", text);
            $("messages").appendChild(line);
            return;
          }
          const err = m.role === "assistant" && !m.content && m.trace && m.trace.error;
          const body = addMessage(m.role, err ? "no reply: " + (m.trace.error.message || m.trace.error.kind) : m.content, m.created_at);
          if (err) body.parentNode.className = "msg assistant failed";
          /* A turn that ended in an error is not an answer to keep, whatever text it got out first. */
          if (KEEP_ON && m.role === "assistant" && m.trace && m.trace.error) body.parentNode.setAttribute("data-keep", "no");
          body.parentNode.setAttribute("data-message", String(m.id));
          if (m.role === "assistant") answers.set(String(m.id), body.parentNode);
          /* A card and a tab per stored chart, from the spec alone. NO ROW IS READ HERE: a tab
           * pays for its rows when it is first opened. */
          (m.charts || []).forEach((c) => registerChart(body.parentNode, c, m.id));
          /* A comparison, on the other hand, IS read back: the trace kept the spec and the ids, so
           * the block is recomputed from those rows rather than stored as text. A reopened thread
           * shows the same figures because it runs the same code over the same rows. */
          ((m.trace && m.trace.tool_calls) || []).forEach((tc) => {
            if (tc && tc.recompute) renderCompare(body.parentNode, tc.recompute);
          });
          proposeFromRow(body.parentNode, m);
          specFromRow(body.parentNode, m);
        });
        projectPanel();
        /* The context read may have answered before these rows were here to hang the control on. */
        if (keepKnown && keepKnown.threadId === id) syncKeep(id, keepKnown.state);
        scrollDown();
        loadRuns(id, epoch);
        loadRecords(id, epoch, rows.length, answers);
        viewsMount(id, epoch);
        return loadThreads();
      });
  }

  /* A conversation named in the address: `#thread=<uuid>`, as the workspace's timeline links here
   * (specs/terminal-run-results.md §5). Read once, after the first list has been asked for; a boot whose
   * session could not be used asked for none, and opens none. The id is asked for with the reader's own
   * token, so the database's row level security decides whether it is theirs: exactly one row with that
   * id opens it through openThread, the function a click calls. Any other fragment, no row, a failed
   * read, or a conversation already open leaves the page as it is. A fragment reaches no server, and
   * nothing here writes one. */
  const THREAD_HASH = /^#thread=([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})$/;
  function openNamedThread() {
    const named = THREAD_HASH.exec((typeof location === "object" && location && location.hash) || "");
    if (!named || !session || threadsSeq === 0 || currentThread || sending) return Promise.resolve();
    const id = named[1];
    return rest("threads?select=id&id=eq." + id, true)
      .then((rows) => {
        if (!Array.isArray(rows) || rows.length !== 1 || !rows[0] || rows[0].id !== id || currentThread || sending) return undefined;
        return openThread(id);
      })
      .catch(() => undefined);
  }

  function newThread() {
    currentThread = null;
    $("messages").textContent = "";
    setStatus("");
    resetPanel();
    clearContext();
    return loadThreads();
  }

  /* ---------- board rows: fetched by id with the publishable key alone ---------- */
  function fetchRows(ids) {
    const need = ids.filter((id) => !rowCache.has(id) && !inflight.has(id));
    if (need.length) {
      const chunks = [];
      for (let i = 0; i < need.length; i += 30) chunks.push(need.slice(i, i + 30));
      const job = chunks.reduce((p, chunk) => p.then(() =>
        rest(SNAPSHOTS_TABLE + "?select=*&id=in.(" + chunk.join(",") + ")", false)
          .then((rows) => rows.forEach((r) => rowCache.set(r.id, r)))), Promise.resolve());
      /* ONE promise for the whole job, registered for every id BEFORE anything resolves, so a
       * caller arriving between two chunks waits too. Cleared either way: a failed request is
       * retried by the next open, not remembered. */
      const settled = job.then(() => { need.forEach((id) => inflight.delete(id)); },
                               (err) => { need.forEach((id) => inflight.delete(id)); throw err; });
      need.forEach((id) => inflight.set(id, settled));
    }
    const waits = [];
    ids.forEach((id) => { const p = inflight.get(id); if (p && waits.indexOf(p) === -1) waits.push(p); });
    return Promise.all(waits).then(() => ids.map((id) => rowCache.get(id)).filter(Boolean));
  }

  /* ---------- charts: spec + rows -> ChartSpec -> ChartForms ----------
   * Two steps, because they have different lifetimes. `computeChart` is the series: it depends
   * on the spec and the rows and on nothing about the page, so a tab keeps it. `ChartForms.render`
   * is that series AT A WIDTH, so it is redone when the panel's width changes and never refetches
   * or recomputes to do it. */
  function computeChart(spec, rows) {
    return ChartSpec.compute(spec, ChartSpec.polls(rows));
  }

  function renderChart(spec, rows, width) {
    return ChartForms.render(computeChart(spec, rows), { width: width || 720 });
  }

  /* ---------- the chart panel ----------
   * STATE, then ONE projector. Nothing here reads the DOM to find out what is showing.
   *
   * Per chart (a TAB): the stored record, a status, the computed series `c`, the drawn model `m`
   * with the width it was drawn at, and how many of the rows it names were still held. `c` and
   * `m` are what this page used to compute and discard; they are kept because everything a
   * chart will later answer to — a crosshair over `m.marks`, a selection by `data-book` — reads
   * them. Per thread: the tabs in message-then-emission order, which one is active, whether the
   * panel is open, and an EPOCH that every continuation appending into the view compares before
   * it writes. All of it is reset when the view changes and none of it is persisted:
   * `authenticated` holds SELECT and nothing else on threads and messages.
   *
   * IDENTITY. A stored chart's `id` is `"c" + n` with n restarting every turn, so every
   * message's first chart is `c1` — measured 2026-09-18: a two-message thread's three cards read
   * c1, c2, c1. A chart is identified by (message, chart). On the live path the message id does
   * not exist until `done`, so until then the message's ordinal in this view stands in for it
   * (`p3:c1`), and `done` replaces it (`41:c1`).
   *
   * CLOSED. A chart is stored on its message and its card stays in the thread, so closing a tab
   * deletes nothing: it is a flag on the tab, and the tab keeps its place in `tabs`, its key, its
   * rows, `c` and `m`. `history` is the tabs in the order they were last active — where the panel
   * goes when the active tab is the one closed. Neither is stored, so reopening the thread brings
   * every tab back. */
  const FLOOR_W = 480;                       /* 21 books at a 14 px pitch + the forms' 174 px of padding */
  const WIDE_QUERY = "(min-width: 1112px)";  /* the CSS breakpoint's other statement */
  const RESIZE_MS = 150;
  const SWIPE_PX = 96;                       /* rightward travel that dismisses the overlay */
  const SWIPE_SLOP = 12;                     /* travel before the panel starts to follow the finger */
  const SWIPE_EDGE = 24;                     /* a touch starting left of this is left to the browser */
  const panel = { tabs: [], active: null, open: false, epoch: 0, messages: 0, history: [] };
  let swipe = null;
  const refsByMessage = new Map();
  let readoutCells = null;
  let resizeTimer = null;

  function isWide() {
    return !window.matchMedia || window.matchMedia(WIDE_QUERY).matches;
  }

  function keyOf(tab) {
    return (tab.messageId === null ? "p" + tab.ordinal : String(tab.messageId)) + ":" + tab.chart.id;
  }

  function resetPanel() {
    panel.tabs = [];
    panel.active = null;
    panel.history = [];
    panel.open = false;
    panel.messages = 0;
    panel.epoch += 1;
    refsByMessage.clear();
    $("tabs").textContent = "";
    projectPanel();
  }

  /* The card row of one assistant message, made on its first chart. */
  function refsOf(msgEl) {
    let refs = refsByMessage.get(msgEl);
    if (!refs) {
      panel.messages += 1;
      refs = { node: document.createElement("div"), ordinal: panel.messages };
      refs.node.className = "refs";
      msgEl.appendChild(refs.node);
      refsByMessage.set(msgEl, refs);
    }
    return refs;
  }

  function clock(iso) {
    return typeof iso === "string" && iso.length >= 19 ? iso.slice(0, 19).replace("T", " ") : "";
  }

  /* What a tab says, as its two rows. ONE function, called where the tab is made and exposed as
   * `__terminal.panel.label`, so that what is measured is this page's label and not a copy of it.
   * A series that reads no row (gamma) has no market and no region, and its second row is the
   * poll time or nothing. */
  function tabLabel(spec, capturedAt) {
    const when = clock(capturedAt);
    return [String(spec.series || "chart"),
            [spec.market, spec.region, when ? when.slice(11) : null].filter(Boolean).join(" · ")];
  }

  function registerChart(msgEl, chart, messageId) {
    const refs = refsOf(msgEl);
    const spec = chart.spec || {};
    const sd = typeof spec.series === "string" ? ChartSpec.seriesOf(spec.series) : null;
    const tab = {
      seq: panel.tabs.length, ordinal: refs.ordinal,
      messageId: messageId === undefined || messageId === null ? null : messageId,
      /* Only ids that ARE ids. The function stores `[null]` for a series that reads no row
       * (gamma). Unfiltered that is one request for `id=in.()` — 200 and empty, measured
       * 2026-09-18, so the chart drew — and, now that a tab counts the rows it was given against
       * the rows it names, a false "0 of 1 rows still held" about a chart that names none. */
      chart: { id: String(chart.id || ""), spec: spec, captured_at: chart.captured_at || null,
               ids: (Array.isArray(chart.ids) ? chart.ids : []).filter((id) => typeof id === "number" && isFinite(id)) },
      status: "idle", error: null, c: null, m: null, width: 0, held: null, loading: null,
      closed: false, card: null, button: null
    };
    const when = clock(tab.chart.captured_at);
    /* The chart's place in this view, on its card AND its tab. Tabs are made in message-then-
     * emission order, which a reopened thread reproduces, so the number is the same next time. */
    const ordinal = "#" + (tab.seq + 1);
    const part = (cls, text) => {
      const node = document.createElement("span");
      node.className = cls;
      node.textContent = text;
      return node;
    };

    /* The card: what the chart leaves in the thread. Always "go to", never a toggle — clicking
     * the card of the chart already showing closes nothing (live.html lost a pane to one gesture
     * meaning two things). Its listener is bound here, once, where the node is made. */
    const card = document.createElement("button");
    card.setAttribute("type", "button");
    card.className = "ref";
    const title = document.createElement("span");
    title.className = "ref-title";
    title.textContent = spec.title || (sd ? sd.label : String(spec.series || "chart"));
    card.appendChild(title);
    const chips = document.createElement("span");
    chips.className = "chips";
    [spec.series, spec.region, spec.market, when ? "poll " + when : null,
     tab.chart.ids.length > 1 ? tab.chart.ids.length + " polls" : null]
      .filter(Boolean).forEach((t) => {
        const chip = document.createElement("span");
        chip.className = "chip";
        chip.textContent = t;
        chips.appendChild(chip);
      });
    card.appendChild(chips);
    card.appendChild(part("ref-n", ordinal));
    /* A card is also how a CLOSED tab comes back: `openTab` clears the flag, and the tab is where
     * it always was, because closing never took it out of the strip. */
    card.addEventListener("click", () => { openTab(tab); });
    refs.node.appendChild(card);
    tab.card = card;

    /* The tab: no listener of its own — the strip carries one, bound once, that outlives it, and
     * it is that listener that tells the `×` from the rest of the tab. `Delete` closes too. */
    const rows = tabLabel(spec, tab.chart.captured_at);
    const button = document.createElement("button");
    button.setAttribute("type", "button");
    button.setAttribute("role", "tab");
    button.setAttribute("data-tab", String(tab.seq));
    button.setAttribute("aria-keyshortcuts", "Delete");
    button.setAttribute("title", [ordinal].concat(rows).filter(Boolean).join(" · "));
    /* The floor's allowance for a long ordinal (F133). `#1`–`#99` are three characters or fewer
     * and set 0, which is the value the floor's `var()` falls back to and the expression it had
     * before this existed; `#100` sets 1 and `#1000` sets 2, one advance each, which is what the
     * ordinal takes from the series label beside it. */
    button.style.setProperty("--ord-extra", String(Math.max(0, ordinal.length - 3)));
    button.appendChild(part("tab-n", ordinal));
    button.appendChild(part("tab-s", rows[0]));
    const x = part("tab-x", "×");
    x.setAttribute("data-close", "1");
    x.setAttribute("aria-hidden", "true");
    button.appendChild(x);
    button.appendChild(part("tab-d", rows[1]));
    $("tabs").appendChild(button);
    tab.button = button;

    panel.tabs.push(tab);
    return tab;
  }

  /* A block child of the panel body, so its width is the body's content width whatever the
   * body's padding is — and 0 while the panel is not displayed, which is why a tab is drawn
   * only after the projector has shown the panel. */
  function chartWidth() {
    return Math.max(FLOOR_W, $("readout").clientWidth || 720);
  }

  function draw(tab) {
    if (tab.status === "ready") {
      const width = chartWidth();
      if (!tab.m || tab.width !== width) {
        tab.m = ChartForms.render(tab.c, { width: width });
        tab.width = width;
      }
      const svg = $("panel-svg");
      /* `mount` rewrites `class` and `data-series` and empties the root, but leaves any other
       * attribute where it is — so the hover of the chart just replaced would survive onto the new
       * one and dim a book it knows nothing about. Cleared here, where the redraw happens. */
      svg.removeAttribute("data-hover");
      if (hoverCell) hoverCell.textContent = "—";
      ChartForms.mount(tab.m, svg, document);
      svg.setAttribute("width", String(tab.m.width));
      svg.setAttribute("height", String(tab.m.height));
      chartsRendered += 1;
    }
    projectPanel();
  }

  function loadTab(tab) {
    const epoch = panel.epoch;
    tab.status = "loading";
    tab.error = null;
    tab.loading = fetchRows(tab.chart.ids).then((rows) => {
      tab.held = { named: tab.chart.ids.length, got: rows.length };
      let c;
      try { c = computeChart(tab.chart.spec, rows); } catch (err) { c = { ok: false, error: err.message }; }
      if (c.ok) { tab.c = c; tab.status = "ready"; }
      else { tab.status = "failed"; tab.error = "chart not drawn: " + c.error; }
    }, (err) => {
      tab.status = "failed";
      tab.error = "rows not loaded: " + err.message;
    }).then(() => {
      tab.loading = null;
      if (epoch === panel.epoch) { if (panel.active === tab) draw(tab); else projectPanel(); }
      return tab;
    });
    return tab.loading;
  }

  function openTab(tab) {
    tab.closed = false;
    panel.history = panel.history.filter((t) => t !== tab);
    panel.history.push(tab);
    panel.active = tab;
    panel.open = true;
    projectPanel();
    if (tab.status === "ready") { draw(tab); return Promise.resolve(tab); }
    if (tab.status === "loading") return tab.loading;
    const loading = loadTab(tab);
    projectPanel();
    return loading;
  }

  function closePanel() {
    panel.open = false;
    projectPanel();
  }

  /* Where the panel goes when the ACTIVE tab is closed. The tab that was active before it, if it
   * is still open: it has been opened, so going back to it reads nothing. Otherwise the nearest
   * open tab to the right, then to the left — and that one may never have been opened, so it
   * reads its rows as any first activation does. */
  function tabAfter(tab) {
    let i;
    for (i = panel.history.length - 1; i >= 0; i -= 1) {
      if (panel.history[i] !== tab && !panel.history[i].closed) return panel.history[i];
    }
    for (i = tab.seq + 1; i < panel.tabs.length; i += 1) if (!panel.tabs[i].closed) return panel.tabs[i];
    for (i = tab.seq - 1; i >= 0; i -= 1) if (!panel.tabs[i].closed) return panel.tabs[i];
    return null;
  }

  /* HIDES a tab; deletes nothing. The chart is on its message and its card stays in the thread,
   * so the tab keeps its place, its key and everything computed for it, and its card opens it
   * again. With no tab left to show, the panel closes. */
  function closeTab(tab) {
    if (tab.closed) return;
    tab.closed = true;
    if (panel.active === tab) {
      const next = panel.open ? tabAfter(tab) : null;
      if (next) { openTab(next); return; }
      panel.active = null;
      panel.open = false;
    }
    projectPanel();
  }

  /* live.html §9: cells are made ONCE and their text reassigned. What they show is the CHART —
   * the per-book quote waits for a selection, which this page does not have yet. */
  const READOUT = [
    ["series", (t) => { const sd = ChartSpec.seriesOf(t.chart.spec.series); return sd ? sd.label : String(t.chart.spec.series || "—"); }],
    ["event", (t) => { const ev = t.c && t.c.meta && t.c.meta.event; return Array.isArray(ev) ? ev[2] + " @ " + ev[1] : "—"; }],
    ["region", (t) => t.chart.spec.region || "—"],
    ["market", (t) => t.chart.spec.market || "—"],
    ["poll", (t) => clock(t.chart.captured_at) || "—"],
    ["reference", (t) => { const me = t.c && t.c.meta; return me && me.reference_book ? me.reference_book + (me.reference_line === null || me.reference_line === undefined ? "" : " " + me.reference_line) : "—"; }],
    ["books", (t) => { const me = t.c && t.c.meta; return me && typeof me.n_books === "number" ? me.n_books + " · " + me.n_matched + " on the line · " + me.n_off_line + " off" : "—"; }],
    ["polls", (t) => { const me = t.c && t.c.meta; return me && typeof me.n_frames === "number" ? me.n_frames + " of a " + me.window + "-poll window" : "—"; }],
    ["rows held", (t) => !t.held ? "—" : t.held.named ? t.held.got + " of " + t.held.named : "reads none"]
  ];

  function projectPanel() {
    const tab = panel.active;
    $("panel").hidden = !panel.open;
    $("app").className = panel.open ? "with-panel" : "";
    panel.tabs.forEach((t) => {
      const on = panel.open && t === tab;
      const bad = t.status === "failed" ? " failed" : "";
      t.button.className = "tab" + (on ? " is-active" : "") + bad;
      t.button.setAttribute("aria-selected", String(on));
      t.button.setAttribute("data-chart", keyOf(t));
      t.button.hidden = t.closed;
      t.card.className = "ref" + (on ? " is-open" : "") + bad;
      t.card.setAttribute("data-chart", keyOf(t));
    });
    if (!readoutCells) {
      readoutCells = READOUT.map((spec) => {
        const cell = document.createElement("div");
        cell.className = "cell";
        const k = document.createElement("span");
        k.className = "label";
        k.textContent = spec[0];
        const v = document.createElement("b");
        cell.appendChild(k);
        cell.appendChild(v);
        $("readout").appendChild(cell);
        return v;
      });
    }
    READOUT.forEach((spec, i) => { readoutCells[i].textContent = tab ? spec[1](tab) : "—"; });
    $("chart-scroll").hidden = !(tab && tab.status === "ready");
    const why = $("panel-why");
    /* A chart redrawn from fewer rows than it names is a DIFFERENT chart from the one the
     * message was written beside, and `fetchRows` drops what does not resolve without a word. */
    const short = tab && tab.held && tab.held.got < tab.held.named;
    why.className = "why" + (tab && tab.status === "failed" ? "" : " note");
    why.textContent = !tab ? "" :
      tab.status === "loading" ? "loading rows" :
      tab.status === "failed" ? tab.error + (short ? " (" + tab.held.got + " of " + tab.held.named + " rows still held)" : "") :
      short ? "drawn from " + tab.held.got + " of the " + tab.held.named + " rows this chart names; the rest are no longer held" : "";
    if (panel.open && tab && tab.button.scrollIntoView) tab.button.scrollIntoView({ block: "nearest", inline: "nearest" });
    projectStrip();
  }

  /* THE STRIP'S SCROLL OFFSET IS THE ONE PIECE OF PANEL STATE THE BROWSER OWNS — a person scrolls
   * it natively — so this, and only this, reads the DOM to find out what is showing: whether any
   * tab is hidden, and on which side. The steppers are shown when the strip would overflow
   * WITHOUT them. Asking whether it overflows as it stands would oscillate: showing them narrows
   * the strip and hiding them widens it, and a strip within their width of fitting flips forever. */
  function projectStrip() {
    const strip = $("tabs"), prev = $("tabs-prev"), next = $("tabs-next");
    const steppers = prev.hidden ? 0 : (prev.offsetWidth || 0) + (next.offsetWidth || 0);
    const over = panel.open && strip.scrollWidth > strip.clientWidth + steppers + 1;
    prev.hidden = !over;
    next.hidden = !over;
    const left = over && strip.scrollLeft > 1;
    const right = over && strip.scrollLeft + strip.clientWidth < strip.scrollWidth - 1;
    prev.disabled = !left;
    next.disabled = !right;
    strip.setAttribute("data-more", [left ? "left" : "", right ? "right" : ""].filter(Boolean).join(" "));
  }

  function stepStrip(dir) {
    const strip = $("tabs");
    strip.scrollLeft += dir * Math.max(120, strip.clientWidth * 0.8);
    projectStrip();
  }

  /* ---------- the swipe: below the breakpoint, a rightward drag puts the overlay away ----------
   * PASSIVE listeners: nothing here can block a native scroll, and nothing needs to. The rule is
   * "a swipe that SCROLLED NOTHING dismisses" — the three scrollers inside the panel are read at
   * `touchstart` and again at every move and at the end, and a gesture during which any of them
   * moved was theirs. On a phone the chart is wider than the panel and rests at scrollLeft 0, so
   * a rightward swipe over it dismisses until a reader has scrolled the chart, and after that
   * scrolls it back first.
   *
   * Dismissal is `closePanel()` and moves NO FOCUS. Measured 2026-09-18: `card.focus()` on a card
   * above the fold took #messages from 6388 to 3200, and the conversation's scroll position is
   * what the overlay exists to preserve.
   *
   * NOT MEASURED, and not measurable with a synthetic gesture: that a browser goes on delivering
   * touchmove/touchend while it pans a scroller natively; what iOS Safari's left-edge back-swipe
   * does with a touch SWIPE_EDGE is meant to leave alone; pull-to-refresh. */
  function scrollersNow() {
    return [$("chart-scroll").scrollLeft, $("tabs").scrollLeft, $("panel-body").scrollTop];
  }

  function dragTo(px) {
    const el = $("panel");
    el.setAttribute("data-drag", px ? "1" : "0");
    el.style.transform = px ? "translateX(" + px + "px)" : "";
  }

  function swipeTo(touch) {
    swipe.dx = touch.clientX - swipe.x;
    swipe.dy = touch.clientY - swipe.y;
    const now = scrollersNow();
    if (swipe.at.some((v, i) => v !== now[i])) swipe.scrolled = true;
  }

  function swipeHolds(travel) {
    return !swipe.scrolled && swipe.dx >= travel && swipe.dx >= 2 * Math.abs(swipe.dy);
  }

  /* A second finger raises its own `touchstart`, with two touches, and that disarms the swipe:
   * every gesture that reaches `touchmove` armed is one finger's. */
  function swipeStart(e) {
    swipe = null;
    dragTo(0);
    if (isWide() || !panel.open || e.touches.length !== 1) return;
    if (e.touches[0].clientX < SWIPE_EDGE) return;
    swipe = { x: e.touches[0].clientX, y: e.touches[0].clientY, dx: 0, dy: 0, scrolled: false, at: scrollersNow() };
  }

  function swipeMove(e) {
    if (!swipe) return;
    swipeTo(e.touches[0]);
    dragTo(swipeHolds(SWIPE_SLOP) ? swipe.dx : 0);
  }

  function swipeEnd(e) {
    if (!swipe) return;
    if (e.changedTouches && e.changedTouches.length) swipeTo(e.changedTouches[0]);
    const dismiss = swipeHolds(SWIPE_PX);
    swipe = null;
    dragTo(0);
    if (dismiss) closePanel();
  }

  function swipeCancel() {
    swipe = null;
    dragTo(0);
  }

  function panelState() {
    return {
      open: panel.open, epoch: panel.epoch, active: panel.active ? keyOf(panel.active) : null,
      history: panel.history.map(keyOf),
      tabs: panel.tabs.map((t) => ({
        key: keyOf(t), seq: t.seq, messageId: t.messageId, series: t.chart.spec.series || null,
        closed: t.closed,
        ids: t.chart.ids.length, status: t.status, error: t.error, held: t.held,
        width: t.width, height: t.m ? t.m.height : 0, marks: t.m ? t.m.marks.length : 0,
        elements: t.m ? t.m.elements.length : 0, computed: !!t.c
      }))
    };
  }

  /* ---------- the crosshair: one listener on the root, the model read at event time ----------
   *
   * WHY THE ROOT. `ChartForms.mount` empties `#panel-svg` and repopulates it on every redraw, so a
   * listener on a mark — or on any child — is destroyed by the next draw and stops silently. The
   * root outlives every redraw, which is what the markup says it is for.
   *
   * WHY THE MODEL IS READ HERE AND NOT CAPTURED. `draw` replaces `tab.m` with a new model whenever
   * the width changes, so a closure over `m` keeps answering from the geometry of the width before
   * the resize: confidently, and wrongly, with nothing on the screen saying so. Every lookup starts
   * from `panel.active`.
   *
   * WHAT A HOVERED NUMBER CARRIES. The readout row already names this chart's region, event,
   * market, poll and reference book; the crosshair adds the book, the value formatted by the
   * series' own formatter, and — for a series that reads one side — the ROLE that side is, from
   * `c.meta.roles`. A number whose side is not on the screen is the defect this avoids (XW-F38 is
   * the wider gap, and is not closed by this).
   *
   * TOUCH IS REFUSED, not forgotten: the panel already reads touch for the swipe and the chart pans
   * inside its wrapper on a phone, so a crosshair on touch would contend with both. Tap-to-read is
   * a ruling, not an oversight. */
  const HOVER_FORMS = { dot: 1, bar: 1, dumbbell: 1, scatter: 1, slope: 1 };
  let hoverCell = null;

  /* INSIDE THE PLOT, or nothing. Without this the nearest mark answers from anywhere — including
   * a pointer that has left the chart entirely, which would put a book and a number on the screen
   * for a position that is not on the chart. The frame is the renderer's own plotting box; the
   * margin is the mark radius, so a point on a mark at the edge still reads. */
  const HOVER_MARGIN = 8;
  /* TWO FRAME SHAPES, because the renderer has two: a book chart's frame is `{top, bot}` — its
   * marks span the width by rank — and a line, cells or slope chart's is `{x0, x1, y0, y1}`.
   * Neither is normalised in chart_forms.js, and this page does not change that file, so the
   * reading of it is here, once, and the number a test hovers at comes from the same function. */
  function plotBox(m) {
    const f = m.frame || {};
    const n = (v, fallback) => (typeof v === "number" ? v : fallback);
    return { x0: n(f.x0, 0), x1: n(f.x1, m.width),
             y0: n(f.y0, n(f.top, 0)), y1: n(f.y1, n(f.bot, m.height)) };
  }
  function insidePlot(m, x, y) {
    const b = plotBox(m);
    return x >= b.x0 - HOVER_MARGIN && x <= b.x1 + HOVER_MARGIN
        && y >= b.y0 - HOVER_MARGIN && y <= b.y1 + HOVER_MARGIN;
  }

  function markAt(m, x, y) {
    if (!m || !Array.isArray(m.marks) || !m.marks.length || !HOVER_FORMS[m.form]) return null;
    if (!insidePlot(m, x, y)) return null;
    let best = null, bestD = Infinity;
    m.marks.forEach((mk) => {
      let d;
      if (m.form === "scatter") {
        if (typeof mk.cx !== "number" || typeof mk.cy !== "number") return;
        d = Math.abs(mk.cx - x) + Math.abs(mk.cy - y) * 0.5;
      } else if (m.form === "slope") {
        /* Read at the ENDS only: between them each book is a curve whose shape lives in
         * chart_forms.js, and a value read there would be invented. Which end is named below. */
        const x0 = m.frame ? m.frame.x0 : null, x1 = m.frame ? m.frame.x1 : null;
        if (typeof x0 !== "number" || typeof x1 !== "number") return;
        const dLeft = Math.abs(x0 - x) + Math.abs(mk.y0 - y) * 0.5;
        const dRight = Math.abs(x1 - x) + Math.abs(mk.y1 - y) * 0.5;
        d = Math.min(dLeft, dRight);
        if (d < bestD) { best = { mark: mk, end: dLeft <= dRight ? "implied" : "fair" }; bestD = d; }
        return;
      } else {
        if (typeof mk.x !== "number") return;
        d = Math.abs(mk.x - x);
      }
      if (d < bestD) { best = { mark: mk, end: null }; bestD = d; }
    });
    return best;
  }

  /* What the hovered mark reads out, as text. The formatter is the series' own — the one the
   * chart's labels print with — so the crosshair cannot disagree with the chart beside it. */
  function hoverText(tab, hit) {
    const c = tab.c, m = tab.m, mk = hit.mark;
    const fmt = (v) => (ChartSpec.FMT[c.fmt] ? ChartSpec.FMT[c.fmt](v) : String(v));
    /* WHICH SIDE, named as a reader names it. `c.meta.roles[0]` is the role side A is — "home",
     * "away", "Over", "Under" — and for a game the page also holds the teams, so a role of "home"
     * is said as the home team. The event row is [id, home, away], which is how the readout above
     * prints "away @ home". */
    const roles = (c.meta && c.meta.roles) || null;
    const ev = (c.meta && c.meta.event) || null;
    const role = Array.isArray(roles) && roles.length ? roles[0] : null;
    const side = role === "home" && Array.isArray(ev) ? ev[1]
      : role === "away" && Array.isArray(ev) ? ev[2] : role;
    let value;
    if (m.form === "scatter") value = fmt(mk.delta_pp !== undefined ? mk.delta_pp : mk.hold);
    else if (m.form === "slope") value = fmt(hit.end === "implied" ? mk.implied : mk.fair);
    else value = fmt(mk.value);
    /* ORDER: the book, the number, and then WHAT THE NUMBER IS OF — the side — because that
     * qualifies the number and a flag does not. Flags follow. A series that is not one-sided
     * (`hold_strip`, `overround`) names no side, because it has none to name. */
    const bits = [mk.book || "—", value];
    if (side && c.family === "book" && c.key !== "hold_strip" && c.key !== "overround") bits.push(side);
    if (m.form === "slope") bits.push(hit.end);
    if (mk.value2 !== undefined && mk.value2 !== null) bits.push("to " + fmt(mk.value2));
    if (mk.withheld) bits.push("withheld");
    if (mk.clipped) bits.push("clipped");
    if (mk.isRef) bits.push("reference");
    return bits.join(" · ");
  }

  /* Which elements the hovered book owns. A CSS selector cannot read the root's attribute — there
   * is no `attr()` in a selector — so the match is made here and marked, and the stylesheet only
   * says what a marked element looks like. Every element the renderer labelled is considered, so a
   * book drawn as several elements lights up whole. */
  function paintHit(svg, book) {
    const all = svg.querySelectorAll ? svg.querySelectorAll("[data-book]") : [];
    for (let i = 0; i < all.length; i += 1) {
      if (book !== null && all[i].getAttribute("data-book") === book) all[i].setAttribute("data-hit", "1");
      else all[i].removeAttribute("data-hit");
    }
  }

  function showHover(hit, tab) {
    const svg = $("panel-svg");
    if (!hoverCell) {
      const cell = document.createElement("div");
      cell.className = "cell hover";
      const label = document.createElement("span");
      label.className = "label";
      label.textContent = "under the pointer";
      hoverCell = document.createElement("b");
      hoverCell.id = "readout-hover";
      cell.appendChild(label);
      cell.appendChild(hoverCell);
      $("readout").appendChild(cell);
    }
    if (!hit) {
      hoverCell.textContent = "—";
      svg.removeAttribute("data-hover");
      paintHit(svg, null);
      return;
    }
    hoverCell.textContent = hoverText(tab, hit);
    if (hit.mark.book) svg.setAttribute("data-hover", hit.mark.book); else svg.removeAttribute("data-hover");
    paintHit(svg, hit.mark.book || null);
  }

  function hoverAt(x, y) {
    const tab = panel.active;                       /* read NOW: `draw` replaces `tab.m` on a resize */
    if (!panel.open || !tab || tab.status !== "ready" || !tab.m) { showHover(null, null); return null; }
    const hit = markAt(tab.m, x, y);
    showHover(hit, tab);
    return hit ? { book: hit.mark.book || null, end: hit.end, text: hoverCell.textContent } : null;
  }

  function bindCrosshair() {
    const svg = $("panel-svg");
    svg.addEventListener("pointermove", (ev) => {
      if (ev.pointerType === "touch") return;
      const r = svg.getBoundingClientRect();
      hoverAt(ev.clientX - r.left, ev.clientY - r.top);
    });
    svg.addEventListener("pointerleave", () => { showHover(null, null); });
  }

  /* ---------- comparisons: RECOMPUTED HERE, never a figure the function handed over ----------
   *
   * D-3, option b. A statistics tool's result reaches this page as `{ tool, spec, ids }` and
   * nothing else: the spec it ran on, and the snapshot rows it read. The page fetches those rows
   * with its own key and redoes the arithmetic with the modules inlined above — the same bytes the
   * function ran — exactly as a chart is redrawn from its spec. A number on this screen is a number
   * this page computed.
   *
   * THE ARITHMETIC IS MIRRORED IN ORDER, NOT JUST IN VALUE. `stat_prims.js` rounds each side to
   * four decimals and then subtracts, so `r4(r4(a * scale) - r4(b * scale))` is the expression, not
   * `r4((a - b) * scale)`: the two differ in the last place and the parity test compares them
   * exactly. `test_terminal_page.py` runs `stat_board.js` itself over the same rows and asserts
   * this page's figures equal the function's, book for book — so a change to either side goes red
   * rather than quietly disagreeing on a screen.
   *
   * WHAT IS NOT RECOMPUTED: the refusals. A tool that refused sends no block, and its reason is the
   * status line's, as before. The three comparability rules below (B4, an unusable quote, B6) are
   * applied here because a delta for a bet that is not the same bet must not be drawn at all; they
   * are field comparisons, not arithmetic, and the parity test covers which books they withhold. */
  const r4 = (v) => (typeof v === "number" && isFinite(v) ? Math.round(v * 1e4) / 1e4 : null);
  const diff = (name, unit, va, vb, scale) => {
    const a = r4(va * scale), b = r4(vb * scale);
    return { name: name, unit: unit, a: a, b: b, value: r4(a - b) };
  };
  const COMPARE = {
    board_compare_books: (spec, rows) => {
      const row = rows.filter((r) => r.region === spec.region)[0];
      const board = row ? ChartSpec.panel(row, spec.event, spec.market) : null;
      const a = board ? ChartSpec.quoteFor(board, spec.book_a) : null;
      const b = board ? ChartSpec.quoteFor(board, spec.book_b) : null;
      if (!a || !b || a.fair === null || b.fair === null) return null;
      return {
        head: spec.book_a + " minus " + spec.book_b,
        quantities: [
          diff("fair side A", "pp", a.fair[0], b.fair[0], 100.0),
          diff("hold", "pp", a.hold, b.hold, 100.0),
          diff("price side A", "decimal", a.prices[0], b.prices[0], 1.0),
          diff("price side B", "decimal", a.prices[1], b.prices[1], 1.0)
        ],
        points: []
      };
    },
    board_compare_regions: (spec, rows) => {
      const refRegion = spec.reference_region || "eu";
      const ref = rows.filter((r) => r.region === refRegion)[0];
      const mea = rows.filter((r) => r.region === spec.region)[0];
      const rb = ref ? ChartSpec.panel(ref, spec.event, spec.market) : null;
      const mb = mea ? ChartSpec.panel(mea, spec.event, spec.market) : null;
      if (!rb || !mb || !rb.reference) return null;
      const anchor = rb.reference;
      const points = ChartSpec.everyQuote(mb).map((q) => {
        const withheld = q.isExchange ? "an exchange, never compared (B4)"
          : q.fair === null ? "no usable quote here"
          : q.line !== anchor.line ? "line " + String(q.line) + ", the reference quotes " + String(anchor.line) + " (B6)"
          : null;
        return { book: q.book, unit: "pp", withheld: withheld,
                 value: withheld ? null : r4(BoardQuote.deltaPp(q.fair[0], anchor.fair[0])) };
      });
      return { head: spec.region + " minus " + anchor.book + " (" + refRegion + ")", quantities: [], points: points };
    }
  };

  /* The rendered block. Built from a computed result, so a caller that computed nothing renders
   * nothing — there is no path here that prints a figure without having produced it. */
  function compareBlock(out) {
    const box = document.createElement("div");
    box.className = "compare";
    box.setAttribute("data-compare", "1");
    const head = document.createElement("div");
    head.className = "compare-head";
    head.textContent = out.head;
    box.appendChild(head);
    const line = (label, value, unit, withheld) => {
      const r = document.createElement("div");
      r.className = "compare-row" + (withheld ? " withheld" : "");
      const k = document.createElement("span");
      k.className = "compare-k";
      k.textContent = label;
      const v = document.createElement("span");
      v.className = "compare-v";
      v.textContent = withheld ? withheld
        : (value === null ? "—" : (value > 0 ? "+" : "") + value.toFixed(unit === "pp" ? 2 : 3) + (unit === "pp" ? " pp" : ""));
      r.appendChild(k);
      r.appendChild(v);
      box.appendChild(r);
    };
    out.quantities.forEach((q) => line(q.name, q.value, q.unit, null));
    out.points.forEach((p) => line(p.book, p.value, p.unit, p.withheld));
    return box;
  }

  /* Fetch the rows the tool read, recompute, and put the block in the message. Unknown tools and
   * absent blocks are ignored, which is what the page did with every unread field before this. */
  function renderCompare(parent, rc) {
    if (!parent || !rc || !COMPARE[rc.tool] || !Array.isArray(rc.ids) || !rc.ids.length) return Promise.resolve(null);
    return fetchRows(rc.ids).then((rows) => {
      const out = COMPARE[rc.tool](rc.spec || {}, rows || []);
      if (!out) return null;
      const box = compareBlock(out);
      parent.appendChild(box);
      return box;
    }, () => null);
  }

  /* ---------- messages ---------- */
  function addMessage(role, text, at) {
    const el = document.createElement("div");
    el.className = "msg " + role;
    const meta = document.createElement("div");
    meta.className = "meta";
    meta.textContent = role + (at ? " · " + at.slice(0, 19).replace("T", " ") : "");
    el.appendChild(meta);
    const body = document.createElement("div");
    body.className = "body";
    body.textContent = text || "";
    el.appendChild(body);
    $("messages").appendChild(el);
    return body;
  }

  /* ---------- the turn record: save status and the Record panel ----------
   * specs/turn-record.md §14.1 (save wording), §15 (the panel) and §16.1 (no stored figure). The
   * readers are api.thread_record and api.turn_record. Either may be missing on a page released before
   * its migration: the conversation still works, and the panel says the record is unavailable. */
  const SAVE_TEXT = { false: "Unsaved — no durable record.", unknown: "Not confirmed saved. Reopen the thread to check." };
  const RECORD_HEADER = "What this answer did and read. This record confers nothing.";
  const CONTEXT_NOT_ESTABLISHED = "not established (the turn ended before its context was read)";
  /* §16.1's stored figures. The reader omits them; naming them here means that a reader that let one
   * through still puts nothing of it on the page. */
  const WITHHELD = ["value", "n", "n_units", "row_count", "count_value", "candidate_count", "row_facts"];
  /* models[].fallback_evidence in plain words. It records what was REPORTED, so none_reported says that
   * none was reported, never that none happened. An unlisted value is shown as it came. */
  const FALLBACK_TEXT = { fallback_reported: "fallback reported", none_reported: "fallback: none reported",
                          iterations_not_returned: "fallback not known: the iterations were not returned" };

  function api(name, body) {
    const headers = Object.assign(restHeaders(true), { "Content-Type": "application/json",
                                                       "Accept-Profile": "api", "Content-Profile": "api" });
    return Promise.resolve()
      .then(() => fetch(SUPABASE_URL + "/rest/v1/rpc/" + name, { method: "POST", headers: headers, body: JSON.stringify(body) }))
      .then((r) => {
        if (r.ok) return r.status === 204 ? null : r.json();
        /* The status and PostgREST's error code ride on the error, for a caller that tells a missing
         * reader (404, PGRST202) from a failed one. The message is what it was. */
        return r.text().catch(() => "").then((t) => {
          const e = new Error("HTTP " + r.status + " on " + name);
          e.status = r.status;
          try { e.code = JSON.parse(t).code; } catch (_) { e.code = undefined; }
          throw e;
        });
      });
  }

  /* The working context line. The user's own selection, read by the page from the owner readers
   * api.thread_selection (017) and api.get_investigation (013); nothing here comes from the terminal
   * function or its `done` event. No selection, or a reader this database does not have yet (404 or
   * PGRST202): no line. Any other failed read says so. The newest read wins, and a read for a view that
   * has since changed paints nothing. */
  let contextSeq = 0;
  function clearContext() {
    contextSeq += 1;
    const el = $("context-line");
    el.hidden = true;
    el.textContent = "";
    keepKnown = null;
    withdrawKeep();
  }
  /* Resolves to what the read established about this thread: "none" (it answered, and there is no
   * selection), "selected", or "unknown" (it failed, or this database has no such reader). The Keep
   * control is offered on "none" alone. */
  function refreshContext(threadId) {
    if (!threadId) return Promise.resolve();
    contextSeq += 1;
    const seq = contextSeq;
    const epoch = panel.epoch;
    const current = () => seq === contextSeq && epoch === panel.epoch && currentThread === threadId;
    const paint = (text, inv) => {
      if (!current()) return;
      const el = $("context-line");
      el.textContent = "";
      if (KEEP_ON && inv) {
        /* The flag's form of the same fact, with the way to the Investigation. The workspace may be
         * framing this page, so the link takes the top window. */
        const a = document.createElement("a");
        a.href = WORKSPACE_URL + "?id=" + encodeURIComponent(inv.id);
        a.target = "_top";
        a.textContent = "Open the Investigation";
        el.append("Working in: " + inv.title, a);
      } else {
        el.textContent = text || "";
      }
      el.hidden = !el.textContent;
    };
    return api("thread_selection", { p_thread_id: threadId })
      .then((sel) => {
        if (sel === null || sel === undefined) { paint(""); return "none"; }
        if (typeof sel !== "object" || Array.isArray(sel) || typeof sel.investigation_id !== "string") throw new Error("thread_selection answered an unreadable selection");
        return api("get_investigation", { p_id: sel.investigation_id }).then((inv) => {
          if (!inv || typeof inv !== "object" || typeof inv.title !== "string" || inv.title === "") throw new Error("get_investigation answered no title");
          paint("Selected working context: Investigation \"" + inv.title + "\". Each answer's Record says whether it had it.",
                { id: sel.investigation_id, title: inv.title });
          return "selected";
        });
      })
      .catch((err) => {
        const missing = err && (err.status === 404 || err.code === "PGRST202") && /on thread_selection$/.test(err.message || "");
        paint(missing ? "" : "Working context: not read.");
        return "unknown";
      })
      .then((state) => {
        if (current()) { keepKnown = { threadId: threadId, state: state }; syncKeep(threadId, state); }
        if (current()) proposeContext(threadId, state);
        return state;
      });
  }

  /* ---------- runs where they happened (specs/conversation-readers.md §3) ----------
   * The owner's own read of api.thread_runs (023), whose `record` is api.run_record's answer. A bare
   * "Run completed." line becomes the run's card; a run still pending gets its card under the line that
   * started it and is read again until it is not. With no reader, or a failed read, the lines stay as
   * they are. What a record says is TclRun's (run_card.js); this only places it. */
  const RUN_POLL_MS = 5000;
  const RUN_POLL_MAX = 40;                 /* 200 s: past the 150 s deadline after which a run reads lost */
  const versionWords = new Map();
  function modelWordsOf(versionId) {
    if (typeof versionId !== "string" || !versionId) return Promise.resolve(null);
    if (!versionWords.has(versionId)) {
      versionWords.set(versionId, api("get_model_version", { p_version_id: versionId })
        .then((v) => (v && typeof v.content === "string" ? TclRun.modelWords(v.content) : null))
        .catch(() => { versionWords.delete(versionId); return null; }));
    }
    return versionWords.get(versionId);
  }
  function paintRun(card, record, gaveUp) {
    /* A refused or not-evaluated run's stored reason, in a sentence, where the record carries a code the closed
     * table knows (api.run_record's `reason_code`, migration 024). No code, or one outside the table: describe's
     * own answer, the sentence this card has always had. */
    const d = TclRun.describeWithReason(record);
    /* The pending sentence promises another read. Once this page has stopped reading, it says that instead. */
    if (d.pending && gaveUp) d.sentence = TclRun.PENDING_GAVE_UP;
    card.textContent = "";
    card.setAttribute("data-status", d.status || "unread");
    const head = keepNode("div", "run-card-head");
    head.appendChild(keepNode("span", "run-chip " + (d.status || "unread"), d.title));
    if (d.score) head.appendChild(keepNode("span", "run-chip klass", d.score.klass));
    const model = keepNode("span", "run-model");
    head.appendChild(model);
    card.appendChild(head);
    card.appendChild(keepNode("p", "run-sentence", d.sentence));
    if (d.score) {
      /* The class is in the head, the disclosure is the next line, and the figures follow: one block. */
      card.appendChild(keepNode("p", "run-disclosure", d.score.disclosure));
      const box = keepNode("div", "run-score");
      box.appendChild(keepNode("p", "run-score-name", d.score.name));
      [[TclRun.LABELS.candidate, d.score.candidate, "candidate"], [TclRun.LABELS.baseline, d.score.baseline, "baseline"]].forEach((b) => {
        const bar = keepNode("div", "run-bar");
        bar.setAttribute("data-bar", b[2]);
        bar.appendChild(keepNode("span", "run-bar-label", b[0]));
        if (d.score.chart.bars) {
          const track = keepNode("span", "run-bar-track");
          const fill = keepNode("span", "run-bar-fill " + b[2]);
          fill.style.width = d.score.chart.bars[b[2]].toFixed(2) + "%";
          track.appendChild(fill);
          bar.appendChild(track);
        }
        bar.appendChild(keepNode("span", "run-bar-value", b[1]));
        box.appendChild(bar);
      });
      box.appendChild(keepNode("p", "run-difference", d.score.difference));
      const iv = d.score.chart.interval;
      if (iv) {
        const strip = keepNode("div", "run-interval");
        const at = (className, left, text) => {
          const el = keepNode("div", className, text);
          el.style.left = left.toFixed(2) + "%";
          strip.appendChild(el);
          return el;
        };
        strip.appendChild(keepNode("div", "axis"));
        at("band", iv.lo).style.width = (iv.hi - iv.lo).toFixed(2) + "%";
        at("mean", iv.mean);
        at("zero", iv.zero);
        at("lo", iv.lo, d.score.lo);
        at("hi", iv.hi, d.score.hi);
        at("nought", iv.zero, "0");
        box.appendChild(strip);
        box.appendChild(keepNode("p", "run-axis-note", "Left of 0, your model scored lower (better). At 0 there is no difference."));
      }
      card.appendChild(box);
      card.appendChild(keepNode("p", "run-direction", d.score.direction));
      card.appendChild(keepNode("p", "run-counts", d.score.counts));
    }
    if (record && typeof record === "object") {
      modelWordsOf(record.source_version_id).then((words) => { if (words && model.isConnected) model.textContent = words; });
    }
    return d;
  }
  function placeRun(record, threadId, epoch, polls) {
    /* A record this page does not know how to read places nothing: the line it would replace is true, and
     * "could not be read" in its place would be a worse account of the run than the line. */
    if (TclRun.describe(record).status === null) return;
    const find = (id) => {
      const line = TclRun.lineId(id);
      return line === null ? null : $("messages").querySelector('.run-line[data-message="' + line + '"]');
    };
    let card = $("messages").querySelector('.run-card[data-run="' + record.run_ref + '"]');
    if (!card) {
      const delivery = find(record.delivery_message_id);
      const command = find(record.command_message_id);
      if (!delivery && !command) return;
      card = keepNode("div", "run-card");
      card.setAttribute("data-run", record.run_ref);
      if (delivery) {
        delivery.textContent = "";
        delivery.classList.add("has-card");
        delivery.appendChild(card);
      } else {
        command.after(card);
      }
    }
    if (paintRun(card, record, polls >= RUN_POLL_MAX).pending && polls < RUN_POLL_MAX) {
      setTimeout(() => pollRun(record.run_ref, threadId, epoch, polls + 1), RUN_POLL_MS);
    }
  }
  function pollRun(runRef, threadId, epoch, polls) {
    if (epoch !== panel.epoch || currentThread !== threadId) return;
    api("run_record", { p_run_ref: runRef })
      .then((record) => {
        if (epoch !== panel.epoch || currentThread !== threadId) return;
        if (record && typeof record === "object" && record.run_ref === runRef) placeRun(record, threadId, epoch, polls);
      })
      .catch(() => {
        if (polls < RUN_POLL_MAX) { setTimeout(() => pollRun(runRef, threadId, epoch, polls + 1), RUN_POLL_MS); return; }
        /* The last read failed too: the card stops promising another. */
        const sentence = $("messages").querySelector('.run-card[data-run="' + runRef + '"][data-status="pending"] .run-sentence');
        if (sentence && epoch === panel.epoch && currentThread === threadId) sentence.textContent = TclRun.PENDING_GAVE_UP;
      });
  }
  let runsMissing = false;
  function loadRuns(threadId, epoch) {
    if (runsMissing) return Promise.resolve();
    return api("thread_runs", { p_thread_id: threadId })
      .then((rows) => {
        if (epoch !== panel.epoch || currentThread !== threadId) return;
        const runs = TclRun.runsOf(rows);
        runs.forEach((row) => placeRun(row.record, threadId, epoch, 0));
        /* The thread opened at its end before these cards had any height; it is at its end again. */
        if (runs.length) scrollDown();
        proposeRuns(threadId, epoch, runs);
      })
      .catch((err) => { if (err && (err.status === 404 || err.code === "PGRST202")) runsMissing = true; });
  }

  /* ---------- a proposed model: the card, and the click that saves and runs it (specs/model-proposal.md) ----------
   * This block is put into the page only by terminal.render(propose=True); without the flag none of it is here.
   * The assistant's propose_model tool saved nothing and ran nothing. The card is drawn from the tool's stored
   * input, read by TclPropose (propose_flow.js) with the save act's own rules, and the bytes are built here. One
   * click records two of the user's own acts: api.save_model_version, then the run-start function. What the card
   * says about the Investigation comes from the page's own read of the selection, never from the function. */
  const PROPOSE_UUID = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
  const PROPOSE_START_TIMEOUT_MS = 30000;
  const PROPOSE_INPUT_TEXT = {
    mkt: "the fixture's market price. Synthetic, not a market observation.",
    sig: "the fixture's signal. Synthetic.",
    late: "a signal recorded after the reference time. The evaluation refuses a run that uses it."
  };
  const PROPOSE_DOING = { check: "reading this conversation's context", save: "saving the model", start: "starting the run" };
  const PROPOSE_SAVE_REFUSALS = {
    document_invalid: "The service refused this model, so nothing was saved and nothing was run.",
    idempotency_conflict: "This save conflicted with an earlier request, so nothing was saved and nothing was run. Try again."
  };
  const PROPOSE_START_REFUSALS = {
    stale_selection: "This conversation's context changed since this card showed it. The model was saved; no run was started. The card now shows the context in force.",
    selection_required: "This conversation is not in an Investigation now. The model was saved; no run was started.",
    target_not_selected: "This conversation no longer works in that Investigation. The model was saved; no run was started.",
    target_unavailable: "That conversation, Investigation or model is not available to this account. The model was saved; no run was started.",
    idempotency_conflict: "This start conflicted with an earlier request. The model was saved; no run was started. Try again."
  };
  /* The proposal a live turn's tool_result carried, by its answer element, until `done` says the answer is stored. */
  const proposeHeardBy = new WeakMap();
  /* The attempt, held here as well as in storage: a browser that refuses the write must still resend the same
   * keys on "Try again" within this page. */
  const proposeHeld = new Map();
  let proposeCards = [];
  let proposeBusy = false;
  let proposeSeq = 0;
  /* What the newest context read established for a thread: { threadId, state, ctx }. `ctx` is the selection in
   * force and its Investigation's name, and is what a click sends as the selection this card displayed. */
  let proposeShown = null;

  function proposeOwner() { return session && session.user ? session.user.id : null; }
  function proposeLoad(card) {
    const owner = proposeOwner();
    const stored = TclPropose.load(keepStore(), card.threadId, card.messageId, owner, card.p.content);
    if (stored) return stored;
    const held = proposeHeld.get(card.threadId + "." + card.messageId);
    return TclPropose.valid(held, card.threadId, card.messageId, owner, card.p.content) ? held : null;
  }
  function proposeSave(attempt) {
    proposeHeld.set(attempt.thread_id + "." + attempt.message_id, attempt);
    TclPropose.save(keepStore(), attempt);
  }

  /* A stored answer: its last valid proposal, unless the turn ended in an error. */
  function proposeFromRow(msgEl, m) {
    if (!m || m.role !== "assistant" || !m.trace || m.trace.error || !currentThread) return;
    const p = TclPropose.lastOf(m.trace.tool_calls);
    if (p) proposeCard(msgEl, currentThread, m.id, p);
  }
  /* A live turn: the function's echo of the input it accepted, read with the reader a stored call gets. */
  function proposeHeard(msgEl, d) {
    if (!d || d.name !== TclPropose.TOOL || d.ok !== true) return;
    const p = TclPropose.read(d.proposal);
    if (p) proposeHeardBy.set(msgEl, p);
  }
  /* The card waits for `done`: an answer that failed, or was not stored, is not one to build from. */
  function proposeAtDone(msgEl, d, epoch) {
    const p = proposeHeardBy.get(msgEl);
    if (!p || !d || d.ok !== true || epoch !== panel.epoch || !currentThread) return;
    if (TclPropose.messageKey(d.message_id) === null || ("persisted" in d && d.persisted !== true)) return;
    proposeCard(msgEl, currentThread, d.message_id, p);
    scrollDown();
  }

  function proposeCard(msgEl, threadId, messageId, p) {
    const key = TclPropose.messageKey(messageId);
    const words = TclRun.modelWords(p.content);
    if (!msgEl || key === null || !words) return null;
    const el = keepNode("div", "proposal");
    el.setAttribute("data-proposal", key);
    /* Above the answer's Record where a live turn has already added one, as a reopened conversation has it. */
    const record = msgEl.querySelector("details.record");
    if (record && record.parentNode === msgEl) msgEl.insertBefore(el, record); else msgEl.appendChild(el);
    const card = { el: el, threadId: threadId, messageId: key, p: p, words: words, epoch: panel.epoch,
                   matched: false, busy: false, said: null };
    proposeCards = proposeCards.filter((c) => c.el.isConnected);
    proposeCards.push(card);
    proposePaint(card);
    /* The context read may have answered before this card was here, and said only that there is a selection. */
    if (proposeShown && proposeShown.threadId === threadId && proposeShown.state === "selected" && !proposeShown.ctx && !proposeShown.reading) {
      proposeShown.reading = true;
      proposeContext(threadId, "selected");
    }
    return card;
  }

  /* refreshContext's answer for this thread. "selected" is read again here for the two ids a start sends and
   * the Investigation's name, and only when a card is there to use them. */
  function proposeContext(threadId, state) {
    proposeSeq += 1;
    const seq = proposeSeq;
    proposeCards = proposeCards.filter((c) => c.el.isConnected);
    const settle = (shown) => {
      if (seq !== proposeSeq) return;
      proposeShown = shown;
      proposeCards.forEach((c) => { if (c.threadId === threadId && c.el.isConnected) proposePaint(c); });
    };
    if (state !== "selected" || !proposeCards.some((c) => c.threadId === threadId)) {
      settle({ threadId: threadId, state: state, ctx: null });
      return Promise.resolve();
    }
    return api("thread_selection", { p_thread_id: threadId })
      .then((sel) => {
        if (sel === null || sel === undefined) return { threadId: threadId, state: "none", ctx: null };
        if (typeof sel !== "object" || !PROPOSE_UUID.test(sel.selection_act_id) || !PROPOSE_UUID.test(sel.investigation_id)) throw new Error("unreadable selection");
        return api("get_investigation", { p_id: sel.investigation_id }).then((inv) => {
          if (!inv || typeof inv.title !== "string" || inv.title === "") throw new Error("no title");
          return { threadId: threadId, state: "selected",
                   ctx: { selection_act_id: sel.selection_act_id, investigation_id: sel.investigation_id, title: inv.title } };
        });
      })
      .catch(() => ({ threadId: threadId, state: "unknown", ctx: null }))
      .then(settle);
  }

  /* The conversation's runs, as loadRuns just read them. A card with no finished attempt in this browser is
   * compared, in words, with the saved model of each run. A match is of content, never of identity. */
  function proposeRuns(threadId, epoch, runs) {
    const cards = proposeCards.filter((c) => c.el.isConnected && c.threadId === threadId && !c.matched);
    if (!cards.length || !runs.length) return;
    Promise.all(runs.map((row) => modelWordsOf(row.record && row.record.source_version_id))).then((words) => {
      if (epoch !== panel.epoch || currentThread !== threadId) return;
      cards.forEach((c) => {
        if (words.indexOf(c.words) === -1) return;
        c.matched = true;
        if (c.el.isConnected && !c.busy) proposePaint(c);
      });
    });
  }

  function proposeRow(list, label, values) {
    const row = keepNode("div", "proposal-row");
    row.appendChild(keepNode("span", "proposal-key", label));
    const val = keepNode("span", "proposal-val");
    values.forEach((text) => val.appendChild(keepNode("span", "", text)));
    row.appendChild(val);
    list.appendChild(row);
  }

  function proposePaint(card) {
    if (card.p.spec) return specPaint(card);
    const el = card.el;
    const attempt = proposeLoad(card);
    const outcome = attempt && attempt.run_ref ? attempt.outcome : null;
    const saved = !!(attempt && attempt.version_id);
    const shown = proposeShown && proposeShown.threadId === card.threadId ? proposeShown : null;
    el.textContent = "";
    el.setAttribute("data-state", outcome || (saved ? "saved" : "proposed"));
    const head = keepNode("div", "proposal-head");
    head.appendChild(keepNode("span", "run-chip proposal-chip", "Proposed model"));
    head.appendChild(keepNode("span", "run-chip", outcome === "started" ? "Saved · run started"
      : outcome === "not_started" ? "Saved · run not started" : saved ? "Saved · not run" : "Not saved"));
    el.appendChild(head);
    el.appendChild(keepNode("div", "proposal-title", card.words));
    el.appendChild(keepNode("p", "proposal-reason", card.p.reason));
    const list = keepNode("div", "proposal-rows");
    proposeRow(list, "Dataset", ["Synthetic fixture, 8 events. Not real games."]);
    proposeRow(list, "Inputs", card.p.features.map((name) => name + ": " + PROPOSE_INPUT_TEXT[name]));
    proposeRow(list, "Family", ["Logistic regression, penalty " + card.p.l2 + "."]);
    proposeRow(list, "Compared with", ["The market input alone."]);
    proposeRow(list, "Can produce", ["A synthetic backtest. Not prospective evidence, and no decision rests on it."]);
    el.appendChild(list);

    const say = (text) => el.appendChild(keepNode("p", "proposal-note", text));
    let button = null;
    if (outcome === "started") {
      say("You saved this model and started a run of it from this card. The run's result is shown where it ran, further down this conversation.");
    } else if (outcome === "not_started") {
      say("You saved this model from this card. Its run was recorded but could not be started, and it will read as lost at its deadline.");
    } else if (!shown) {
      say("Reading this conversation's context.");
    } else if (shown.state === "none") {
      say("A run happens in an Investigation, and this conversation is not in one. Keep this conversation as an Investigation first" +
          (KEEP_ON ? ", with the control under the newest answer" : ", from the workspace") + ". This card then offers Save and run.");
    } else if (shown.state !== "selected" || !shown.ctx) {
      say(shown.state === "selected" ? "Reading this conversation's context."
        : "This conversation's context could not be read, so Save and run is not offered. Reopen the conversation to read it again.");
    } else {
      if (card.matched && !attempt) {
        say("A run of a model with these same inputs and penalty was already started from this conversation, and its result is shown where it ran. This card cannot tell whether that run came from this proposal.");
      }
      el.appendChild(keepNode("p", "proposal-records", saved
        ? "This model is already saved as a version. One click records one thing: a run of it started in the Investigation \"" + shown.ctx.title + "\". Nothing is shared."
        : "One click records two things: this model saved as a version, and a run of it started in the Investigation \"" + shown.ctx.title + "\". Nothing is shared."));
      const actions = keepNode("div", "proposal-actions");
      button = keepNode("button", card.matched && !attempt ? "" : "fill",
                        saved ? "Start the run" : card.matched && !attempt ? "Save and run again" : "Save and run");
      button.type = "button";
      button.setAttribute("data-proposal-go", card.messageId);
      button.disabled = card.busy || proposeBusy;
      button.addEventListener("click", () => proposeGo(card));
      actions.appendChild(button);
      el.appendChild(actions);
    }
    const status = keepNode("p", "proposal-status" + (card.said && card.said.bad ? " bad" : ""), card.said ? card.said.text : "");
    status.setAttribute("role", "status");
    el.appendChild(status);
    return button;
  }

  /* The run-start function, called as the workspace page calls it. A request that never answers has an unknown
   * outcome, which is what a dropped connection is, and the same key is sent again. */
  function proposeStart(body) {
    const call = fetch(SUPABASE_URL + "/functions/v1/run-start", {
      method: "POST",
      headers: { "apikey": SUPABASE_KEY, "Authorization": "Bearer " + session.access_token,
                 "Content-Type": "application/json", "Accept": "application/json" },
      body: JSON.stringify(body)
    }).then((r) => r.json().catch(() => null).then((payload) => {
      if (r.ok) return payload;
      const e = new Error("HTTP " + r.status + " on run-start");
      e.status = r.status;
      e.code = payload && typeof payload.error === "string" ? payload.error : undefined;
      throw e;
    }));
    return Promise.race([call, new Promise((_, reject) => {
      setTimeout(() => reject(new Error("no answer from run-start")), PROPOSE_START_TIMEOUT_MS);
    })]);
  }

  function proposeSaid(out) {
    const doing = PROPOSE_DOING[out.step] || "recording";
    if (out.status === "started") {
      return { bad: false, text: out.how === "replay" ? "This start was already accepted. Its run is shown below."
        : out.how === "unconfirmed" ? "Saved, and the run was started, but the service's answer was lost. Its state shows below."
        : "Saved, and the run started. Its result comes back below." };
    }
    if (out.status === "not_started") return { bad: true, text: "Saved. The run could not be started; it will be recorded as lost at its deadline." };
    if (out.status === "no_context") return { bad: true, text: "This conversation is not in an Investigation now, so this click recorded nothing." };
    if (out.status === "context_changed") return { bad: true, text: "This conversation's context changed since this card showed it, so this click recorded nothing. The card now shows the context in force." };
    if (out.status === "refused" && out.step === "save") return { bad: true, text: PROPOSE_SAVE_REFUSALS[out.code] || "The save was refused, so nothing was saved and nothing was run." };
    if (out.status === "refused") return { bad: true, text: PROPOSE_START_REFUSALS[out.code] || "The start was refused. The model was saved; no run was started." };
    const kept = out.step === "start" ? " The model was saved." : "";
    if (out.kind === "network") return { bad: true, text: "The connection dropped while " + doing + ". Try again repeats this request; it cannot save or start anything twice." };
    if (out.kind === "server") return { bad: true, text: "The service did not answer while " + doing + ". Try again repeats this request; it cannot save or start anything twice." };
    if (out.kind === "auth") return { bad: true, text: "Your sign-in was not accepted while " + doing + ". Sign in again, then try again." };
    if (out.kind === "unavailable") return { bad: true, text: "This step is not served here, so " + doing + " did not happen." + kept };
    return { bad: true, text: "The service's answer while " + doing + " could not be used." + kept + " Try again repeats this request." };
  }

  function proposeGo(card) {
    const shown = proposeShown && proposeShown.threadId === card.threadId ? proposeShown : null;
    const owner = proposeOwner();
    if (proposeBusy || !shown || shown.state !== "selected" || !shown.ctx || !owner || card.threadId !== currentThread) return;
    let attempt = proposeLoad(card);
    if (!attempt) {
      attempt = TclPropose.fresh(card.threadId, card.messageId, owner, card.p.content, () => crypto.randomUUID());
      proposeSave(attempt);
    }
    proposeBusy = true;
    card.busy = true;
    card.said = { bad: false, text: "Recording…" };
    proposePaint(card);
    const hooks = { uuid: () => crypto.randomUUID(), persist: proposeSave,
                    step: (name, state) => {
                      if (state !== "working" || !card.el.isConnected) return;
                      const status = card.el.querySelector(".proposal-status");
                      if (status) status.textContent = name === "save" ? "Saving the model…" : "Starting the run…";
                    } };
    refreshIfNeeded()
      .then((ok) => (ok ? TclPropose.run(attempt, shown.ctx, { api: keepApi, start: proposeStart }, hooks)
                        : { status: "failed", step: "check", kind: "auth" }))
      .catch(() => ({ status: "failed", step: "check", kind: "network" }))
      .then((out) => {
        proposeBusy = false;
        card.busy = false;
        card.said = proposeSaid(out);
        proposeCards.forEach((c) => { if (c.el.isConnected) proposePaint(c); });
        if (out.status === "started" || out.status === "not_started") { proposeShowRun(card.threadId, card.epoch, out.run_ref); return; }
        /* Whatever was refused about the context, the page reads it again and the card follows that read. */
        if (currentThread === card.threadId && (out.status === "no_context" || out.status === "context_changed" ||
                                                (out.status === "refused" && out.step === "start"))) refreshContext(card.threadId);
      });
  }

  /* The run's line. start_run wrote a command message this view has not read: it is read here, by the id the
   * run's own record names, and put where openThread would have put it. Then the existing run card takes over. */
  function proposeShowRun(threadId, epoch, runRef) {
    const here = () => epoch === panel.epoch && currentThread === threadId;
    if (!here()) return Promise.resolve();
    return api("thread_runs", { p_thread_id: threadId })
      .then((rows) => {
        const row = TclRun.runsOf(rows).filter((r) => r.run_ref === runRef)[0];
        const id = row ? TclRun.lineId(row.record.command_message_id) : null;
        if (id === null || !here() || $("messages").querySelector('.run-line[data-message="' + id + '"]')) return undefined;
        return rest("messages?select=id,content,kind&id=eq." + id, true).then((found) => {
          const m = Array.isArray(found) ? found[0] : null;
          if (!m || m.kind !== "command" || !here() || $("messages").querySelector('.run-line[data-message="' + id + '"]')) return;
          const line = keepNode("div", "run-line");
          line.setAttribute("data-message", id);
          line.append(keepNode("span", "meta", "Run"), " ", keepNode("span", "", m.content || ""));
          $("messages").appendChild(line);
        });
      })
      .catch(() => undefined)
      .then(() => (here() ? loadRuns(threadId, epoch) : undefined))
      .then(() => { if (here()) scrollDown(); });
  }

  /* For a test that drives this page's own bytes: the cards in view, and a card drawn from a stored row. */
  window.__terminalPropose = {
    cards: function () {
      return proposeCards.filter((c) => c.el.isConnected).map((c) => ({ message: c.messageId, state: c.el.getAttribute("data-state"),
        words: c.words, content: c.p.content, offered: !!c.el.querySelector("[data-proposal-go]"), text: c.el.textContent }));
    },
    context: function () { return proposeShown; }
  };

  /* ---------- a proposed composable model: its card (specs/model-spec-assistant.md) ----------
   * This block is put into the page only by terminal.render(propose=True, model_spec=True); without the flag none
   * of it is here, and the proposal card above is exactly what it was. The assistant's propose_model tool gave
   * PARTS and saved nothing. The card is drawn from the tool's stored input, read here by TclModelParts and checked
   * by TclModelSpec against TclDatasets' description: the same three scripts the terminal function ran, inlined
   * above. The document, its words, its cost and every refusal shown are this page's own reading. The click, the
   * attempt and the context are the proposal card's (TclPropose.run and the functions above), unchanged. */
  const SPEC_EVIDENCE = {
    synthetic_backtest: "A synthetic backtest. Not prospective evidence, and no decision rests on it.",
    historical_backtest: "A historical backtest: the outcomes were known when it ran. Not prospective evidence."
  };
  const SPEC_NO_REFUSAL = "This page checked the model against the dataset's description and found nothing a run would be refused for. " +
    "The evaluation can still refuse a run for what the data itself shows.";
  const SPEC_NOT_STORED = "The service refused to save this model, so nothing was saved and nothing was run. This page checked the document " +
    "before sending it and found nothing wrong with it. A service that has not yet been updated to store this kind of model refuses every one of them this way.";
  const specHeardBy = new WeakMap();

  /* A propose_model input as this page reads it: what the proposal card holds, with the reading beside it. null
   * for anything that is not a valid proposal, the old kind's input included. Never throws: a stored call this
   * page cannot read draws no card. */
  function specRead(input) {
    try {
      const r = TclModelParts.read(input, TclModelSpec, TclDatasets.get);
      return r.ok ? { content: r.text, reason: r.reason, spec: r } : null;
    } catch (e) { return null; }
  }
  /* A stored answer: its last valid proposal, unless the turn ended in an error. */
  function specFromRow(msgEl, m) {
    if (!m || m.role !== "assistant" || !m.trace || m.trace.error || !currentThread) return;
    let found = null;
    (Array.isArray(m.trace.tool_calls) ? m.trace.tool_calls : []).forEach((call) => {
      const p = call && call.name === TclModelParts.TOOL ? specRead(call.input) : null;
      if (p) found = p;
    });
    if (found) proposeCard(msgEl, currentThread, m.id, found);
  }
  /* A live turn: the function's echo of the input it was given, read with the reader a stored call gets. */
  function specHeard(msgEl, d) {
    if (!d || d.name !== TclModelParts.TOOL || d.ok !== true || !d.model_spec) return;
    const p = specRead(d.model_spec);
    if (p) specHeardBy.set(msgEl, p);
  }
  /* The card waits for `done`, as the proposal card does: a failed or unsaved answer is not one to build from. */
  function specAtDone(msgEl, d, epoch) {
    const p = specHeardBy.get(msgEl);
    if (!p || !d || d.ok !== true || epoch !== panel.epoch || !currentThread) return;
    if (TclPropose.messageKey(d.message_id) === null || ("persisted" in d && d.persisted !== true)) return;
    proposeCard(msgEl, currentThread, d.message_id, p);
    scrollDown();
  }

  /* A count with its thousands apart, written here so that it reads the same in every browser. */
  function specCount(n) {
    return typeof n === "number" && isFinite(n) ? String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ",") : "not counted";
  }

  function specPaint(card) {
    const el = card.el;
    const spec = card.p.spec;
    const rows = spec.rows;
    const about = spec.description;
    const attempt = proposeLoad(card);
    const outcome = attempt && attempt.run_ref ? attempt.outcome : null;
    const saved = !!(attempt && attempt.version_id);
    const shown = proposeShown && proposeShown.threadId === card.threadId ? proposeShown : null;
    const refusedBefore = spec.refusals.length > 0;
    el.textContent = "";
    el.setAttribute("data-state", outcome || (saved ? "saved" : "proposed"));
    el.setAttribute("data-model-schema", TclModelParts.SCHEMA);
    const head = keepNode("div", "proposal-head");
    head.appendChild(keepNode("span", "run-chip proposal-chip", "Proposed model"));
    head.appendChild(keepNode("span", "run-chip", outcome === "started" ? "Saved · run started"
      : outcome === "not_started" ? "Saved · run not started" : saved ? "Saved · not run" : "Not saved"));
    if (refusedBefore && !outcome) head.appendChild(keepNode("span", "run-chip proposal-chip-refused", "A run would be refused"));
    el.appendChild(head);
    el.appendChild(keepNode("div", "proposal-title", card.words));
    el.appendChild(keepNode("p", "proposal-reason", card.p.reason));
    const list = keepNode("div", "proposal-rows");
    proposeRow(list, "Dataset", [spec.dataset.id + ", version " + spec.dataset.version + "."].concat(typeof about.summary === "string" ? [about.summary] : []));
    proposeRow(list, "Model", [rows.sentences[0]]);
    if (rows.inputs.length) proposeRow(list, "Built inputs", rows.inputs.map((input) => input.id + ": " + input.words + "."));
    proposeRow(list, rows.fits.length === 1 ? "Fit" : "Fits", rows.fits.map((fit) => fit.family + " on " + fit.features.join(", ") +
      ". Penalty " + fit.penalty + ". " + fit.window + "."));
    if (rows.blend) proposeRow(list, "Blend", [rows.blend + "."]);
    if (rows.calibration) proposeRow(list, "Calibration", [rows.calibration + "."]);
    if (about.baseline && typeof about.baseline.input === "string") proposeRow(list, "Compared with", ["The dataset's market input alone (" + about.baseline.input + ")."]);
    proposeRow(list, "Can produce", [SPEC_EVIDENCE[spec.dataset.evidence_class] || String(spec.dataset.evidence_class)]);
    proposeRow(list, "Size", ["A count of " + specCount(spec.cost) + ". This dataset allows one run " + specCount(spec.budget) + "."]);
    proposeRow(list, "Before a run", refusedBefore ? spec.refusals.map((r) => r.sentence) : [SPEC_NO_REFUSAL]);
    if (refusedBefore) list.lastChild.classList.add("proposal-row-refused");
    el.appendChild(list);

    const say = (text) => el.appendChild(keepNode("p", "proposal-note", text));
    let button = null;
    if (outcome === "started") {
      say("You saved this model and started a run of it from this card. The run's result is shown where it ran, further down this conversation.");
    } else if (outcome === "not_started") {
      say("You saved this model from this card. Its run was recorded but could not be started, and it will read as lost at its deadline.");
    } else if (refusedBefore) {
      say("A run of this model would be refused for the reason" + (spec.refusals.length === 1 ? "" : "s") +
          " under \"Before a run\", so this card does not offer Save and run. Ask the assistant to change the model.");
    } else if (!shown) {
      say("Reading this conversation's context.");
    } else if (shown.state === "none") {
      say("A run happens in an Investigation, and this conversation is not in one. Keep this conversation as an Investigation first" +
          (KEEP_ON ? ", with the control under the newest answer" : ", from the workspace") + ". This card then offers Save and run.");
