    } else if (shown.state !== "selected" || !shown.ctx) {
      say(shown.state === "selected" ? "Reading this conversation's context."
        : "This conversation's context could not be read, so Save and run is not offered. Reopen the conversation to read it again.");
    } else {
      if (card.matched && !attempt) {
        say("A run of a model that reads the same in words was already started from this conversation, and its result is shown where it ran. This card cannot tell whether that run came from this proposal.");
      }
      el.appendChild(keepNode("p", "proposal-records", saved
        ? "This model is already saved as a version. One click records one thing: a run of it started in the Investigation \"" + shown.ctx.title + "\". Nothing is shared."
        : "One click records two things: this model saved as a version, and a run of it started in the Investigation \"" + shown.ctx.title + "\". Nothing is shared."));
      const actions = keepNode("div", "proposal-actions");
      button = keepNode("button", card.matched && !attempt ? "" : "fill",
                        saved ? "Start the run" : card.matched && !attempt ? "Save and run again" : "Save and run");
      button.type = "button";
      button.setAttribute("data-proposal-go", card.messageId);
      button.disabled = card.busy || proposeBusy;
      button.addEventListener("click", () => specGo(card));
      actions.appendChild(button);
      el.appendChild(actions);
    }
    const status = keepNode("p", "proposal-status" + (card.said && card.said.bad ? " bad" : ""), card.said ? card.said.text : "");
    status.setAttribute("role", "status");
    el.appendChild(status);
    return button;
  }

  /* What a finished click says. A save the database refused is said in full: until the release that stores this
   * kind of model, every one of them is refused that way, and the card must not read as broken. Where the service
   * gave its reason beside the refusal, that reason's own sentence is shown. */
  function specSaid(card, out) {
    if (out.status === "refused" && out.step === "save" && out.code === "document_invalid") {
      const why = typeof card.saveReason === "string" && Object.prototype.hasOwnProperty.call(TclModelParts.SENTENCES, card.saveReason)
        ? TclModelParts.sentenceOf({ code: card.saveReason, where: "" }, null) : null;
      return { bad: true, text: why === null ? SPEC_NOT_STORED
        : "The service refused to save this model, so nothing was saved and nothing was run. Its reason: " + why };
    }
    return proposeSaid(out);
  }

  /* The click: the proposal card's, with two things this kind of model needs. The run names the document's own
   * dataset and the described version, where propose_flow.js names the old fixture; and a refused save's reason,
   * which that flow does not pass on, is kept for the sentence above. */
  function specGo(card) {
    const shown = proposeShown && proposeShown.threadId === card.threadId ? proposeShown : null;
    const owner = proposeOwner();
    const spec = card.p.spec;
    if (proposeBusy || spec.refusals.length || !shown || shown.state !== "selected" || !shown.ctx || !owner || card.threadId !== currentThread) return;
    let attempt = proposeLoad(card);
    if (!attempt) {
      attempt = TclPropose.fresh(card.threadId, card.messageId, owner, card.p.content, () => crypto.randomUUID());
      proposeSave(attempt);
    }
    proposeBusy = true;
    card.busy = true;
    card.saveReason = null;
    card.said = { bad: false, text: "Recording…" };
    specPaint(card);
    const hooks = { uuid: () => crypto.randomUUID(), persist: proposeSave,
                    step: (name, state) => {
                      if (state !== "working" || !card.el.isConnected) return;
                      const status = card.el.querySelector(".proposal-status");
                      if (status) status.textContent = name === "save" ? "Saving the model…" : "Starting the run…";
                    } };
    const calls = {
      api: (name, body) => keepApi(name, body).then((row) => {
        if (name === "save_model_version" && row && row.status === "refused") card.saveReason = typeof row.reason === "string" ? row.reason : null;
        return row;
      }),
      start: (body) => proposeStart(Object.assign({}, body, { fixture_id: spec.dataset.id, fixture_version: spec.dataset.version }))
    };
    refreshIfNeeded()
      .then((ok) => (ok ? TclPropose.run(attempt, shown.ctx, calls, hooks) : { status: "failed", step: "check", kind: "auth" }))
      .catch(() => ({ status: "failed", step: "check", kind: "network" }))
      .then((out) => {
        proposeBusy = false;
        card.busy = false;
        card.said = specSaid(card, out);
        proposeCards.forEach((c) => { if (c.el.isConnected) proposePaint(c); });
        if (out.status === "started" || out.status === "not_started") { proposeShowRun(card.threadId, card.epoch, out.run_ref); return; }
        if (currentThread === card.threadId && (out.status === "no_context" || out.status === "context_changed" ||
                                                (out.status === "refused" && out.step === "start"))) refreshContext(card.threadId);
      });
  }

  /* ---------- a saved chart of a run's diagnostics (specs/chart-views.md, specs/chart-wiring.md) ----------
   * Drawn by the page from the run's stored outputs, read under the reader's own sign-in, under the answer it was
   * shown with. The terminal function sends no figure and no row; TclViews (terminal_views.js) says every state. */
  const tclViews = TclViews.create({ viewSpec: TclViewModules.viewSpec, draw: TclViewModules.draw,
                                     runOutputs: (ref) => api("run_outputs", { p_run_ref: ref }),
                                     threadViews: (id) => api("thread_views", { p_thread_id: id }) });
  function viewsMount(threadId, epoch) {
    return tclViews.mountThread(threadId, (item) => {
      if (epoch !== panel.epoch || currentThread !== threadId) return null;
      const msg = Array.from($("messages").querySelectorAll(".msg.assistant[data-message]"))
        .find((el) => el.getAttribute("data-message") === String(item.message_id));
      if (!msg) return null;
      let box = Array.from(msg.children).find((el) => el.className === "views");
      if (!box) { box = document.createElement("div"); box.className = "views"; msg.appendChild(box); }
      const key = String(item.turn_id) + ":" + String(item.ordinal);
      if (Array.from(box.children).some((el) => el.getAttribute("data-view-key") === key)) return null;
      const el = document.createElement("div");
      el.setAttribute("data-view-key", key);
      el.setAttribute("data-view-ordinal", String(item.ordinal));
      const after = Array.from(box.children).find((c) => Number(c.getAttribute("data-view-ordinal")) > Number(item.ordinal));
      box.insertBefore(el, after || null);
      return el;
    }).catch(() => undefined);
  }
  /* ---------- keep this conversation as an Investigation (specs/keep-as-investigation.md) ----------
   * One click, three existing acts, each its own record: TclKeep (keep_flow.js) runs them and keeps
   * the attempt, and this is only its face. The row sits under the newest answer and is offered only
   * when the page's own read said the thread has no selection. What the line above says afterwards
   * comes from refreshContext's read, never from this flow's belief. */
  const KEEP_DOING = { check: "reading this conversation's context", create: "creating the Investigation",
                       link: "adding this conversation", select: "setting this conversation to work in it",
                       confirm: "confirming the selection" };
  const KEEP_TIMEOUT_MS = 20000;
  const KEEP_REFUSALS = {
    target_unavailable: "That conversation reference is not available to this account. Nothing was selected.",
    idempotency_conflict: "This selection conflicted with an earlier request, so nothing was selected. Try again."
  };
  let keepBusy = false;
  /* What the newest context read established for the open thread, so the control can be placed when
   * the thread's rows arrive after it. */
  let keepKnown = null;
  /* The attempt, held here as well as in storage: a browser that refuses the write must still resend
   * the same keys on "Try again" within this page. */
  const keepHeld = new Map();
  function keepLoad(threadId) {
    const owner = session && session.user ? session.user.id : null;
    const stored = TclKeep.load(keepStore(), threadId, owner);
    if (stored) return stored;
    const held = keepHeld.get(threadId);
    return TclKeep.valid(held, threadId, owner) ? held : null;
  }
  function keepSave(attempt) {
    keepHeld.set(attempt.thread_id, attempt);
    TclKeep.save(keepStore(), attempt);
  }
  function keepClear(threadId) {
    keepHeld.delete(threadId);
    TclKeep.clear(keepStore(), threadId);
  }
  /* A request that never answers must not hold the control for ever. Its outcome is unknown, which is
   * what a dropped connection is, and the same key is sent again. */
  function keepApi(name, body) {
    return Promise.race([api(name, body), new Promise((_, reject) => {
      setTimeout(() => reject(new Error("no answer from " + name)), KEEP_TIMEOUT_MS);
    })]);
  }
  function keepStore() {
    try { if (window.localStorage) return window.localStorage; } catch (e) { /* no storage: no resume */ }
    return { getItem: () => null, setItem: () => {}, removeItem: () => {} };
  }
  /* With the flag off this page does not look for the control at all: nothing of it can be there. */
  function withdrawKeep() {
    if (!KEEP_ON) return;
    const el = $("keep");
    if (el) el.remove();
  }
  /* The newest answer that is an answer: not a failed one, not the loose text before one, not empty. */
  function keepAnchor() {
    const all = $("messages").querySelectorAll(".msg.assistant");
    for (let i = all.length - 1; i >= 0; i -= 1) {
      const body = all[i].querySelector(".body");
      if (all[i].className === "msg assistant" && all[i].getAttribute("data-keep") !== "no" && body && body.textContent) return all[i];
    }
    return null;
  }
  function syncKeep(threadId, state) {
    if (!KEEP_ON || keepBusy) return null;
    withdrawKeep();
    /* The thread works in an Investigation, so an attempt left in storage has nothing left to do: its
     * last step went through unanswered, or another selection was made. It is not offered again. */
    if (state === "selected" && threadId) keepClear(threadId);
    if (state !== "none" || !threadId || threadId !== currentThread || !session || !session.user) return null;
    const anchor = keepAnchor();
    if (!anchor) return null;
    const pending = keepLoad(threadId);
    const row = document.createElement("div");
    row.id = "keep";
    row.className = "keep";
    const open = document.createElement("button");
    open.type = "button";
    open.id = "keep-open";
    open.className = "fill";
    open.textContent = pending ? "Finish keeping this as an Investigation" : "Keep this as an Investigation";
    const hint = document.createElement("span");
    hint.className = "keep-hint";
    hint.textContent = "One place for this conversation and whatever you build from it.";
    open.addEventListener("click", () => openKeep(threadId, row));
    row.append(open, hint);
    const atEnd = anchor === $("messages").lastElementChild;
    anchor.appendChild(row);
    /* Under the last row the control is new height below the fold; the conversation follows it. */
    if (atEnd) scrollDown();
    return open;
  }
  function keepNode(tag, className, text) {
    const el = document.createElement(tag);
    if (className) el.className = className;
    if (text) el.textContent = text;
    return el;
  }
  function markKeep(ui, step, state) {
    const li = ui.steps[step];
    if (!li) return;
    li.setAttribute("data-state", state);
    li.lastChild.textContent = state === "done" ? " · recorded" : state === "working" ? " · recording" : "";
  }
  function sayKeep(ui, text, bad) {
    ui.status.textContent = text;
    ui.status.className = "keep-status" + (bad ? " bad" : "");
  }
  function openKeep(threadId, row) {
    if (keepBusy || threadId !== currentThread) return;
    const pending = keepLoad(threadId);
    const question = $("messages").querySelector(".msg.user .body");
    row.textContent = "";
    row.className = "keep keep-panel";
    const field = keepNode("div");
    const label = keepNode("label", "", "Name");
    label.htmlFor = "keep-name";
    const input = document.createElement("input");
    input.id = "keep-name";
    input.type = "text";
    input.autocomplete = "off";
    input.value = pending ? pending.title : TclKeep.suggestTitle(question ? question.textContent : "");
    /* Once a click has been made the name belongs to that attempt: a new name would be a new create. */
    input.disabled = !!pending;
    field.append(label, input);
    const list = keepNode("ol", "keep-steps");
    const steps = {};
    [["create", "A new Investigation with this name."],
     ["link", "This conversation, added to it."],
     ["select", "This conversation set to work in it, so the assistant knows the Investigation, and each answer's Record says whether it had it."]
    ].forEach((pair) => {
      const li = keepNode("li", "", pair[1]);
      li.setAttribute("data-step", pair[0]);
      li.appendChild(keepNode("span", "keep-mark"));
      steps[pair[0]] = li;
      list.appendChild(li);
    });
    const actions = keepNode("div", "keep-actions");
    const go = keepNode("button", "fill", pending ? "Continue" : "Keep");
    go.type = "button";
    go.id = "keep-go";
    const cancel = keepNode("button", "", "Not now");
    cancel.type = "button";
    cancel.id = "keep-cancel";
    actions.append(go, cancel);
    const status = keepNode("p", "keep-status");
    status.id = "keep-status";
    status.setAttribute("role", "status");
    const ui = { row: row, input: input, go: go, cancel: cancel, status: status, steps: steps };
    row.append(
      keepNode("div", "keep-head", "Keep this as an Investigation"), field,
      keepNode("p", "keep-note", pending ? "This name belongs to the attempt already started." : "Suggested from your question. Change it if you like."),
      keepNode("p", "", "One click records three things, each as its own entry:"), list,
      keepNode("p", "keep-note", "Nothing is run and nothing is shared. Only you can read it."),
      status, actions);
    if (pending && pending.investigation_id) markKeep(ui, "create", "done");
    if (pending && pending.reference_act_id) markKeep(ui, "link", "done");
    go.addEventListener("click", () => runKeep(threadId, ui));
    cancel.addEventListener("click", () => {
      if (keepBusy) return;
      const again = syncKeep(threadId, "none");
      if (again) again.focus({ preventScroll: true });
    });
    /* The panel is taller than the row it replaced, and the conversation scrolls: bring it into view. */
    row.scrollIntoView({ block: "nearest" });
    (pending ? go : input).focus({ preventScroll: true });
  }
  function keepFailure(out) {
    const doing = KEEP_DOING[out.step] || "recording";
    if (out.status === "refused") return KEEP_REFUSALS[out.code] || "The selection was refused, so nothing was selected.";
    if (out.kind === "network") return "The connection dropped while " + doing + ". Try again continues from that step; it cannot record anything twice.";
    if (out.kind === "server") return "The service did not answer while " + doing + ". Try again continues from that step; it cannot record anything twice.";
    if (out.kind === "auth") return "Your sign-in was not accepted while " + doing + ". Sign in again, then continue.";
    if (out.kind === "unavailable") return "This step is not served here, so " + doing + " did not happen. What was recorded before it stays.";
    if (out.kind === "invalid" && out.step === "create") return "The service refused that name, so nothing was recorded. Change the name and try again.";
    return "The service's answer while " + doing + " could not be used. Try again continues from that step.";
  }
  function runKeep(threadId, ui) {
    if (keepBusy) return;
    let attempt = keepLoad(threadId);
    if (!attempt) {
      const problem = TclKeep.titleProblem(ui.input.value);
      if (problem) { sayKeep(ui, problem, true); return; }
      attempt = TclKeep.fresh(threadId, session.user.id, ui.input.value, () => crypto.randomUUID());
      keepSave(attempt);
    }
    keepBusy = true;
    ui.input.value = attempt.title;
    ui.input.disabled = true;
    ui.go.disabled = true;
    ui.cancel.disabled = true;
    sayKeep(ui, "Recording…", false);
    const hooks = { uuid: () => crypto.randomUUID(), persist: keepSave,
                    forget: () => keepClear(threadId), step: (name, state) => markKeep(ui, name, state) };
    refreshIfNeeded()
      .then((ok) => (ok ? TclKeep.run(attempt, keepApi, hooks) : { status: "failed", step: "check", kind: "auth" }))
      .catch(() => ({ status: "failed", step: "check", kind: "network" }))
      .then((out) => {
        keepBusy = false;
        const over = out.status === "kept" || out.status === "superseded";
        if (!over && ui.row.isConnected && currentThread === threadId) {
          Object.keys(ui.steps).forEach((name) => {
            if (ui.steps[name].getAttribute("data-state") === "working") markKeep(ui, name, "");
          });
          sayKeep(ui, keepFailure(out), true);
          ui.go.textContent = "Try again";
          ui.go.disabled = false;
          ui.cancel.disabled = false;
          /* The attempt is gone only when the name itself was refused; then the name is free again. */
          ui.input.disabled = !!keepLoad(threadId);
          ui.row.scrollIntoView({ block: "nearest" });
          ui.go.focus({ preventScroll: true });
          return;
        }
        /* Kept, superseded, or the reader has moved on: the page reads the thread it is on, and that
         * read decides the line and whether the control is offered. A conversation that now works in an
         * Investigation also moves in the left column, so the list is read again. */
        if (currentThread) refreshContext(currentThread);
        if (over) loadThreads();
      });
  }

  /* `persisted` from `done`: true adds nothing; false and "unknown" say exactly what was established;
   * absent is an older function, from which nothing is inferred. Any other value is treated as absent. */
  function showSave(msg, persisted) {
    const text = persisted === false ? SAVE_TEXT.false : persisted === "unknown" ? SAVE_TEXT.unknown : null;
    if (!text) return;
    const p = document.createElement("p");
    p.className = "save" + (persisted === "unknown" ? " unknown" : "");
    p.textContent = text;
    msg.appendChild(p);
  }

  function recordNote(msg, text) {
    const p = document.createElement("p");
    p.className = "record-note";
    p.textContent = text;
    msg.appendChild(p);
  }

  /* A scalar as text, or a pin as its identities ("key value, ..."). Withheld keys are dropped at every
   * depth, and null renders nothing. */
  function asText(value) {
    if (typeof value === "string") return value;
    if (typeof value === "number" || typeof value === "boolean") return String(value);
    if (Array.isArray(value)) return value.map(asText).filter(Boolean).join(", ");
    if (value && typeof value === "object") {
      return Object.keys(value).filter((k) => !WITHHELD.includes(k))
        .map((k) => [k, asText(value[k])]).filter((kv) => kv[1]).map((kv) => kv[0] + " " + kv[1]).join(", ");
    }
    return "";
  }
  const listOf = (v) => (Array.isArray(v) ? v.filter((x) => x && typeof x === "object") : []);
  /* A turn id is the question message's id (a bigint), passed back to turn_record as it came. */
  const isTurnId = (v) => Number.isSafeInteger(v) || (typeof v === "string" && v !== "");
  const byOrdinal = (a, b) => (Number(a.ordinal) || 0) - (Number(b.ordinal) || 0);

  /* Every value goes in as text. A missing key renders nothing, and nothing is counted but the length of
   * an array the reader returned. */
  function fillRecord(body, doc) {
    body.textContent = "";
    if (!doc || typeof doc !== "object" || Array.isArray(doc)) { body.textContent = "The record is unavailable."; return; }
    const line = (label, parts) => {
      const kept = parts.filter((x) => x !== undefined && x !== null && x !== "");
      if (!kept.length) return;
      const p = document.createElement("p");
      p.textContent = label + ": " + kept.map(asText).join(" · ");
      body.appendChild(p);
    };
    const has = (o, k) => o[k] !== undefined && o[k] !== null && o[k] !== "";
    line("Recorded", [doc.recorded_at]);
    /* From api.turn_record's `context` (022). An object: the Investigation the turn had and the selection
     * it came from; null: it had none; a missing key (an older reader) says nothing. The note is not shown.
     * One null is not "none": a turn that ended while its context was being assembled (the lookup failed,
     * was refused, or timed out) never learned whether there was a selection, and the line says so. */
    if ("context" in doc) {
      const c = doc.context;
      if (c === null) line("Working context", [doc.termination === "context_failure" ? CONTEXT_NOT_ESTABLISHED : "none"]);
      else if (typeof c === "object" && !Array.isArray(c)) {
        line("Working context", [typeof c.title === "string" && c.title ? "Investigation \"" + c.title + "\"" : "Investigation",
                                 has(c, "selection_act_id") ? "selection " + asText(c.selection_act_id) : null]);
      }
    }
    listOf(doc.models).forEach((m) => {
      line("Model" + (has(m, "invocation_ordinal") ? " (call " + asText(m.invocation_ordinal) + ")" : ""), [
        has(m, "requested") ? "requested " + asText(m.requested) : null,
        has(m, "served") ? "served " + asText(m.served) : null,
        has(m, "basis") ? "basis " + asText(m.basis) : null,
        has(m, "fallback_evidence") ? (FALLBACK_TEXT[m.fallback_evidence] || "fallback: " + asText(m.fallback_evidence)) : null,
        has(m, "stop_reason") ? "stop " + asText(m.stop_reason) : null]);
    });
    listOf(doc.invocations).slice().sort(byOrdinal).forEach((inv) => {
      line("Call " + (has(inv, "ordinal") ? asText(inv.ordinal) : "?"), [inv.tool_name, inv.kind]);
    });
    listOf(doc.reads).slice().sort(byOrdinal).forEach((r) => {
      line("Read" + (has(r, "invocation_ordinal") ? " (call " + asText(r.invocation_ordinal) + ")" : ""), [
        r.source, has(r, "object") ? "table " + asText(r.object) : null,
        has(r, "as_of_mode") ? "as of " + asText(r.as_of_mode) : null, r.outcome,
        asText(r.pins) ? "pins " + asText(r.pins) : null]);
    });
    line("Ended", [doc.termination, doc.delivery_kind]);
    line("Also recorded", [
      Array.isArray(doc.quantities) ? doc.quantities.length + " quantities" : null,
      Array.isArray(doc.entity_resolutions) ? doc.entity_resolutions.length + " entity resolutions" : null,
      Array.isArray(doc.artifacts) ? doc.artifacts.length + " artifacts" : null]);
    line("Record hash", [doc.document_sha256]);
    if (!body.childNodes.length) body.textContent = "The record is unavailable.";
  }

  /* Collapsed and read-only. The record is read when it is first opened, and again only if that read failed. */
  function addRecord(msg, turnId) {
    const details = document.createElement("details");
    details.className = "record";
    details.setAttribute("data-turn", String(turnId));
    const summary = document.createElement("summary");
    summary.textContent = RECORD_HEADER;
    const body = document.createElement("div");
    body.className = "record-body";
    details.appendChild(summary);
    details.appendChild(body);
    let read = null;
    details.addEventListener("toggle", () => {
      if (!details.open || read) return;
      body.textContent = "reading the record";
      read = api("turn_record", { p_turn_id: turnId })
        .then((doc) => fillRecord(body, doc))
        .catch(() => { read = null; body.textContent = "The record is unavailable."; });
    });
    msg.appendChild(details);
  }

  /* One read per thread load. Recorded answers get the panel, legacy answers say they have none; if the
   * reader is missing or fails, every answer says the record is unavailable. The reader is
   * thread_record(p_thread_id, p_before_id, p_limit) (§12): from the newest, as many as the page loaded.
   * `answers` maps each rendered assistant message's id to its element. */
  function loadRecords(threadId, epoch, loaded, answers) {
    if (!answers.size) return Promise.resolve();
    return api("thread_record", { p_thread_id: threadId, p_before_id: null, p_limit: loaded })
      .then((items) => {
        if (epoch !== panel.epoch) return;
        if (!Array.isArray(items)) throw new Error("thread_record answered " + typeof items);
        const byMessage = new Map(listOf(items).map((it) => [String(it.message_id), it]));
        answers.forEach((msg, messageId) => {
          const it = byMessage.get(messageId);
          if (it && it.kind === "recorded" && isTurnId(it.turn_id)) addRecord(msg, it.turn_id);
          else if (it && it.kind === "legacy") recordNote(msg, "There is no record for this answer.");
        });
      })
      .catch(() => {
        if (epoch !== panel.epoch) return;
        answers.forEach((msg) => recordNote(msg, "The record is unavailable."));
      });
  }

  function scrollDown() {
    const box = $("messages");
    box.scrollTop = box.scrollHeight;
  }

  function setStatus(text, bad) {
    $("status").textContent = text;
    $("status").className = "status" + (bad ? " bad" : "");
  }

  /* ---------- SSE: parsed from the response body as it arrives ---------- */
  function makeSseParser() {
    let buffer = "";
    function parseBlock(block) {
      let event = "message";
      const data = [];
      block.split("\n").forEach((line) => {
        if (line.startsWith(":")) return;
        const at = line.indexOf(":");
        const field = at === -1 ? line : line.slice(0, at);
        let value = at === -1 ? "" : line.slice(at + 1);
        if (value.startsWith(" ")) value = value.slice(1);
        if (field === "event") event = value;
        else if (field === "data") data.push(value);
      });
      if (!data.length) return null;
      let parsed;
      try { parsed = JSON.parse(data.join("\n")); } catch (e) { parsed = { raw: data.join("\n") }; }
      return { event: event, data: parsed };
    }
    return {
      push: function (text) {
        buffer += text.replace(/\r\n/g, "\n");
        const out = [];
        let at;
        while ((at = buffer.indexOf("\n\n")) !== -1) {
          const block = buffer.slice(0, at);
          buffer = buffer.slice(at + 2);
          const ev = parseBlock(block);
          if (ev) out.push(ev);
        }
        return out;
      },
      end: function () {
        const rest = buffer;
        buffer = "";
        const ev = rest.trim() ? parseBlock(rest) : null;
        return ev ? [ev] : [];
      }
    };
  }

  async function send(text) {
    if (sending) return;
    /* Refused, the session is over and the page is on its way to the sign-in page; unreachable, the
     * status already says so. Either way this turn is not sent. */
    if (!(await refreshIfNeeded())) return;
    sending = true;
    $("send").disabled = true;
    if (!keepBusy) withdrawKeep();
    addMessage("user", text, new Date().toISOString());
    const answerBody = addMessage("assistant", "", null);
    let looseBody = null;
    let answered = false;
    let failure = null;
    /* The view this turn started in. A thread click is not gated on `sending`, so the view can
     * change while the stream is still arriving; whatever would APPEND into the view checks that
     * it is still this one first. The answer's own nodes are detached by then and harmless. */
    const epoch = panel.epoch;
    const turnTabs = [];
    setStatus("sending");
    scrollDown();
    const handlers = {
      thread: (d) => { if (d.created || !currentThread) currentThread = d.id; },
      status: (d) => setStatus(d.tool ? "calling " + d.tool : (d.note || d.board || "")),
      tool_call: (d) => setStatus(d.name + (d.input && d.input.series ? " " + d.input.series : "")),
      tool_result: (d) => {
        setStatus(d.name + (d.ok ? " ok" : " refused: " + (d.error || "")), !d.ok);
        /* A comparison the page can redo goes into the answer, where it stays; the status line is
         * transient and the next tool overwrites it. Nothing is drawn from `d`'s own figures —
         * `renderCompare` fetches the rows and computes. */
        if (d.recompute) renderCompare(answerBody.parentNode, d.recompute);
        proposeHeard(answerBody.parentNode, d);
        specHeard(answerBody.parentNode, d);
      },
      chart: (d) => {
        if (epoch !== panel.epoch) return;
        /* ADD, never replace: a new tab, and the active one. Its message id arrives with `done`.
         * Opened at once only where the panel sits BESIDE the conversation — over it, the panel
         * would cover the answer while it streams, so the card waits to be tapped. */
        const tab = registerChart(answerBody.parentNode, d, null);
        turnTabs.push(tab);
        if (isWide()) openTab(tab); else projectPanel();
        scrollDown();
      },
      text_delta: (d) => {
        if (epoch !== panel.epoch) return;
        if (!looseBody) { looseBody = addMessage("assistant loose", "", null); }
        looseBody.textContent += d.text;
      },
      answer_delta: (d) => { answerBody.textContent += d.text; scrollDown(); },
      answer: (d) => { answerBody.textContent = d.text; answered = true; scrollDown(); },
      error: (d) => { failure = d.message || d.kind || "unknown error"; setStatus("error: " + failure, true); },
      done: (d) => {
        if (d.ok) setStatus("done · " + (d.ms ? Math.round(d.ms / 1000) + "s" : "") + (d.charts ? " · " + d.charts + " chart(s)" : ""));
        else { if (!failure) failure = d.reason || "no answer"; setStatus("no answer: " + failure, true); }
        /* The stored row's id, which is the other half of each of this turn's charts' identity.
         * A failed turn's `done` carries none, and its tabs keep their place in the view. */
        if (d.message_id !== undefined && d.message_id !== null && epoch === panel.epoch) {
          turnTabs.forEach((t) => { t.messageId = d.message_id; });
          projectPanel();
        }
        /* The answer's own nodes: harmless if the view has changed and they are detached. */
        const answerMsg = answerBody.parentNode;
        if (d.message_id !== undefined && d.message_id !== null) answerMsg.setAttribute("data-message", String(d.message_id));
        if (KEEP_ON && !d.ok) answerMsg.setAttribute("data-keep", "no");
        if ("persisted" in d) showSave(answerMsg, d.persisted);
        if (d.persisted === true && isTurnId(d.turn_id)) addRecord(answerMsg, d.turn_id);
        proposeAtDone(answerMsg, d, epoch);
        specAtDone(answerMsg, d, epoch);
        if (d.persisted === true && epoch === panel.epoch && currentThread) viewsMount(currentThread, epoch);
        /* The selection may have changed since the thread opened; the page reads it again. */
        if (epoch === panel.epoch && currentThread) refreshContext(currentThread);
      }
    };
    try {
      const terminalToken = await terminalAuthorization();
      const resp = await fetch(FUNCTION_URL, {
        method: "POST",
        headers: { "apikey": SUPABASE_KEY, "Authorization": "Bearer " + terminalToken,
                   "Content-Type": "application/json", "Accept": "text/event-stream" },
        body: JSON.stringify({ thread_id: currentThread, message: text })
      });
      if (!resp.ok) {
        const j = await resp.json().catch(() => ({}));
        throw new Error(j.error || ("HTTP " + resp.status));
      }
      const reader = resp.body.getReader();
      const decoder = new TextDecoder();
      const parser = makeSseParser();
      const dispatch = (ev) => { const h = handlers[ev.event]; if (h) h(ev.data); };
      while (true) {
        const chunk = await reader.read();
        if (chunk.done) break;
        parser.push(decoder.decode(chunk.value, { stream: true })).forEach(dispatch);
      }
      parser.end().forEach(dispatch);
      if (!answered && !answerBody.textContent) {
        /* The function stores an assistant row carrying the error in its trace, so the thread
         * keeps the reason; the same text is shown here rather than a bare no-reply marker. */
        answerBody.textContent = failure ? "no reply: " + failure : "no reply";
        answerBody.parentNode.className = "msg assistant failed";
      }
      await loadThreads();
    } catch (err) {
      setStatus("error: " + err.message, true);
    } finally {
      sending = false;
      $("send").disabled = false;
    }
  }

  /* ---------- chrome ---------- */
  /* Signed in is the only state this page shows: without a session it has already gone to the
   * sign-in page from <head>. The session is refreshed before the first read (F128). */
  function show() {
    $("who").textContent = session.user.email || session.user.id || "";
    return refreshIfNeeded()
      .then((ok) => (ok ? loadThreads() : undefined))
      .then(() => openNamedThread())
      .catch((err) => setStatus("threads: " + err.message, true));
  }

  function bind() {
    bindCrosshair();
    $("signout").addEventListener("click", () => { signOut(); });
    $("new-thread").addEventListener("click", newThread);
    $("composer").addEventListener("submit", (e) => {
      e.preventDefault();
      const text = $("input").value.trim();
      if (!text) return;
      $("input").value = "";
      send(text);
    });
    $("input").addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("composer").requestSubmit(); }
    });
    /* ONE listener for every tab there will ever be, on the strip — a container that outlives
     * each tab and each thread — rather than one per button made inside a loop. A click that
     * passes a `data-close` on its way up to the tab closes it; any other opens it. */
    $("tabs").addEventListener("click", (e) => {
      let el = e.target;
      let closing = false;
      while (el && el.getAttribute) {
        if (el.getAttribute("data-close") !== null) closing = true;
        const seq = el.getAttribute("data-tab");
        if (seq !== null && seq !== undefined && seq !== "") {
          const tab = panel.tabs[Number(seq)];
          if (tab && closing) closeTab(tab);
          else if (tab) openTab(tab);
          return;
        }
        el = el.parentNode;
      }
    });
    /* `Delete` on a focused tab, the keyboard's `×`. Focus then goes to the tab the panel landed
     * on — inside the panel, so it scrolls the strip and never the conversation. */
    $("tabs").addEventListener("keydown", (e) => {
      if (e.key !== "Delete" || !e.target || !e.target.getAttribute) return;
      const seq = e.target.getAttribute("data-tab");
      const tab = seq === null || seq === undefined || seq === "" ? null : panel.tabs[Number(seq)];
      if (!tab) return;
      closeTab(tab);
      if (panel.open && panel.active && panel.active.button.focus) panel.active.button.focus();
    });
    /* Hidden tabs, reached three ways: the steppers, a vertical wheel turned sideways (a mouse
     * has no other way to scroll a horizontal strip), and the strip's own native scroll — which
     * is why the fade and the steppers are re-read on `scroll`, whoever caused it. */
    $("tabs-prev").addEventListener("click", () => { stepStrip(-1); });
    $("tabs-next").addEventListener("click", () => { stepStrip(1); });
    $("tabs").addEventListener("wheel", (e) => {
      if (e.deltaX || !e.deltaY) return;
      $("tabs").scrollLeft += e.deltaMode === 1 ? e.deltaY * 16 : e.deltaY;
    }, { passive: true });
    $("tabs").addEventListener("scroll", projectStrip, { passive: true });
    $("panel").addEventListener("touchstart", swipeStart, { passive: true });
    $("panel").addEventListener("touchmove", swipeMove, { passive: true });
    $("panel").addEventListener("touchend", swipeEnd, { passive: true });
    $("panel").addEventListener("touchcancel", swipeCancel, { passive: true });
    $("panel-close").addEventListener("click", closePanel);
    /* The panel's width is the chart's width, so when one changes the other is redone — from the
     * kept series: no request, no recompute. Without this the chart is a picture of the width
     * the panel had when the tab was opened. */
    window.addEventListener("resize", () => {
      if (resizeTimer !== null) clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        resizeTimer = null;
        if (panel.open && panel.active && panel.active.status === "ready") draw(panel.active);
        projectStrip();
      }, RESIZE_MS);
    });
  }

  /* Exposed so the page's OWN bytes can be driven in node: the SSE parser on a canned stream,
   * a chart from a spec and rows, the validator, and the state a test reads back.
   *
   * `panel` is the page's own panel, not a transcription of it: `add` is `registerChart` on a
   * fresh assistant message — the function `openThread` and the live `chart` handler call — and
   * `open` is `openTab`, the function a card and the strip call. A probe that rebuilt those
   * lines for itself stayed green on a path this page had stopped using. */
  window.__terminal = {
    parseSse: function (text) { const p = makeSseParser(); return p.push(text).concat(p.end()); },
    renderChart: function (spec, rows, width) { return renderChart(spec, rows, width); },
    validate: function (spec) { return ChartSpec.validate(spec); },
    functionUrl: function () { return FUNCTION_URL; },
    state: function () {
      return { signedIn: !!session, thread: currentThread, charts: chartsRendered, sending: sending };
    },
    panel: {
      add: function (chart, messageId) {
        const body = addMessage("assistant", "", null);
        const tab = registerChart(body.parentNode, chart, messageId);
        projectPanel();
        return keyOf(tab);
      },
      open: function (key) {
        const tab = panel.tabs.filter((t) => keyOf(t) === key)[0];
        return tab ? openTab(tab).then(panelState) : Promise.reject(new Error("no such chart: " + key));
      },
      close: function () { closePanel(); return panelState(); },
      closeTab: function (key) {
        const tab = panel.tabs.filter((t) => keyOf(t) === key)[0];
        if (!tab) throw new Error("no such chart: " + key);
        closeTab(tab);
        return panelState();
      },
      label: function (spec, capturedAt) { return tabLabel(spec, capturedAt); },
      /* The crosshair, driven at a position in the chart's own user units. It reads the ACTIVE
       * tab's current model, which is the property a test has to be able to break. */
      hover: function (x, y) { return hoverAt(x, y); },
      /* The active tab's marks, as the positions a pointer can be at. The page holds these anyway;
       * a test addresses a mark by where it IS rather than by a number copied into the test. */
      marks: function () {
        const tab = panel.active;
        if (!tab || !tab.m || !Array.isArray(tab.m.marks)) return null;
        return { form: tab.m.form, width: tab.m.width, height: tab.m.height,
                 plot: plotBox(tab.m),
                 marks: tab.m.marks.map((mk) => ({ book: mk.book || null, x: mk.x === undefined ? null : mk.x,
                   py: mk.py === undefined ? null : mk.py,
                   cx: mk.cx === undefined ? null : mk.cx, cy: mk.cy === undefined ? null : mk.cy,
                   y0: mk.y0 === undefined ? null : mk.y0, y1: mk.y1 === undefined ? null : mk.y1 })) };
      },
      state: panelState
    },
    /* The page's OWN recomputation, exposed so a test can run it against `stat_board.js` over the
     * same rows. It takes rows rather than fetching them, so the comparison under test is the
     * arithmetic and not the reader. */
    compare: {
      tools: function () { return Object.keys(COMPARE); },
      run: function (tool, spec, rows) { return COMPARE[tool] ? COMPARE[tool](spec, rows) : null; }
    }
  };

  /* With no session the <head> script has already hidden the page and sent it to sign in, so
   * nothing is bound and nothing is read; `__terminal` above is still defined, for the tests. */
  if (session) {
    bind();
    show();
  }
})();
</script>
</body>
</html>
