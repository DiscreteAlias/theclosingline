<!--
  The beta terminal (R-CL15, R-CL16). Rendered by realdata/closingline/terminal.py, which
  inlines the six modules and session.js verbatim, embeds the typeface, and substitutes only
  scalars (live.py's F19 guard).

  WHAT THIS PAGE DOES, and with which credential:
    holds the session the sign-in page stored (signin.html, through session.js), refreshes it
      before it reads anything, and with no session stored goes to the sign-in page from <head>
      before the body is parsed — it has no sign-in box of its own (specs/terminal-ui-port.md);
    reads that user's threads and messages with the PUBLISHABLE key plus the token, so
      PostgREST runs as `authenticated` under the RLS policies 005_terminal.sql proposes;
    reads board rows with the publishable key ALONE (anon), the credential the live page reads
      with — `authenticated` holds no grant on public.snapshots and needs none;
    sends each message to the Edge Function with the token, and reads the reply as
      Server-Sent Events over the response body (not Realtime);
    draws a chart from its stored spec and the rows the spec names, through the same six
      modules the function computed it with — in a PANEL beside the conversation, not in the
      thread. The thread carries one reference card per chart; the panel holds every chart of
      the open thread as a tab strip, and reads a chart's rows when its tab is first opened.
  No package, no CDN, no HTML strings: every node is built with createElement/textContent.
-->

  const SUPABASE_KEY     = "sb_publishable_8Rp9NOSJPyKToxHQqFm4dQ_AlRRN81g";
  const SNAPSHOTS_TABLE  = "snapshots";
  const FUNCTION_NAME    = "terminal";
  const POLL_INDEX_LIMIT = 200;
  const SIGNIN_URL       = "signin.html";
</script>
<script>
/* realdata/closingline/session.js, inlined verbatim: the same bytes the sign-in page carries. */
/* The beta terminal's session: where it is kept, what counts as one, and the calls that move it.
 *
 * ONE set of bytes on TWO pages. realdata/closingline/signin.py inlines this file verbatim into the
 * sign-in page and the terminal inlines the same file; tests pin each page to it. The pages hand the
 * session to each other through storage and through nothing else, so a key or a shape that differed
 * between them would not be an error anybody saw: the terminal would find no session and send the
 * reader to sign in, and the sign-in page would find one and send the reader back.
 *
 * It reads the two globals each page declares, SUPABASE_URL and SUPABASE_KEY, and only when it calls.
 * It touches no DOM and never navigates: where to go is each page's own decision.
 */
var TclSession = (function () {
  "use strict";

  /* The key and the shape the terminal wrote before this file existed, so that a session stored by
   * either version is read by the other. */
  var KEY = "tcl.terminal.session";

  /* What counts as a session. Anything else in the slot — JSON that does not parse, an object with a
   * token missing — is NO session, on both pages alike, so they cannot disagree about whether one is
   * held. `user` is required because the terminal names the reader from it. */
  function shaped(s) {
    return !!s && typeof s === "object"
      && typeof s.access_token === "string" && s.access_token !== ""
      && typeof s.refresh_token === "string" && s.refresh_token !== ""
      && typeof s.expires_at === "number" && isFinite(s.expires_at)
      && !!s.user && typeof s.user === "object";
  }

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      var s = raw ? JSON.parse(raw) : null;
      return shaped(s) ? s : null;
    } catch (e) {
      return null;
    }
  }

  /* Stores, then READS BACK: true only when the next load() will return this session. A browser that
   * refuses site storage throws here or quietly keeps nothing, and either way the answer is false. */
  function save(s) {
    try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) { /* the read-back decides */ }
    var back = load();
    return !!back && back.access_token === s.access_token;
  }

  function clear() {
    try { localStorage.removeItem(KEY); } catch (e) { /* nothing was held */ }
  }

  /* A GoTrue grant, in the shape that is stored. */
  function fromGrant(body) {
    return {
      access_token: body.access_token,
      refresh_token: body.refresh_token,
      expires_at: Math.floor(Date.now() / 1000) + (body.expires_in || 3600),
      user: { id: body.user && body.user.id, email: body.user && body.user.email }
    };
  }

  /* A POST to GoTrue with the publishable key, and the user's token when there is one. `keepalive`
   * lets the request outlive the page that made it: a request still in flight when its document is
   * unloaded is otherwise the browser's to cancel. */
  function call(path, body, token, keepalive) {
    var headers = { "apikey": SUPABASE_KEY, "Content-Type": "application/json" };
    if (token) headers["Authorization"] = "Bearer " + token;
    var init = { method: "POST", headers: headers, body: JSON.stringify(body) };
    if (keepalive) init.keepalive = true;
    return fetch(SUPABASE_URL + "/auth/v1/" + path, init).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (j) { return { status: r.status, body: j }; });
    });
  }

  /* Seconds the access token has left. */
  function remaining(s) {
    return s.expires_at - Math.floor(Date.now() / 1000);
  }

  /* A new session from the refresh token. Resolves to it; resolves to null when GoTrue REFUSES the
   * refresh token (a 4xx: it is spent or revoked, and the session is over); REJECTS when GoTrue could
   * not be asked or failed (a network error, a 5xx), because then nothing is known about the session
   * and signing the reader out would be a guess. */
  function refresh(s) {
    return call("token?grant_type=refresh_token", { refresh_token: s.refresh_token }).then(function (r) {
      if (r.status === 200 && r.body && r.body.access_token) return fromGrant(r.body);
      if (r.status >= 400 && r.status < 500) return null;
      throw new Error("the session could not be refreshed (HTTP " + r.status + ")");
    });
  }

  function logout(s) {
    return call("logout", {}, s.access_token, true);
  }

  return { KEY: KEY, load: load, save: save, clear: clear, fromGrant: fromGrant, call: call,
           remaining: remaining, refresh: refresh, logout: logout };
})();

</script>
<script>
  /* Signed out, this page has nothing to show and nothing to read. The document is hidden first,
   * so that no part of the app paints while the sign-in page loads; there is no sign-in box here
   * for an app shell to show under (F93). */
  if (!TclSession.load()) { document.documentElement.hidden = true; location.replace(SIGNIN_URL); }
</script>

  /* The landing page's tokens (live.html :root), by name and by value. --bad is this terminal's own:
     the landing page has no colour for a failure. One family for everything, Inconsolata first. */
  :root {
    --page: #0a0a0c; --panel: #101014; --surface: #16161c; --rule: #2a2a32;
    --primary: #fafafa; --muted: #8a8a93; --accent: #22d3ee; --margin: #f59e0b; --bad: #f87171;
    --mono: "Inconsolata", 'SF Mono','Cascadia Code','JetBrains Mono','Roboto Mono',ui-monospace,monospace;
  }
  * { box-sizing: border-box; }
  /* F42, recurring here. `[hidden]` is a USER-AGENT rule, the lowest weight in the cascade, and
     `main { display: grid }` and `section { display: flex }` below are author rules that beat it.
     Measured 2026-09-18: signed out, #app carried `hidden = true` and computed `display: grid`,
     868 px of shell under the sign-in box (F93). That box is on its own page now, so nothing here
     hides the app; the panel, a closed tab and the steppers still hide, through this rule. */
  [hidden] { display: none !important; }
  /* ONE COLUMN, the header and then `main`, so that `main` takes whatever height the header leaves
     and no header height is written anywhere. `main` used to be `calc(100% - 45px)`, and 45 was near
     the height of a header showing no sign-out control — the header the chrome probe measured (F127).
     Signed in, the header was 55.3 px and the document scrolled by the difference. `main` is
     `flex: 1` with `min-height: 0`: a flex item's automatic minimum is its content, so without it a
     long conversation makes `main` — and the document — as tall as the conversation again. */
  html, body { height: 100%; }
  body { margin: 0; display: flex; flex-direction: column; background: var(--page); color: var(--primary);
         font-family: var(--mono); font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
  /* It wraps rather than push the page wider than a phone: signed in at 360 px, the reader's email
     and the sign-out control did not fit beside the rest, and the page was 41 px too wide (F127). */
  header { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; padding: 10px 16px;
           border-bottom: 1px solid var(--rule); }
  .wordmark { font-family: var(--mono); letter-spacing: .14em; text-transform: uppercase;
              font-size: 12px; color: var(--primary); }
  .beta { font-family: var(--mono); font-size: 11px; letter-spacing: .13em; text-transform: uppercase;
          color: var(--margin); border: 1px solid var(--margin); padding: 1px 6px; border-radius: 3px; }
  .spacer { flex: 1; }
  #who { font-family: var(--mono); font-size: 12px; color: var(--muted);
         overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  button { font: inherit; color: var(--primary); background: var(--surface); border: 1px solid var(--rule);
           border-radius: 4px; padding: 6px 10px; cursor: pointer; }
  button:hover { border-color: var(--muted); }
  button.primary { border-color: var(--accent); color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  textarea { font: inherit; color: var(--primary); background: var(--panel); border: 1px solid var(--rule);
             border-radius: 4px; padding: 8px 10px; width: 100%; }
  textarea:focus { outline: none; border-color: var(--accent); }
  /* The ROW is pinned to the viewport. An implicit auto row grows with its content — measured
     2026-09-18 with 80 messages: the DOCUMENT scrolled (4721 px in a 913 px viewport), #messages
     never did (clientHeight = scrollHeight, so scrollDown() was a no-op) and the composer sat 3.8
     viewports down. A panel beside that conversation would have scrolled away with it. One
     declaration, on the row, for every child of `main`: `min-height: 0` on the sections does
     the same and was measured redundant beside it, so it is not here. */
  main { display: grid; grid-template-columns: 240px 1fr; grid-template-rows: minmax(0, 1fr);
         flex: 1; min-height: 0; position: relative; }
  /* Three columns while the panel is open. Their minima — 240 + 360 + 512 — are the breakpoint
     below, where there is no longer room for a panel BESIDE the conversation. 512, not the
     chart's 480 floor: the panel's border and its body's padding sit outside the chart, and a
     panel at its minimum must still hold a chart at its floor without scrolling. */
  main.with-panel { grid-template-columns: 240px minmax(360px, 1fr) minmax(512px, 1.4fr); }
  aside { border-right: 1px solid var(--rule); padding: 12px; overflow: auto; }
  aside button { width: 100%; margin-bottom: 10px; }
  #threads { list-style: none; margin: 0; padding: 0; }
  #threads li { padding: 8px 8px; border-radius: 4px; cursor: pointer; font-size: 13px;
                color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #threads li:hover { background: var(--panel); }
  #threads li.current { background: var(--surface); color: var(--primary); }
  section { display: flex; flex-direction: column; min-width: 0; }
  #messages { flex: 1; overflow: auto; padding: 16px 20px; }
  /* One plain line above the conversation: the working context the user selected, read by the page. */
  .context-line { margin: 0; padding: 8px 20px 0; font-family: var(--mono); font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
  .context-line a { color: var(--accent); margin-left: 10px; }
  /* The left column under its Investigations (specs/conversation-readers.md §3). A label and an
   * Investigation's own row are not conversations: no pointer, no hover. */
  #threads li.label { cursor: default; padding: 12px 8px 2px; font-size: 11px; letter-spacing: .08em;
                      text-transform: uppercase; color: var(--muted); white-space: normal; }
  #threads li.inv { cursor: default; white-space: normal; color: var(--primary); padding: 8px 8px 4px; }
  #threads li.label:hover, #threads li.inv:hover { background: none; }
  #threads li.inv a { color: var(--primary); text-decoration: none; }
  #threads li.inv a:hover { text-decoration: underline; }
  #threads li.nested { margin-left: 12px; }
  /* A run's result where the run happened. Never a figure without its class and disclosure: the card is
   * drawn whole from one record by one function. */
  .run-line.has-card { padding: 0; color: var(--primary); }
  .run-card { max-width: 820px; margin: 0 0 14px; padding: 12px 14px; border: 1px solid var(--rule); border-radius: 5px;
              background: var(--surface); color: var(--primary); font-size: 14px; white-space: normal; }
  .run-line.has-card .run-card { margin: 0; }
  .run-card > * { margin: 0 0 10px; }
  .run-card > :last-child { margin-bottom: 0; }
  .run-card-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .run-chip { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; border: 1px solid var(--rule);
              border-radius: 3px; padding: 1px 6px; color: var(--muted); }
  .run-chip.completed, .run-chip.pending { color: var(--accent); border-color: var(--accent); }
  .run-chip.refused { color: var(--bad); border-color: var(--bad); }
  .run-chip.not_evaluated, .run-chip.klass { color: var(--margin); border-color: var(--margin); }
  .run-chip.lost { border-style: dashed; }
  .run-model, .run-sentence, .run-counts, .run-axis-note { font-size: 12px; color: var(--muted); }
  .run-disclosure { font-size: 13px; }
  .run-score { border: 1px solid var(--rule); border-radius: 5px; background: var(--panel); padding: 12px 14px; }
  .run-score > * { margin: 0 0 10px; }
  .run-score > :last-child { margin-bottom: 0; }
  .run-score-name { font-size: 12px; color: var(--muted); }
  .run-bar { display: flex; align-items: center; gap: 12px; }
  .run-bar-label { flex: 0 0 150px; }
  .run-bar-track { flex: 1; height: 16px; background: var(--surface); border-radius: 2px; display: flex; min-width: 40px; }
  .run-bar-fill { border-radius: 2px; background: #5d5d68; }
  .run-bar-fill.candidate { background: var(--accent); }
  .run-bar-value { flex: 0 0 56px; text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
  .run-interval { position: relative; height: 62px; font-size: 12px; }
  .run-interval > * { position: absolute; }
  .run-interval .axis { left: 0; right: 0; top: 20px; height: 1px; background: var(--rule); }
  .run-interval .band { top: 15px; height: 11px; background: rgba(34, 211, 238, .35); border-radius: 2px; }
  .run-interval .mean { top: 9px; width: 3px; height: 23px; margin-left: -1px; background: var(--accent); }
  .run-interval .zero { top: 4px; width: 1px; height: 33px; background: var(--primary); }
  .run-interval .lo { top: 28px; transform: translateX(-100%); padding-right: 6px; color: var(--muted); }
  .run-interval .hi { top: 28px; padding-left: 6px; color: var(--muted); }
  .run-interval .nought { top: 44px; transform: translateX(-50%); }
  /* Keep this conversation as an Investigation: a row under the newest answer, and its panel. */
  .keep { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin: 10px 0 0; padding-top: 10px;
          border-top: 1px solid var(--rule); white-space: normal; }
  .keep-hint, .keep-note { font-size: 12px; color: var(--muted); }
  button.fill { background: var(--accent); border-color: var(--accent); color: var(--page); font-weight: 600; }
  .keep.keep-panel { display: block; border: 1px solid var(--accent); border-radius: 5px; background: var(--surface);
                     padding: 12px 14px; }
  .keep-panel > * { margin: 0 0 10px; }
  .keep-panel > :last-child { margin-bottom: 0; }
  .keep-head { font-size: 15px; font-weight: 600; }
  .keep-panel label { display: block; font-size: 11px; letter-spacing: .08em; text-transform: uppercase;
                      color: var(--muted); margin-bottom: 4px; }
  .keep-panel input { font: inherit; color: var(--primary); background: var(--panel); border: 1px solid var(--rule);
                      border-radius: 4px; padding: 8px 10px; width: 100%; }
  .keep-panel input:focus { outline: none; border-color: var(--accent); }
  .keep-steps { padding-left: 22px; }
  .keep-mark { color: var(--accent); }
  .keep-status { font-size: 12px; color: var(--muted); min-height: 1.4em; }
  .keep-status.bad { color: var(--bad); }
  .keep-actions { display: flex; flex-wrap: wrap; gap: 8px; }
  /* A proposed model (specs/model-proposal.md): put in only by terminal.render(propose=True). The card sits in
     its answer, which is pre-wrap; the card is not. Chips are the run card's. */
  .proposal { margin: 10px 0 0; padding: 14px; border: 1px solid var(--rule); border-radius: 5px; background: var(--surface);
              white-space: normal; display: flex; flex-direction: column; gap: 12px; }
  .proposal > * { margin: 0; }
  .proposal[data-state="started"] { border-color: var(--accent); }
  .proposal-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .run-chip.proposal-chip { color: var(--accent); border-color: var(--accent); }
  .proposal-title { font-size: 18px; font-weight: 600; }
  .proposal-rows { display: flex; flex-direction: column; border-top: 1px solid var(--rule); }
  .proposal-row { display: flex; flex-wrap: wrap; gap: 2px 16px; padding: 8px 0; border-bottom: 1px solid var(--rule); }
  .proposal-key { flex: 0 0 130px; color: var(--muted); }
  .proposal-val { flex: 1 1 300px; display: flex; flex-direction: column; gap: 2px; }
  .proposal-note, .proposal-records { font-size: 12px; color: var(--muted); }
  .proposal-records { color: var(--primary); }
  .proposal-actions { display: flex; flex-wrap: wrap; gap: 10px; }
  .proposal-actions button { min-height: 44px; padding: 0 20px; }
  .proposal-status { font-size: 12px; color: var(--muted); }
  .proposal-status:empty { display: none; }
  .proposal-status.bad { color: var(--bad); }
  /* A proposed composable model's card (specs/model-spec-assistant.md): put in only by
     terminal.render(propose=True, model_spec=True). It is the proposal card; these add what a refusal found before
     a run looks like. */
  .run-chip.proposal-chip-refused { color: var(--bad); border-color: var(--bad); }
  .proposal-row-refused .proposal-val { color: var(--bad); }
  /* A saved chart of a run's diagnostics (specs/chart-views.md): put in only with the render flag `views`
     (terminal.py). The figure sits in its answer, which is pre-wrap; the figure is not. The tokens are the
     terminal page's own. The chart scrolls sideways inside its box when it was drawn wider than the answer. */
  /* The box the page puts an answer's charts in (specs/chart-wiring.md). A track of minmax(0, 1fr) gives it no
     min-content width of its own, so a chart drawn wider than a phone scrolls inside .view-chart instead of
     widening the conversation column (which is `1fr`, and would grow to the widest chart). */
  .views { display: grid; grid-template-columns: minmax(0, 1fr); white-space: normal; }
  .view { margin: 10px 0 0; padding: 14px; border: 1px solid var(--rule); border-radius: 5px; background: var(--surface);
          white-space: normal; display: flex; flex-direction: column; gap: 10px; }
  .view > * { margin: 0; }
  .view-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
  .view-chip { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; border: 1px solid var(--margin);
               border-radius: 3px; padding: 1px 6px; color: var(--margin); }
  .view-producer { font-family: var(--mono); }
  /* The run's evidence class and disclosure: beside every chart, in the primary colour, never smaller than the
     text around them. A reader must not be able to see the chart and miss them. */
  .view-evidence { font-size: 13px; color: var(--primary); border-left: 2px solid var(--margin); padding-left: 10px; }
  .view-class { font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--margin); margin-right: 6px; }
  .view-chart { overflow-x: auto; border: 1px solid var(--rule); border-radius: 3px; background: var(--page); }
  .view-chart svg { display: block; }
  .view-status { font-size: 13px; color: var(--muted); }
  .view-status.refused { color: var(--bad); }
  .view-limits { font-size: 12px; color: var(--muted); }
  .view-limits summary { cursor: pointer; min-height: 24px; }
  .view-limits ul { margin: 6px 0 0; padding-left: 18px; }
  .view-limits li { margin: 0 0 4px; }
  .view[data-view-state="refused"] { border-color: var(--bad); }
  .msg { max-width: 820px; margin: 0 0 14px; padding: 10px 14px; border-radius: 6px; white-space: pre-wrap;
         overflow-wrap: anywhere; }
  .msg.user { background: var(--surface); border: 1px solid var(--rule); }
  .msg.assistant { background: var(--panel); border: 1px solid var(--rule); }
  .run-line { max-width: 820px; margin: 0 0 14px; padding: 2px 14px; color: var(--muted); font-family: var(--mono); font-size: 13px; overflow-wrap: anywhere; }
  .msg.loose { color: var(--muted); font-style: italic; }
  .msg.failed { border-color: var(--bad); color: var(--muted); }
  .meta { font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase;
          color: var(--muted); margin: 0 0 6px; }
  /* Under an answer: whether it was saved (specs/turn-record.md §14.1), and the record of what it
     did and read (§15, §16.1). Read-only; nothing here is a control over the answer. */
  .save { font-family: var(--mono); font-size: 11px; color: var(--bad); margin: 8px 0 0; white-space: normal; }
  .save.unknown { color: var(--margin); }
  .record, .record-note { margin: 8px 0 0; white-space: normal; font-size: 12px; color: var(--muted); }
  .record-note { font-family: var(--mono); font-size: 11px; }
  .record > summary { cursor: pointer; font-family: var(--mono); font-size: 11px; letter-spacing: .04em; }
  .record-body { margin: 6px 0 0 2px; border-left: 1px solid var(--rule); padding: 2px 0 2px 10px;
                 overflow-wrap: anywhere; }
  .record-body p { margin: 0 0 6px; }
  /* ---- the reference card: what a chart leaves in the thread. One per chart, inside the
     assistant's message, built from the stored spec alone — no row is read to draw it. ---- */
  .refs { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; white-space: normal; }
  .ref { display: inline-flex; flex-direction: column; align-items: flex-start; gap: 5px;
         max-width: 100%; text-align: left; padding: 8px 10px; }
  .ref:hover, .ref.is-open { border-color: var(--accent); }
  .ref.failed { border-color: var(--bad); }
  .ref-title { font-size: 13px; overflow-wrap: anywhere; }
  .ref .chips { display: flex; flex-wrap: wrap; gap: 4px 0; }
  /* The chart's place in this view, the same `#n` its tab leads with. It is what tells two charts
     apart when nothing else does: a stored chart holds its event's id and not its name, so two
     games with the same series, region, market and poll wrote the same tab (measured 2026-09-18). */
  .ref { position: relative; padding-right: 40px; }
  .ref-n { position: absolute; top: 8px; right: 10px; font-family: var(--mono); font-size: 11px;
           letter-spacing: .04em; color: var(--primary); opacity: .7; }
  /* A comparison the page recomputed. It sits in the answer, not in the status line, because the
     status line is overwritten by the next tool and a figure a reader wants to look at twice must
     outlive the turn. Monospaced and right-aligned so the column of numbers reads as a column. */
  .compare { margin: 8px 0 2px; padding: 8px 10px; border: 1px solid var(--rule);
             border-radius: 2px; font-family: var(--mono); font-size: 12px; max-width: 34em; }
  .compare-head { color: var(--muted); font-size: 11px; letter-spacing: .04em;
                  text-transform: uppercase; margin-bottom: 6px; }
  .compare-row { display: flex; justify-content: space-between; gap: 12px; padding: 1px 0; }
  .compare-k { overflow-wrap: anywhere; }
  .compare-v { white-space: nowrap; color: var(--primary); }
  .compare-row.withheld .compare-v { color: var(--muted); font-size: 11px; white-space: normal;
                                     text-align: right; }
  /* ---- the chart panel: BESIDE the conversation while there is room, OVER it when there is
     not. A <section>, so it is already a flex column with min-width 0. ---- */
  .panel { border-left: 1px solid var(--rule); background: var(--panel); }
  .panel-head { display: flex; align-items: stretch; border-bottom: 1px solid var(--rule); }
  .tabs { flex: 1; min-width: 0; display: flex; overflow-x: auto; scrollbar-width: thin; }
  /* Which side of the strip holds tabs that are not showing: a fade on that side, set by the script
     from the strip's scroll offset. At 0 px both stops coincide and the mask is opaque. */
  .tabs { --fade-l: 0px; --fade-r: 0px;
          -webkit-mask-image: linear-gradient(to right, transparent, #000 var(--fade-l), #000 calc(100% - var(--fade-r)), transparent);
          mask-image: linear-gradient(to right, transparent, #000 var(--fade-l), #000 calc(100% - var(--fade-r)), transparent); }
  .tabs[data-more~="left"] { --fade-l: 28px; }
  .tabs[data-more~="right"] { --fade-r: 28px; }
  /* A tab is TWO ROWS — `#n series ×` over `market · region · time` — each with its own ellipsis,
     because one row cannot shrink: measured 2026-09-18, the narrowest one-row tab that still told
     every label apart was 202 px and the narrowest natural tab 195, the differing token (market,
     region) being the one a right-hand ellipsis eats first. Two rows tell them apart at 13
     characters and the ellipsis. THE FLOOR IS THOSE 14 ADVANCES, in `ch` and the tab's own
     letter-spacing, plus the tab's 24 px of padding and 1 px of border — AND ONE PIXEL MORE. A row
     exactly 14 advances wide is a rounding away from 13: laid out in 1/64 px, 14 advances of
     Inconsolata came to 83.156 px against 83.16 needed and the last character went, 21 labels of
     118 colliding; the same was true, by 0.001 px, of the face the floor was first measured in,
     and an instrument reading whole pixels hid it (F115's addendum). Measured 2026-09-19: at 13
     advances labels collide however much margin is given; at 14 with the pixel, none do, in either
     face. Tabs shrink to it before the strip scrolls; the active tab never shrinks.
     AND THE ORDINAL TAKES FROM THE SERIES LABEL, so the floor carries `--ord-extra` (F133). `#n`
     shares the series row's grid line, and each character it gains takes one advance from the
     label beside it: from `#100` nine of the 118 labels collided, `hold_s…` against `hold_d…`,
     eighteen from `#1000`, in both faces. `registerChart` sets `--ord-extra` to the ordinal's
     length less three, so `#1`–`#99` — every ordinal the floor was derived over — resolve at
     0 and compute the expression this line held before, and only `#100` and beyond are wider. */
  .tab { flex: 0 1 auto; min-width: calc((14 + var(--ord-extra, 0)) * (1ch + .04em) + 24px + 1px + 1px);
         display: grid; grid-template-columns: auto minmax(0, 1fr) auto; column-gap: 6px; row-gap: 1px;
         align-items: baseline; align-content: center; text-align: left;
         border: 0; border-right: 1px solid var(--rule); border-bottom: 2px solid transparent;
         border-radius: 0; background: transparent; color: var(--muted); padding: 7px 12px;
         font-family: var(--mono); font-size: 11px; letter-spacing: .04em; white-space: nowrap; }
  .tab:hover { color: var(--primary); }
  .tab.is-active { flex: none; color: var(--primary); background: var(--surface); border-bottom-color: var(--accent); }
  .tab.failed { color: var(--bad); }
  .tab-n { color: var(--primary); opacity: .7; }
  .tab-s, .tab-d { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .tab-d { grid-column: 1 / -1; opacity: .8; }
  /* A <span>, because a button cannot hold a button; the strip's one listener reads `data-close`.
     Its padding is hit area and its negative margin gives the same space back to the row. */
  .tab-x { padding: 6px 8px; margin: -6px -8px -6px -2px; border-radius: 3px; color: var(--muted); }
  .tab-x:hover { color: var(--primary); background: var(--rule); }
  /* Outside the strip's scroll area, so they stay reachable however many tabs there are. The
     steppers are BOTH after the strip, so showing them never moves a tab sideways. */
  .tabs-step { flex: none; border: 0; border-left: 1px solid var(--rule); border-radius: 0;
               background: transparent; color: var(--muted); font-family: var(--mono); font-size: 14px;
               padding: 0 9px; }
  .tabs-step:hover:not(:disabled) { color: var(--primary); }
  #panel-close { flex: none; border: 0; border-left: 1px solid var(--rule); border-radius: 0;
                 background: transparent; color: var(--muted); font-family: var(--mono); font-size: 11px;
                 letter-spacing: .08em; text-transform: uppercase; }
  .panel-body { flex: 1; min-height: 0; overflow-y: auto; padding: 12px 14px 16px; }
  .readout { display: flex; flex-wrap: wrap; gap: 4px 18px; margin: 0 0 12px;
             font-family: var(--mono); font-size: 11px; }
  .readout .cell { display: flex; gap: 6px; align-items: baseline; }
  .readout .label { color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
  .readout b { font-weight: 600; }
  /* The <svg> carries its width and height as ATTRIBUTES and no CSS width, so one user unit is
     one CSS pixel at every panel width; narrower than the chart's floor, this wrapper scrolls. */
  .chart-scroll { overflow-x: auto; }
  .chart-scroll svg { display: block; }
  /* Chart text in the page's face. chart_forms.js injects a stylesheet of its own, scoped to
     `.tcl-chart`, that names the terminal's former mono stack; that file's bytes are pinned to the
     function's vendor module and are not this page's to change, so the family is set here, on the
     one root every chart is mounted into, which outranks the class. The family only: the chart's
     sizes and colours stay its own. Its layout budgets 6.6 px a character (CHAR_PX) and Inconsolata
     at 11 px advances 5.5, so a label has more room than it needs, never less. */
  #panel-svg { font-family: var(--mono); }
  /* THE CROSSHAIR'S HIGHLIGHT, as a page rule over the marks the renderer already labels with
     `data-book`: nothing in chart_forms.js changes, exactly as the port set the chart's face. The
     root carries the hovered book, so one attribute write per pointer move repaints the chart. */
  #panel-svg[data-hover] [data-book] { opacity: .35; }
  #panel-svg[data-hover] [data-hit] { opacity: 1; }
  .readout .cell.hover .label { color: var(--accent); }
  .readout .cell.hover b { font-variant-numeric: tabular-nums; }
  .why { color: var(--bad); font-size: 12px; margin: 10px 0 0; min-height: 1.4em; }
  .why.note { color: var(--muted); }
  .status { font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase;
            color: var(--muted); padding: 4px 20px; min-height: 22px; border-top: 1px solid var(--rule); }
  .status.bad { color: var(--bad); }
  #composer { display: flex; gap: 10px; padding: 12px 20px 16px; border-top: 1px solid var(--rule); }
  #composer textarea { resize: none; height: 64px; }
  #composer button { align-self: flex-end; height: 40px; }
  .chip { display: inline-block; font-family: var(--mono); font-size: 11px; color: var(--muted);
          border: 1px solid var(--rule); border-radius: 3px; padding: 0 6px; margin-right: 6px; }
  /* The attribution nflverse's CC BY 4.0 asks for, on the page that shows the data. Scheme-less on
     purpose: this page carries no absolute URL to any host but its Supabase project
     (test_live_output_safety.py), so the references are text, not links. */
  .attribution { font-size: 11px; color: var(--muted); padding: 4px 20px 8px; margin: 0;
                 border-top: 1px solid var(--rule); }
  /* Below 1112 px the panel covers the conversation instead of narrowing it, so the conversation
     underneath does not reflow and keeps its scroll position. It is positioned against `main`,
     not against the viewport with the header's height written in: the header measured 40.9 px,
     not the 45 `main`'s own height assumes, and a panel pinned at 45 left 4 px of conversation
     showing above it. The script's WIDE_QUERY is the other statement of this breakpoint. */
  @media (max-width: 1111px) {
    main.with-panel { grid-template-columns: 240px 1fr; }
    .panel { position: absolute; top: 0; right: 0; bottom: 0; left: 0; z-index: 20; border-left: 0; }
  }
  /* The swipe. While a finger drags it the panel follows with no easing; let go short of a
     dismissal and it eases back. A transform lays nothing out, so the conversation underneath
     neither reflows nor scrolls. */
  @media (prefers-reduced-motion: no-preference) { .panel { transition: transform .15s ease-out; } }
  .panel[data-drag="1"] { transition: none; }
  @media (max-width: 720px) { main, main.with-panel { grid-template-columns: 1fr; } aside { display: none; } }
</style>

<body>
<header>
  <span class="wordmark">the closing line</span>
  <span class="beta">terminal · beta</span>
  <span class="spacer"></span>
  <span id="who"></span>
  <button id="signout">sign out</button>
</header>

<main id="app">
  <aside>
    <button id="new-thread">new thread</button>
    <ul id="threads"></ul>
  </aside>
  <section>
    <p id="context-line" class="context-line" hidden></p>
    <div id="messages"></div>
    <div id="status" class="status"></div>
    <form id="composer">
      <textarea id="input" placeholder="Ask about the board. Shift+Enter for a new line." required></textarea>
      <button type="submit" class="primary" id="send">send</button>
    </form>
    <p class="attribution">NFL statistics: nflverse-data (github.com/nflverse/nflverse-data), CC BY 4.0 (creativecommons.org/licenses/by/4.0); restructured into tables; not endorsed by nflverse.</p>
  </section>
  <!-- The chart panel. The <svg> is MARKUP, not a node a script creates: every tab is mounted into
       this one root, so "one persistent root" is a property of the page rather than a discipline
       of its script — and the root is the container that outlives every redraw, which is where a
       delegated listener will go when the charts become interactive. -->
  <section id="panel" class="panel" aria-label="charts" hidden>
    <div class="panel-head">
      <div id="tabs" class="tabs" role="tablist" aria-label="charts in this thread"></div>
      <button type="button" id="tabs-prev" class="tabs-step" aria-label="scroll the tabs left" hidden>‹</button>
      <button type="button" id="tabs-next" class="tabs-step" aria-label="scroll the tabs right" hidden>›</button>
      <button type="button" id="panel-close" aria-label="close the chart panel">close</button>
    </div>
    <div id="panel-body" class="panel-body" role="tabpanel">
      <div id="readout" class="readout"></div>
      <div id="chart-scroll" class="chart-scroll" hidden><svg id="panel-svg" role="img"></svg></div>
      <p id="panel-why" class="why"></p>
    </div>
  </section>
</main>

<script>
/* slice/layer4/devig.js, inlined verbatim. Proven bit-identical to devig.py by
 * tests/test_devig_parity.py, which evaluates the file's own bytes. */
/* Devigging methods for two-sided markets — the browser-side port of devig.py.
 *
 * A LITERAL transcription of `slice/layer4/devig.py`, agreeing with it bit-for-bit.
 * Both languages use IEEE 754 binary64, and +, - and / are correctly rounded in both,
 * so bit-equality follows from the standard — PROVIDED the operation order is preserved.
 * It is not an approximation to be reordered for elegance:
 *
 *     additive returns `p_a - overround / 2.0`, NOT the algebraically equal
 *     `(p_a - p_b + 1) / 2`. Those two forms differ by one unit in the last place
 *     on 772 of 2304 sampled price pairs.
 *
 * Proven against `slice/layer4/parity/devig_parity.json` by
 * `tests/test_devig_parity.py`, which evaluates THIS FILE'S BYTES — the same bytes
 * that get inlined into the page. A bare script, no import/export, no dependency,
 * no build step.
 *
 * NAMING COLLISION, because these two live one call apart in a browser:
 *   `overround` HERE (and in devig.py)   = book sum MINUS ONE.
 *   `overround` in board.py / board_quote.js = the book sum ITSELF.
 * See board_quote.js.
 *
 * Errors: see DevigError. Messages devig.py authors are reproduced byte for byte.
 * Messages CPython authors are a DECLARED equivalence, tabulated in the fixture.
 */

var Devig = (function () {
  "use strict";

  /* Carries the Python exception type name, so a declared equivalence is checkable
   * rather than merely asserted in prose. `pyType` is one of ValueError, TypeError,
   * ZeroDivisionError, NotImplementedError. */
  class DevigError extends Error {
    constructor(pyType, message) {
      super(message);
      this.name = "DevigError";
      this.pyType = pyType;
    }
  }

  /* Python's repr(float), byte for byte.
   *
   * Needed because devig.py interpolates the offending values into its own error
   * messages, and JS disagrees with Python on all of: integral values ("2" vs "2.0"),
   * infinity ("Infinity" vs "inf"), NaN ("NaN" vs "nan"), negative zero ("0" vs
   * "-0.0"), and the thresholds at which each switches to exponent notation.
   *
   * Python uses exponent form iff decpt <= -4 or decpt > 16, with a signed exponent
   * of at least two digits; JS switches at 1e-7 and 1e21 and never pads the exponent.
   * Verified over 14040 values, including both threshold boundaries and subnormals. */
  function pyRepr(x) {
    if (Number.isNaN(x)) return "nan";
    if (x === Infinity) return "inf";
    if (x === -Infinity) return "-inf";
    const neg = x < 0 || Object.is(x, -0);
    const a = Math.abs(x);
    if (a === 0) return neg ? "-0.0" : "0.0";
    const m = a.toExponential().match(/^(\d)(?:\.(\d+))?e([+-]\d+)$/);
    const digits = m[1] + (m[2] || "");
    const decpt = parseInt(m[3], 10) + 1;
    let out;
    if (decpt <= -4 || decpt > 16) {
      const e = decpt - 1;
      const frac = digits.slice(1);
      const es = (e < 0 ? "-" : "+") + String(Math.abs(e)).padStart(2, "0");
      out = digits[0] + (frac ? "." + frac : "") + "e" + es;
    } else if (decpt <= 0) {
      out = "0." + "0".repeat(-decpt) + digits;
    } else if (decpt >= digits.length) {
      out = digits + "0".repeat(decpt - digits.length) + ".0";
    } else {
      out = digits.slice(0, decpt) + "." + digits.slice(decpt);
    }
    return (neg ? "-" : "") + out;
  }

  /* Mirrors devig.py's `_validate_two_sided`, INCLUDING the order in which the
   * failures occur. Python unpacks before it compares, so an arity failure precedes
   * the range guard and a non-numeric element fails at the comparison, not the
   * unpack. Trigger order is part of what the fixture asserts. */
  function validateTwoSided(oddsTwoSided) {
    if (!Array.isArray(oddsTwoSided)) {
      // Python: `o_a, o_b = 2.0` -> TypeError, cannot unpack non-iterable float object
      throw new DevigError(
        "TypeError",
        "cannot unpack non-array odds_two_sided"
      );
    }
    if (oddsTwoSided.length !== 2) {
      // Python: ValueError from unpacking, "not enough"/"too many values to unpack"
      throw new DevigError(
        "ValueError",
        "odds_two_sided must hold exactly 2 values; got " + oddsTwoSided.length
      );
    }
    for (const o of oddsTwoSided) {
      if (typeof o !== "number") {
        // Python: TypeError, '<=' not supported between instances of 'str' and 'float'
        throw new DevigError(
          "TypeError",
          "'<=' not supported between decimal odds of type " +
            typeof o +
            " and float"
        );
      }
    }
    const o_a = oddsTwoSided[0];
    const o_b = oddsTwoSided[1];
    // NaN fails both comparisons, so it passes this guard exactly as Python's does.
    if (o_a <= 1.0 || o_b <= 1.0) {
      throw new DevigError(
        "ValueError",
        "both decimal odds must be > 1.0; got (" +
          pyRepr(o_a) +
          ", " +
          pyRepr(o_b) +
          ")"
      );
    }
  }

  /* Standard proportional devigging. devig.py:23-36. */
  function multiplicative(oddsTwoSided) {
    validateTwoSided(oddsTwoSided);
    const o_a = oddsTwoSided[0];
    const o_b = oddsTwoSided[1];
    const p_a = 1.0 / o_a;
    const p_b = 1.0 / o_b;
    const s = p_a + p_b;
    /* EXPLICIT, not inherited. Both odds infinite underflows the sum to zero, where
     * Python raises and JS would return NaN. NaN is the worst available way to
     * disagree: it propagates into a chart instead of surfacing. */
    if (s === 0) {
      throw new DevigError("ZeroDivisionError", "float division by zero");
    }
    return [p_a / s, p_b / s];
  }

  /* Additive devigging — subtract half the overround from each side. devig.py:39-56.
   * `overround` here is the book sum MINUS ONE, per the header note. */
  function additive(oddsTwoSided) {
    validateTwoSided(oddsTwoSided);
    const o_a = oddsTwoSided[0];
    const o_b = oddsTwoSided[1];
    const p_a = 1.0 / o_a;
    const p_b = 1.0 / o_b;
    const overround = p_a + p_b - 1.0;
    return [p_a - overround / 2.0, p_b - overround / 2.0];
  }

  /* Shin (1992). DEFERRED — devig.py:59-66 raises before touching its argument, so
   * this raises on invalid input and on wrong arity too. Message is devig.py's own,
   * reproduced byte for byte.
   *
   * At n = 2 the Shin and additive maps are the same map, exactly, at every price and
   * every hold — so deferring this costs nothing on two-way markets. */
  function shin(oddsTwoSided) {
    throw new DevigError(
      "NotImplementedError",
      "Shin devigging deferred per slice non-goals"
    );
  }

  /* Power devigging. DEFERRED — devig.py:69-76. The `power` argument is accepted and
   * never read, matching the Python. */
  function power(oddsTwoSided, powerExponent) {
    throw new DevigError(
      "NotImplementedError",
      "Power devigging deferred per slice non-goals"
    );
  }

    }

        "ValueError",

    DevigError: DevigError,

/* realdata/closingline/board_quote.js, inlined verbatim, AFTER devig.js because it reads the
 * free global `Devig`. Proven by test_board_quote_parity.py. */
/* One book's two-sided quote, devigged — the browser-side port of board.py's `_devig`.
 *
 * A LITERAL transcription of `realdata/closingline/board.py:224-256`, agreeing with it
 * bit-for-bit. Depends on `Devig` from `slice/layer4/devig.js`, which must be evaluated
 * first. Direction is realdata -> slice, which is the permitted one.
 *
 * Proven against `realdata/closingline/parity/board_quote_parity.json` by
 * `tests/realdata/closingline/test_board_quote_parity.py`, which evaluates THIS FILE'S
 * BYTES. A bare script, no import/export, no dependency, no build step.
 *
 * NAMING COLLISION — the reason this note appears in both files:
 *   `overround` HERE (and in board.py) = the book sum ITSELF, p_a + p_b.
 *   `overround` in devig.js / devig.py = the book sum MINUS ONE.
 * Carrying this file's vocabulary into the devig math would be wrong in a way that
 * still produces plausible numbers.
 *
 * WHAT THIS FILE DELIBERATELY DOES NOT PORT: `_market_board`. Outcome alignment,
 * bucketing, and the B1-B6 constraints stay server-side, which is what poller.py
 * already does at encode time. Moving them into the browser is precisely what
 * realdata/closingline/__init__.py warns against.
 */

var BoardQuote = (function () {
  "use strict";

  /* board.py:224-242. Returns null where the Python returns None.
   *
   * NOTE the asymmetry with devig.js: on the SAME predicate — either price at or
   * below 1.0 — this returns null and `Devig.multiplicative` throws. Two responses to
   * one condition, one frame apart. The board answers with None so the quote is
   * dropped from the board rather than failing the render. */
  function quote(prices) {
    if (!Array.isArray(prices) || prices.length !== 2) {
      return null;
    }
    if (prices[0] <= 1.0 || prices[1] <= 1.0) {
      return null;
    }
    const implied = [1.0 / prices[0], 1.0 / prices[1]];
    // The book sum. Named `overround` to match board.py's field, not devig.py's local.
    const overround = implied[0] + implied[1];
    /* Unreachable for valid input, since both implied values are strictly positive.
     * Present because board.py has it, and because NaN passes it there too:
     * `NaN <= 0.0` is false in both languages. */
    if (overround <= 0.0) {
      return null;
    }
    const fair = Devig.multiplicative(prices);
    return {
      prices: [prices[0], prices[1]],
      implied: implied,
      overround: overround,
      hold: (overround - 1.0) / overround,
      fair: fair,
      delta_pp: null,
    };
  }

  /* board.py:245-256. Two operations, in this order.
   *
   * `fairA` is role index ZERO, and role order comes from the REFERENCE BOOK's own
   * outcome order (board.py:180-192) — not from any canonical home-away convention.
   * The landed corpus lists home first 34049 times and away first 22645 times, so the
   * SIGN of this number depends on how Pinnacle happened to order that market. A
   * reader who assumes home-first will misread roughly two markets in five. */
  function deltaPp(fairA, referenceFairA) {
    return (fairA - referenceFairA) * 100.0;
  }

  return {
    quote: quote,
    deltaPp: deltaPp,
  };
})();

<script>
/* realdata/closingline/live_board.js, inlined verbatim, AFTER board_quote.js. Proven by
 * test_live_board_parity.py. */
/* One (event, market) panel, bucketed — the browser-side port of board.py's `_market_board`
 * bucketing, driven from the poller's positional payload instead of the raw API response.
 *
 * WHY THIS EXISTS AT ALL, AND WHAT IT COSTS. `realdata/closingline/__init__.py:10-12` states
 * that the board's constraints live in `board.py` "so a template rewrite cannot silently drop
 * one", and `board_quote.js:17-20` declines to port `_market_board` for exactly that reason.
 * The live page has no server-side board, so the seam moves whether or not anyone likes it.
 * It is moved WITH its proof rather than without: `parity/live_board_parity.json`, generated
 * from the landed `poller.decode` -> `board._market_board` chain, with four red-proofs that
 * each go red on a different rule being dropped. See F26.
 *
 * WHAT THE PAYLOAD CANNOT TELL US (F26). `board.py` holds `EXCHANGES` — the two eu exchanges
 * and, from R-CL3, the five `us_ex` venues. `poller.py` imports
 * BOARD_MARKETS, REFERENCE_BOOK and TOTALS_ROLES from board.py and NOT this set, and emits no
 * `is_exchange` field, so B4 cannot be derived from a payload — only re-asserted. The
 * duplication below is the ruled workaround, NOT the design: the fix is the poller emitting
 * the set, which is a payload change and therefore a schema bump, a new image and a restart.
 * `test_live_board_parity.py` asserts this list equals `board.EXCHANGES`, so the two copies
 * cannot drift apart silently — which is the only thing that makes the duplication safe.
 *
 * DEPENDS on `BoardQuote` (and through it `Devig`), which must be evaluated first.
 * A bare script, no import/export, no dependency, no build step.
 */

  "use strict";

  /* board.EXCHANGES, duplicated. See the header: this is re-asserted, not derived, and the
   * parity test is what stops it drifting. */
  var EXCHANGES = ["betfair_ex_eu", "matchbook", "betopenly", "kalshi", "novig", "polymarket",
                   "prophetx"];

  function isExchange(book) {
    return EXCHANGES.indexOf(book) !== -1;
  }

  /* board.py:308-309. `-abs(delta_pp)` first, then the book key. Python's sort and JS's are
   * both stable, and both compare ASCII strings by code point, so the tuple comparison
   * transcribes directly. */

    var da = -Math.abs(a.delta_pp === null ? 0.0 : a.delta_pp);
    var db = -Math.abs(b.delta_pp === null ? 0.0 : b.delta_pp);

    return a.book < b.book ? -1 : (a.book > b.book ? 1 : 0);
  }

  /* board.py:311-312. A null line sorts as 0.0, matching `q.line if ... is not None else 0.0`. */
  function byLine(a, b) {

    var lb = b.line === null ? 0.0 : b.line;
    if (la !== lb) return la < lb ? -1 : 1;
    return a.book < b.book ? -1 : (a.book > b.book ? 1 : 0);
  }

  /* Bucket one panel. Returns null exactly where `_market_board` returns None:
   *   - the market is not in the payload's legend            (board.py:271-273)
   *   - the reference book does not quote it            (B5, board.py:264-268)
   *   - the reference book's own quote is unusable       (board.py:280-282)
   *
   * `dropped` has no counterpart in `_market_board`, which discards such quotes silently.
   * It is returned so the partition assertion can be total: matched + off_line + exchanges
   * + dropped + the reference must account for every row in the panel, with both sides of
   * that equation derived rather than hardcoded.
   */
  function bucket(payload, eventIdx, marketKey) {
    if (!payload || !payload.markets || !payload.rows) return null;
    var marketIdx = payload.markets.indexOf(marketKey);
    if (marketIdx < 0) return null;
    if (!(eventIdx >= 0 && eventIdx < payload.events.length)) return null;

    var refIdx = payload.books.indexOf(payload.reference_book);
    if (refIdx < 0) return null;

    var panelRows = [];
    var i;
    for (i = 0; i < payload.rows.length; i += 1) {
      var row = payload.rows[i];
      if (row[0] === eventIdx && row[2] === marketIdx) panelRows.push(row);
    }

    var refRow = null;
    for (i = 0; i < panelRows.length; i += 1) {
      if (panelRows[i][1] === refIdx) { refRow = panelRows[i]; break; }
    }
    if (refRow === null) return null;

    var refQuote = BoardQuote.quote([refRow[3], refRow[4]]);
    if (refQuote === null) return null;

    function entry(row, quote) {
      return {
        book: payload.books[row[1]],
        bookIndex: row[1],
        isExchange: isExchange(payload.books[row[1]]),
        line: row[5],
        asof: payload.last_updates[row[6]],
        prices: [row[3], row[4]],
        implied: quote === null ? null : quote.implied,
        overround: quote === null ? null : quote.overround,
        hold: quote === null ? null : quote.hold,
        fair: quote === null ? null : quote.fair,
        // board.py:284 gives the reference a delta against ITSELF, which is exactly +0.0.
        delta_pp: quote === null ? null : BoardQuote.deltaPp(quote.fair[0], refQuote.fair[0])
      };
    }

    var reference = entry(refRow, refQuote);
    var matched = [], offLine = [], exchanges = [], dropped = [];

    for (i = 0; i < panelRows.length; i += 1) {
      var r = panelRows[i];
      if (r[1] === refIdx) continue;
      var q = BoardQuote.quote([r[3], r[4]]);
      if (q === null) { dropped.push(entry(r, null)); continue; }
      var e = entry(r, q);
      if (e.isExchange) {
        // B4: a lay price is not a back price. Never mixed into dispersion.
        exchanges.push(e);
      } else if (e.line === reference.line) {
        // Exact comparison, as board.py:305. A tolerance would mask the very thing B6 names.
        matched.push(e);
      } else {
        // B6: different line, different bet. Never compared.
        offLine.push(e);
      }
    }

    matched.sort(byDistance);
    exchanges.sort(byDistance);
    offLine.sort(byLine);

    return {
      market: marketKey,
      roles: payload.roles[marketKey],
      event: payload.events[eventIdx],
      referenceBook: payload.reference_book,
      referenceLine: reference.line,
      reference: reference,
      matched: matched,
      off_line: offLine,
      exchanges: exchanges,
      dropped: dropped

  }

  return {
    EXCHANGES: EXCHANGES,
    bucket: bucket
  };
})();

</script>

/* realdata/closingline/gamma.js, inlined verbatim. Proven by test_live_gamma_parity.py. */
/* First-order devig bias coefficients — the browser-side port of Proposition 2.
 *
 * A LITERAL transcription of `verification/harness/gamma_analytical_wsb.py`, whose formulas
 * are themselves transcribed from `docs/15_LAYER_5_FOUNDATIONS_CLV_FAIR_BET.md:182` and
 * published as Proposition 2 of Stavsky, É. (2026), "Closing-Line Value as a Fair Bet, and
 * the Devig Bias That Governs It".
 *
 * Each function returns the PER-STEP BIAS β = v · γ(p) at the focal outcome, not γ itself.
 * The Python's own docstrings are explicit about that and the naming here follows it rather
 * than improving on it, because a reader moving between the two files should not have to
 * hold two conventions.
 *
 * NO PYTHON IMPORT, IN EITHER DIRECTION. `realdata/` may not import `verification/`
 * (`tests/test_realdata_import_direction.py`, docs/31 §8), so this file transcribes and the
 * TEST — which lives in `tests/` and may import anything — is what pins the transcription to
 * the source. That is the same shape as `devig.js`: the artifact is standalone, the proof
 * crosses the boundary.
 *
 * EXACTNESS, AND THE ONE EXCEPTION. Three of the four are +, -, * and / on binary64, which
 * IEEE 754 requires to be correctly rounded, so they agree with the Python bit for bit and
 * the test asserts exactly that. `power` calls `log`, which IEEE 754 does NOT require to be
 * correctly rounded — the standard recommends it and does not mandate it — so no bit claim is
 * available for it across two runtimes. The test states a tolerance for that one case, in
 * ulps, as a decision with its measured basis. See `test_live_gamma_parity.py`.
 *
 * A bare script, no import/export, no dependency, no build step.
 */

var Gamma = (function () {
  "use strict";

  /* Matched method-truth: multiplicative devig on multiplicative truth. γ ≡ 0.
   * `docs/15:182` — the hold cancels, so the bias is zero at ALL orders in v, not merely at
   * first order. `gamma_analytical_wsb.py:31-41` returns zeros_like(v). */
  function multiplicative(p, v) {
    return 0.0 * v;
  }

  /* Additive on multiplicative truth, n = 2: β = v · (p − 1/n).
   * `gamma_analytical_wsb.py:43-53`: `v * (p_focal - 0.5)`. */
  function additive(p, v) {
    return v * (p - 0.5);
  }

  /* Shin three-way on multiplicative truth, n = 3: β = v · (n·p − 1) / (2(n − 1)).
   * `gamma_analytical_wsb.py:55-69`: `v * (3.0 * p_focal - 1.0) / 4.0`.
   *
   * Kept at n = 3 rather than generalised. The Python is n = 3 and the operation order is
   * what the bit-equality claim rests on; a general form would be a different expression
   * that happens to agree at n = 3, which is not the same thing. */
  function shinThreeWay(p, v) {
    return v * (3.0 * p - 1.0) / 4.0;
  }

  /* Power on multiplicative truth, n = 2: β = v · p · (1 + ln p / H(p)), with H the Shannon
   * entropy of the true distribution. `gamma_analytical_wsb.py:71-87`.
   *
   * THE ONE FUNCTION WITHOUT A BIT CLAIM, and the reason is `Math.log`. Operation order is
   * still preserved exactly, because that is what keeps the divergence to the transcendental
   * rather than adding rounding of our own. */
  function power(p, v) {
    var pOther = 1.0 - p;
    var h = -(p * Math.log(p) + pOther * Math.log(pOther));
    return v * p * (1.0 + Math.log(p) / h);
  }

  /* The family, for the γ(p) panel. One curve per method; the registry names them. */
  var METHODS = [
    { key: "multiplicative", label: "multiplicative", fn: multiplicative,
      note: "matched: zero at all orders" },
    { key: "additive", label: "additive", fn: additive,
      note: "zero crossing at p = 1/n" },
    { key: "shin3", label: "Shin (n=3)", fn: shinThreeWay,
      note: "zero crossing at p = 1/n" },
    { key: "power", label: "power", fn: power,
      note: "entropy-weighted" }
  ];

  return {
    multiplicative: multiplicative,
    additive: additive,
    shinThreeWay: shinThreeWay,
    power: power,
    METHODS: METHODS
  };
})();

<script>
/* realdata/closingline/chart_spec.js, inlined verbatim, AFTER the four above because it reads
 * BoardQuote, LiveBoard and Gamma. Proven by test_terminal_chart_spec.py. */
/* Chart specs for the beta terminal: what a chart IS, said once, checked before anything draws.
 *
 * A spec is a small JSON object the model emits through the `emit_chart` tool and the page
 * re-renders from the stored rows — `{ series, region, event, market, window?, sort?, title? }`.
 * This file validates a spec (fail closed: an unknown series, region, market or key is refused
 * before anything is computed, F32 and VG-F14's rule), groups `public.snapshots` rows into
 * POLLS (one bulk insert per poll, so a poll's rows share `captured_at` exactly — the join key
 * specs/region-expansion.md §2 names), applies the region gate R-CL11/R-CL13 wrote onto every
 * row, and computes each series from the four proven modules.
 *
 * ONE FILE, TWO RUNTIMES. The page inlines these bytes; the Edge Function imports the same bytes
 * through the generated module realdata/closingline/terminal.py builds. A spec the function
 * accepted is therefore a spec the page can draw, because both ran this code.
 *
 * WHAT IS REUSED, UNCHANGED: `Devig` (through `BoardQuote`), `BoardQuote.quote`,
 * `LiveBoard.bucket` and `LiveBoard.EXCHANGES`, `Gamma`. The series computes below are
 * transcribed from templates/live.html's registry (`bookPoints`, `lineSeries`,
 * `aggregateSeries`, the `freshness` and `dv` computes), which lived beside DOM code and could
 * not be reused as bytes. The arithmetic per quote is the same expression in the same order.
 *

 * not. A `us` row is used only when its `gate` is "eu_events" — a row stored ungated under
 * R-CL11 is EXCLUDED from every board and said to be, never silently rendered. `us` and `us_ex`
 * rows carry no reference book (R-CL3), so `LiveBoard.bucket` returns null for them by
 * construction; `referencelessBoard` below builds the same board shape without a reference:
 * quotes on the MODAL line are `matched`, every other line is `off_line` (B6 still holds: a
 * different line is a different bet), exchanges are `exchanges` (B4), and `delta_pp` is null
 * everywhere because there is nothing to be a delta from. Anything joining across regions
 * does so explicitly on event id (`describe().cross`), as R-CL3 requires.
 *
 * DEPENDS on `BoardQuote`, `LiveBoard` and `Gamma`, which must be evaluated first.
 * A bare script, no import/export, no dependency, no build step.
 */

var ChartSpec = (function () {
  "use strict";

  var REGIONS = ["eu", "us", "us_ex"];
  var MARKETS = ["h2h", "spreads", "totals"];
  var SORTS = ["hold", "fair", "name"];
  var GATE_PINNACLE = "pinnacle";
  var GATE_EU_EVENTS = "eu_events";

  }
  function num(v, n) { return typeof v === "number" ? v.toFixed(n) : "—"; }

   * null, because a referenceless board has nothing to take a delta from. */

      book: payload.books[row[1]],
      bookIndex: row[1],

   * `LiveBoard.bucket`'s result so every consumer reads one shape; `reference` is null and
   * `referenceLine` is the MODAL line among usable non-exchange quotes (ties: the lowest,
   * null lowest of all), which is the line most of the board is quoting. Returns null where
   * bucket would: unknown market, unknown event, or no quotes at all on the panel. */

    if (!(eventIdx >= 0 && eventIdx < payload.events.length)) return null;
    var quotes = [], exchanges = [], dropped = [];
    var i;
    for (i = 0; i < payload.rows.length; i += 1) {

    }
    if (p.reference_book !== null && p.reference_book !== undefined) {

        " for event " + spec.event + " in region " + row.region + ", or its quote is unusable (B5)";
