<script>
/* realdata/closingline/session.js, inlined verbatim: the same bytes the terminal carries. */
/* The beta terminal's session: where it is kept, what counts as one, and the calls that move it.
 *
 * ONE set of bytes on TWO pages. realdata/closingline/signin.py inlines this file verbatim into the
 * sign-in page and the terminal inlines the same file; tests pin each page to it. The pages hand the
 * session to each other through storage and through nothing else, so a key or a shape that differed
 * between them would not be an error anybody saw: the terminal would find no session and send the
 * reader to sign in, and the sign-in page would find one and send the reader back.
 *
 * It reads the two globals each page declares, SUPABASE_URL and SUPABASE_KEY, and only when it calls.
 * It touches no DOM and never navigates: where to go is each page's own decision.
 */
var TclSession = (function () {
  "use strict";

  /* The key and the shape the terminal wrote before this file existed, so that a session stored by
   * either version is read by the other. */
  var KEY = "tcl.terminal.session";

  /* What counts as a session. Anything else in the slot — JSON that does not parse, an object with a
   * token missing — is NO session, on both pages alike, so they cannot disagree about whether one is
   * held. `user` is required because the terminal names the reader from it. */
  function shaped(s) {
    return !!s && typeof s === "object"
      && typeof s.access_token === "string" && s.access_token !== ""
      && typeof s.refresh_token === "string" && s.refresh_token !== ""
      && typeof s.expires_at === "number" && isFinite(s.expires_at)
      && !!s.user && typeof s.user === "object";
  }

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      var s = raw ? JSON.parse(raw) : null;
      return shaped(s) ? s : null;
    } catch (e) {
      return null;
    }
  }

  /* Stores, then READS BACK: true only when the next load() will return this session. A browser that
   * refuses site storage throws here or quietly keeps nothing, and either way the answer is false. */
  function save(s) {
    try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) { /* the read-back decides */ }
    var back = load();
    return !!back && back.access_token === s.access_token;
  }

  function clear() {
    try { localStorage.removeItem(KEY); } catch (e) { /* nothing was held */ }
  }

  /* A GoTrue grant, in the shape that is stored. */
  function fromGrant(body) {
    return {
      access_token: body.access_token,
      refresh_token: body.refresh_token,
      expires_at: Math.floor(Date.now() / 1000) + (body.expires_in || 3600),
      user: { id: body.user && body.user.id, email: body.user && body.user.email }
    };
  }

  /* A POST to GoTrue with the publishable key, and the user's token when there is one. `keepalive`
   * lets the request outlive the page that made it: a request still in flight when its document is
   * unloaded is otherwise the browser's to cancel. */
  function call(path, body, token, keepalive) {
    var headers = { "apikey": SUPABASE_KEY, "Content-Type": "application/json" };
    if (token) headers["Authorization"] = "Bearer " + token;
    var init = { method: "POST", headers: headers, body: JSON.stringify(body) };
    if (keepalive) init.keepalive = true;
    return fetch(SUPABASE_URL + "/auth/v1/" + path, init).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (j) { return { status: r.status, body: j }; });
    });
  }

  /* Seconds the access token has left. */
  function remaining(s) {
    return s.expires_at - Math.floor(Date.now() / 1000);
  }

  /* A new session from the refresh token. Resolves to it; resolves to null when GoTrue REFUSES the
   * refresh token (a 4xx: it is spent or revoked, and the session is over); REJECTS when GoTrue could
   * not be asked or failed (a network error, a 5xx), because then nothing is known about the session
   * and signing the reader out would be a guess. */
  function refresh(s) {
    return call("token?grant_type=refresh_token", { refresh_token: s.refresh_token }).then(function (r) {
      if (r.status === 200 && r.body && r.body.access_token) return fromGrant(r.body);
      if (r.status >= 400 && r.status < 500) return null;
      throw new Error("the session could not be refreshed (HTTP " + r.status + ")");
    });
  }

  function logout(s) {
    return call("logout", {}, s.access_token, true);
  }

  return { KEY: KEY, load: load, save: save, clear: clear, fromGrant: fromGrant, call: call,
           remaining: remaining, refresh: refresh, logout: logout };
})();

</script>

   * that nothing paints while the terminal loads, and no request is made: the terminal refreshes an
   * expired token itself. */
  if (TclSession.load()) { document.documentElement.hidden = true; location.replace(TERMINAL_URL); }

  /* The landing page's tokens (live.html :root), by name and by value. --bad is this terminal's own:
     the landing page has no colour for a failure. One family for everything, Inconsolata first. */
  :root {
    --page: #0a0a0c; --panel: #101014; --surface: #16161c; --rule: #2a2a32;
    --primary: #fafafa; --muted: #8a8a93; --accent: #22d3ee; --margin: #f59e0b; --bad: #f87171;
    --mono: "Inconsolata", 'SF Mono','Cascadia Code','JetBrains Mono','Roboto Mono',ui-monospace,monospace;
  }
  * { box-sizing: border-box; }
  /* F42: `[hidden]` is a user-agent rule and any author `display` beats it. */
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--page); color: var(--primary); font-family: var(--mono);
         font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
  /* The terminal's header, which wraps rather than pushing the page wider than a phone. */
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; padding: 10px 16px;
           border-bottom: 1px solid var(--rule); }
  .wordmark { letter-spacing: .14em; text-transform: uppercase; font-size: 12px; color: var(--primary); }
  .beta { font-size: 11px; letter-spacing: .13em; text-transform: uppercase;
          color: var(--margin); border: 1px solid var(--margin); padding: 1px 6px; border-radius: 3px; }
  button { font: inherit; color: var(--primary); background: var(--surface); border: 1px solid var(--rule);
           border-radius: 4px; padding: 6px 10px; cursor: pointer; }
  button:hover { border-color: var(--muted); }
  button.primary { border-color: var(--accent); color: var(--accent); }
  input { font: inherit; color: var(--primary); background: var(--panel); border: 1px solid var(--rule);
          border-radius: 4px; padding: 8px 10px; width: 100%; }
  input:focus { outline: none; border-color: var(--accent); }
  /* Never wider than the viewport less a 16 px gutter each side. */
  .auth { width: min(380px, calc(100% - 32px)); margin: 60px auto; padding: 24px; background: var(--panel);
          border: 1px solid var(--rule); border-radius: 6px; }
  .auth h1 { font-size: 14px; margin: 0 0 14px; letter-spacing: .13em; text-transform: uppercase;
             color: var(--muted); }
  .auth label { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 4px; }
  .auth .row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .note { font-size: 12px; color: var(--muted); margin-top: 10px; min-height: 1.4em; }
  .note.bad { color: var(--bad); }
</style>
</head>
<body>
<header>
  <span class="wordmark">the closing line</span>
  <span class="beta">terminal · beta</span>
</header>

<div id="auth" class="auth">
  <h1>Sign in</h1>
  <form id="auth-form">
    <label for="email">email</label>
    <input id="email" type="email" autocomplete="username" required>
    <label for="password">password</label>
    <input id="password" type="password" autocomplete="current-password" minlength="8" required>
    <div class="row">
      <button type="submit" class="primary" id="signin">sign in</button>
      <button type="button" id="signup">create account</button>
    </div>
  </form>
  <p id="auth-note" class="note"></p>
</div>

<script>
(function () {
  "use strict";

  const $ = (id) => document.getElementById(id);

  function say(text, bad) {
    const note = $("auth-note");
    note.className = "note" + (bad ? " bad" : "");
    note.textContent = text;
  }

  function refused(body, what, status) {
    return new Error(body.error_description || body.msg || body.error || (what + " failed (HTTP " + status + ")"));
  }

  /* A grant becomes a stored session, and the terminal opens it. Stored AND READ BACK first: a
   * browser that refuses site storage would otherwise send the reader to a terminal that finds no
   * session and sends them straight back here. The session that cannot be kept is revoked rather than
   * left live on the server with nobody holding it. */
  function enter(body) {
    const s = TclSession.fromGrant(body);
    if (!TclSession.save(s)) {
      TclSession.logout(s).catch(() => {});
      say("signed in, but this browser will not let the page keep the session, so the terminal " +
          "cannot open it: allow this site to store data, then sign in again", true);
      return;
    }
    say("opening the terminal");
    location.replace(TERMINAL_URL);
  }

  async function signIn(email, password) {
    const r = await TclSession.call("token?grant_type=password", { email: email, password: password });
    if (r.status !== 200 || !r.body.access_token) throw refused(r.body, "sign-in", r.status);
    enter(r.body);
  }

  async function signUp(email, password) {
    const r = await TclSession.call("signup", { email: email, password: password });
    if (r.status !== 200) throw refused(r.body, "sign-up", r.status);
    if (r.body.access_token) { enter(r.body); return; }
    say("account created: confirm the email we sent, then sign in");
  }

  $("auth-form").addEventListener("submit", (e) => {
    e.preventDefault();
    say("signing in");
    signIn($("email").value.trim(), $("password").value).catch((err) => say(err.message, true));
  });
  $("signup").addEventListener("click", () => {
    /* The button is type="button", so the form's `required` and `minlength` never run for it — only
     * the submit button (sign in) triggers them — and an empty email reached GoTrue, which reads a
     * signup with no email as an anonymous sign-up and answers "Anonymous sign-ins are disabled"
     * (measured 2026-09-17). The check lives here, where the values are read, and no call is made
     * until both are present. */
    const email = $("email").value.trim();
    const password = $("password").value;
    if (!email || !password) { say("enter an email and a password to create an account", true); return; }
    if (password.length < 8) { say("the password must be at least 8 characters", true); return; }
    say("creating account");
    signUp(email, password).catch((err) => say(err.message, true));
  });
})();
</script>
</body>
</html>
